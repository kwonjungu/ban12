<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>두더지 잡기 🔨</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: radial-gradient(circle at 50% -10%, #2f6fd0 0%, #1b3f83 45%, #0d1c3d 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #wrap { width: 100%; max-width: 460px; }

  #stage {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 11;
    max-height: calc(100vh - 20px);
    margin: 0 auto;
    border-radius: 20px;
    overflow: hidden;
    background: #6fc2ef;
    box-shadow: 0 18px 40px rgba(0,0,0,.55), 0 0 0 3px rgba(255,255,255,.12) inset;
    touch-action: manipulation;
    cursor: crosshair;
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute; left: 0; right: 0; top: 0;
    padding: 9px 10px 0;
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 6px; pointer-events: none;
  }
  .pill {
    background: rgba(12, 20, 44, .55);
    border: 2px solid rgba(255,255,255,.22);
    border-radius: 14px;
    padding: 5px 10px;
    line-height: 1.15;
    text-align: center;
    backdrop-filter: blur(3px);
    box-shadow: 0 3px 0 rgba(0,0,0,.25);
  }
  .lbl { display: block; font-size: 10px; letter-spacing: .06em; opacity: .8; }
  .val { font-size: 20px; font-weight: 900; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
  #lives { font-size: 17px; letter-spacing: 1px; }
  #time.warn { color: #ff6b6b; animation: tick .5s infinite; }
  @keyframes tick { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.22);} }
  #time { display: inline-block; }

  #timebarWrap {
    position: absolute; left: 12px; right: 12px; top: 62px;
    height: 8px; border-radius: 99px;
    background: rgba(6,12,30,.5);
    border: 2px solid rgba(255,255,255,.18);
    overflow: hidden; pointer-events: none;
  }
  #timebar { height: 100%; width: 100%; border-radius: 99px;
    background: linear-gradient(90deg, #7dffb0, #ffe066); transition: background .3s; }
  #timebar.warn { background: linear-gradient(90deg, #ff9f43, #ff5252); }

  #comboBox {
    position: absolute; left: 0; right: 0; top: 78px;
    text-align: center; pointer-events: none; opacity: 0;
    font-size: 24px; font-weight: 900;
    color: #ffe66d;
    text-shadow: 0 3px 0 #b5541b, 0 0 18px rgba(255,214,102,.8);
  }
  #comboBox.on { opacity: 1; }
  #comboBox.pop { animation: cpop .32s ease-out; }
  @keyframes cpop { 0%{ transform: scale(.5) rotate(-8deg);} 60%{ transform: scale(1.3) rotate(4deg);} 100%{ transform: scale(1);} }

  #banner {
    position: absolute; left: 0; right: 0; top: 40%;
    text-align: center; pointer-events: none; opacity: 0;
  }
  #banner span {
    display: inline-block;
    background: linear-gradient(180deg, #fff4c2, #ffcf4a);
    color: #6b3b0b;
    font-weight: 900; font-size: 17px;
    padding: 9px 16px; border-radius: 14px;
    border: 3px solid #fff;
    box-shadow: 0 8px 22px rgba(0,0,0,.45);
  }
  #banner.show { animation: bn 2s ease-out forwards; }
  @keyframes bn {
    0% { opacity: 0; transform: translateY(24px) scale(.7); }
    15% { opacity: 1; transform: translateY(0) scale(1.08); }
    25% { transform: translateY(0) scale(1); }
    80% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-22px) scale(.95); }
  }

  #muteBtn {
    position: absolute; right: 10px; bottom: 10px;
    width: 38px; height: 38px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,.28);
    background: rgba(12,20,44,.55); color: #fff;
    font-size: 17px; cursor: pointer; padding: 0;
    z-index: 5;
  }
  #muteBtn:active { transform: scale(.92); }

  /* ---------- 오버레이 ---------- */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; padding: 20px 18px;
    text-align: center;
    background: radial-gradient(circle at 50% 30%, rgba(10,22,52,.72), rgba(6,12,30,.92));
    backdrop-filter: blur(2px);
  }
  .screen.hide { display: none; }

  .bigTitle {
    font-size: 40px; font-weight: 900; letter-spacing: -1px;
    color: #ffe066;
    text-shadow: 0 4px 0 #b5541b, 0 8px 0 rgba(0,0,0,.35), 0 0 30px rgba(255,209,102,.55);
    margin: 0;
    animation: float 2.4s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{ transform: translateY(0) rotate(-1.5deg);} 50%{ transform: translateY(-8px) rotate(1.5deg);} }
  .sub { font-size: 14px; opacity: .92; line-height: 1.65; margin: 0; }
  .moleRow { font-size: 30px; letter-spacing: 6px; }
  .moleRow span { display: inline-block; animation: peek 1.6s ease-in-out infinite; }
  .moleRow span:nth-child(2){ animation-delay: .25s; }
  .moleRow span:nth-child(3){ animation-delay: .5s; }
  .moleRow span:nth-child(4){ animation-delay: .75s; }
  @keyframes peek { 0%,100%{ transform: translateY(6px) scale(.92);} 50%{ transform: translateY(-8px) scale(1.06);} }

  .btn {
    font-family: inherit;
    margin-top: 4px;
    padding: 13px 30px;
    font-size: 19px; font-weight: 900;
    color: #5a2a00;
    background: linear-gradient(180deg, #ffe680, #ffb703);
    border: 3px solid #fff;
    border-radius: 16px;
    box-shadow: 0 6px 0 #c47a00, 0 12px 22px rgba(0,0,0,.42);
    cursor: pointer;
    animation: btnPulse 1.4s ease-in-out infinite;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c47a00; }
  @keyframes btnPulse { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.05);} }

  .card {
    background: rgba(255,255,255,.08);
    border: 2px solid rgba(255,255,255,.18);
    border-radius: 16px;
    padding: 10px 14px;
    font-size: 13px; line-height: 1.7;
  }
  .key { display: inline-block; background: rgba(255,255,255,.16); border-radius: 6px; padding: 0 6px; font-weight: 800; }
  .best { font-size: 13px; opacity: .9; }

  #grade { font-size: 58px; font-weight: 900; line-height: 1;
    text-shadow: 0 5px 0 rgba(0,0,0,.4), 0 0 26px currentColor; }
  #gradeName { font-size: 15px; font-weight: 800; opacity: .95; }
  #finalScore { font-size: 42px; font-weight: 900; color: #ffe066; text-shadow: 0 4px 0 #b5541b; }
  #stats { font-size: 13px; opacity: .92; line-height: 1.8; }
  #regret { font-size: 14px; font-weight: 800; color: #ffd166; }
  .newRec { color: #7dffb0 !important; animation: cpop .5s ease-out; }
  .tiny { font-size: 11px; opacity: .6; }

  @media (max-width: 400px) {
    .bigTitle { font-size: 33px; }
    .val { font-size: 18px; }
    #finalScore { font-size: 36px; }
    #grade { font-size: 48px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>

    <div id="hud">
      <div class="pill"><span class="lbl">점수</span><span class="val" id="score">0</span></div>
      <div class="pill"><span class="lbl">목숨</span><span class="val" id="lives">❤️❤️❤️</span></div>
      <div class="pill"><span class="lbl">시간</span><span class="val"><span id="time">60</span></span></div>
    </div>
    <div id="timebarWrap"><div id="timebar"></div></div>
    <div id="comboBox"></div>
    <div id="banner"><span></span></div>

    <button id="muteBtn" type="button" aria-label="소리 켜기 끄기">🔊</button>

    <!-- 시작 화면 -->
    <div class="screen" id="titleScreen">
      <div class="moleRow"><span>🐹</span><span>🔨</span><span>🐹</span><span>💣</span></div>
      <h1 class="bigTitle">두더지 잡기</h1>
      <p class="sub">튀어나온 두더지를 <b>탕! 탕!</b> 때려라<br>60초 안에 몇 점까지 갈 수 있어?</p>
      <div class="card">
        🐹 일반 <b>+10</b> &nbsp; ✨ 황금 <b>+50</b> &nbsp; 💣 폭탄 <b>-20</b><br>
        연속으로 맞히면 점수가 <b>배로</b> 늘어나!
      </div>
      <button class="btn" id="startBtn" type="button">시작하기 🔨</button>
      <p class="best" id="bestTitle">최고 기록: 0점</p>
      <p class="tiny">마우스·손가락으로 두더지를 콕! &nbsp;/&nbsp; 키보드는 <span class="key">1</span>~<span class="key">9</span></p>
    </div>

    <!-- 결과 화면 -->
    <div class="screen hide" id="overScreen">
      <div id="grade">S</div>
      <div id="gradeName">두더지 대왕</div>
      <div id="finalScore">0</div>
      <div id="stats">명중률 0% · 최고 콤보 0</div>
      <div id="regret">아깝다!</div>
      <button class="btn" id="againBtn" type="button">한 판 더! 🔨</button>
      <p class="tiny">스페이스 또는 화면을 탭하면 바로 다시 시작</p>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* =========================================================
     기본 요소
     ========================================================= */
  var stage = document.getElementById('stage');
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');

  var elScore = document.getElementById('score');
  var elLives = document.getElementById('lives');
  var elTime = document.getElementById('time');
  var elBar = document.getElementById('timebar');
  var elCombo = document.getElementById('comboBox');
  var elBanner = document.getElementById('banner');
  var elBannerText = elBanner.querySelector('span');
  var titleScreen = document.getElementById('titleScreen');
  var overScreen = document.getElementById('overScreen');
  var startBtn = document.getElementById('startBtn');
  var againBtn = document.getElementById('againBtn');
  var muteBtn = document.getElementById('muteBtn');
  var elBestTitle = document.getElementById('bestTitle');
  var elGrade = document.getElementById('grade');
  var elGradeName = document.getElementById('gradeName');
  var elFinal = document.getElementById('finalScore');
  var elStats = document.getElementById('stats');
  var elRegret = document.getElementById('regret');

  /* =========================================================
     저장 (localStorage 는 반드시 try/catch)
     ========================================================= */
  var BEST_KEY = 'whackamole_best_v1';
  function loadBest() {
    try {
      var v = window.localStorage.getItem(BEST_KEY);
      var n = parseInt(v, 10);
      return isFinite(n) && n > 0 ? n : 0;
    } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { window.localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* 무시 */ }
  }
  var best = loadBest();

  /* =========================================================
     소리 (WebAudio 로 직접 합성 — 외부 파일 없음)
     ========================================================= */
  var AC = null, master = null, muted = false;

  function audioReady() {
    if (!AC) {
      try {
        var Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) return null;
        AC = new Ctor();
        master = AC.createGain();
        master.gain.value = 0.25;
        master.connect(AC.destination);
      } catch (e) { AC = null; master = null; return null; }
    }
    if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
    return AC;
  }

  function tone(freq, dur, type, vol, delay, slideTo) {
    if (!AC || !master || muted) return;
    try {
      var t0 = AC.currentTime + (delay || 0);
      var osc = AC.createOscillator();
      var g = AC.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.3, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(master);
      osc.start(t0); osc.stop(t0 + dur + 0.03);
    } catch (e) {}
  }

  function noiseBurst(dur, vol, cutoff, delay, sweepTo) {
    if (!AC || !master || muted) return;
    try {
      var t0 = AC.currentTime + (delay || 0);
      var len = Math.max(1, Math.floor(AC.sampleRate * dur));
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = AC.createBufferSource(); src.buffer = buf;
      var f = AC.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(cutoff || 1200, t0);
      if (sweepTo) f.frequency.exponentialRampToValueAtTime(Math.max(60, sweepTo), t0 + dur);
      var g = AC.createGain();
      g.gain.setValueAtTime(vol || 0.3, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t0); src.stop(t0 + dur + 0.02);
    } catch (e) {}
  }

  // 콤보가 오를수록 음정이 올라가는 성공음 (도-레-미-파-솔-라-시-도)
  var SCALE = [261.6, 293.7, 329.6, 349.2, 392.0, 440.0, 493.9, 523.3, 587.3, 659.3, 698.5, 784.0];
  function sndHit(combo) {
    var idx = Math.min(SCALE.length - 1, Math.max(0, combo - 1));
    var f = SCALE[idx];
    noiseBurst(0.06, 0.35, 2600, 0, 500);
    tone(f, 0.11, 'square', 0.26, 0.005);
    tone(f * 2, 0.08, 'triangle', 0.14, 0.01);
  }
  function sndGold() {
    tone(783.9, 0.1, 'triangle', 0.28, 0);
    tone(987.7, 0.1, 'triangle', 0.28, 0.07);
    tone(1174.6, 0.16, 'triangle', 0.3, 0.14);
    tone(1567.9, 0.2, 'sine', 0.2, 0.21);
  }
  function sndBomb() {
    noiseBurst(0.45, 0.6, 900, 0, 60);
    tone(160, 0.45, 'sawtooth', 0.32, 0, 40);
  }
  function sndMiss() { noiseBurst(0.13, 0.2, 700, 0, 220); }
  function sndEscape() { tone(330, 0.13, 'sine', 0.16, 0, 180); }
  function sndCombo(level) {
    var b = 523.3 * Math.pow(1.06, level);
    tone(b, 0.1, 'triangle', 0.25, 0);
    tone(b * 1.5, 0.12, 'triangle', 0.22, 0.06);
    tone(b * 2, 0.16, 'sine', 0.18, 0.12);
  }
  function sndStart() {
    tone(392, 0.11, 'square', 0.26, 0);
    tone(523.3, 0.11, 'square', 0.26, 0.1);
    tone(659.3, 0.22, 'square', 0.28, 0.2);
  }
  function sndOver() {
    tone(523.3, 0.16, 'square', 0.24, 0);
    tone(392, 0.16, 'square', 0.24, 0.15);
    tone(311.1, 0.16, 'square', 0.24, 0.3);
    tone(261.6, 0.4, 'square', 0.26, 0.45);
  }
  function sndTick(last) {
    tone(last ? 1046 : 880, 0.07, 'square', 0.18, 0);
  }
  function sndRecord() {
    tone(523.3, 0.1, 'triangle', 0.26, 0);
    tone(659.3, 0.1, 'triangle', 0.26, 0.09);
    tone(784, 0.1, 'triangle', 0.26, 0.18);
    tone(1046.5, 0.35, 'triangle', 0.3, 0.27);
  }

  muteBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    if (!muted) { audioReady(); tone(660, 0.09, 'triangle', 0.22, 0); }
  });

  /* =========================================================
     캔버스 크기 / devicePixelRatio
     ========================================================= */
  var W = 360, H = 440, DPR = 1;
  var L = null; // 레이아웃 정보

  function resize() {
    var r = stage.getBoundingClientRect();
    W = Math.max(200, Math.round(r.width));
    H = Math.max(240, Math.round(r.height));
    DPR = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    computeLayout();
  }

  function computeLayout() {
    var padX = W * 0.07;
    var top = H * 0.20;
    var bottom = H * 0.05;
    var gridW = W - padX * 2;
    var gridH = H - top - bottom;
    var cw = gridW / 3;
    var ch = gridH / 3;
    var cells = [];
    for (var i = 0; i < 9; i++) {
      var col = i % 3, row = (i / 3) | 0;
      cells.push({
        cx: padX + cw * (col + 0.5),
        cy: top + ch * (row + 0.78)
      });
    }
    L = {
      cells: cells,
      cw: cw, ch: ch,
      top: top,
      rx: Math.min(cw * 0.40, ch * 0.46),
      ry: Math.min(cw * 0.40, ch * 0.46) * 0.42,
      rise: ch * 0.66,
      horizon: H * 0.30
    };
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });
  if (window.ResizeObserver) {
    try { new ResizeObserver(resize).observe(stage); } catch (e) {}
  }

  /* =========================================================
     게임 상태
     ========================================================= */
  var STATE = { TITLE: 0, PLAY: 1, OVER: 2 };
  var state = STATE.TITLE;

  var GAME_TIME = 60;

  var holes = [];
  for (var h = 0; h < 9; h++) {
    holes.push({ state: 'idle', type: 'normal', time: 0, dur: 1, hitTime: 0, seed: Math.random() * 10 });
  }

  var score = 0, lives = 3, combo = 0, maxCombo = 0;
  var swings = 0, hits = 0;
  var timeLeft = GAME_TIME, elapsed = 0;
  var spawnTimer = 0;
  var shake = 0, hitstop = 0, flash = 0, flashColor = '255,255,255';
  var particles = [], pops = [];
  var events = [];
  var lastTickSec = -1;
  var kbMode = false, selHole = 4;
  var hammer = { x: -999, y: -999, swing: 0, show: 0 };
  var bgTime = 0;

  function resetGame() {
    for (var i = 0; i < 9; i++) {
      holes[i].state = 'idle';
      holes[i].time = 0;
      holes[i].dur = 1;
      holes[i].hitTime = 0;
      holes[i].type = 'normal';
    }
    score = 0; lives = 3; combo = 0; maxCombo = 0;
    swings = 0; hits = 0;
    timeLeft = GAME_TIME; elapsed = 0;
    spawnTimer = 0.35;
    shake = 0; hitstop = 0; flash = 0;
    particles.length = 0; pops.length = 0;
    lastTickSec = -1;
    selHole = 4;
    events = [
      { t: 10, text: '✨ 황금 두더지 등장! 아주 빨라!', done: false },
      { t: 20, text: '💣 폭탄 두더지 조심! 때리면 -20', done: false },
      { t: 30, text: '🔥 두더지 러시! 더 빨라진다!', done: false },
      { t: 45, text: '🌟 황금 폭풍! 지금이 기회야!', done: false },
      { t: 55, text: '⏰ 마지막 5초! 전력으로!', done: false }
    ];
    updateHUD();
    showCombo(false);
  }

  /* =========================================================
     HUD
     ========================================================= */
  function updateHUD() {
    elScore.textContent = String(score);
    var hearts = '';
    for (var i = 0; i < 3; i++) hearts += (i < lives ? '❤️' : '🖤');
    elLives.textContent = hearts;
    var t = Math.max(0, Math.ceil(timeLeft));
    elTime.textContent = String(t);
    var ratio = Math.max(0, Math.min(1, timeLeft / GAME_TIME));
    elBar.style.width = (ratio * 100).toFixed(1) + '%';
    if (timeLeft <= 10) { elTime.classList.add('warn'); elBar.classList.add('warn'); }
    else { elTime.classList.remove('warn'); elBar.classList.remove('warn'); }
  }

  function multiplier() { return Math.min(8, 1 + Math.floor(combo / 3)); }

  function showCombo(on) {
    if (!on) { elCombo.classList.remove('on'); return; }
    elCombo.textContent = '🔥 ' + combo + '콤보  x' + multiplier();
    elCombo.classList.add('on');
    elCombo.classList.remove('pop');
    void elCombo.offsetWidth;
    elCombo.classList.add('pop');
  }

  function banner(text) {
    elBannerText.textContent = text;
    elBanner.classList.remove('show');
    void elBanner.offsetWidth;
    elBanner.classList.add('show');
  }

  /* =========================================================
     이펙트
     ========================================================= */
  function addParticles(x, y, n, colors, power, kind) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = (0.4 + Math.random()) * power;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - power * 0.5,
        life: 0.45 + Math.random() * 0.45,
        max: 0.9,
        r: (kind === 'smoke' ? 6 : 3) + Math.random() * 4,
        c: colors[(Math.random() * colors.length) | 0],
        kind: kind || 'dot',
        rot: Math.random() * 6.3,
        vr: (Math.random() - 0.5) * 12
      });
    }
    if (particles.length > 320) particles.splice(0, particles.length - 320);
  }

  function addPop(x, y, text, color, size) {
    pops.push({ x: x, y: y, text: text, c: color, life: 0.95, size: size || 26, vy: -60 });
    if (pops.length > 24) pops.shift();
  }

  function doShake(v) { shake = Math.min(26, shake + v); }
  function doFlash(v, color) { flash = Math.max(flash, v); flashColor = color || '255,255,255'; }

  /* =========================================================
     두더지 등장 로직
     ========================================================= */
  function progress() { return Math.max(0, Math.min(1, elapsed / GAME_TIME)); }

  function activeCount() {
    var n = 0;
    for (var i = 0; i < 9; i++) if (holes[i].state === 'up') n++;
    return n;
  }

  function maxActive() {
    if (elapsed < 4) return 1;
    var n = 1 + Math.floor(progress() * 3);      // 1 → 4
    if (elapsed >= 30) n += 1;                    // 러시
    return Math.min(5, n);
  }

  function spawnInterval() {
    var v = 1.05 - 0.66 * progress();             // 1.05초 → 0.39초
    if (elapsed >= 30) v *= 0.78;
    if (elapsed >= 45) v *= 0.88;
    return Math.max(0.22, v);
  }

  function pickType() {
    if (elapsed < 10) return 'normal';
    var r = Math.random();
    var goldP = elapsed >= 45 ? 0.20 : 0.09;
    var bombP = elapsed >= 20 ? (elapsed >= 30 ? 0.20 : 0.15) : 0;
    if (r < goldP) return 'gold';
    if (r < goldP + bombP) return 'bomb';
    return 'normal';
  }

  function upDuration(type) {
    var p = progress();
    if (type === 'gold') return 0.72 - 0.20 * p;
    if (type === 'bomb') return 1.30 - 0.35 * p;
    if (elapsed < 4) return 2.1;                  // 첫 성공은 확실하게
    return 1.55 - 0.80 * p;
  }

  function spawnMole(forceType) {
    var free = [];
    for (var i = 0; i < 9; i++) if (holes[i].state === 'idle') free.push(i);
    if (!free.length) return;
    var idx = free[(Math.random() * free.length) | 0];
    var m = holes[idx];
    m.type = forceType || pickType();
    m.state = 'up';
    m.time = 0;
    m.dur = upDuration(m.type);
    m.hitTime = 0;
    m.seed = Math.random() * 10;
  }

  /* =========================================================
     때리기
     ========================================================= */
  function breakCombo(reason) {
    if (combo >= 3) {
      // 콤보가 아까울수록 크게 알린다
      addPop(W * 0.5, L.top + L.ch * 0.4, '콤보 끊김!', '#ff8a8a', 22);
    }
    combo = 0;
    showCombo(false);
    if (reason === 'escape') sndEscape();
  }

  function hitMole(idx) {
    var m = holes[idx];
    var c = L.cells[idx];
    var pop = molePop(m);
    var mx = c.cx, my = c.cy - L.rise * pop * 0.55;

    if (m.type === 'bomb') {
      m.state = 'hit'; m.hitTime = 0;
      score = Math.max(0, score - 20);
      lives -= 1;
      combo = 0; showCombo(false);
      doShake(22); doFlash(0.6, '255,80,80'); hitstop = 0.09;
      addParticles(mx, my, 26, ['#ff5252', '#ffb703', '#333333', '#888888'], 320, 'smoke');
      addPop(mx, my - 10, '-20', '#ff6b6b', 34);
      sndBomb();
      updateHUD();
      if (lives <= 0) { setTimeout(gameOver, 260); }
      return;
    }

    // 일반 / 황금
    combo += 1;
    if (combo > maxCombo) maxCombo = combo;
    hits += 1;
    var base = (m.type === 'gold') ? 50 : 10;
    var gain = base * multiplier();
    score += gain;

    m.state = 'hit'; m.hitTime = 0;
    hitstop = m.type === 'gold' ? 0.075 : 0.05;
    doShake(m.type === 'gold' ? 12 : 6);

    if (m.type === 'gold') {
      doFlash(0.35, '255,220,120');
      addParticles(mx, my, 26, ['#ffe066', '#fff3b0', '#ffd166', '#ffffff'], 300, 'star');
      addPop(mx, my - 10, '+' + gain, '#ffe066', 38);
      sndGold();
    } else {
      addParticles(mx, my, 14, ['#c98a4b', '#8b5a2b', '#ffe066', '#ffffff'], 240, 'dot');
      addPop(mx, my - 10, '+' + gain, '#ffffff', 28);
      sndHit(combo);
    }

    if (combo >= 2) showCombo(true);
    if (combo % 5 === 0) {
      var bonus = combo * 5;
      score += bonus;
      addPop(W * 0.5, L.top + L.ch * 0.3, combo + '연속! +' + bonus, '#7dffb0', 26);
      addParticles(W * 0.5, L.top + L.ch * 0.35, 18, ['#7dffb0', '#ffe066', '#ffffff'], 260, 'star');
      doFlash(0.22, '160,255,200');
      sndCombo(Math.floor(combo / 5));
      banner('🔥 ' + combo + '연속! 점수 x' + multiplier());
    }
    updateHUD();
  }

  function swingAt(x, y, fromKey) {
    if (state !== STATE.PLAY) return;
    swings += 1;
    hammer.x = x; hammer.y = y; hammer.swing = 0.001; hammer.show = 1;

    var found = -1, bestD = 1e9;
    for (var i = 0; i < 9; i++) {
      var m = holes[i];
      if (m.state !== 'up') continue;
      var p = molePop(m);
      if (p < 0.30) continue;
      var c = L.cells[i];
      var my = c.cy - L.rise * p * 0.55;
      var dx = (x - c.cx) / (L.cw * 0.52);
      var dy = (y - my) / (L.ch * 0.46);
      var d = dx * dx + dy * dy;
      if (d <= 1 && d < bestD) { bestD = d; found = i; }
    }

    if (found >= 0) { hitMole(found); return; }

    // 헛스윙
    combo = 0; showCombo(false);
    sndMiss();
    addParticles(x, y, 7, ['#ffffff', '#cfe8ff'], 130, 'dot');
    if (!fromKey) addPop(x, y - 6, '헛스윙!', 'rgba(255,255,255,.75)', 18);
    doShake(3);
  }

  function molePop(m) {
    if (m.state === 'hit') return 1;
    if (m.state !== 'up') return 0;
    var riseT = 0.14, sinkT = 0.18;
    if (m.time < riseT) {
      var k = m.time / riseT;
      return 1 - Math.pow(1 - k, 3);
    }
    if (m.time > m.dur - sinkT) {
      var k2 = Math.max(0, (m.dur - m.time) / sinkT);
      return k2 * k2;
    }
    return 1;
  }

  /* =========================================================
     업데이트
     ========================================================= */
  function update(dt) {
    bgTime += dt;

    // 이펙트는 항상 흐른다
    if (shake > 0) shake = Math.max(0, shake - dt * 60);
    if (flash > 0) flash = Math.max(0, flash - dt * 2.6);
    if (hammer.show > 0) hammer.show = Math.max(0, hammer.show - dt * 1.6);
    if (hammer.swing > 0) { hammer.swing += dt; if (hammer.swing > 0.26) hammer.swing = 0; }

    var i;
    for (i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += (p.kind === 'smoke' ? -180 : 900) * dt;
      p.vx *= 0.99;
      p.rot += p.vr * dt;
    }
    for (i = pops.length - 1; i >= 0; i--) {
      var q = pops[i];
      q.life -= dt;
      if (q.life <= 0) { pops.splice(i, 1); continue; }
      q.y += q.vy * dt;
      q.vy *= 0.94;
    }

    if (state === STATE.TITLE) {
      // 시작 화면에서도 두더지가 빼꼼빼꼼 (썸네일용)
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnTimer = 0.55 + Math.random() * 0.5;
        if (activeCount() < 3) {
          var free = [];
          for (i = 0; i < 9; i++) if (holes[i].state === 'idle') free.push(i);
          if (free.length) {
            var idx = free[(Math.random() * free.length) | 0];
            var mm = holes[idx];
            mm.state = 'up';
            mm.time = 0;
            mm.dur = 1.2 + Math.random() * 0.8;
            mm.type = Math.random() < 0.18 ? 'gold' : 'normal';
            mm.seed = Math.random() * 10;
          }
        }
      }
      for (i = 0; i < 9; i++) {
        var tm = holes[i];
        if (tm.state === 'up') {
          tm.time += dt;
          if (tm.time >= tm.dur) { tm.state = 'idle'; tm.time = 0; }
        } else if (tm.state === 'hit') {
          tm.hitTime += dt;
          if (tm.hitTime > 0.3) { tm.state = 'idle'; tm.time = 0; }
        }
      }
      return;
    }

    if (state !== STATE.PLAY) return;

    // 히트스톱 (성공 순간 짜릿하게 멈춤)
    if (hitstop > 0) {
      hitstop -= dt;
      dt = dt * 0.06;
    }

    elapsed += dt;
    timeLeft -= dt;

    // 남은 10초 초읽기
    var sec = Math.ceil(timeLeft);
    if (timeLeft <= 10 && sec !== lastTickSec && sec >= 0) {
      lastTickSec = sec;
      sndTick(sec <= 3);
    }

    // 30초마다 새로운 사건
    for (i = 0; i < events.length; i++) {
      if (!events[i].done && elapsed >= events[i].t) {
        events[i].done = true;
        banner(events[i].text);
        doFlash(0.25, '255,240,180');
        sndCombo(2);
      }
    }

    // 두더지 등장
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnTimer = spawnInterval();
      if (activeCount() < maxActive()) {
        spawnMole(elapsed < 4 ? 'normal' : null);
      }
    }

    // 두더지 상태
    for (i = 0; i < 9; i++) {
      var m = holes[i];
      if (m.state === 'up') {
        m.time += dt;
        if (m.time >= m.dur) {
          m.state = 'idle';
          m.time = 0;
          if (m.type !== 'bomb') {
            // 놓쳤다 → 콤보 리셋
            var c = L.cells[i];
            addPop(c.cx, c.cy - 14, '놓쳤다!', '#9fb6d9', 18);
            if (combo > 0) breakCombo('escape'); else sndEscape();
          }
        }
      } else if (m.state === 'hit') {
        m.hitTime += dt;
        if (m.hitTime > 0.3) { m.state = 'idle'; m.time = 0; }
      }
    }

    updateHUD();

    if (timeLeft <= 0) {
      timeLeft = 0;
      updateHUD();
      gameOver();
    }
  }

  /* =========================================================
     그리기
     ========================================================= */
  function font(size, weight) {
    return (weight || 900) + ' ' + Math.round(size) + 'px -apple-system, BlinkMacSystemFont, system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
  }

  function drawBackground() {
    // 하늘
    var sky = ctx.createLinearGradient(0, 0, 0, L.horizon + 20);
    sky.addColorStop(0, '#8fd6ff');
    sky.addColorStop(1, '#d9f2ff');
    ctx.fillStyle = sky;
    ctx.fillRect(-40, -40, W + 80, L.horizon + 60);

    // 해
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#fff3a8';
    ctx.beginPath();
    ctx.arc(W * 0.82, H * 0.10, W * 0.075, 0, 6.2832);
    ctx.fill();
    ctx.globalAlpha = 0.25;
    ctx.beginPath();
    ctx.arc(W * 0.82, H * 0.10, W * 0.11 + Math.sin(bgTime * 2) * 3, 0, 6.2832);
    ctx.fill();
    ctx.restore();

    // 구름
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (var k = 0; k < 3; k++) {
      var cxp = ((bgTime * (6 + k * 4) + k * W * 0.42) % (W + 140)) - 70;
      var cyp = H * (0.07 + k * 0.045);
      var s = W * (0.055 + k * 0.012);
      ctx.beginPath();
      ctx.arc(cxp, cyp, s, 0, 6.2832);
      ctx.arc(cxp + s * 0.85, cyp + s * 0.15, s * 0.75, 0, 6.2832);
      ctx.arc(cxp - s * 0.85, cyp + s * 0.2, s * 0.62, 0, 6.2832);
      ctx.fill();
    }

    // 먼 언덕
    ctx.fillStyle = '#7fc96b';
    ctx.beginPath();
    ctx.moveTo(-20, L.horizon + 10);
    ctx.quadraticCurveTo(W * 0.25, L.horizon - H * 0.07, W * 0.55, L.horizon + 8);
    ctx.quadraticCurveTo(W * 0.8, L.horizon - H * 0.05, W + 20, L.horizon + 12);
    ctx.lineTo(W + 20, H + 20);
    ctx.lineTo(-20, H + 20);
    ctx.closePath();
    ctx.fill();

    // 잔디밭
    var g = ctx.createLinearGradient(0, L.horizon, 0, H);
    g.addColorStop(0, '#63b552');
    g.addColorStop(1, '#3d8a3a');
    ctx.fillStyle = g;
    ctx.fillRect(-20, L.horizon + 6, W + 40, H - L.horizon);

    // 풀 무늬
    ctx.strokeStyle = 'rgba(255,255,255,.10)';
    ctx.lineWidth = 2;
    for (var i = 0; i < 26; i++) {
      var gx = ((i * 137.5) % W);
      var gy = L.horizon + 20 + ((i * 71) % (H - L.horizon - 24));
      ctx.beginPath();
      ctx.moveTo(gx, gy);
      ctx.lineTo(gx + 3, gy - 8);
      ctx.stroke();
    }
  }

  function drawHoleBack(cx, cy, rx, ry) {
    // 흙 둔덕
    ctx.fillStyle = '#8a5a2f';
    ctx.beginPath();
    ctx.ellipse(cx, cy + ry * 0.35, rx * 1.34, ry * 1.5, 0, 0, 6.2832);
    ctx.fill();
    ctx.fillStyle = '#a06c39';
    ctx.beginPath();
    ctx.ellipse(cx, cy + ry * 0.15, rx * 1.2, ry * 1.28, 0, 0, 6.2832);
    ctx.fill();
    // 구멍
    ctx.fillStyle = '#2a1810';
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, 6.2832);
    ctx.fill();
    var g = ctx.createLinearGradient(0, cy - ry, 0, cy + ry);
    g.addColorStop(0, 'rgba(0,0,0,.55)');
    g.addColorStop(1, 'rgba(90,50,25,.25)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, 6.2832);
    ctx.fill();
  }

  function drawHoleFront(cx, cy, rx, ry) {
    // 구멍 앞턱 (두더지 아랫부분을 가림)
    ctx.fillStyle = '#a06c39';
    ctx.beginPath();
    ctx.ellipse(cx, cy + ry * 0.16, rx * 1.2, ry * 1.28, 0, 0, Math.PI);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.14)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + ry * 0.16, rx * 1.2, ry * 1.28, 0, 0.15, Math.PI - 0.15);
    ctx.fill();
  }

  function drawNormalMole(s, gold, wob) {
    var body = gold ? '#f6c445' : '#a2703f';
    var body2 = gold ? '#ffdd76' : '#c08a55';
    var belly = gold ? '#fff0b8' : '#e3c39b';

    // 귀
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(-s * 0.36, -s * 0.86, s * 0.15, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.36, -s * 0.86, s * 0.15, 0, 6.2832); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.arc(-s * 0.36, -s * 0.86, s * 0.07, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.36, -s * 0.86, s * 0.07, 0, 6.2832); ctx.fill();

    // 몸통
    var g = ctx.createLinearGradient(0, -s * 1.05, 0, 0);
    g.addColorStop(0, body2);
    g.addColorStop(1, body);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, -s * 0.52, s * 0.52, s * 0.6, 0, 0, 6.2832);
    ctx.fill();

    // 배
    ctx.fillStyle = belly;
    ctx.beginPath();
    ctx.ellipse(0, -s * 0.3, s * 0.33, s * 0.33, 0, 0, 6.2832);
    ctx.fill();

    // 눈
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-s * 0.18, -s * 0.72, s * 0.115, s * 0.13, 0, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s * 0.18, -s * 0.72, s * 0.115, s * 0.13, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#241408';
    var ex = Math.sin(wob) * s * 0.02;
    ctx.beginPath(); ctx.arc(-s * 0.18 + ex, -s * 0.71, s * 0.058, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.18 + ex, -s * 0.71, s * 0.058, 0, 6.2832); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(-s * 0.20 + ex, -s * 0.74, s * 0.022, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.16 + ex, -s * 0.74, s * 0.022, 0, 6.2832); ctx.fill();

    // 코 + 입
    ctx.fillStyle = '#e8788a';
    ctx.beginPath(); ctx.ellipse(0, -s * 0.53, s * 0.085, s * 0.062, 0, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(60,30,10,.7)';
    ctx.lineWidth = Math.max(1.4, s * 0.022);
    ctx.beginPath();
    ctx.arc(0, -s * 0.47, s * 0.09, 0.35, Math.PI - 0.35);
    ctx.stroke();
    // 앞니
    ctx.fillStyle = '#fff';
    ctx.fillRect(-s * 0.065, -s * 0.42, s * 0.055, s * 0.09);
    ctx.fillRect(s * 0.012, -s * 0.42, s * 0.055, s * 0.09);

    // 수염
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.lineWidth = Math.max(1, s * 0.014);
    for (var i = -1; i <= 1; i += 2) {
      ctx.beginPath();
      ctx.moveTo(i * s * 0.1, -s * 0.5);
      ctx.lineTo(i * s * 0.42, -s * 0.56);
      ctx.moveTo(i * s * 0.1, -s * 0.47);
      ctx.lineTo(i * s * 0.42, -s * 0.44);
      ctx.stroke();
    }

    // 손
    ctx.fillStyle = body2;
    ctx.beginPath(); ctx.ellipse(-s * 0.46, -s * 0.16, s * 0.14, s * 0.11, -0.4, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s * 0.46, -s * 0.16, s * 0.14, s * 0.11, 0.4, 0, 6.2832); ctx.fill();

    if (gold) {
      // 왕관
      ctx.fillStyle = '#ffd23f';
      ctx.strokeStyle = '#b8860b';
      ctx.lineWidth = Math.max(1, s * 0.015);
      ctx.beginPath();
      ctx.moveTo(-s * 0.26, -s * 1.0);
      ctx.lineTo(-s * 0.26, -s * 1.22);
      ctx.lineTo(-s * 0.10, -s * 1.08);
      ctx.lineTo(0, -s * 1.30);
      ctx.lineTo(s * 0.10, -s * 1.08);
      ctx.lineTo(s * 0.26, -s * 1.22);
      ctx.lineTo(s * 0.26, -s * 1.0);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      // 반짝임
      var tw = 0.5 + 0.5 * Math.sin(wob * 6);
      ctx.save();
      ctx.globalAlpha = ctx.globalAlpha * (0.5 + tw * 0.5);
      ctx.fillStyle = '#fffbe0';
      star(ctx, s * 0.5, -s * 1.05, s * 0.13, 4);
      star(ctx, -s * 0.55, -s * 0.75, s * 0.09, 4);
      ctx.restore();
    }
  }

  function drawBombMole(s, wob) {
    // 폭탄 몸통
    var g = ctx.createRadialGradient(-s * 0.15, -s * 0.72, s * 0.05, 0, -s * 0.55, s * 0.62);
    g.addColorStop(0, '#6e7480');
    g.addColorStop(1, '#20242c');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, -s * 0.55, s * 0.52, 0, 6.2832);
    ctx.fill();

    // 심지
    ctx.strokeStyle = '#c8a06a';
    ctx.lineWidth = Math.max(2, s * 0.05);
    ctx.beginPath();
    ctx.moveTo(s * 0.04, -s * 1.03);
    ctx.quadraticCurveTo(s * 0.28, -s * 1.24, s * 0.14, -s * 1.4);
    ctx.stroke();
    // 불꽃
    var f = 0.6 + 0.4 * Math.sin(wob * 22);
    ctx.fillStyle = '#ffcf4a';
    ctx.beginPath(); ctx.arc(s * 0.14, -s * 1.42, s * 0.11 * f, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#ff6b35';
    ctx.beginPath(); ctx.arc(s * 0.14, -s * 1.42, s * 0.07 * f, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s * 0.14, -s * 1.44, s * 0.032 * f, 0, 6.2832); ctx.fill();

    // 화난 눈
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-s * 0.19, -s * 0.6, s * 0.12, s * 0.11, 0, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s * 0.19, -s * 0.6, s * 0.12, s * 0.11, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#c62828';
    ctx.beginPath(); ctx.arc(-s * 0.19, -s * 0.59, s * 0.06, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.19, -s * 0.59, s * 0.06, 0, 6.2832); ctx.fill();
    // 눈썹
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = Math.max(2, s * 0.045);
    ctx.beginPath();
    ctx.moveTo(-s * 0.33, -s * 0.79); ctx.lineTo(-s * 0.09, -s * 0.69);
    ctx.moveTo(s * 0.33, -s * 0.79); ctx.lineTo(s * 0.09, -s * 0.69);
    ctx.stroke();
    // 이빨 입
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(-s * 0.16, -s * 0.36);
    ctx.lineTo(s * 0.16, -s * 0.36);
    ctx.lineTo(s * 0.10, -s * 0.26);
    ctx.lineTo(0, -s * 0.34);
    ctx.lineTo(-s * 0.10, -s * 0.26);
    ctx.closePath();
    ctx.fill();
  }

  function star(c, x, y, r, n) {
    c.beginPath();
    for (var i = 0; i < n * 2; i++) {
      var rad = (i % 2 === 0) ? r : r * 0.4;
      var a = (Math.PI / n) * i - Math.PI / 2;
      var px = x + Math.cos(a) * rad;
      var py = y + Math.sin(a) * rad;
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.closePath();
    c.fill();
  }

  function drawMoleAt(m, cell, idx) {
    var pop = molePop(m);
    if (pop <= 0 && m.state !== 'hit') return;

    var s = Math.min(L.cw * 0.62, L.ch * 0.60);
    var baseY = cell.cy - L.rise * pop;
    var sq = 0, alpha = 1, extraRot = 0;

    if (m.state === 'hit') {
      var k = Math.min(1, m.hitTime / 0.3);
      sq = Math.sin(k * Math.PI) * 0.35;             // 스케일 팝 (눌렸다가 사라짐)
      baseY = cell.cy - L.rise * (1 - k * 0.9);
      alpha = 1 - k * 0.7;
      extraRot = Math.sin(k * 12) * 0.12;
    } else {
      // 튀어오르는 순간 살짝 커졌다 돌아오기
      if (m.time < 0.26) sq = -Math.sin(Math.min(1, m.time / 0.26) * Math.PI) * 0.16;
    }

    ctx.save();
    // 구멍 위쪽만 보이도록 자르기
    ctx.beginPath();
    ctx.rect(cell.cx - L.cw * 0.75, 0, L.cw * 1.5, cell.cy + L.ry * 0.15);
    ctx.clip();

    ctx.globalAlpha = alpha;
    ctx.translate(cell.cx, baseY);
    ctx.rotate(extraRot + Math.sin((bgTime + m.seed) * 3) * 0.04 * pop);
    ctx.scale(1 + sq, 1 - sq);

    // 그림자
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.beginPath();
    ctx.ellipse(0, s * 0.05, s * 0.42, s * 0.12, 0, 0, 6.2832);
    ctx.fill();

    var wob = bgTime + m.seed;
    if (m.type === 'bomb') drawBombMole(s, wob);
    else drawNormalMole(s, m.type === 'gold', wob);

    if (m.state === 'hit' && m.type !== 'bomb') {
      // 별 뱅뱅
      ctx.fillStyle = '#ffe066';
      for (var i = 0; i < 3; i++) {
        var a = m.hitTime * 12 + i * 2.1;
        star(ctx, Math.cos(a) * s * 0.55, -s * 1.15 + Math.sin(a) * s * 0.12, s * 0.11, 5);
      }
    }
    ctx.restore();
  }

  function drawHammer() {
    if (hammer.show <= 0) return;
    var s = Math.min(W, H) * 0.13;
    var swing = hammer.swing > 0 ? Math.sin(Math.min(1, hammer.swing / 0.26) * Math.PI) : 0;
    ctx.save();
    ctx.globalAlpha = Math.min(1, hammer.show * 1.4);
    ctx.translate(hammer.x + s * 0.5, hammer.y - s * 0.35);
    ctx.rotate(-0.5 + swing * 1.5);

    // 손잡이
    ctx.fillStyle = '#b5651d';
    ctx.strokeStyle = 'rgba(0,0,0,.3)';
    ctx.lineWidth = 2;
    roundRect(ctx, -s * 0.08, 0, s * 0.16, s * 0.95, s * 0.06);
    ctx.fill(); ctx.stroke();
    // 머리
    ctx.fillStyle = '#e63946';
    roundRect(ctx, -s * 0.42, -s * 0.34, s * 0.84, s * 0.42, s * 0.12);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    roundRect(ctx, -s * 0.36, -s * 0.28, s * 0.7, s * 0.11, s * 0.05);
    ctx.fill();
    ctx.restore();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    drawBackground();

    for (var i = 0; i < 9; i++) {
      var cell = L.cells[i];
      drawHoleBack(cell.cx, cell.cy, L.rx, L.ry);
      drawMoleAt(holes[i], cell, i);
      drawHoleFront(cell.cx, cell.cy, L.rx, L.ry);

      // 키보드 선택 표시
      if (kbMode && state === STATE.PLAY && i === selHole) {
        ctx.strokeStyle = 'rgba(255,255,255,.85)';
        ctx.lineWidth = 3;
        ctx.setLineDash([7, 6]);
        ctx.lineDashOffset = -bgTime * 26;
        roundRect(ctx, cell.cx - L.cw * 0.42, cell.cy - L.ch * 0.72, L.cw * 0.84, L.ch * 0.88, 12);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 구멍 번호 (키보드 안내)
      if (kbMode && state === STATE.PLAY) {
        ctx.fillStyle = 'rgba(255,255,255,.55)';
        ctx.font = font(Math.max(10, L.cw * 0.16), 800);
        ctx.textAlign = 'center';
        ctx.fillText(String(i + 1), cell.cx, cell.cy + L.ry * 1.9);
      }
    }

    // 파티클
    for (var p2 = 0; p2 < particles.length; p2++) {
      var p = particles[p2];
      var a = Math.max(0, Math.min(1, p.life / p.max));
      ctx.globalAlpha = a;
      ctx.fillStyle = p.c;
      if (p.kind === 'star') {
        star(ctx, p.x, p.y, p.r * 1.4, 5);
      } else if (p.kind === 'smoke') {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * (1.6 - a * 0.6), 0, 6.2832);
        ctx.fill();
      } else {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillRect(-p.r * 0.5, -p.r * 0.5, p.r, p.r);
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;

    // 튀어오르는 점수 숫자
    ctx.textAlign = 'center';
    for (var q2 = 0; q2 < pops.length; q2++) {
      var q = pops[q2];
      var al = Math.max(0, Math.min(1, q.life / 0.6));
      var sc = q.life > 0.75 ? 1 + (q.life - 0.75) * 2.2 : 1;
      ctx.save();
      ctx.globalAlpha = al;
      ctx.translate(q.x, q.y);
      ctx.scale(sc, sc);
      ctx.font = font(q.size, 900);
      ctx.lineWidth = Math.max(3, q.size * 0.16);
      ctx.strokeStyle = 'rgba(20,10,0,.75)';
      ctx.strokeText(q.text, 0, 0);
      ctx.fillStyle = q.c;
      ctx.fillText(q.text, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    drawHammer();
    ctx.restore();

    // 화면 번쩍임
    if (flash > 0) {
      ctx.fillStyle = 'rgba(' + flashColor + ',' + (flash * 0.55).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    // 시간 부족 경고 비네트
    if (state === STATE.PLAY && timeLeft <= 10) {
      var pulse = 0.16 + 0.12 * Math.sin(bgTime * 8);
      var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.32, W / 2, H / 2, Math.max(W, H) * 0.72);
      vg.addColorStop(0, 'rgba(255,0,0,0)');
      vg.addColorStop(1, 'rgba(255,0,0,' + pulse.toFixed(3) + ')');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* =========================================================
     루프 (rAF + delta time, 단 하나만 돈다)
     ========================================================= */
  var lastT = 0, rafId = 0;
  function loop(t) {
    rafId = window.requestAnimationFrame(loop);
    if (!lastT) lastT = t;
    var dt = (t - lastT) / 1000;
    lastT = t;
    if (dt > 0.05) dt = 0.05;   // 탭 복귀 시 순간이동 방지
    if (dt < 0) dt = 0;
    update(dt);
    draw();
  }

  /* =========================================================
     시작 / 종료
     ========================================================= */
  function startGame() {
    audioReady();
    resetGame();
    state = STATE.PLAY;
    titleScreen.classList.add('hide');
    overScreen.classList.add('hide');
    stage.style.cursor = 'crosshair';
    sndStart();
    banner('시작! 두더지를 때려!');
  }

  function gradeOf(sc, acc) {
    if (sc >= 1100 && acc >= 65) return { g: 'S', name: '두더지 대왕 👑', c: '#ffe066' };
    if (sc >= 800) return { g: 'A', name: '망치 고수 🔨', c: '#7dffb0' };
    if (sc >= 500) return { g: 'B', name: '제법인데? 😎', c: '#8fd6ff' };
    if (sc >= 250) return { g: 'C', name: '연습 중 🙂', c: '#ffd166' };
    return { g: 'D', name: '다시 도전! 💪', c: '#ff9f9f' };
  }

  function gameOver() {
    if (state !== STATE.PLAY) return;
    state = STATE.OVER;

    // 남아있는 두더지 정리
    for (var i = 0; i < 9; i++) { holes[i].state = 'idle'; holes[i].time = 0; }

    var acc = swings > 0 ? Math.round(hits / swings * 100) : 0;
    var gr = gradeOf(score, acc);

    elGrade.textContent = gr.g;
    elGrade.style.color = gr.c;
    elGradeName.textContent = gr.name;
    elFinal.textContent = score + '점';
    elStats.textContent = '명중률 ' + acc + '% · 최고 콤보 ' + maxCombo + ' · 잡은 두더지 ' + hits + '마리';

    var isNew = score > best;
    if (isNew) {
      best = score;
      saveBest(best);
      elRegret.textContent = '🏆 신기록 달성! 대단해!';
      elRegret.classList.add('newRec');
      sndRecord();
      doFlash(0.5, '255,240,160');
    } else {
      elRegret.classList.remove('newRec');
      var diff = best - score;
      if (diff <= 0) elRegret.textContent = '최고 기록: ' + best + '점';
      else if (diff <= 50) elRegret.textContent = '아깝다! 최고 기록까지 딱 ' + diff + '점!';
      else if (diff <= 200) elRegret.textContent = '조금만 더! 최고 기록까지 ' + diff + '점';
      else elRegret.textContent = '최고 기록 ' + best + '점 · ' + diff + '점 남았어';
      sndOver();
    }
    elBestTitle.textContent = '최고 기록: ' + best + '점';

    overScreen.classList.remove('hide');
    stage.style.cursor = 'pointer';
    lastTapTime = Date.now();   // 실수로 바로 재시작되는 것 방지
  }

  /* =========================================================
     입력 — 마우스 / 터치 / 키보드
     ========================================================= */
  function stagePos(e) {
    var r = stage.getBoundingClientRect();
    var cx, cy;
    if (e.touches && e.touches.length) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
    else if (e.changedTouches && e.changedTouches.length) { cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY; }
    else { cx = e.clientX; cy = e.clientY; }
    return { x: (cx - r.left) * (W / r.width), y: (cy - r.top) * (H / r.height) };
  }

  var lastTapTime = 0;
  function onPress(e) {
    if (e.target && e.target.tagName === 'BUTTON') return;  // 버튼은 자기 click 으로 처리
    audioReady();
    var now = Date.now();

    if (state === STATE.TITLE) {
      startGame();
      return;
    }
    if (state === STATE.OVER) {
      if (now - lastTapTime < 350) return;  // 오조작 방지
      startGame();
      return;
    }
    kbMode = false;
    var p = stagePos(e);
    swingAt(p.x, p.y, false);
    lastTapTime = now;
  }

  stage.addEventListener('pointerdown', function (e) {
    if (e.target && e.target.tagName === 'BUTTON') return;
    e.preventDefault();
    onPress(e);
  });
  // pointer 미지원 대비
  if (!window.PointerEvent) {
    stage.addEventListener('mousedown', function (e) { e.preventDefault(); onPress(e); });
    stage.addEventListener('touchstart', function (e) { e.preventDefault(); onPress(e); }, { passive: false });
  }
  stage.addEventListener('pointermove', function (e) {
    if (state !== STATE.PLAY) return;
    var p = stagePos(e);
    hammer.x = p.x; hammer.y = p.y;
    if (hammer.show < 0.6) hammer.show = 0.6;
  });
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  startBtn.addEventListener('click', function (e) { e.stopPropagation(); audioReady(); startGame(); });
  againBtn.addEventListener('click', function (e) { e.stopPropagation(); audioReady(); startGame(); });

  var KEYMAP = {
    'Digit1': 0, 'Digit2': 1, 'Digit3': 2,
    'Digit4': 3, 'Digit5': 4, 'Digit6': 5,
    'Digit7': 6, 'Digit8': 7, 'Digit9': 8,
    'Numpad7': 0, 'Numpad8': 1, 'Numpad9': 2,
    'Numpad4': 3, 'Numpad5': 4, 'Numpad6': 5,
    'Numpad1': 6, 'Numpad2': 7, 'Numpad3': 8,
    'KeyQ': 0, 'KeyW': 1, 'KeyE': 2,
    'KeyA': 3, 'KeyS': 4, 'KeyD': 5,
    'KeyZ': 6, 'KeyX': 7, 'KeyC': 8
  };
  var GAME_KEYS = { 'Space': 1, 'ArrowUp': 1, 'ArrowDown': 1, 'ArrowLeft': 1, 'ArrowRight': 1, 'Enter': 1 };

  function hitHoleByKey(idx) {
    kbMode = true;
    selHole = idx;
    var c = L.cells[idx];
    swingAt(c.cx, c.cy - L.rise * 0.5, true);
  }

  window.addEventListener('keydown', function (e) {
    if (e.repeat) return;
    var code = e.code;
    if (!code) {  // 아주 오래된 브라우저 대비
      var k = e.key || '';
      if (k === ' ') code = 'Space';
      else if (k === 'Enter') code = 'Enter';
      else if (k.indexOf('Arrow') === 0) code = k;
      else if (k >= '1' && k <= '9') code = 'Digit' + k;
      else if (k.length === 1) code = 'Key' + k.toUpperCase();
      else code = '';
    }
    if (GAME_KEYS[code] || KEYMAP.hasOwnProperty(code)) e.preventDefault();

    if (state === STATE.TITLE) {
      if (code === 'Space' || code === 'Enter' || KEYMAP.hasOwnProperty(code)) { audioReady(); startGame(); }
      return;
    }
    if (state === STATE.OVER) {
      if (code === 'Space' || code === 'Enter') { audioReady(); startGame(); }
      return;
    }

    if (KEYMAP.hasOwnProperty(code)) { audioReady(); hitHoleByKey(KEYMAP[code]); return; }

    var col = selHole % 3, row = (selHole / 3) | 0;
    if (code === 'ArrowLeft') { kbMode = true; col = (col + 2) % 3; selHole = row * 3 + col; }
    else if (code === 'ArrowRight') { kbMode = true; col = (col + 1) % 3; selHole = row * 3 + col; }
    else if (code === 'ArrowUp') { kbMode = true; row = (row + 2) % 3; selHole = row * 3 + col; }
    else if (code === 'ArrowDown') { kbMode = true; row = (row + 1) % 3; selHole = row * 3 + col; }
    else if (code === 'Space' || code === 'Enter') { audioReady(); hitHoleByKey(selHole); }
  });

  // 탭이 숨겨지면 시간이 튀지 않도록
  document.addEventListener('visibilitychange', function () { lastT = 0; });

  /* =========================================================
     시작!
     ========================================================= */
  elBestTitle.textContent = '최고 기록: ' + best + '점';
  resize();
  updateHUD();
  spawnTimer = 0.4;
  rafId = window.requestAnimationFrame(loop);
})();
</script>
</body>
</html>
