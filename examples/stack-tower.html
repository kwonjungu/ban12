<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>스택 타워 🏗️</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#0a0f22;
    overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  body { display:flex; align-items:center; justify-content:center; }
  #wrap {
    position:relative;
    width:min(100vw, 460px);
    height:min(100vh, 900px);
    box-shadow:0 0 60px rgba(0,0,0,.6);
    overflow:hidden;
  }
  canvas { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
(function(){
'use strict';

/* ================= 캔버스 & 화면 ================= */
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var wrap = document.getElementById('wrap');
var W = 360, H = 640, DPR = 1;
var BH = 24;          // 블록 한 층 높이
var BASE_Y = 0;       // 월드 y=0 의 화면 y
var PAD = 6;

function resize(){
  var oldW = W;
  var r = wrap.getBoundingClientRect();
  W = Math.max(240, Math.round(r.width));
  H = Math.max(360, Math.round(r.height));
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  BH = Math.max(18, Math.min(30, Math.round(H * 0.034)));
  BASE_Y = H - Math.round(H * 0.10);
  if (oldW && Math.abs(oldW - W) > 1) {
    var k = W / oldW;
    for (var i=0;i<blocks.length;i++){ blocks[i].x *= k; blocks[i].w *= k; }
    if (cur){ cur.x *= k; cur.w *= k; }
    INIT_W = W * 0.62;
  } else {
    INIT_W = W * 0.62;
  }
  makeStars();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });

/* ================= 저장 (반드시 try/catch) ================= */
function loadNum(key, def){
  try {
    var v = window.localStorage.getItem(key);
    if (v === null || v === undefined) return def;
    var n = parseInt(v, 10);
    return isNaN(n) ? def : n;
  } catch(e){ return def; }
}
function saveNum(key, val){
  try { window.localStorage.setItem(key, String(val)); } catch(e){}
}
function loadFlag(key, def){
  try {
    var v = window.localStorage.getItem(key);
    if (v === null) return def;
    return v === '1';
  } catch(e){ return def; }
}

var bestFloor = loadNum('stacktower_best_floor', 0);
var bestScore = loadNum('stacktower_best_score', 0);
var muted = loadFlag('stacktower_muted', false);

/* ================= 소리 (WebAudio 직접 합성) ================= */
var AC = null;
var noiseBuf = null;

function audioInit(){
  if (AC) { if (AC.state === 'suspended') { try{ AC.resume(); }catch(e){} } return; }
  try {
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    AC = new Ctor();
    if (AC.state === 'suspended') { try{ AC.resume(); }catch(e){} }
  } catch(e){ AC = null; }
}
function getNoise(){
  if (!AC) return null;
  if (noiseBuf) return noiseBuf;
  try {
    var len = Math.floor(AC.sampleRate * 0.4);
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i=0;i<len;i++) d[i] = Math.random()*2-1;
  } catch(e){ noiseBuf = null; }
  return noiseBuf;
}
function tone(freq, dur, type, vol, delay, slideTo){
  if (!AC || muted) return;
  try {
    var t0 = AC.currentTime + (delay || 0);
    var o = AC.createOscillator();
    var g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, vol), t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch(e){}
}
function noise(dur, vol, delay, freq, q){
  if (!AC || muted) return;
  var buf = getNoise();
  if (!buf) return;
  try {
    var t0 = AC.currentTime + (delay || 0);
    var s = AC.createBufferSource();
    s.buffer = buf;
    var f = AC.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.setValueAtTime(freq || 900, t0);
    f.Q.value = q || 1.2;
    var g = AC.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(t0); s.stop(t0 + dur + 0.05);
  } catch(e){}
}
var SCALE = [0,2,4,5,7,9,11,12,14,16,19,21,24];
function sndPerfect(comboIdx){
  var st = SCALE[Math.min(comboIdx, SCALE.length-1)];
  var f = 523.25 * Math.pow(2, st/12);
  tone(f, 0.28, 'sine', 0.30, 0);
  tone(f*2, 0.20, 'triangle', 0.14, 0.01);
  tone(f*3, 0.12, 'sine', 0.06, 0.02);
  noise(0.10, 0.10, 0, 3200, 2.5);
}
function sndPlace(){
  tone(180, 0.10, 'square', 0.16, 0, 110);
  noise(0.10, 0.16, 0, 380, 1.0);
}
function sndCut(){
  noise(0.18, 0.14, 0.02, 1500, 0.8);
  tone(90, 0.16, 'sawtooth', 0.10, 0.02, 55);
}
function sndStart(){
  tone(392, 0.13, 'triangle', 0.22, 0.00);
  tone(523.25, 0.13, 'triangle', 0.22, 0.09);
  tone(659.25, 0.13, 'triangle', 0.22, 0.18);
  tone(1046.5, 0.30, 'triangle', 0.24, 0.27);
}
function sndOver(){
  tone(320, 0.55, 'sawtooth', 0.22, 0, 70);
  tone(160, 0.60, 'square', 0.12, 0.05, 45);
  noise(0.45, 0.14, 0, 260, 0.7);
}
function sndEvent(){
  tone(784, 0.10, 'square', 0.16, 0);
  tone(1046.5, 0.16, 'square', 0.16, 0.09);
}
function sndGold(){
  tone(1174.7, 0.10, 'triangle', 0.18, 0);
  tone(1568, 0.18, 'triangle', 0.18, 0.08);
}

/* ================= 게임 상태 ================= */
var state = 'menu';           // menu | playing | over
var blocks = [];              // {x,w,lv,hue,gold,pop}
var cur = null;               // 움직이는 블록
var debris = [];
var parts = [];
var floats = [];
var meteors = [];
var camY = 0, camTarget = 0;
var score = 0, combo = 0, maxCombo = 0;
var shake = 0, hitstop = 0, flash = 0, perfGlow = 0;
var toast = null;
var playTime = 0, overTime = 0, menuTime = 0;
var spawnSide = 1;
var INIT_W = 220;
var stars = [];
var newRecord = false;
var lastEventLv = 0;
var shownGoldTip = false;
var finalFloors = 0;          // 게임오버 순간의 층수 (붕괴로 blocks 가 줄어들어도 유지)
var queuedRestart = false;    // 게이트 전에 누른 탭 선입력 버퍼
var RESTART_GATE = 1.0;       // 붕괴 연출을 보여줄 시간
var LIFE_WARN = 2.6;          // 블록 수명: 경고 시작
var LIFE_MAX = 4.0;           // 블록 수명: 강제 낙하
var FAST_CUT = 1.2;           // 빠른 결정 보너스 컷오프

function makeStars(){
  stars = [];
  for (var i=0;i<140;i++){
    stars.push({
      x: Math.random()*W,
      y: Math.random()*2200,
      r: Math.random()*1.6 + 0.5,
      a: Math.random()*0.6 + 0.25,
      tw: Math.random()*6
    });
  }
}

function hueFor(lv){ return (202 + lv*7) % 360; }

function reset(){
  blocks = [];
  debris = [];
  parts = [];
  floats = [];
  meteors = [];
  cur = null;
  camY = 0; camTarget = 0;
  score = 0; combo = 0; maxCombo = 0;
  shake = 0; hitstop = 0; flash = 0; perfGlow = 0;
  toast = null;
  playTime = 0; overTime = 0;
  spawnSide = 1;
  newRecord = false;
  lastEventLv = 0;
  shownGoldTip = false;
  finalFloors = 0;
  queuedRestart = false;
  INIT_W = W * 0.62;
  blocks.push({ x: W/2, w: INIT_W, lv: 0, hue: hueFor(0), gold:false, pop:0 });
  spawnBlock();
}

function speedFor(lv){
  return Math.min(330, 118 + lv*6);
}

/* 20층 이상 파동 배수 (판정 계산과 이동에서 같은 값을 써야 한다) */
function waveMul(lv, t){
  if (lv < 20) return 1;
  return 1 + 0.22 * Math.sin(t * 4.0);
}

/* 퍼펙트 판정 폭: 블록 폭이 아니라 '속도'에 묶는다.
   ±perfEps = 총 3.5프레임(60fps 기준)의 반응 시간을 몇 층이든 보장한다. */
function perfEpsFor(c){
  var top = blocks[blocks.length-1];
  var eSpd = speedFor(c.lv) * (c.lv >= 20 ? 1.22 : 1) * (c.gold ? 1.25 : 1);
  var e = Math.max(top.w * 0.045, eSpd / 60 * 1.75);
  if (c.lv <= 3) e *= 2.2;          // 첫 3블록은 접대 — 10초 안에 첫 PERFECT
  return Math.min(e, top.w * 0.5);  // 최소 절반은 걸쳐야 퍼펙트
}

/* 이 폭 이하로 남으면 다음 판에서 사실상 확정사망(walking dead)이므로 그 자리에서 끝낸다 */
function minAliveW(){ return Math.max(14, INIT_W * 0.07); }

function spawnBlock(){
  var top = blocks[blocks.length-1];
  var lv = top.lv + 1;
  var w = top.w;
  var gold = (lv % 7 === 0);
  var minX = w/2 + PAD, maxX = W - w/2 - PAD;
  if (maxX < minX) { minX = maxX = W/2; }
  cur = {
    x: spawnSide > 0 ? minX : maxX,
    w: w,
    lv: lv,
    dir: spawnSide > 0 ? 1 : -1,
    hue: gold ? 45 : hueFor(lv),
    gold: gold,
    t: 0,
    life: 0,
    warned: false
  };
  spawnSide *= -1;
  if (gold && !shownGoldTip){
    shownGoldTip = true;
    setToast('✨ 황금 블록! 점수 2배', 2.2);
  }
}

function setToast(msg, dur){
  toast = { text: msg, t: 0, dur: dur || 1.8 };
}

/* ================= 입력 ================= */
function muteRect(){ return { x: W - 44, y: 10, w: 34, h: 34 }; }

function handleTap(){
  audioInit();
  if (state === 'menu'){
    reset();
    state = 'playing';
    sndStart();
    setToast('움직이는 블록을 딱 맞춰!', 2.0);
  } else if (state === 'playing'){
    dropBlock();
  } else if (state === 'over'){
    if (overTime > RESTART_GATE){
      reset();
      state = 'playing';
      sndStart();
    } else {
      // 게이트 전에 누른 탭도 버리지 않고 예약한다 ('접수됨' 소리까지)
      if (!queuedRestart) tone(660, 0.05, 'triangle', 0.10, 0);
      queuedRestart = true;
    }
  }
}

cv.addEventListener('pointerdown', function(e){
  e.preventDefault();
  var r = cv.getBoundingClientRect();
  var px = (e.clientX - r.left) * (W / r.width);
  var py = (e.clientY - r.top) * (H / r.height);
  var m = muteRect();
  if (px >= m.x - 6 && px <= m.x + m.w + 6 && py >= m.y - 6 && py <= m.y + m.h + 6){
    audioInit();
    muted = !muted;
    saveNum('stacktower_muted', muted ? 1 : 0);
    if (!muted) tone(880, 0.10, 'triangle', 0.2, 0);
    return;
  }
  handleTap();
}, { passive:false });

cv.addEventListener('touchstart', function(e){ e.preventDefault(); }, { passive:false });
cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

window.addEventListener('keydown', function(e){
  var k = e.key;
  if (k === ' ' || k === 'Spacebar' || k === 'ArrowUp' || k === 'ArrowDown' ||
      k === 'ArrowLeft' || k === 'ArrowRight' || k === 'Enter'){
    e.preventDefault();
    handleTap();
  } else if (k === 'm' || k === 'M'){
    audioInit();
    muted = !muted;
    saveNum('stacktower_muted', muted ? 1 : 0);
  }
});

/* ================= 블록 놓기 ================= */
function dropBlock(){
  if (!cur) return;
  var top = blocks[blocks.length-1];
  var offset = cur.x - top.x;
  var absOff = Math.abs(offset);
  var overlap = top.w - absOff;
  var perfEps = perfEpsFor(cur);
  var minW = minAliveW();
  var floorNo = blocks.length + 1;
  var fast = (cur.life < FAST_CUT);

  if (absOff <= perfEps){
    /* ===== PERFECT ===== */
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    // 콤보는 점수가 아니라 '목숨'이다 — 콤보가 높을수록 폭이 크게 되살아난다
    var grow = 6 + Math.min(combo, 5) * 5;   // 콤보1=11px … 콤보5+=31px
    var nw = Math.min(top.w + grow, INIT_W);
    var gain = Math.round((50 + Math.min(combo,12) * 25) * (cur.gold ? 2 : 1));
    if (fast) gain = Math.round(gain * 1.5);
    score += gain;
    blocks.push({ x: top.x, w: nw, lv: cur.lv, hue: cur.hue, gold: cur.gold, pop: 1 });
    floats.push({ x: top.x, wy: cur.lv*BH + BH + 6, t: 0,
      text: (combo >= 2 ? 'PERFECT x' + combo : 'PERFECT!'),
      sub: '+' + gain + (fast ? ' ⚡빠름!' : ''),
      hue: cur.gold ? 45 : 55 });
    if (nw > top.w + 0.5){
      floats.push({ x: top.x, wy: cur.lv*BH + BH + 30, t: 0,
        text: '', sub: '폭 +' + Math.round(nw - top.w), hue: 150 });
    }
    burstRing(top.x, cur.lv*BH + BH/2, nw, cur.gold ? 45 : 52);
    shake = Math.max(shake, 9 + Math.min(combo,8));
    hitstop = 0.06;
    flash = 0.55;
    perfGlow = 1;
    sndPerfect(combo - 1);
    if (cur.gold) sndGold();
    if (combo === 5 || combo === 10 || combo === 15){
      flash = 0.95; shake = 26; hitstop = 0.12;
      setToast(combo === 5 ? '🔥 콤보 5! 블록이 크게 커진다!' : '🔥🔥 콤보 ' + combo + '! 미쳤다!', 1.6);
      sndEvent();
      burstRing(top.x, cur.lv*BH + BH/2, W, 45);
    }
  } else if (overlap <= minW){
    // 너무 조금 걸쳤다 → 그 자리에서 끝낸다 (살아남아도 다음 탭에 확정사망인 구간 제거)
    debris.push({
      x: cur.x, wy: cur.lv * BH, w: cur.w, h: BH,
      vx: (offset > 0 ? 1 : -1) * 90, vy: 30,
      rot: 0, rv: (offset > 0 ? 1 : -1) * 3.0,
      hue: cur.hue, gold: cur.gold
    });
    cur = null;
    burst(top.x, top.lv*BH + BH, 18, top.hue, 1.2);
    sndCut();
    gameOver();
    return;
  } else {
    /* ===== 잘림 ===== */
    if (combo >= 2){ setToast('콤보 끊김! 😢', 1.0); shake = Math.max(shake, 10); }
    combo = 0;
    var newX = top.x + offset/2;
    var newW = overlap;
    var cutW = absOff;
    var cutX = offset > 0 ? (cur.x + cur.w/2 - cutW/2) : (cur.x - cur.w/2 + cutW/2);
    debris.push({
      x: cutX, wy: cur.lv * BH, w: cutW, h: BH,
      vx: (offset > 0 ? 1 : -1) * (40 + Math.random()*40), vy: 20,
      rot: 0, rv: (offset > 0 ? 1 : -1) * 2.4,
      hue: cur.hue, gold: cur.gold
    });
    var g2 = Math.round(10 * (cur.gold ? 2 : 1) * (fast ? 1.5 : 1));
    score += g2;
    blocks.push({ x: newX, w: newW, lv: cur.lv, hue: cur.hue, gold: cur.gold, pop: 0.8 });
    floats.push({ x: cutX, wy: cur.lv*BH + BH, t: 0, text: '+' + g2, sub: (fast ? '⚡빠름!' : ''), hue: cur.hue });
    burst(cutX, cur.lv*BH + BH/2, 10, cur.hue, 0.8);
    shake = Math.max(shake, 6);
    hitstop = 0.03;
    sndPlace();
    sndCut();
  }

  cur = null;
  checkEvents(floorNo);
  spawnBlock();
}

function checkEvents(floorNo){
  var lv = blocks[blocks.length-1].lv;
  if (lv >= 10 && lv % 10 === 0 && lv !== lastEventLv){
    lastEventLv = lv;
    sndEvent();
    if (lv === 10) setToast('🚀 ' + lv + '층! 블록이 빨라진다!', 1.8);
    else if (lv === 20) setToast('🌪 ' + lv + '층! 블록이 흔들린다!', 1.8);
    else if (lv === 30){
      setToast('☄️ ' + lv + '층! 우주가 보여!', 1.8);
      for (var mk=0; mk<3; mk++){
        meteors.push({ x: W*0.5 + mk*140 + Math.random()*120, y: -40 - mk*60, vx: -160, vy: 260, t: 0, life: 1.4 });
      }
    }
    else setToast('🔥 ' + lv + '층 돌파!', 1.6);
    flash = Math.max(flash, 0.35);
    shake = Math.max(shake, 8);
  }
  if (bestFloor > 0 && floorNo === bestFloor + 1){
    setToast('🎉 신기록 갱신!!', 2.0);
    flash = Math.max(flash, 0.6);
    shake = Math.max(shake, 12);
    sndEvent();
  }
}

function gameOver(){
  state = 'over';
  overTime = 0;
  queuedRestart = false;
  var floors = blocks.length;
  finalFloors = floors;                 // 붕괴로 blocks 가 줄어도 표시용 층수는 유지
  if (floors > bestFloor){ bestFloor = floors; newRecord = true; saveNum('stacktower_best_floor', bestFloor); }
  if (score > bestScore){ bestScore = score; saveNum('stacktower_best_score', bestScore); }

  // 탑을 실제로 무너뜨린다 (위에서부터 최대 8층이 잔해로 날아간다)
  var keep = Math.max(1, blocks.length - 8);
  for (var i = blocks.length - 1; i >= keep; i--){
    var b = blocks[i];
    debris.push({
      x: b.x, wy: b.lv * BH, w: b.w, h: BH,
      vx: (Math.random() < 0.5 ? -1 : 1) * (70 + (blocks.length - i) * 30),
      vy: -40 - Math.random()*80,
      rot: 0, rv: (Math.random()-0.5) * 6,
      hue: b.hue, gold: b.gold
    });
    burst(b.x, b.lv*BH + BH/2, 4, b.hue, 0.7);
  }
  blocks.length = keep;

  hitstop = 0.22;
  shake = 28;
  sndOver();
}

/* ================= 파티클 ================= */
function burst(x, wy, n, hue, power){
  for (var i=0;i<n;i++){
    var a = Math.random() * Math.PI * 2;
    var sp = (60 + Math.random()*180) * (power || 1);
    parts.push({
      x: x, wy: wy,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp + 40,
      life: 0.5 + Math.random()*0.5, t: 0,
      r: 2 + Math.random()*3.5, hue: hue + (Math.random()*30-15), g: 620
    });
  }
}
function burstRing(x, wy, w, hue){
  for (var i=0;i<26;i++){
    var a = Math.PI * (i/25);
    var sp = 130 + Math.random()*140;
    parts.push({
      x: x + (Math.random()-0.5)*w, wy: wy,
      vx: Math.cos(a)*sp*0.6, vy: Math.sin(a)*sp,
      life: 0.55 + Math.random()*0.5, t: 0,
      r: 2 + Math.random()*4, hue: hue + (Math.random()*40-20), g: 420
    });
  }
}

/* ================= 업데이트 ================= */
function update(dt){
  flash = Math.max(0, flash - dt*2.4);
  shake = Math.max(0, shake - dt*46);
  perfGlow = Math.max(0, perfGlow - dt*1.8);
  if (toast){ toast.t += dt; if (toast.t > toast.dur) toast = null; }

  if (state === 'menu'){ menuTime += dt; return; }
  if (state === 'over'){
    overTime += dt;
    // 게이트 전에 눌린 탭을 게이트가 열리는 순간 자동 실행
    if (queuedRestart && overTime > RESTART_GATE){
      queuedRestart = false;
      reset();
      state = 'playing';
      sndStart();
      return;
    }
  }

  if (hitstop > 0){ hitstop -= dt; return; }

  if (state === 'playing'){
    playTime += dt;
    if (cur){
      cur.t += dt;
      cur.life += dt;
      if (!cur.warned && cur.life > LIFE_WARN){
        cur.warned = true;
        tone(300, 0.08, 'square', 0.11, 0);
      }
      if (cur.life > LIFE_MAX){
        dropBlock();               // 기다리는 데는 비용이 있다 — 강제 낙하
      }
    }
    if (cur && state === 'playing'){
      var spd = speedFor(cur.lv) * waveMul(cur.lv, cur.t);
      if (cur.gold) spd *= 1.25;
      cur.x += cur.dir * spd * dt;
      var minX = cur.w/2 + PAD, maxX = W - cur.w/2 - PAD;
      if (maxX < minX){ minX = maxX = W/2; }
      if (cur.x > maxX){ cur.x = maxX; cur.dir = -1; }
      if (cur.x < minX){ cur.x = minX; cur.dir = 1; }
    }
  }

  // 카메라 (붕괴 중에는 화면이 따라 내려가지 않도록 고정)
  if (state === 'playing'){
    var stackH = blocks.length * BH;
    camTarget = Math.max(0, stackH - (BASE_Y - H*0.60));
  }
  camY += (camTarget - camY) * Math.min(1, dt * 6.5);

  // 유성 (30층~)
  var topLv = blocks.length ? blocks[blocks.length-1].lv : 0;
  if (state === 'playing' && topLv >= 30 && Math.random() < dt * 0.5 && meteors.length < 8){
    meteors.push({ x: Math.random()*W*1.3, y: -30, vx: -160, vy: 260, t: 0, life: 1.4 });
  }
  for (var mi=meteors.length-1; mi>=0; mi--){
    var mo = meteors[mi];
    mo.t += dt;
    mo.x += mo.vx * dt;
    mo.y += mo.vy * dt;
    if (mo.t > mo.life || mo.y > H + 60) meteors.splice(mi,1);
  }

  // 팝 애니메이션
  for (var i=0;i<blocks.length;i++){
    if (blocks[i].pop > 0) blocks[i].pop = Math.max(0, blocks[i].pop - dt*4.2);
  }

  // 잔해
  for (var d=debris.length-1; d>=0; d--){
    var o = debris[d];
    o.vy += 1500 * dt;
    o.wy -= o.vy * dt;
    o.x += o.vx * dt;
    o.rot += o.rv * dt;
    if (screenY(o.wy) > H + 260) debris.splice(d,1);
  }

  // 파티클
  for (var p=parts.length-1; p>=0; p--){
    var q = parts[p];
    q.t += dt;
    q.vy -= q.g * dt;
    q.x += q.vx * dt;
    q.wy += q.vy * dt;
    q.vx *= 0.985;
    if (q.t >= q.life) parts.splice(p,1);
  }

  // 점수 텍스트
  for (var f=floats.length-1; f>=0; f--){
    floats[f].t += dt;
    floats[f].wy += 44 * dt;
    if (floats[f].t > 1.2) floats.splice(f,1);
  }
}

function screenY(worldY){ return BASE_Y - worldY + camY; }

/* ================= 그리기 ================= */
function rr(x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  if (r < 0) r = 0;
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

var FONT = '-apple-system, BlinkMacSystemFont, system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
function setFont(size, weight){ ctx.font = (weight || 'bold') + ' ' + size + 'px ' + FONT; }
function text(str, x, y, size, color, align, weight, shadow){
  setFont(size, weight);
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (shadow){
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillText(str, x + 2, y + 2.5);
  }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

function drawSky(){
  var lv = blocks.length ? blocks[blocks.length-1].lv : 0;
  var t = Math.min(1, lv / 45);
  var topL = 6 + (1-t)*10;
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'hsl(' + (232 - t*20) + ', 55%, ' + topL + '%)');
  g.addColorStop(0.55, 'hsl(' + (222 - t*10) + ', 48%, ' + (14 + (1-t)*10) + '%)');
  g.addColorStop(1, 'hsl(' + (208 + t*20) + ', 45%, ' + (22 + (1-t)*14) + '%)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 별 (카메라 패럴랙스) — 30층부터 별이 두 배로 촘촘해진다
  var off = (state === 'menu' ? menuTime*6 : camY * 0.3);
  var starN = (lv >= 30) ? stars.length : Math.min(70, stars.length);
  for (var i=0;i<starN;i++){
    var s = stars[i];
    var y = ((s.y + off) % 2200);
    if (y > H + 20) continue;
    var tw = 0.55 + 0.45*Math.sin((state==='menu'?menuTime:playTime)*2.2 + s.tw);
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x, y, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 달
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = '#fdf3c9';
  ctx.beginPath();
  ctx.arc(W - 62, 96 - Math.min(60, camY*0.02), 22, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = 0.20;
  ctx.beginPath();
  ctx.arc(W - 62, 96 - Math.min(60, camY*0.02), 34, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = 1;

  if (state === 'menu') return;

  // (a) 12층~ : 구름층
  if (lv >= 12){
    var co = (camY * 0.45) % 900;
    ctx.fillStyle = '#dbe8ff';
    ctx.globalAlpha = 0.10;
    for (var ci=0; ci<5; ci++){
      var cx = (ci*137 + co*0.35) % (W + 160) - 80;
      var cyy = 200 + ci*90 - co;
      if (cyy < -60) cyy += 900;
      if (cyy > H + 60) continue;
      ctx.beginPath();
      ctx.ellipse(cx, cyy, 70 + ci*12, 18, 0, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // (b) 22층~ : 저 아래 도시 불빛
  if (lv >= 22){
    var po = (camY * 0.12) % 40;
    ctx.fillStyle = 'hsl(45, 90%, 60%)';
    for (var bi=0; bi<24; bi++){
      var bw = 6 + (bi * 7) % 9;
      var bx = (bi * 79 + 11) % W;
      var bh2 = 8 + (bi * 13) % 26;
      ctx.globalAlpha = 0.20 + ((bi * 17) % 10) * 0.03;
      ctx.fillRect(bx, H - 34 + po*0.5, bw, bh2);
    }
    ctx.globalAlpha = 1;
  }

  // (c) 30층~ : 진짜 유성
  if (meteors.length){
    ctx.lineCap = 'round';
    for (var k=0; k<meteors.length; k++){
      var m2 = meteors[k];
      var ma = Math.max(0, 1 - m2.t / m2.life);
      ctx.globalAlpha = ma * 0.9;
      var gm = ctx.createLinearGradient(m2.x, m2.y, m2.x - m2.vx*0.22, m2.y - m2.vy*0.22);
      gm.addColorStop(0, 'rgba(255,255,255,1)');
      gm.addColorStop(1, 'rgba(160,200,255,0)');
      ctx.strokeStyle = gm;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(m2.x, m2.y);
      ctx.lineTo(m2.x - m2.vx*0.22, m2.y - m2.vy*0.22);
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(m2.x, m2.y, 2.2, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.lineCap = 'butt';
  }
}

function drawGround(){
  var y = screenY(0);
  if (y > H + 60 || y < -60) return;
  var g = ctx.createLinearGradient(0, y, 0, H);
  g.addColorStop(0, 'rgba(120,180,255,.28)');
  g.addColorStop(1, 'rgba(10,16,40,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, y, W, H - y);
  ctx.strokeStyle = 'rgba(160,210,255,.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, y); ctx.lineTo(W, y);
  ctx.stroke();
}

function blockColors(hue, gold){
  if (gold){
    return { top:'hsl(48, 100%, 72%)', mid:'hsl(42, 96%, 58%)', bot:'hsl(34, 90%, 44%)', edge:'hsl(50,100%,85%)' };
  }
  return {
    top:'hsl(' + hue + ', 72%, 68%)',
    mid:'hsl(' + hue + ', 66%, 55%)',
    bot:'hsl(' + hue + ', 62%, 38%)',
    edge:'hsl(' + hue + ', 85%, 80%)'
  };
}

function drawBlockRect(x, y, w, h, hue, gold, glow, band){
  if (w <= 0.5) return;
  var c = blockColors(hue, gold);
  if (glow){
    ctx.save();
    ctx.shadowColor = gold ? 'rgba(255,210,80,.95)' : 'hsla(' + hue + ',95%,70%,.9)';
    ctx.shadowBlur = 22 * glow;
  }
  var g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, c.top);
  g.addColorStop(0.5, c.mid);
  g.addColorStop(1, c.bot);
  ctx.fillStyle = g;
  rr(x, y, w, h, 4);
  ctx.fill();
  if (glow) ctx.restore();

  // 윗면 하이라이트
  ctx.fillStyle = 'rgba(255,255,255,.30)';
  rr(x + 2, y + 1.5, Math.max(0, w - 4), Math.max(1.5, h*0.20), 2);
  ctx.fill();
  // 아래 그림자선
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.fillRect(x + 2, y + h - 2.5, Math.max(0, w - 4), 2);
  // 10층 구간마다 무늬가 바뀌어 탑 자체도 높이에 따라 달라 보인다
  if (band && w > 26){
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.fillRect(x + w*0.30 - 2, y + 4, 4, Math.max(2, h - 9));
    ctx.fillRect(x + w*0.70 - 2, y + 4, 4, Math.max(2, h - 9));
  }
  // 테두리
  ctx.strokeStyle = 'rgba(255,255,255,.28)';
  ctx.lineWidth = 1;
  rr(x + 0.5, y + 0.5, Math.max(0, w - 1), Math.max(0, h - 1), 4);
  ctx.stroke();

  if (gold && w > 22){
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    setFont(Math.min(13, h*0.62), 'bold');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('★', x + w/2, y + h/2 + 0.5);
  }
}

function drawBlocks(){
  for (var i=0;i<blocks.length;i++){
    var b = blocks[i];
    var ytop = screenY(b.lv*BH + BH);
    if (ytop > H + 40 || ytop + BH < -40) continue;
    var pop = b.pop;
    var bandOn = (Math.floor(b.lv/10) % 2 === 1);
    if (pop > 0){
      var sx = 1 + pop*0.16, sy2 = 1 - pop*0.34;
      ctx.save();
      ctx.translate(b.x, ytop + BH);
      ctx.scale(sx, sy2);
      drawBlockRect(-b.w/2, -BH, b.w, BH, b.hue, b.gold, pop*0.9, bandOn);
      ctx.restore();
    } else {
      drawBlockRect(b.x - b.w/2, ytop, b.w, BH, b.hue, b.gold, 0, bandOn);
    }
  }
}

function drawCurrent(){
  if (!cur) return;
  var ytop = screenY(cur.lv*BH + BH);
  var bob = Math.sin(cur.t*8) * 1.5;
  var by = ytop - 8 + bob;
  var top = blocks[blocks.length-1];
  var gy = screenY(top.lv*BH + BH);

  // 퍼펙트 판정 창을 눈에 보이게 (아래 블록 윗면의 흰 띠)
  var e = perfEpsFor(cur);
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.fillRect(top.x - e, gy, e*2, 3);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fillRect(top.x - 1, gy - 1, 2, 5);

  // 수명 경고: 2.6초부터 빨갛게 점멸 + 남은 시간 바
  var warn = cur.life > LIFE_WARN;
  ctx.save();
  if (warn) ctx.globalAlpha = 0.6 + 0.4*Math.sin(cur.life*22);
  drawBlockRect(cur.x - cur.w/2, by, cur.w, BH,
    warn ? 2 : cur.hue, warn ? false : cur.gold,
    0.55 + 0.25*Math.sin(cur.t*7), (Math.floor(cur.lv/10) % 2 === 1));
  ctx.restore();

  if (warn){
    var ratio = Math.max(0, 1 - (cur.life - LIFE_WARN) / (LIFE_MAX - LIFE_WARN));
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(cur.x - cur.w/2, by - 7, cur.w, 3);
    ctx.fillStyle = 'hsl(' + (ratio*50) + ', 95%, 60%)';
    ctx.fillRect(cur.x - cur.w/2, by - 7, cur.w * ratio, 3);
  }

  // 정렬 가이드 (아래 블록 중심선)
  ctx.strokeStyle = 'rgba(255,255,255,.20)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3,5]);
  ctx.beginPath();
  ctx.moveTo(top.x, gy);
  ctx.lineTo(top.x, by + BH);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawDebris(){
  for (var i=0;i<debris.length;i++){
    var o = debris[i];
    var y = screenY(o.wy + o.h);
    ctx.save();
    ctx.translate(o.x, y + o.h/2);
    ctx.rotate(o.rot);
    ctx.globalAlpha = 0.92;
    drawBlockRect(-o.w/2, -o.h/2, o.w, o.h, o.hue, o.gold, 0);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

function drawParts(){
  for (var i=0;i<parts.length;i++){
    var p = parts[i];
    var a = 1 - (p.t / p.life);
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = 'hsl(' + p.hue + ', 90%, ' + (62 + a*18) + '%)';
    var y = screenY(p.wy);
    ctx.beginPath();
    ctx.arc(p.x, y, p.r * (0.4 + a*0.8), 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloats(){
  for (var i=0;i<floats.length;i++){
    var f = floats[i];
    var a = 1 - Math.max(0, (f.t - 0.6) / 0.6);
    var pop2 = f.t < 0.14 ? (1 + (0.14 - f.t) * 3.2) : 1;
    var y = screenY(f.wy);
    ctx.globalAlpha = Math.max(0, a);
    ctx.save();
    ctx.translate(f.x, y);
    ctx.scale(pop2, pop2);
    text(f.text, 0, 0, 19, 'hsl(' + f.hue + ', 100%, 72%)', 'center', '900', true);
    if (f.sub) text(f.sub, 0, 20, 15, '#ffffff', 'center', 'bold', true);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

function drawBestLine(){
  if (bestFloor <= 1 || state !== 'playing') return;
  var y = screenY(bestFloor * BH);
  if (y < -20 || y > H - 40) return;
  ctx.strokeStyle = 'rgba(255,214,102,.75)';
  ctx.lineWidth = 2;
  ctx.setLineDash([8,6]);
  ctx.beginPath();
  ctx.moveTo(0, y); ctx.lineTo(W, y);
  ctx.stroke();
  ctx.setLineDash([]);
  text('👑 최고 ' + bestFloor + '층', W - 10, y - 12, 13, 'rgba(255,214,102,.95)', 'right', 'bold', true);
}

function drawHUD(){
  var floors = (state === 'over') ? finalFloors : blocks.length;

  var g = ctx.createLinearGradient(0,0,0,86);

  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,86);

  text(floors + '층', 14, 26, 26, '#ffffff', 'left', '900', true);
  text('점수 ' + score, 14, 52, 15, 'rgba(255,255,255,.82)', 'left', 'bold', true);

  if (combo >= 2){

    ctx.save();
    ctx.translate(W/2, 34);
    ctx.scale(s, s);

    ctx.globalAlpha = ta;
    setFont(16, 'bold');
    var tw = ctx.measureText(toast.text).width;
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    rr(W/2 - tw/2 - 14, H - 78, tw + 28, 34, 17); ctx.fill();
    text(toast.text, W/2, H - 61, 16, '#ffffff', 'center', 'bold', false);
    ctx.globalAlpha = 1;
  }
}

function drawMenu(){
  // 장식 타워
  var n = 9;
  var baseW = Math.min(W*0.52, 220);

  for (var i=0;i<n;i++){

    var y = by - (i+1)*BH;
    ctx.save();
    ctx.globalAlpha = 0.97;
    drawBlockRect(W/2 - w/2 + wob, y, w, BH - 2, hueFor(i*2), i === 6, i === 6 ? 0.5 : 0);
    ctx.restore();
  }
  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,.35)';

  grad.addColorStop(1, '#8fd0ff');

  text('움직이는 블록을 딱! 맞춰 높이 쌓자', W/2, H*0.20 + 44, 15, 'rgba(255,255,255,.88)', 'center', 'bold', true);
  text('정확히 맞추면 PERFECT ✨ 콤보만큼 넓어져!', W/2, H*0.20 + 68, 13, 'rgba(160,210,255,.9)', 'center', 'bold', true);
  text('⏱ 4초 안에 놓아야 해! 빨리 놓으면 점수 1.5배', W/2, H*0.20 + 88, 13, 'rgba(255,190,150,.92)', 'center', 'bold', true);

  var blink = 0.55 + 0.45*Math.sin(menuTime*4.5);
  ctx.globalAlpha = blink;
  setFont(19, '900');
  var t2 = '화면을 탭! 또는 스페이스!';
  var tw2 = ctx.measureText(t2).width;

  rr(W/2 - tw2/2 - 20, H*0.885 - 24, tw2 + 40, 46, 23); ctx.fill();

  } else {
    text('첫 도전! 몇 층까지 갈 수 있을까?', W/2, H*0.955, 14, 'rgba(255,255,255,.7)', 'center', 'bold', true);

function drawOver(){
  // 무너지는 장면을 0.85초 동안 그대로 보여준 뒤에 어둠막을 덮는다
  var a = Math.min(0.80, Math.max(0, overTime - 0.85) * 2.4);
  ctx.fillStyle = 'rgba(6,10,26,' + a + ')';
  ctx.fillRect(0,0,W,H);

  // 게이트 전에 누른 탭도 '접수됐다'를 눈으로 보여준다
  if (queuedRestart){
    ctx.globalAlpha = 1;
    setFont(17, '900');
    var qt = '⏳ 다시하기 접수!';
    var qw = ctx.measureText(qt).width;
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    rr(W/2 - qw/2 - 16, H*0.84 - 22, qw + 32, 42, 21); ctx.fill();
    text(qt, W/2, H*0.84, 17, '#ffffff', 'center', '900', true);
  }
  if (overTime < 0.95) return;

  var floors = finalFloors;
  var cy = H*0.34;
  var ot = overTime - 0.95;
  var pop = ot < 0.35 ? 1 + (0.35-ot)*1.4 : 1;

  ctx.save();
  ctx.translate(W/2, cy);
  ctx.scale(pop, pop);
  text(newRecord ? '🎉' : '💥', 0, -54, 40, '#fff', 'center', 'bold', false);
  text(newRecord ? '신기록이야!' : '무너졌다!', 0, 0, 36, newRecord ? '#ffd257' : '#ff7b7b', 'center', '900', true);
  ctx.restore();

  text(floors + '층', W/2, cy + 56, 44, '#ffffff', 'center', '900', true);
  text('점수 ' + score + '점 · 최고 콤보 x' + maxCombo, W/2, cy + 92, 15, 'rgba(255,255,255,.85)', 'center', 'bold', true);

  var msg;
  if (newRecord) msg = '와! 최고 기록을 깼어! 🏆';
  else {
    var diff = bestFloor - floors;
    if (diff <= 0) msg = '기록과 똑같아! 한 층만 더!';
    else if (diff <= 3) msg = '아깝다! 최고 기록까지 딱 ' + diff + '층!';
    else if (diff <= 8) msg = '조금만 더! ' + diff + '층 남았어';
    else msg = '최고 기록은 ' + bestFloor + '층! 다시 도전!';
  }
  setFont(16, 'bold');
  var mw = ctx.measureText(msg).width;
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  rr(W/2 - mw/2 - 16, cy + 116, mw + 32, 36, 18); ctx.fill();
  text(msg, W/2, cy + 134, 16, '#ffffff', 'center', 'bold', true);

  text('👑 최고 ' + bestFloor + '층 · ' + bestScore + '점', W/2, cy + 176, 14, 'rgba(255,214,102,.9)', 'center', 'bold', true);

  if (overTime > RESTART_GATE){
    var blink = queuedRestart ? 1 : (0.55 + 0.45*Math.sin(overTime*5.5));
    ctx.globalAlpha = blink;
    setFont(19, '900');
    var t2 = queuedRestart ? '바로 다시 시작!' : '탭! 또는 스페이스로 다시하기';
    var tw2 = ctx.measureText(t2).width;
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    rr(W/2 - tw2/2 - 20, H*0.84 - 24, tw2 + 40, 46, 23); ctx.fill();
    text(t2, W/2, H*0.84, 19, '#ffffff', 'center', '900', true);
    ctx.globalAlpha = 1;
  }
}

function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0,0,W,H);

  var sx = 0, sy = 0;
  if (shake > 0.2){
    sx = (Math.random()-0.5) * shake;
    sy = (Math.random()-0.5) * shake;
  }
  ctx.save();
  ctx.translate(sx, sy);

  drawSky();

  if (state === 'menu'){
    drawMenu();
    ctx.restore();
    drawFlash();
    return;
  }

  drawGround();
  drawBestLine();
  drawBlocks();
  drawDebris();
  drawCurrent();
  drawParts();
  drawFloats();

  ctx.restore();

  drawHUD();
  if (state === 'over') drawOver();
  drawFlash();
}

function drawFlash(){
  if (flash > 0.01){
    ctx.fillStyle = 'rgba(255,255,255,' + (flash*0.42) + ')';
    ctx.fillRect(0,0,W,H);
  }
}

/* ================= 루프 (rAF + delta, 단 하나) ================= */
var lastT = 0;
function loop(ts){
  if (!lastT) lastT = ts;
  var dt = (ts - lastT) / 1000;
  lastT = ts;
  if (dt < 0) dt = 0;
  if (dt > 0.05) dt = 0.05;   // 탭 복귀 순간이동 방지
  update(dt);
  render();
  window.requestAnimationFrame(loop);
}

/* ================= 시작 ================= */
resize();
blocks.push({ x: W/2, w: W*0.62, lv: 0, hue: hueFor(0), gold:false, pop:0 });
INIT_W = W * 0.62;
window.requestAnimationFrame(loop);

})();
</script>
