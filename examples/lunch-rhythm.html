<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>급식 리듬 게임 🥁</title>
<style>
  :root{
    --l1:#ff4fd8;
    --l2:#a06bff;
    --l3:#34e0ff;
    --l4:#ffd23f;
    --s1:rgba(255,79,216,.45);
    --s2:rgba(160,107,255,.45);
    --s3:rgba(52,224,255,.45);
    --s4:rgba(255,210,63,.45);
    --bg1:#1a0b2e;
    --bg2:#0d0518;
    --ink:#ffffff;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:
      radial-gradient(120% 80% at 50% 0%, #2a1148 0%, var(--bg1) 45%, var(--bg2) 100%);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  #app{
    position:relative;
    width:100%; max-width:460px;
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    background:linear-gradient(180deg,#1d0c33 0%, #12061f 60%, #0b0414 100%);
    box-shadow:0 0 60px rgba(160,80,255,.35), inset 0 0 60px rgba(120,40,200,.18);
    overflow:hidden;
  }

  /* ---------- HUD ---------- */
  #hud{
    flex:0 0 auto;
    padding:8px 10px 6px;
    border-bottom:1px solid rgba(180,120,255,.25);
    background:linear-gradient(180deg, rgba(80,25,140,.55), rgba(30,10,55,0));
  }
  .hudRow{ display:flex; align-items:center; gap:6px; }
  .chip{
    flex:1 1 0; min-width:0;
    display:flex; align-items:center; justify-content:center; gap:5px;
    padding:6px 4px;
    border-radius:12px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    font-size:13px; font-weight:800;
    white-space:nowrap;
  }
  .chip b{ font-size:15px; letter-spacing:.3px; }
  #scoreChip b{ color:#ffe27a; text-shadow:0 0 10px rgba(255,210,63,.7); }
  #comboChip b{ color:#ff8ae2; text-shadow:0 0 10px rgba(255,79,216,.7); }
  #soundBtn{
    flex:0 0 auto; width:40px; height:34px;
    border-radius:12px; border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.07); color:#fff;
    font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #soundBtn:active{ transform:scale(.93); }
  #timeWrap{
    margin-top:7px; height:7px; border-radius:99px;
    background:rgba(255,255,255,.1); overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
  }
  #timeBar{
    height:100%; width:0%;
    background:linear-gradient(90deg,var(--l1),var(--l2),var(--l3),var(--l4));
    box-shadow:0 0 12px rgba(255,120,240,.8);
    transition:width .08s linear;
  }

  /* ---------- 무대 ---------- */
  #stage{ position:relative; flex:1 1 auto; display:flex; flex-direction:column; min-height:0; }
  #field{ position:relative; flex:1 1 auto; min-height:0; }
  #cv{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  /* ---------- 터치 버튼 ---------- */
  #pads{
    flex:0 0 auto;
    display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
    padding:8px 8px 10px;
    background:linear-gradient(180deg, rgba(20,8,38,0), rgba(12,4,25,.95) 40%);
  }
  .pad{
    height:78px; border-radius:16px;
    border:2px solid var(--c);
    background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.02));
    box-shadow:0 0 14px var(--cs), inset 0 0 18px rgba(255,255,255,.05);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    cursor:pointer; touch-action:none;
    transition:transform .06s ease, background .08s ease;
  }
  .pad .key{ font-size:22px; font-weight:900; color:var(--c); text-shadow:0 0 12px var(--c); }
  .pad .em{ font-size:17px; opacity:.95; }
  .pad.on{
    transform:scale(.94) translateY(2px);
    background:linear-gradient(180deg, var(--cs), rgba(255,255,255,.06));
  }

  /* ---------- 오버레이 ---------- */
  .overlay{
    position:absolute; inset:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; padding:18px 16px;
    text-align:center;
    background:radial-gradient(90% 70% at 50% 35%, rgba(60,20,110,.86), rgba(9,3,18,.96));
    overflow-y:auto;
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
  }
  .overlay.hide{ display:none; }

  h1{
    font-size:31px; line-height:1.2; font-weight:900; letter-spacing:-.5px;
    background:linear-gradient(90deg,#ff4fd8,#a06bff,#34e0ff,#ffd23f);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    filter:drop-shadow(0 0 14px rgba(255,90,220,.55));
    animation:hue 5s linear infinite;
  }
  @keyframes hue{ 0%{filter:drop-shadow(0 0 14px rgba(255,90,220,.55)) hue-rotate(0deg);} 100%{filter:drop-shadow(0 0 14px rgba(255,90,220,.55)) hue-rotate(360deg);} }
  .sub{ font-size:14px; color:#e3ccff; font-weight:700; line-height:1.6; }
  .tiny{ font-size:12px; color:#b79ad6; font-weight:600; }

  .keyRow{ display:flex; gap:8px; justify-content:center; margin:2px 0 4px; }
  .keyCap{
    width:60px; padding:9px 0 8px; border-radius:14px;
    border:2px solid var(--c);
    background:rgba(255,255,255,.05);
    box-shadow:0 0 16px var(--cs);
    animation:bounce 1.4s ease-in-out infinite;
    animation-delay:var(--d);
  }
  .keyCap .k{ font-size:20px; font-weight:900; color:var(--c); text-shadow:0 0 10px var(--c); }
  .keyCap .e{ font-size:19px; display:block; margin-top:1px; }
  @keyframes bounce{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-7px);} }

  .btn{
    margin-top:4px;
    padding:14px 34px; border:none; border-radius:99px;
    font-family:inherit; font-size:19px; font-weight:900; color:#22003d;
    background:linear-gradient(90deg,#ffd23f,#ff8ae2,#7ee8ff);
    box-shadow:0 6px 0 rgba(90,20,140,.55), 0 0 26px rgba(255,140,240,.65);
    cursor:pointer;
  }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(90,20,140,.55), 0 0 18px rgba(255,140,240,.5); }

  /* 결과 화면 */
  #grade{ font-size:66px; font-weight:900; line-height:1; text-shadow:0 0 26px currentColor; animation:pop .5s ease; }
  @keyframes pop{ 0%{transform:scale(.3); opacity:0;} 60%{transform:scale(1.18);} 100%{transform:scale(1); opacity:1;} }
  #accBig{ font-size:38px; font-weight:900; color:#fff; text-shadow:0 0 18px rgba(120,220,255,.8); }
  .resGrid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:7px;
    width:100%; max-width:300px;
  }
  .resCell{
    padding:8px 4px; border-radius:12px;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12);
  }
  .resCell .n{ font-size:19px; font-weight:900; }
  .resCell .l{ font-size:11px; color:#c9b0ea; font-weight:700; margin-top:1px; }
  .lineRow{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .pill{
    padding:6px 13px; border-radius:99px; font-size:13px; font-weight:800;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
  }

  @media (max-height:640px){
    h1{ font-size:26px; }
    .keyCap{ width:52px; padding:6px 0 5px; }
    .keyCap .e{ font-size:16px; }
    .pad{ height:62px; }
    .overlay{ gap:8px; }
    .btn{ padding:11px 28px; font-size:17px; }
    #grade{ font-size:50px; }
    #accBig{ font-size:30px; }
  }
  @media (max-height:470px){
    h1{ font-size:22px; }
    .overlay{ gap:5px; }
    .keyCap{ width:46px; }
    .pad{ height:52px; }
    #grade{ font-size:40px; }
    #accBig{ font-size:25px; }
    .resCell .n{ font-size:16px; }
  }
</style>
</head>
<body>
<div id="app">

  <div id="hud">
    <div class="hudRow">
      <div class="chip" id="scoreChip">🍚 점수 <b id="scoreTxt">0</b></div>
      <div class="chip" id="comboChip">🔥 콤보 <b id="comboTxt">0</b></div>
      <button id="soundBtn" type="button" aria-label="소리 켜기 끄기">🔊</button>
    </div>
    <div id="timeWrap"><div id="timeBar"></div></div>
  </div>

  <div id="stage">
    <div id="field"><canvas id="cv"></canvas></div>

    <div id="pads">
      <div class="pad" data-lane="0" style="--c:var(--l1); --cs:var(--s1)"><span class="key">D</span><span class="em">🍚</span></div>
      <div class="pad" data-lane="1" style="--c:var(--l2); --cs:var(--s2)"><span class="key">F</span><span class="em">🍗</span></div>
      <div class="pad" data-lane="2" style="--c:var(--l3); --cs:var(--s3)"><span class="key">J</span><span class="em">🥦</span></div>
      <div class="pad" data-lane="3" style="--c:var(--l4); --cs:var(--s4)"><span class="key">K</span><span class="em">🍅</span></div>
    </div>

    <!-- 시작 화면 -->
    <div class="overlay" id="startScreen">
      <div style="font-size:44px">🥁🍱</div>
      <h1>급식 리듬 게임</h1>
      <p class="sub">위에서 떨어지는 반찬이<br>선에 닿는 순간 <b>딱!</b> 눌러줘</p>
      <div class="keyRow">
        <div class="keyCap" style="--c:var(--l1); --cs:var(--s1); --d:0s"><span class="k">D</span><span class="e">🍚</span></div>
        <div class="keyCap" style="--c:var(--l2); --cs:var(--s2); --d:.12s"><span class="k">F</span><span class="e">🍗</span></div>
        <div class="keyCap" style="--c:var(--l3); --cs:var(--s3); --d:.24s"><span class="k">J</span><span class="e">🥦</span></div>
        <div class="keyCap" style="--c:var(--l4); --cs:var(--s4); --d:.36s"><span class="k">K</span><span class="e">🍅</span></div>
      </div>
      <p class="tiny">📱 폰이면 아래 큰 버튼을 눌러도 돼!</p>
      <button class="btn" id="startBtn" type="button">시작하기 ▶</button>
      <p class="tiny" id="bestTxt"></p>
    </div>

    <!-- 결과 화면 -->
    <div class="overlay hide" id="resultScreen">
      <div style="font-size:14px; font-weight:800; color:#e3ccff;">급식 끝! 오늘의 점수는?</div>
      <div id="grade">S</div>
      <div id="accBig">100%</div>
      <div class="lineRow">
        <span class="pill">🍚 점수 <b id="rScore">0</b></span>
        <span class="pill">🔥 최고콤보 <b id="rCombo">0</b></span>
      </div>
      <div class="resGrid">
        <div class="resCell"><div class="n" style="color:#7ee8ff" id="rPerfect">0</div><div class="l">PERFECT</div></div>
        <div class="resCell"><div class="n" style="color:#ffd23f" id="rGood">0</div><div class="l">GOOD</div></div>
        <div class="resCell"><div class="n" style="color:#ff7a9c" id="rMiss">0</div><div class="l">MISS</div></div>
      </div>
      <div class="sub" id="rMsg">완전 잘했어!</div>
      <button class="btn" id="retryBtn" type="button">한 판 더! 🔁</button>
      <p class="tiny" id="rBest"></p>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     1) 고정 노트 패턴 (미리 짜둔 배열)
     '.' = 쉼표,  '1'~'4' = 레인 번호,  한 칸 = 8분음표
     뒤로 갈수록 BPM이 올라가서 점점 빨라진다.
     ========================================================= */
  var SECTIONS = [
    { bpm:100, bars:[
      "1...2...",
      "3...4...",
      "1..2..3.",
      "4...3...",
      "1...1...",
      "2...3...",
      "4..3..2.",
      "1...1..."
    ]},
    { bpm:120, bars:[
      "1.2.3.4.",
      "4.3.2.1.",
      "1..2..3.",
      "12..34..",
      "1.1.2.2.",
      "3.3.4.4.",
      "1..3..2.",
      "4.2.4.2.",
      "13..24..",
      "1.2.3.4."
    ]},
    { bpm:140, bars:[
      "1.2.3.4.",
      "4.3.2.1.",
      "12.12.34",
      "4.4.3.3.",
      "1.3.2.4.",
      "2.4.1.3.",
      "12.34.12",
      "4.1.4.1.",
      "2.3.2.3.",
      "1.2.3.4."
    ]}
  ];

  var LANE_EMOJI = [
    ["🍚","🍙","🍜"],
    ["🍗","🍖","🥚"],
    ["🥦","🥬","🥒"],
    ["🍅","🍎","🍓"]
  ];
  var LANE_COLOR = ["#ff4fd8","#a06bff","#34e0ff","#ffd23f"];
  var LANE_KEY   = ["D","F","J","K"];
  var KEY_CODE   = { KeyD:0, KeyF:1, KeyJ:2, KeyK:3 };

  var LEAD_IN = 2.6;

  // 패턴 → 노트 배열 / 비트 배열 (한 번만 계산)
  var PATTERN = [];
  var BEATS = [];
  var SONG_END = 0;
  (function buildPattern(){
    var t = LEAD_IN, idx = 0;
    for (var s=0; s<SECTIONS.length; s++){
      var bpm = SECTIONS[s].bpm;
      var beatDur = 60 / bpm;
      var slot = beatDur / 2;
      var approach = beatDur * 2.4;         // 노트가 화면을 내려오는 시간
      for (var b=0; b<SECTIONS[s].bars.length; b++){
        var bar = SECTIONS[s].bars[b];
        for (var q=0; q<4; q++){
          BEATS.push({ t: t + q*beatDur, strong: (q % 2) === 0 });
        }
        for (var i=0; i<8; i++){
          var ch = bar.charAt(i);
          if (ch >= "1" && ch <= "4"){
            var lane = ch.charCodeAt(0) - 49;
            PATTERN.push({
              t: t + i*slot,
              lane: lane,
              approach: approach,
              emoji: LANE_EMOJI[lane][idx % 3]
            });
            idx++;
          }
        }
        t += beatDur * 4;
      }
    }
    PATTERN.sort(function(a,b){ return a.t - b.t; });
    SONG_END = t + 1.8;
  })();

  var PERFECT_W = 0.11;
  var GOOD_W    = 0.23;
  var MISS_W    = 0.26;

  /* =========================================================
     2) DOM
     ========================================================= */
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var field = document.getElementById("field");
  var padEls = Array.prototype.slice.call(document.querySelectorAll(".pad"));
  var startScreen = document.getElementById("startScreen");
  var resultScreen = document.getElementById("resultScreen");
  var startBtn = document.getElementById("startBtn");
  var retryBtn = document.getElementById("retryBtn");
  var soundBtn = document.getElementById("soundBtn");
  var scoreTxt = document.getElementById("scoreTxt");
  var comboTxt = document.getElementById("comboTxt");
  var timeBar = document.getElementById("timeBar");
  var bestTxt = document.getElementById("bestTxt");

  var W = 300, H = 400, judgeY = 340;

  function resize(){
    var r = field.getBoundingClientRect();
    W = Math.max(120, r.width);
    H = Math.max(160, r.height);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    judgeY = H - 58;
  }
  window.addEventListener("resize", resize);
  if (window.ResizeObserver){
    try { new ResizeObserver(resize).observe(field); } catch(e){}
  }

  /* =========================================================
     3) 소리 (외부 파일 없이 직접 만든 소리)
     ========================================================= */
  var ac = null, master = null, noiseBuf = null, soundOn = true;

  function initAudio(){
    if (ac) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.5;
      master.connect(ac.destination);
      var len = Math.floor(ac.sampleRate * 0.2);
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i=0; i<len; i++) d[i] = Math.random()*2 - 1;
    } catch(e){ ac = null; }
  }
  function tone(freq, freq2, dur, type, vol){
    if (!soundOn || !ac) return;
    try {
      var now = ac.currentTime;
      var o = ac.createOscillator();
      var g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, now);
      if (freq2) o.frequency.exponentialRampToValueAtTime(freq2, now + dur);
      g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.0008, now + dur);
      o.connect(g); g.connect(master);
      o.start(now); o.stop(now + dur + 0.02);
    } catch(e){}
  }
  function noise(dur, vol, hp){
    if (!soundOn || !ac || !noiseBuf) return;
    try {
      var now = ac.currentTime;
      var src = ac.createBufferSource();
      src.buffer = noiseBuf;
      var f = ac.createBiquadFilter();
      f.type = "highpass"; f.frequency.value = hp;
      var g = ac.createGain();
      g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.0008, now + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(now); src.stop(now + dur + 0.02);
    } catch(e){}
  }
  var HIT_FREQ = [523, 659, 784, 988];
  function sndPerfect(lane){ tone(HIT_FREQ[lane], HIT_FREQ[lane]*2, 0.13, "triangle", 0.30); }
  function sndGood(lane){ tone(HIT_FREQ[lane]*0.75, 0, 0.10, "sine", 0.22); }
  function sndMiss(){ tone(200, 70, 0.18, "sawtooth", 0.16); }
  function sndKick(){ tone(150, 48, 0.17, "sine", 0.45); }
  function sndHat(){ noise(0.05, 0.10, 7000); }
  function sndStart(){ tone(523,1046,0.18,"triangle",0.25); }
  function sndEnd(){
    tone(523,0,0.16,"triangle",0.25);
    setTimeout(function(){ tone(659,0,0.16,"triangle",0.25); }, 150);
    setTimeout(function(){ tone(880,0,0.34,"triangle",0.28); }, 300);
  }

  soundBtn.addEventListener("click", function(){
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "🔊" : "🔇";
  });

  /* =========================================================
     4) 최고 점수 (localStorage, 반드시 try/catch)
     ========================================================= */
  var BEST_KEY = "lunchRhythmBest";
  function loadBest(){
    try {
      var v = window.localStorage.getItem(BEST_KEY);
      var n = parseInt(v, 10);
      return isNaN(n) ? 0 : n;
    } catch(e){ return 0; }
  }
  function saveBest(v){
    try { window.localStorage.setItem(BEST_KEY, String(v)); } catch(e){}
  }
  function showBest(el){
    var b = loadBest();
    el.textContent = b > 0 ? ("🏆 최고 기록 " + b + "점") : "";
  }

  /* =========================================================
     5) 게임 상태
     ========================================================= */
  var mode = "start";           // start / play / result
  var notes = [];
  var songTime = 0;
  var beatIdx = 0;
  var score = 0, combo = 0, maxCombo = 0;
  var cPerfect = 0, cGood = 0, cMiss = 0;
  var laneGlow = [0,0,0,0];
  var padDown = [false,false,false,false];
  var rings = [], parts = [];
  var judgeText = null;         // {text,color,life}
  var comboPop = 0;
  var shake = 0;
  var bgPulse = 0;
  var scroll = 0;

  function resetGame(){
    notes = PATTERN.map(function(n){
      return { t:n.t, lane:n.lane, approach:n.approach, emoji:n.emoji, judged:false };
    });
    songTime = 0;
    beatIdx = 0;
    score = 0; combo = 0; maxCombo = 0;
    cPerfect = 0; cGood = 0; cMiss = 0;
    laneGlow = [0,0,0,0];
    padDown = [false,false,false,false];
    rings = []; parts = [];
    judgeText = null;
    comboPop = 0; shake = 0; bgPulse = 0;
    for (var i=0; i<padEls.length; i++) padEls[i].classList.remove("on");
    updateHud();
    timeBar.style.width = "0%";
  }

  function updateHud(){
    scoreTxt.textContent = score;
    comboTxt.textContent = combo;
  }

  function startGame(){
    if (mode === "play") return;          // 두 번 시작 방지
    initAudio();
    if (ac && ac.state === "suspended"){ try { ac.resume(); } catch(e){} }
    resetGame();
    startScreen.classList.add("hide");
    resultScreen.classList.add("hide");
    mode = "play";
    sndStart();
  }

  function endGame(){
    mode = "result";
    var total = PATTERN.length;
    var acc = total ? ((cPerfect + cGood*0.5) / total) * 100 : 0;
    var accR = Math.round(acc * 10) / 10;

    var grade, gColor, msg;
    if (acc >= 95){ grade="S"; gColor="#ffd23f"; msg="우와! 급식 리듬왕이야! 🏆"; }
    else if (acc >= 85){ grade="A"; gColor="#7ee8ff"; msg="박자 감각 최고! 진짜 잘했어 ✨"; }
    else if (acc >= 70){ grade="B"; gColor="#ff8ae2"; msg="좋아! 조금만 더 하면 A야 💪"; }
    else if (acc >= 45){ grade="C"; gColor="#a06bff"; msg="괜찮아, 한 판 더 하면 늘어! 🙂"; }
    else { grade="D"; gColor="#b79ad6"; msg="천천히 박자를 들어봐, 할 수 있어! 🎵"; }

    document.getElementById("grade").textContent = grade;
    document.getElementById("grade").style.color = gColor;
    document.getElementById("accBig").textContent = accR + "%";
    document.getElementById("rScore").textContent = score;
    document.getElementById("rCombo").textContent = maxCombo;
    document.getElementById("rPerfect").textContent = cPerfect;
    document.getElementById("rGood").textContent = cGood;
    document.getElementById("rMiss").textContent = cMiss;
    document.getElementById("rMsg").textContent = msg;

    if (score > loadBest()) saveBest(score);
    showBest(document.getElementById("rBest"));
    showBest(bestTxt);

    resultScreen.classList.remove("hide");
    sndEnd();
  }

  /* =========================================================
     6) 판정
     ========================================================= */
  function popJudge(text, color){
    judgeText = { text:text, color:color, life:0.62 };
  }
  function addRing(lane, color, big){
    rings.push({ lane:lane, color:color, r: big ? 16 : 14, life:1, max: big ? 60 : 44 });
  }
  function addParts(lane, color, n){
    var cx = (lane + 0.5) * (W / 4);
    for (var i=0; i<n; i++){
      var a = Math.random() * Math.PI * 2;
      var sp = 60 + Math.random() * 150;
      parts.push({
        x:cx, y:judgeY,
        vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 60,
        life:1, color:color, size:2 + Math.random()*3
      });
    }
  }

  function hitLane(lane){
    if (mode !== "play") return;
    laneGlow[lane] = 1;

    var best = null, bestD = 999;
    for (var i=0; i<notes.length; i++){
      var n = notes[i];
      if (n.judged || n.lane !== lane) continue;
      var d = Math.abs(n.t - songTime);
      if (d < bestD){ bestD = d; best = n; }
    }
    if (!best || bestD > GOOD_W) return;   // 헛손질은 벌점 없음

    best.judged = true;
    var color = LANE_COLOR[lane];

    if (bestD <= PERFECT_W){
      cPerfect++;
      combo++;
      score += Math.round(100 * (1 + Math.min(combo, 50) / 50));
      popJudge("PERFECT!", "#7ee8ff");
      addRing(lane, color, true);
      addParts(lane, color, 10);
      sndPerfect(lane);
    } else {
      cGood++;
      combo++;
      score += Math.round(50 * (1 + Math.min(combo, 50) / 100));
      popJudge("GOOD", "#ffd23f");
      addRing(lane, color, false);
      addParts(lane, color, 5);
      sndGood(lane);
    }
    if (combo > maxCombo) maxCombo = combo;
    comboPop = 1;
    updateHud();
  }

  function missNote(){
    cMiss++;
    combo = 0;
    popJudge("MISS", "#ff7a9c");
    shake = 1;
    sndMiss();
    updateHud();
  }

  /* =========================================================
     7) 입력
     ========================================================= */
  document.addEventListener("keydown", function(e){
    if (e.repeat) return;
    var code = e.code;
    if (code === "Space" || code === "ArrowUp" || code === "ArrowDown" ||
        code === "ArrowLeft" || code === "ArrowRight") e.preventDefault();

    if (mode !== "play"){
      if (code === "Space" || code === "Enter") startGame();
      return;
    }
    if (Object.prototype.hasOwnProperty.call(KEY_CODE, code)){
      e.preventDefault();
      var lane = KEY_CODE[code];
      if (padDown[lane]) return;
      padDown[lane] = true;
      padEls[lane].classList.add("on");
      hitLane(lane);
    }
  });
  document.addEventListener("keyup", function(e){
    if (Object.prototype.hasOwnProperty.call(KEY_CODE, e.code)){
      var lane = KEY_CODE[e.code];
      padDown[lane] = false;
      padEls[lane].classList.remove("on");
    }
  });

  padEls.forEach(function(el){
    var lane = parseInt(el.getAttribute("data-lane"), 10);
    function down(e){
      e.preventDefault();
      el.classList.add("on");
      hitLane(lane);
    }
    function up(){ el.classList.remove("on"); }
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    el.addEventListener("pointerleave", up);
    el.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  });

  startBtn.addEventListener("click", startGame);
  retryBtn.addEventListener("click", startGame);

  /* =========================================================
     8) 업데이트
     ========================================================= */
  function update(dt){
    // 이펙트는 항상 갱신
    scroll = (scroll + dt * 40) % 40;
    bgPulse = Math.max(0, bgPulse - dt * 3.2);
    comboPop = Math.max(0, comboPop - dt * 3.5);
    shake = Math.max(0, shake - dt * 4);
    for (var i=0; i<4; i++) laneGlow[i] = Math.max(0, laneGlow[i] - dt * 4);

    for (var r=rings.length-1; r>=0; r--){
      var ri = rings[r];
      ri.r += dt * 150;
      ri.life -= dt * 2.2;
      if (ri.life <= 0 || ri.r > ri.max) rings.splice(r, 1);
    }
    for (var p=parts.length-1; p>=0; p--){
      var pa = parts[p];
      pa.x += pa.vx * dt;
      pa.y += pa.vy * dt;
      pa.vy += 380 * dt;
      pa.life -= dt * 1.5;
      if (pa.life <= 0) parts.splice(p, 1);
    }
    if (judgeText){
      judgeText.life -= dt;
      if (judgeText.life <= 0) judgeText = null;
    }

    if (mode !== "play") return;

    songTime += dt;

    // 비트 소리
    while (beatIdx < BEATS.length && songTime >= BEATS[beatIdx].t){
      if (BEATS[beatIdx].strong){ sndKick(); bgPulse = 1; }
      else { sndHat(); bgPulse = Math.max(bgPulse, 0.45); }
      beatIdx++;
    }

    // 놓친 노트
    for (var n=0; n<notes.length; n++){
      var no = notes[n];
      if (!no.judged && songTime > no.t + MISS_W){
        no.judged = true;
        missNote();
      }
    }

    var prog = Math.min(1, songTime / SONG_END);
    timeBar.style.width = (prog * 100).toFixed(1) + "%";

    if (songTime >= SONG_END) endGame();
  }

  /* =========================================================
     9) 그리기
     ========================================================= */
  function laneCenter(lane){ return (lane + 0.5) * (W / 4); }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0){
      ctx.translate((Math.random()-0.5) * 9 * shake, (Math.random()-0.5) * 9 * shake);
    }

    // 배경
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#1c0a33");
    g.addColorStop(0.6, "#150726");
    g.addColorStop(1, "#0a0316");
    ctx.fillStyle = g;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // 비트에 맞춰 번쩍이는 빛
    if (bgPulse > 0){
      var gp = ctx.createRadialGradient(W/2, judgeY, 10, W/2, judgeY, H*0.9);
      gp.addColorStop(0, "rgba(180,90,255," + (0.20 * bgPulse).toFixed(3) + ")");
      gp.addColorStop(1, "rgba(180,90,255,0)");
      ctx.fillStyle = gp;
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }

    // 흘러가는 가로줄
    ctx.strokeStyle = "rgba(255,255,255,0.045)";
    ctx.lineWidth = 1;
    for (var y = -40 + scroll; y < H; y += 40){
      ctx.beginPath();
      ctx.moveTo(0, Math.round(y) + 0.5);
      ctx.lineTo(W, Math.round(y) + 0.5);
      ctx.stroke();
    }

    var lw = W / 4;

    // 레인
    for (var i=0; i<4; i++){
      var x = i * lw;
      var lg = ctx.createLinearGradient(0, 0, 0, judgeY);
      lg.addColorStop(0, "rgba(255,255,255,0.012)");
      lg.addColorStop(1, "rgba(255,255,255,0.06)");
      ctx.fillStyle = lg;
      ctx.fillRect(x, 0, lw, judgeY + 40);

      if (laneGlow[i] > 0){
        ctx.globalAlpha = laneGlow[i] * 0.35;
        var hg = ctx.createLinearGradient(0, judgeY - 200, 0, judgeY + 20);
        hg.addColorStop(0, "rgba(255,255,255,0)");
        hg.addColorStop(1, LANE_COLOR[i]);
        ctx.fillStyle = hg;
        ctx.fillRect(x, judgeY - 200, lw, 220);
        ctx.globalAlpha = 1;
      }

      ctx.strokeStyle = "rgba(200,150,255,0.18)";
      ctx.beginPath();
      ctx.moveTo(Math.round(x) + 0.5, 0);
      ctx.lineTo(Math.round(x) + 0.5, H);
      ctx.stroke();
    }
    ctx.strokeStyle = "rgba(200,150,255,0.18)";
    ctx.beginPath();
    ctx.moveTo(Math.round(W) - 0.5, 0);
    ctx.lineTo(Math.round(W) - 0.5, H);
    ctx.stroke();

    // 판정선
    ctx.save();
    ctx.shadowColor = "#ff6ae0";
    ctx.shadowBlur = 18;
    ctx.strokeStyle = "rgba(255,255,255,0.9)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, judgeY);
    ctx.lineTo(W, judgeY);
    ctx.stroke();
    ctx.restore();

    // 판정 동그라미
    for (var j=0; j<4; j++){
      var cx = laneCenter(j);
      var rr = 20 + laneGlow[j] * 6;
      ctx.save();
      ctx.shadowColor = LANE_COLOR[j];
      ctx.shadowBlur = 12 + laneGlow[j] * 18;
      ctx.strokeStyle = LANE_COLOR[j];
      ctx.lineWidth = 2.5;
      ctx.globalAlpha = 0.55 + laneGlow[j] * 0.45;
      ctx.beginPath();
      ctx.arc(cx, judgeY, rr, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = "rgba(255,255,255," + (0.35 + laneGlow[j]*0.6).toFixed(2) + ")";
      ctx.font = "700 12px -apple-system, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(LANE_KEY[j], cx, judgeY + 34);
    }

    // 노트
    var noteFont = '26px -apple-system, system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
    ctx.font = noteFont;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (var k=0; k<notes.length; k++){
      var n = notes[k];
      if (n.judged) continue;
      var left = n.t - songTime;
      var p = left / n.approach;             // 1 = 맨 위, 0 = 판정선
      if (p > 1.02 || p < -0.35) continue;
      var y = judgeY - p * (judgeY + 50);
      var cx2 = laneCenter(n.lane);

      ctx.save();
      ctx.globalAlpha = p > 0.92 ? Math.max(0, (1.02 - p) / 0.1) : 1;
      ctx.fillStyle = LANE_COLOR[n.lane];
      ctx.shadowColor = LANE_COLOR[n.lane];
      ctx.shadowBlur = 16;
      ctx.globalAlpha *= 0.28;
      ctx.beginPath();
      ctx.arc(cx2, y, 21, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = p > 0.92 ? Math.max(0, (1.02 - p) / 0.1) : 1;
      ctx.fillText(n.emoji, cx2, y);
      ctx.restore();
    }

    // 링 이펙트
    for (var r2=0; r2<rings.length; r2++){
      var ri2 = rings[r2];
      ctx.save();
      ctx.globalAlpha = Math.max(0, ri2.life) * 0.85;
      ctx.strokeStyle = ri2.color;
      ctx.shadowColor = ri2.color;
      ctx.shadowBlur = 16;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(laneCenter(ri2.lane), judgeY, ri2.r, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }

    // 파티클
    for (var p2=0; p2<parts.length; p2++){
      var pa2 = parts[p2];
      ctx.save();
      ctx.globalAlpha = Math.max(0, pa2.life);
      ctx.fillStyle = pa2.color;
      ctx.shadowColor = pa2.color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(pa2.x, pa2.y, pa2.size, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    // 콤보
    if (mode === "play" && combo >= 2){
      var sc = 1 + comboPop * 0.35;
      ctx.save();
      ctx.translate(W/2, H * 0.40);
      ctx.scale(sc, sc);
      ctx.globalAlpha = 0.92;
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "#ff6ae0";
      ctx.shadowBlur = 22;
      ctx.font = "900 52px -apple-system, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(combo), 0, 0);
      ctx.font = "800 15px -apple-system, system-ui, sans-serif";
      ctx.fillStyle = "#ffb3f0";
      ctx.fillText("COMBO", 0, 36);
      ctx.restore();
    }

    // 판정 글자
    if (judgeText){
      var lifeP = judgeText.life / 0.62;
      var sc2 = 1.25 - lifeP * 0.25;
      ctx.save();
      ctx.globalAlpha = Math.min(1, lifeP * 1.6);
      ctx.translate(W/2, judgeY - 86);
      ctx.scale(sc2, sc2);
      ctx.fillStyle = judgeText.color;
      ctx.shadowColor = judgeText.color;
      ctx.shadowBlur = 20;
      ctx.font = "900 30px -apple-system, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(judgeText.text, 0, 0);
      ctx.restore();
    }

    // 시작 전 카운트다운
    if (mode === "play" && songTime < LEAD_IN){
      var left2 = LEAD_IN - songTime;
      var num = Math.ceil(left2);
      var frac = num - left2;
      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.translate(W/2, H*0.5);
      ctx.scale(1 + frac*0.4, 1 + frac*0.4);
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "#7ee8ff";
      ctx.shadowBlur = 24;
      ctx.font = "900 72px -apple-system, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(num), 0, 0);
      ctx.restore();
    }

    ctx.restore();
  }

  /* =========================================================
     10) 루프 (rAF + delta time, 하나만 돈다)
     ========================================================= */
  var last = 0;
  function loop(now){
    if (!last) last = now;
    var dt = (now - last) / 1000;
    last = now;
    if (document.hidden) dt = 0;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;

    update(dt);
    draw();
    window.requestAnimationFrame(loop);
  }

  document.addEventListener("visibilitychange", function(){
    last = 0;
  });

  resize();
  showBest(bestTxt);
  window.requestAnimationFrame(loop);
})();
</script>
