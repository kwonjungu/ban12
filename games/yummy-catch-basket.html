<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>맛있는 음식 받기 게임 🧺</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Jua, Gaegu) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Jua', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        /* 연두색 체크무늬 주방 배경 패턴 */
        .kitchen-bg {
            background-color: #d8f3dc;
            background-image: 
                linear-gradient(90deg, rgba(183, 228, 199, 0.45) 50%, transparent 50%),
                linear-gradient(rgba(183, 228, 199, 0.45) 50%, transparent 50%);
            background-size: 36px 36px;
        }

        /* 아늑한 식탁 바닥 스타일 */
        .kitchen-table {
            background: linear-gradient(180deg, #b7e4c7 0%, #74c69d 100%);
            border-top: 6px solid #52b788;
            box-shadow: 0 -8px 20px rgba(0, 0, 0, 0.08);
        }

        /* 통통 튀는 바구니 바운스 애니메이션 */
        @keyframes catch-bounce {
            0% { transform: scale(1); }
            35% { transform: scale(1.3) translateY(-8px); }
            70% { transform: scale(0.95) translateY(2px); }
            100% { transform: scale(1) translateY(0); }
        }

        .catch-active {
            animation: catch-bounce 0.22s ease-out;
        }

        /* "쏙!" 점수 팝업 애니메이션 */
        @keyframes float-up {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            50% { opacity: 1; transform: translateY(-25px) scale(1.25); }
            100% { opacity: 0; transform: translateY(-45px) scale(1); }
        }

        .floating-score {
            position: absolute;
            animation: float-up 0.55s forwards ease-out;
            pointer-events: none;
            font-weight: bold;
            z-index: 40;
            text-shadow: 0px 2px 5px rgba(255, 255, 255, 0.9), 0px 1px 2px rgba(0,0,0,0.2);
        }

        /* 정크푸드 획득 시 화면 흔들림 애니메이션 */
        @keyframes screen-shake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-8px, 5px); }
            40% { transform: translate(8px, -5px); }
            60% { transform: translate(-5px, -3px); }
            80% { transform: translate(5px, 3px); }
        }

        .shake-active {
            animation: screen-shake 0.35s ease-in-out;
        }

        /* 정크푸드 획득 시 화면 순간 암전/붉은 깜빡임 효과 */
        @keyframes dark-flash {
            0% { opacity: 0; }
            30% { opacity: 0.5; }
            100% { opacity: 0; }
        }

        .flash-active {
            animation: dark-flash 0.4s ease-out;
        }
    </style>
</head>
<body class="kitchen-bg h-screen w-screen flex flex-col justify-between items-center relative text-slate-800">

    <!-- 상단 UI (메인 점수판 및 상태 표시) -->
    <header class="w-full max-w-md px-4 pt-3 z-30">
        <div class="bg-white/95 backdrop-blur-md rounded-3xl p-3 shadow-lg border-4 border-green-300 flex justify-between items-center">
            <!-- 게임 타이틀 -->
            <div class="flex items-center space-x-2">
                <span class="text-3xl animate-bounce">🍳</span>
                <div>
                    <h1 class="text-base text-green-900 font-bold leading-tight">맛있는 주방</h1>
                    <p class="text-[11px] text-green-600 font-sans font-semibold">간식을 쏙! 받아봐요</p>
                </div>
            </div>

            <!-- 중앙 메인 크게 보이는 점수판 -->
            <div class="flex items-center bg-emerald-500 text-white px-4 py-1.5 rounded-2xl shadow-inner border-2 border-emerald-600">
                <span class="text-xs font-bold mr-1.5 opacity-90">점수</span>
                <span id="score-display" class="text-2xl font-black tracking-wide">0</span>
            </div>

            <!-- 최고점수 및 목숨 -->
            <div class="flex flex-col items-end space-y-0.5">
                <div class="text-[10px] text-green-700 font-bold">
                    🏆 최고 <span id="high-score-display" class="text-amber-600 font-black">0</span>
                </div>
                <div id="lives-display" class="text-xs tracking-wider">❤️❤️❤️</div>
            </div>
        </div>
    </header>

    <!-- 메인 게임 낙하 영역 -->
    <main id="game-area" class="flex-1 w-full max-w-md relative overflow-hidden flex flex-col justify-between items-center select-none touch-none">
        <!-- 배경 주방 소품 장식 -->
        <div class="absolute top-6 left-6 text-3xl opacity-20 pointer-events-none select-none">🧂</div>
        <div class="absolute top-16 right-8 text-3xl opacity-20 pointer-events-none select-none">🧀</div>
        <div class="absolute bottom-24 left-8 text-3xl opacity-20 pointer-events-none select-none">🥖</div>
        <div class="absolute bottom-28 right-6 text-3xl opacity-20 pointer-events-none select-none">✨</div>

        <!-- 중앙 조작 안내 툴팁 -->
        <div id="tutorial-card" class="mt-3 bg-white/85 backdrop-blur-sm px-4 py-2 rounded-2xl border-2 border-dashed border-green-400 text-center shadow-sm pointer-events-none transition-opacity duration-500 z-10">
            <p class="text-green-800 text-sm font-bold">🎮 방향키/버튼 또는 화면 터치로 이동!</p>
            <p class="text-green-600 text-xs font-sans mt-0.5 font-medium">건강 간식 <span class="text-emerald-700 font-bold">+10점</span> | 정크푸드(🍩🍟🍬) <span class="text-rose-600 font-bold">-10점!</span></p>
        </div>

        <!-- 팝업 / floating 이펙트 레이어 -->
        <div id="effect-layer" class="absolute inset-0 pointer-events-none overflow-hidden z-30"></div>

        <!-- 정크푸드 경고 암전/플래시 레이어 -->
        <div id="flash-overlay" class="absolute inset-0 bg-red-950 opacity-0 pointer-events-none z-30"></div>

        <!-- 바구니 (낙하 영역 내부 하단에 위치시켜 100% 충돌 정밀도 확보) -->
        <div id="basket" class="absolute bottom-2 flex flex-col items-center z-20 cursor-grab active:cursor-grabbing" style="left: 50%; transform: translateX(-50%); width: 84px;">
            <div id="basket-emoji" class="text-5xl md:text-6xl select-none drop-shadow-lg">
                🧺
            </div>
            <div class="w-14 h-2 bg-black/20 rounded-full mt-[-6px]"></div>
        </div>
    </main>

    <!-- 하단 모바일 조작 버튼 -->
    <div class="w-full max-w-md px-6 flex justify-between items-center my-1 z-30">
        <button id="btn-left" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold py-2.5 px-8 rounded-2xl shadow-md border-b-4 border-emerald-700 transition flex items-center justify-center text-lg select-none cursor-pointer">
            👈 왼쪽
        </button>
        <button id="btn-right" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold py-2.5 px-8 rounded-2xl shadow-md border-b-4 border-emerald-700 transition flex items-center justify-center text-lg select-none cursor-pointer">
            오른쪽 👉
        </button>
    </div>

    <!-- 식탁 장식 카운터 바닥 -->
    <footer id="table-area" class="w-full max-w-md kitchen-table py-2.5 relative h-10 flex items-center justify-center overflow-hidden">
        <div class="w-full text-center text-[10px] text-green-900/70 font-sans tracking-widest pointer-events-none select-none">
            ─── 🍽️ KITCHEN TABLE 🍽️ ───
        </div>
    </footer>

    <!-- 게임 오버 모달 레이어 -->
    <div id="game-over-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-3xl p-6 max-w-xs w-11/12 text-center shadow-2xl border-4 border-green-300 transform transition-all scale-100">
            <div class="text-5xl mb-2">🥣</div>
            <h2 class="text-2xl text-rose-600 font-bold mb-1">게임 오버!</h2>
            <p class="text-sm text-slate-600 font-sans mb-2 font-bold">건강한 식습관 완성 실패!</p>

            <div class="bg-green-50 rounded-2xl p-3 mb-4 border border-green-200 space-y-2">
                <div>
                    <div class="text-xs text-green-600 font-sans">획득한 점수</div>
                    <div id="final-score" class="text-3xl text-emerald-600 font-black">0</div>
                </div>
                <div class="pt-1.5 border-t border-green-200 flex justify-center">
                    <span class="text-xs text-amber-700 font-bold">최고 기록: <span id="final-high-score">0</span></span>
                </div>
            </div>

            <p class="text-xs text-slate-400 font-sans mb-3">⌨️ [스페이스 바]를 눌러 다시 시작할 수 있어요!</p>

            <button id="btn-restart" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white text-lg font-bold py-3 rounded-2xl shadow-lg border-b-4 border-emerald-700 transition cursor-pointer">
                🔄 다시 도전하기
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM 엘리먼트 참조
            const basket = document.getElementById('basket');
            const basketEmoji = document.getElementById('basket-emoji');
            const gameArea = document.getElementById('game-area');
            const effectLayer = document.getElementById('effect-layer');
            const flashOverlay = document.getElementById('flash-overlay');
            const scoreDisplay = document.getElementById('score-display');
            const highScoreDisplay = document.getElementById('high-score-display');
            const livesDisplay = document.getElementById('lives-display');
            const tutorialCard = document.getElementById('tutorial-card');
            const gameOverModal = document.getElementById('game-over-modal');
            const finalScore = document.getElementById('final-score');
            const finalHighScore = document.getElementById('final-high-score');
            const btnRestart = document.getElementById('btn-restart');
            const btnLeft = document.getElementById('btn-left');
            const btnRight = document.getElementById('btn-right');

            // 게임 상태 변수
            let score = 0;
            let highScore = parseInt(localStorage.getItem('kitchen_game_high_score') || '0', 10);
            let lives = 3;
            let isGameOver = false;
            let isInvincible = false;
            let invincibleTimeout = null;
            let basketX = gameArea.offsetWidth / 2;
            const basketSpeed = 8;
            const keys = { Left: false, Right: false };

            // 건강 간식 및 피해야 할 정크푸드 종류
            const healthySnacks = ['🍎', '🥦', '🥛', '🍌', '🍉', '🍇', '🍗', '🍞', '🍓', '🍊'];
            const junkFoods = ['🍩', '🍟', '🍬'];
            const items = [];
            let lastSpawnTime = 0;
            let spawnInterval = 750;

            // 최고 점수 표시 초기화
            highScoreDisplay.textContent = highScore;

            // Web Audio API를 활용한 효과음 오디오 합성기
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            function playSsokSound() {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(380, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1100, audioCtx.currentTime + 0.09);

                gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.09);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.09);
            }

            function playMissSound() {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(240, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.18);

                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.18);
            }

            // 정크푸드 획득 시 낮고 투박한 감점 소리
            function playJunkSound() {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(170, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.22);

                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.22);
            }

            // 바구니 이동 가능 경계 계산 (gameArea 기준)
            const getBounds = () => {
                const containerWidth = gameArea.offsetWidth || 360;
                const basketWidth = basket.offsetWidth || 84;
                const minX = basketWidth / 2;
                const maxX = containerWidth - (basketWidth / 2);
                return { minX, maxX };
            };

            // 키보드 조작 및 스페이스 키 재시작 이벤트
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = true;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = true;

                // 게임 오버 상태일 때 스페이스 바 누르면 다시 시작
                if (e.code === 'Space' || e.key === ' ') {
                    e.preventDefault();
                    if (isGameOver) {
                        restartGame();
                    }
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = false;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = false;
            });

            // 화면 하단 버튼 (좌/우) 조작 이벤트 바인딩
            const bindButtonEvents = (btn, keyProp) => {
                const start = (e) => { e.preventDefault(); keys[keyProp] = true; };
                const end = (e) => { e.preventDefault(); keys[keyProp] = false; };
                
                btn.addEventListener('mousedown', start);
                btn.addEventListener('mouseup', end);
                btn.addEventListener('mouseleave', end);
                btn.addEventListener('touchstart', start, { passive: false });
                btn.addEventListener('touchend', end, { passive: false });
            };

            bindButtonEvents(btnLeft, 'Left');
            bindButtonEvents(btnRight, 'Right');

            // 간식 및 정크푸드 낙하 객체 생성
            function spawnSnack() {
                if (isGameOver) return;

                // 약 30% 확률로 정크푸드 등장 (🍩 도넛, 🍟 감자튀김, 🍬 캔디)
                const isJunk = Math.random() < 0.3;
                const snackEmoji = isJunk 
                    ? junkFoods[Math.floor(Math.random() * junkFoods.length)]
                    : healthySnacks[Math.floor(Math.random() * healthySnacks.length)];

                const itemEl = document.createElement('div');
                itemEl.className = 'absolute text-4xl select-none pointer-events-none drop-shadow-md z-10 transition-transform';
                itemEl.textContent = snackEmoji;

                const padding = 32;
                const containerWidth = gameArea.offsetWidth || 360;
                const minX = padding;
                const maxX = Math.max(padding * 2, containerWidth - padding);
                const x = Math.random() * (maxX - minX) + minX;
                const fallSpeed = Math.random() * 2 + 3.0; // 낙하 속도 (3.0 ~ 5.0)

                itemEl.style.left = `${x}px`;
                itemEl.style.top = `-45px`;
                gameArea.appendChild(itemEl);

                items.push({
                    element: itemEl,
                    x: x,
                    y: -45,
                    speed: fallSpeed,
                    isJunk: isJunk
                });
            }

            // "쏙! +10" 또는 "-10" 텍스트 애니메이션 이펙트
            function showFloatingText(x, y, text, colorClass = 'text-emerald-600') {
                const el = document.createElement('div');
                el.className = `floating-score text-xl font-black ${colorClass}`;
                el.textContent = text;
                el.style.left = `${x}px`;
                el.style.top = `${y}px`;
                effectLayer.appendChild(el);

                setTimeout(() => {
                    el.remove();
                }, 550);
            }

            // 메인 게임 루프 (충돌 감지 및 점수 업데이트)
            function update(timestamp) {
                if (!isGameOver) {
                    const { minX, maxX } = getBounds();

                    // 키보드 / 버튼에 따른 바구니 이동
                    if (keys.Left) basketX -= basketSpeed;
                    if (keys.Right) basketX += basketSpeed;

                    basketX = Math.max(minX, Math.min(maxX, basketX));
                    basket.style.left = `${basketX}px`;

                    // 간식 생성 타이밍 제어
                    if (!lastSpawnTime || timestamp - lastSpawnTime > spawnInterval) {
                        spawnSnack();
                        lastSpawnTime = timestamp;
                        // 점수가 높아질수록 더 빠르게 낙하
                        spawnInterval = Math.max(380, 750 - Math.floor(score / 50) * 35);
                    }

                    // 정밀한 AABB 바구니 충돌 감지 (BoundingClientRect 기준)
                    const basketRect = basket.getBoundingClientRect();

                    for (let i = items.length - 1; i >= 0; i--) {
                        const item = items[i];
                        item.y += item.speed;
                        item.element.style.top = `${item.y}px`;

                        const itemRect = item.element.getBoundingClientRect();

                        // 바구니와 간식이 서로 교차했는지 감지 (여유 판정 적용)
                        const isColliding = !(
                            itemRect.right < basketRect.left + 8 ||
                            itemRect.left > basketRect.right - 8 ||
                            itemRect.bottom < basketRect.top + 10 ||
                            itemRect.top > basketRect.bottom - 10
                        );

                        if (isColliding) {
                            const gameRect = gameArea.getBoundingClientRect();
                            const popX = itemRect.left - gameRect.left;
                            const popY = itemRect.top - gameRect.top;

                            if (item.isJunk) {
                                if (!isInvincible) {
                                    // 1. 정크푸드 받음: -10점 감점 (점수가 0 이하로 떨어지지 않도록 처리)
                                    score = Math.max(0, score - 10);
                                    scoreDisplay.textContent = score;

                                    // 2. 감점 쿵 소리 재생
                                    playJunkSound();

                                    // 3. 화면 흔들림 & 어두운 붉은 플래시 효과
                                    gameArea.classList.remove('shake-active');
                                    void gameArea.offsetWidth;
                                    gameArea.classList.add('shake-active');

                                    if (flashOverlay) {
                                        flashOverlay.classList.remove('flash-active');
                                        void flashOverlay.offsetWidth;
                                        flashOverlay.classList.add('flash-active');
                                    }

                                    // 4. "으악! -10" 팝업 표시
                                    showFloatingText(popX, popY, '으악! -10 🍩', 'text-rose-600 font-black');
                                } else {
                                    // 무적 상태 시 정크푸드 디버프 방어
                                    playSsokSound();
                                    showFloatingText(popX, popY, '⭐ 무적 방어! ⭐', 'text-amber-500 font-black');
                                }

                            } else {
                                // 1. 건강 간식 받음: +10점 획득
                                score += 10;
                                scoreDisplay.textContent = score;

                                // 2. "쏙!" 피치 소리 재생
                                playSsokSound();

                                // 3. 바구니 통통 튀는 애니메이션 적용
                                basketEmoji.classList.remove('catch-active');
                                void basketEmoji.offsetWidth; // reflow 강제 실행
                                basketEmoji.classList.add('catch-active');

                                // 4. "쏙! +10" 팝업 효과
                                showFloatingText(popX, popY, '쏙! +10 😋', 'text-emerald-700 font-black');
                            }

                            // 5. 튜토리얼 툴팁 서서히 숨기기
                            if (score > 0 && tutorialCard) {
                                tutorialCard.classList.add('opacity-0');
                            }

                            // 6. 음식 즉시 삭제
                            item.element.remove();
                            items.splice(i, 1);

                        } else if (itemRect.top > basketRect.bottom) {
                            // 바구니 아래 바닥으로 도달한 경우
                            if (!item.isJunk) {
                                if (!isInvincible) {
                                    // 건강 간식을 놓친 경우에만 목숨 1 차감
                                    lives--;
                                    updateLivesUI();
                                    playMissSound();

                                    const gameRect = gameArea.getBoundingClientRect();
                                    const popX = itemRect.left - gameRect.left;
                                    const popY = Math.min(gameRect.height - 40, itemRect.top - gameRect.top);
                                    showFloatingText(popX, popY, '❌ 놓쳤다!', 'text-rose-500 font-bold');

                                    if (lives <= 0) {
                                        triggerGameOver();
                                    }
                                } else {
                                    // 무적 상태에서는 세이프
                                    const gameRect = gameArea.getBoundingClientRect();
                                    const popX = itemRect.left - gameRect.left;
                                    const popY = Math.min(gameRect.height - 40, itemRect.top - gameRect.top);
                                    showFloatingText(popX, popY, '🛡️ 무적 세이프!', 'text-amber-500 font-bold');
                                }
                            } else {
                                // 정크푸드는 피하기 성공! Safe 텍스트 표시
                                const gameRect = gameArea.getBoundingClientRect();
                                const popX = itemRect.left - gameRect.left;
                                const popY = Math.min(gameRect.height - 40, itemRect.top - gameRect.top);
                                showFloatingText(popX, popY, 'Safe! 👏', 'text-sky-600 font-bold');
                            }

                            item.element.remove();
                            items.splice(i, 1);
                        }
                    }
                }

                requestAnimationFrame(update);
            }

            // 목숨 UI 업데이트
            function updateLivesUI() {
                let hearts = '';
                const shownLives = Math.max(0, Math.min(3, lives));
                for (let i = 0; i < shownLives; i++) hearts += '❤️';
                for (let i = shownLives; i < 3; i++) hearts += '🖤';
                livesDisplay.textContent = hearts || '🖤🖤🖤';
            }

            // 게임 오버 처리
            function triggerGameOver() {
                isGameOver = true;
                finalScore.textContent = score;

                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('kitchen_game_high_score', highScore);
                    highScoreDisplay.textContent = highScore;
                }
                finalHighScore.textContent = highScore;

                gameOverModal.classList.remove('hidden');
            }

            // 게임 재시작 함수
            function restartGame() {
                items.forEach(item => item.element.remove());
                items.length = 0;

                score = 0;
                lives = 3;
                isGameOver = false;
                isInvincible = false;
                if (invincibleTimeout) clearTimeout(invincibleTimeout);
                basketEmoji.classList.remove('animate-bounce');
                basket.style.filter = '';
                spawnInterval = 750;

                scoreDisplay.textContent = '0';
                updateLivesUI();
                gameOverModal.classList.add('hidden');

                const containerWidth = gameArea.offsetWidth || 360;
                basketX = containerWidth / 2;
                basket.style.left = `${basketX}px`;
            }

            // 재시작 버튼 클릭 이벤트
            btnRestart.addEventListener('click', restartGame);

            // 화면 리사이즈 시 바구니 위치 재조정
            window.addEventListener('resize', () => {
                const { minX, maxX } = getBounds();
                basketX = Math.max(minX, Math.min(maxX, basketX));
                basket.style.left = `${basketX}px`;
            });

            // 게임 초기 위치 설정 및 애니메이션 루프 시작
            const containerWidth = gameArea.offsetWidth || 360;
            basketX = containerWidth / 2;
            basket.style.left = `${basketX}px`;
            requestAnimationFrame(update);
        });
    </script>
</body>
</html>
