<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>음식 받기 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 귀여운 폰트 (Jua) 추가 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            /* 다크 체크무늬 배경으로 변경 */
            background-color: #111111;
            background-image:
                linear-gradient(45deg, #222222 25%, transparent 25%, transparent 75%, #222222 75%, #222222),
                linear-gradient(45deg, #222222 25%, transparent 25%, transparent 75%, #222222 75%, #222222);
            background-size: 60px 60px; /* 체크무늬 크기 */
            background-position: 0 0, 30px 30px; /* 무늬 교차 위치 */

            /* 스크롤 방지 */
            overflow: hidden;
            /* 텍스트 드래그 방지 */
            user-select: none;
            /* 귀여운 폰트 적용 */
            font-family: 'Jua', sans-serif;
            /* 화면 가득 채우기 */
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 게임 영역 */
        #game-container {
            position: relative;
            flex-grow: 1;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            /* 둥글고 귀여운 하얀색 상자 느낌 */
            background-color: rgba(255, 255, 255, 0.85);
            box-shadow: 0 15px 30px rgba(255, 182, 193, 0.4);
            border-radius: 2.5rem;
            margin-top: 2rem;
            margin-bottom: 2rem;
            overflow: hidden;
            border: 6px solid #ffb6c1; /* 두껍고 귀여운 핑크색 테두리 */
        }

        /* 바구니 스타일 */
        #basket {
            position: absolute;
            bottom: 20px;
            font-size: 4rem;
            /* 이모지에 어울리는 입체적인 그림자 효과 */
            filter: drop-shadow(0px 6px 4px rgba(0,0,0,0.2));
            cursor: pointer;
        }

        /* 장식용 타이틀 */
        .game-title {
            position: absolute;
            top: 25px;
            width: 100%;
            text-align: center;
            font-size: 2.8rem;
            color: #ff6b81; /* 톡톡 튀는 핑크색 */
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px rgba(255, 107, 129, 0.2);
            pointer-events: none;
        }

        /* 점수판 스타일 */
        #score-board {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 1.8rem;
            color: #ff9f43; /* 귀여운 오렌지색 */
            background-color: #fff;
            border: 4px solid #ff9f43;
            border-radius: 30px; /* 동글동글한 알약 모양 */
            padding: 5px 25px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            pointer-events: none;
            z-index: 10;
        }

        /* 떨어지는 간식 스타일 */
        .falling-item {
            position: absolute;
            font-size: 3rem;
            top: -50px;
            user-select: none;
            pointer-events: none;
            /* 간식에도 살짝 그림자 추가 */
            filter: drop-shadow(0px 5px 3px rgba(0,0,0,0.15));
        }
    </style>
</head>
<body class="antialiased text-gray-800">

    <div id="game-container">
        <!-- 게임 제목 -->
        <div class="game-title">
            🍎 음식 받기 🥪
        </div>

        <!-- 점수판 -->
        <div id="score-board">점수: 0</div>

        <!-- 바구니 이모지 -->
        <div id="basket">
            🧺
        </div>
    </div>

    <script>
        const basket = document.getElementById('basket');
        const container = document.getElementById('game-container');
        const scoreBoard = document.getElementById('score-board'); // 점수판 요소

        let score = 0; // 점수 변수
        let basketX = 0; // 바구니의 현재 X(가로) 위치
        const basketSpeed = 8; // 바구니 이동 속도 (숫자가 클수록 빠름)

        // 건강 간식 이모지 배열 및 아이템 관련 변수
        const healthySnacks = ['🍎', '🥦', '🥛', '🍌', '🥕', '🍇', '🍉', '🥑', '🍓', '🥝', '🥗', '🍅'];
        const badSnacks = ['🍔', '🍕', '🍟', '🍬', '🍩', '🍫', '🍦', '🍰', '🥤', '🌭', '🍪']; // 피해야 할 해로운 음식 배열 추가
        const activeItems = []; // 현재 화면에 떨어지고 있는 아이템들을 모아두는 배열
        const itemFallSpeed = 4; // 아이템이 떨어지는 속도
        let spawnInterval; // 아이템 생성 타이머

        // 현재 눌려있는 키 상태를 저장하는 객체
        const keys = {
            ArrowLeft: false,
            ArrowRight: false
        };

        // 키를 누를 때 이벤트
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'Left') {
                keys.ArrowLeft = true;
            }
            if (e.key === 'ArrowRight' || e.key === 'Right') {
                keys.ArrowRight = true;
            }
        });

        // 키를 뗄 때 이벤트
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'Left') {
                keys.ArrowLeft = false;
            }
            if (e.key === 'ArrowRight' || e.key === 'Right') {
                keys.ArrowRight = false;
            }
        });

        // 마우스/터치로 바구니 움직이기 (가로 위치를 따라감)
        function moveBasketTo(clientX) {
            const containerRect = container.getBoundingClientRect();
            basketX = clientX - containerRect.left - basket.clientWidth / 2;
        }

        container.addEventListener('mousemove', (e) => {
            moveBasketTo(e.clientX);
        });

        container.addEventListener('touchmove', (e) => {
            e.preventDefault(); // 터치할 때 화면이 스크롤되지 않게 방지
            moveBasketTo(e.touches[0].clientX);
        }, { passive: false });

        // 무작위 간식을 하나 생성하여 하늘에서 떨어뜨리는 함수
        function createItem() {
            // 새 div 요소 만들기
            const itemElement = document.createElement('div');
            itemElement.className = 'falling-item';

            // 70% 확률로 건강한 간식, 30% 확률로 해로운 음식 생성
            const isHealthy = Math.random() < 0.7;

            if (isHealthy) {
                const randomIndex = Math.floor(Math.random() * healthySnacks.length);
                itemElement.innerText = healthySnacks[randomIndex];
                itemElement.dataset.type = 'healthy'; // 종류를 'healthy'로 기록
            } else {
                const randomIndex = Math.floor(Math.random() * badSnacks.length);
                itemElement.innerText = badSnacks[randomIndex];
                itemElement.dataset.type = 'bad'; // 종류를 'bad'로 기록
            }

            // X(가로) 위치 무작위로 정하기 (컨테이너 안쪽)
            const containerWidth = container.clientWidth;
            const itemWidth = 48; // font-size 3rem의 대략적인 픽셀 크기
            const randomX = Math.random() * (containerWidth - itemWidth);

            itemElement.style.left = `${randomX}px`;

            // 각 아이템의 y 위치(세로)를 저장할 속성을 객체에 직접 추가
            itemElement.posY = -50; // 시작점 (CSS의 top 속성과 동일하게 맞춤)

            // 컨테이너(화면)에 추가하고, 관리 배열에도 넣기
            container.appendChild(itemElement);
            activeItems.push(itemElement);
        }

        // 떨어지는 아이템들의 위치를 업데이트(아래로 이동) 하는 함수
        function updateItems() {
            const containerHeight = container.clientHeight;
            const basketRect = basket.getBoundingClientRect(); // 바구니의 현재 화면 위치 및 크기

            // 배열을 뒤에서부터 순회 (도중에 요소를 삭제할 때 오류 방지)
            for (let i = activeItems.length - 1; i >= 0; i--) {
                const item = activeItems[i];

                // 아래로 이동
                item.posY += itemFallSpeed;
                item.style.top = `${item.posY}px`;

                // 충돌 검사 (바구니와 간식이 닿았는지 확인)
                const itemRect = item.getBoundingClientRect();
                const margin = 15; // 이모지의 투명한 여백을 고려한 충돌 보정값

                // 바구니 영역과 아이템 영역이 겹치는지 확인
                if (
                    itemRect.bottom - margin > basketRect.top &&
                    itemRect.top + margin < basketRect.bottom &&
                    itemRect.right - margin > basketRect.left &&
                    itemRect.left + margin < basketRect.right
                ) {
                    // 바구니에 닿았을 때 아이템 종류에 따라 점수 처리
                    if (item.dataset.type === 'healthy') {
                        score += 10; // 건강한 간식은 10점 획득
                    } else if (item.dataset.type === 'bad') {
                        score -= 10; // 해로운 음식은 10점 감점
                        if (score < 0) score = 0; // 0점 밑으로는 떨어지지 않게 처리
                    }

                    scoreBoard.innerText = `점수: ${score}`;

                    item.remove(); // 화면에서 닿은 간식 없애기 (쏙! 들어간 효과)
                    activeItems.splice(i, 1); // 관리 배열에서도 제거
                    continue; // 삭제되었으므로 아래 바닥 검사는 생략하고 다음 간식 검사로 넘어감
                }

                // 바닥(컨테이너 맨 아래)을 벗어나면 삭제
                if (item.posY > containerHeight) {
                    item.remove(); // HTML 화면에서 제거
                    activeItems.splice(i, 1); // 관리 배열에서 제거
                }
            }
        }

        // 매 프레임마다 실행되는 게임 루프
        function gameLoop() {
            // 컨테이너와 바구니의 실제 너비 가져오기 (화면 크기가 변할 수 있으므로)
            const containerWidth = container.clientWidth;
            const basketWidth = basket.clientWidth;

            // 방향키 입력에 따라 위치 업데이트
            if (keys.ArrowLeft) {
                basketX -= basketSpeed;
            }
            if (keys.ArrowRight) {
                basketX += basketSpeed;
            }

            // 바구니가 화면 밖으로 나가지 않도록 경계(벽) 설정
            if (basketX < 0) {
                basketX = 0; // 왼쪽 끝 제한
            } else if (basketX > containerWidth - basketWidth) {
                basketX = containerWidth - basketWidth; // 오른쪽 끝 제한
            }

            // 계산된 위치를 바구니의 실제 스타일(left)에 적용
            basket.style.left = `${basketX}px`;

            // 간식들 위치 업데이트
            updateItems();

            // 다음 프레임에 gameLoop를 다시 호출하여 끊기지 않는 부드러운 애니메이션 완성
            requestAnimationFrame(gameLoop);
        }

        function init() {
            // 게임이 시작될 때 바구니를 화면 한가운데에 배치
            const containerWidth = container.clientWidth;
            const basketWidth = basket.clientWidth;
            basketX = (containerWidth - basketWidth) / 2;
            basket.style.left = `${basketX}px`;

            // 1초(1000ms)마다 새로운 간식 생성 시작
            spawnInterval = setInterval(createItem, 1000);

            // 게임 루프 시작
            requestAnimationFrame(gameLoop);
        }

        // 웹페이지가 모두 로드되면 init 함수 실행
        window.onload = init;
    </script>
</body>
</html>
