<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>낚시왕 🎣</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system, BlinkMacSystemFont, system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background:radial-gradient(120% 90% at 50% 0%, #1e70a8 0%, #0c426b 55%, #05263f 100%);
    color:#fff; overflow:hidden;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
    overscroll-behavior:none;
  }
  #app{
    position:relative; width:100%; height:100vh; max-width:520px; margin:0 auto;
    display:flex; flex-direction:column; overflow:hidden;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-top: env(safe-area-inset-top, 0px);
  }
  @supports (height:100dvh){ #app{height:100dvh} }

  /* ================= HUD ================= */
  #hud{ flex:0 0 auto; padding:8px 9px 5px; display:flex; flex-direction:column; gap:5px; z-index:6 }
  .row{display:flex; align-items:center; gap:5px; flex-wrap:wrap}
  .chip{
    background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.18);
    border-radius:999px; padding:4px 9px; font-size:12px; font-weight:800;
    letter-spacing:-.4px; display:flex; align-items:center; gap:4px; white-space:nowrap;
  }
  .chip b{font-size:14px; color:#ffe27a}
  .spacer{flex:1}
  #timeChip.warn{ background:rgba(255,90,90,.28); border-color:rgba(255,140,140,.6); animation:tick .5s infinite }
  @keyframes tick{ 50%{ transform:scale(1.07) } }
  #hearts{letter-spacing:1px; font-size:13px}
  #hearts span{display:inline-block; transition:transform .25s, opacity .25s}
  #hearts span.gone{opacity:.25; transform:scale(.7); filter:grayscale(1)}
  #streakChip{ background:linear-gradient(90deg,#ff8a3d,#ffd54a); border-color:rgba(255,255,255,.5); color:#3a1d00 }
  #streakChip b{ color:#7a2b00 }
  #streakChip.hide{ display:none }
  #soundBtn{
    background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.18);
    color:#fff; border-radius:999px; width:30px; height:30px; font-size:13px; cursor:pointer; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  #soundBtn:active{transform:scale(.9)}
  #barWrap{
    height:12px; border-radius:999px; background:rgba(0,0,0,.32);
    border:1px solid rgba(255,255,255,.18); overflow:hidden; position:relative;
  }
  #bar{ height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,#4ee08a,#ffe27a); transition:width .25s }
  #barTxt{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:9.5px; font-weight:900; letter-spacing:-.3px; text-shadow:0 1px 2px rgba(0,0,0,.6);
  }

  /* ================= 무대 ================= */
  #stage{ position:relative; flex:1 1 auto; min-height:0; overflow:hidden; touch-action:none }
  canvas{ display:block; width:100%; height:100% }

  #banner{
    position:absolute; left:50%; top:16%; transform:translate(-50%,-6px) scale(.9);
    background:linear-gradient(180deg,#fff3b0,#ffc93c); color:#5a3200;
    padding:8px 16px; border-radius:14px; font-weight:900; font-size:14px; letter-spacing:-.5px;
    box-shadow:0 8px 22px rgba(0,0,0,.4); opacity:0; pointer-events:none; text-align:center;
    border:2px solid #fff; white-space:nowrap; z-index:10; max-width:90%;
  }
  #banner.show{ animation:bannerPop 2.2s ease-out forwards }
  @keyframes bannerPop{
    0%{opacity:0; transform:translate(-50%,10px) scale(.7)}
    12%{opacity:1; transform:translate(-50%,-4px) scale(1.12)}
    22%{transform:translate(-50%,0) scale(1)}
    80%{opacity:1; transform:translate(-50%,0) scale(1)}
    100%{opacity:0; transform:translate(-50%,-18px) scale(.95)}
  }
  #flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:9 }

  /* ================= 조작 버튼 ================= */
  #ctrl{ flex:0 0 auto; padding:6px 9px 12px; display:flex; gap:8px; align-items:stretch; z-index:6 }
  .cbtn{
    background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.24); color:#fff;
    border-radius:16px; font-size:20px; font-weight:900; cursor:pointer; padding:12px 0; flex:1 1 0;
    font-family:inherit; display:flex; align-items:center; justify-content:center;
    touch-action:manipulation;
  }
  .cbtn:active{ transform:scale(.94); background:rgba(255,255,255,.24) }
  #actBtn{
    flex:2 1 0; font-size:15px; letter-spacing:-.5px;
    background:linear-gradient(180deg,#ffd84a,#ff9f1c); color:#4a2500; border-color:#fff6c9;
    box-shadow:0 4px 0 rgba(0,0,0,.28);
  }
  #actBtn:active{ box-shadow:0 1px 0 rgba(0,0,0,.28); transform:translateY(3px) scale(.99) }

  /* ================= 화면 오버레이 ================= */
  .screen{
    position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; padding:20px 16px;
    background:linear-gradient(180deg, rgba(3,26,44,.75) 0%, rgba(3,20,36,.92) 60%, rgba(2,14,26,.97) 100%);
    backdrop-filter:blur(4px); text-align:center;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .screen.hidden{ display:none }
  .big{ font-size:40px; line-height:1 }
  h1{
    font-size:36px; letter-spacing:-1.5px; font-weight:900; line-height:1;
    background:linear-gradient(180deg,#fff,#ffd54a 60%,#ff9f1c);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));
  }
  .sub{ font-size:13px; color:#bfe3ff; font-weight:700; letter-spacing:-.4px; line-height:1.5 }
  .card{
    background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.18);
    border-radius:16px; padding:11px 14px; font-size:12px; font-weight:700;
    color:#dff1ff; line-height:1.7; letter-spacing:-.4px; max-width:330px; width:100%;
  }
  .card .k{ color:#ffe27a; font-weight:900 }
  .btn{
    margin-top:4px; border:none; border-radius:999px; padding:12px 24px; font-size:16px; font-weight:900;
    letter-spacing:-.5px; cursor:pointer; font-family:inherit;
    background:linear-gradient(180deg,#ffd84a,#ff9f1c); color:#4a2500;
    box-shadow:0 4px 0 rgba(0,0,0,.32); animation:bob 1.5s ease-in-out infinite;
    touch-action:manipulation;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.32); animation:none }
  @keyframes bob{ 50%{ transform:translateY(-4px) } }
  .best{ font-size:12.5px; font-weight:900; color:#ffe27a }
  .hint{ font-size:11px; color:#8fb8d6; font-weight:700 }
  .titleFish{ font-size:32px; letter-spacing:6px; animation:swim 3s ease-in-out infinite }
  @keyframes swim{ 50%{ transform:translateX(10px) rotate(-6deg) } }
  #overTitle{ font-size:28px; font-weight:900; letter-spacing:-1.5px }
  .missTxt{ font-size:13px; font-weight:900; color:#ff9f9f }
  .statRow{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; width:100%; max-width:340px; }
  .stat{
    background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.18);
    border-radius:12px; padding:8px 10px; font-size:11px; font-weight:800; color:#cfe9ff; flex:1 1 30%; min-width:85px;
  }
  .stat b{ display:block; font-size:17px; color:#ffe27a; margin-top:2px }

  .shopGrid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; max-width:360px; margin:6px 0; }
  .shopItem{ background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); border-radius:12px; padding:8px; text-align:left; display:flex; flex-direction:column; justify-content:space-between; }
  .shopItemTitle{ font-size:11.5px; font-weight:800; color:#fff; }
  .shopItemDesc{ font-size:9.5px; color:#bfe3ff; margin:2px 0 6px; line-height:1.25; }
  .shopBuyBtn{ background:linear-gradient(180deg,#ffd84a,#ff9f1c); border:none; color:#4a2500; font-weight:900; font-size:11px; padding:7px 10px; border-radius:8px; cursor:pointer; width:100%; touch-action:manipulation; }
  .shopBuyBtn:disabled{ background:rgba(255,255,255,.2); color:rgba(255,255,255,.4); cursor:not-allowed; }

  @media (max-width: 380px) {
    .shopGrid { grid-template-columns: 1fr; }
    h1 { font-size: 30px; }
    .chip { font-size: 11px; padding: 3px 7px; }
    .chip b { font-size: 12.5px; }
    #hudShopBtn, #hudResetBtn { font-size: 10.5px; }
  }
</style>
</head>
<body>

<div id="app">

  <div id="hud">
    <div class="row">
      <div class="chip">🗓 <b id="dayTxt">1</b>일차</div>
      <div class="chip" id="streakChip">🔥 <b id="streakTxt">2</b>연속</div>
      <div class="spacer"></div>
      <button class="chip" id="hudShopBtn" style="cursor:pointer; background:rgba(255,215,0,0.22); border-color:#ffe27a; color:#ffe27a">🛒 상점</button>
      <button class="chip" id="hudResetBtn" style="cursor:pointer; background:rgba(255,90,90,0.22); border-color:#ff9f9f; color:#ff9f9f">🔄 처음부터</button>
      <div class="chip" id="hearts"><span>❤️</span><span>❤️</span><span>❤️</span></div>
      <div class="chip" id="timeChip">⏱ <b id="timeTxt">60</b></div>
      <button id="soundBtn" aria-label="소리 켜고 끄기">🔊</button>
    </div>
    <div id="barWrap">
      <div id="bar"></div>
      <div id="barTxt">0원 / 180원</div>
    </div>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="flash"></div>
    <div id="banner"></div>
  </div>

  <div id="ctrl">
    <button class="cbtn" id="leftBtn" aria-label="왼쪽">◀</button>
    <button class="cbtn" id="actBtn">🥅 뜰채 내리기</button>
    <button class="cbtn" id="rightBtn" aria-label="오른쪽">▶</button>
  </div>

  <!-- 시작 화면 -->
  <div class="screen" id="titleScreen">
    <div class="titleFish">🐟🥅🐠</div>
    <h1>낚시왕</h1>
    <div class="sub">깊은 바다일수록 큰 물고기!<br>오늘의 목표 금액을 채워라</div>
    <div class="card">
      <span class="k">🥅 뜰채 내리기</span> 스페이스 · 마우스 좌클릭 · 화면 톡!<br>
      <span class="k">↔ 조종</span> 마우스 이동 · 화살표 · ◀▶ 버튼<br>
      <span class="k">🐙 크라켄</span> 묵직하지만 대박 10000원!
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
      <button class="btn" id="startBtn">🥅 뜰채질 시작!</button>
      <button class="btn" id="titleShopBtn" style="background:linear-gradient(180deg,#36d1dc,#5b86e5); color:#fff; animation:none;">🛒 상점</button>
      <button class="btn" id="titleResetBtn" style="background:linear-gradient(180deg,#ff6b6b,#ee5253); color:#fff; animation:none;">🔄 처음부터</button>
    </div>
    <div class="best" id="bestTitle">🏆 최고 기록 0원</div>
    <div class="hint">한 판 60초 · '.' 입력 시 다음 단계</div>
  </div>

  <!-- 결과 화면 -->
  <div class="screen hidden" id="overScreen">
    <div class="big" id="overIcon">🏆</div>
    <div id="overTitle">1일차 성공!</div>
    <div class="missTxt" id="missTxt"></div>
    <div class="statRow">
      <div class="stat">오늘 번 돈<b id="stMoney">0원</b></div>
      <div class="stat">전체 합계<b id="stTotal">0원</b></div>
      <div class="stat">최고 기록<b id="stBest">0원</b></div>
    </div>
    <div style="display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; justify-content:center;">
      <button class="btn" id="openShopBtn" style="background:linear-gradient(180deg,#36d1dc,#5b86e5); color:#fff; animation:none;">🛒 장비 상점</button>
      <button class="btn" id="againBtn">다시 하기</button>
      <button class="btn" id="restartBtn" style="background:linear-gradient(180deg,#ff6b6b,#ee5253); color:#fff; animation:none;">🔄 처음부터 하기</button>
    </div>
    <div class="hint">스페이스 또는 화면을 톡 눌러도 돼</div>
  </div>

  <!-- 상점 화면 Modal -->
  <div class="screen hidden" id="shopScreen" style="z-index:30;">
    <div style="font-size:32px;">🛒 낚시 장비 상점</div>
    <div class="sub" style="margin-bottom:4px;">보유 금액: <b id="shopMoney" style="color:#ffe27a; font-size:16px;">0원</b></div>
    <div class="shopGrid" id="shopGrid"></div>
    <button class="btn" id="closeShopBtn" style="animation:none; padding:10px 24px; font-size:14px; margin-top:8px;">닫기 / 게임으로 돌아가기</button>
  </div>

</div>

<script>
(function(){
"use strict";

/* ================= 저장소 ================= */
function loadBest(){
  try{
    var v = window.localStorage.getItem('fishingMasterBest');
    var n = parseInt(v, 10);
    return isFinite(n) && n > 0 ? n : 0;
  }catch(e){ return 0; }
}
function saveBest(v){
  try{ window.localStorage.setItem('fishingMasterBest', String(v)); }catch(e){}
}
function loadSound(){
  try{ return window.localStorage.getItem('fishingMasterSnd') !== '0'; }catch(e){ return true; }
}
function saveSound(on){
  try{ window.localStorage.setItem('fishingMasterSnd', on ? '1' : '0'); }catch(e){}
}

/* ================= 소리 (WebAudio 직접 합성) ================= */
var actx = null, master = null, soundOn = loadSound();

function initAudio(){
  if(actx) { if(actx.state === 'suspended'){ try{ actx.resume(); }catch(e){} } return; }
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.26;
    master.connect(actx.destination);
    if(actx.state === 'suspended'){ try{ actx.resume(); }catch(e){} }
  }catch(e){ actx = null; }
}
function tone(f, d, type, v, delay, f2){
  if(!actx || !soundOn) return;
  try{
    var t0 = actx.currentTime + (delay || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(24, f2), t0 + d);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.002, v), t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + d + 0.04);
  }catch(e){}
}
function noiseBurst(d, v, f1, f2, delay){
  if(!actx || !soundOn) return;
  try{
    var t0 = actx.currentTime + (delay || 0);
    var len = Math.max(1, Math.floor(actx.sampleRate * d));
    var buf = actx.createBuffer(1, len, actx.sampleRate);
    var data = buf.getChannelData(0);
    for(var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = actx.createBufferSource(); src.buffer = buf;
    var flt = actx.createBiquadFilter(); flt.type = 'bandpass';
    flt.frequency.setValueAtTime(f1, t0);
    flt.frequency.exponentialRampToValueAtTime(Math.max(40, f2), t0 + d);
    flt.Q.value = 1.0;
    var g = actx.createGain();
    g.gain.setValueAtTime(v, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    src.connect(flt); flt.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + d + 0.03);
  }catch(e){}
}
var PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26];
function note(step, d, v, delay, type){
  var st = PENTA[Math.min(step, PENTA.length - 1)];
  tone(523.25 * Math.pow(2, st / 12), d || 0.16, type || 'triangle', v || 0.3, delay || 0);
}
function sndCast(){ tone(700, 0.12, 'sine', 0.18, 0, 220); noiseBurst(0.22, 0.22, 1400, 300, 0.10); }
function sndHook(step){
  note(step, 0.15, 0.32, 0, 'triangle');
  note(step + 2, 0.12, 0.16, 0.055, 'sine');
}
function sndCoin(n){
  for(var i = 0; i < Math.min(n, 6); i++){
    note(4 + i, 0.13, 0.26, i * 0.065, 'square');
  }
}
function sndTrash(){ tone(150, 0.3, 'sawtooth', 0.22, 0, 60); noiseBurst(0.2, 0.14, 500, 120, 0); }
function sndShark(){
  noiseBurst(0.5, 0.34, 1800, 90, 0);
  tone(320, 0.5, 'sawtooth', 0.3, 0, 46);
  tone(160, 0.6, 'square', 0.2, 0.05, 32);
}
function sndEvent(){ note(5, 0.12, 0.22, 0, 'square'); note(7, 0.12, 0.22, 0.08, 'square'); note(10, 0.22, 0.24, 0.16, 'square'); }
function sndClear(){
  var s = [0, 4, 7, 9, 11];
  for(var i = 0; i < s.length; i++) note(s[i], 0.24, 0.3, i * 0.1, 'triangle');
  tone(1046.5, 0.5, 'sine', 0.2, 0.5);
}
function sndOver(){
  tone(392, 0.28, 'sawtooth', 0.24, 0, 300);
  tone(294, 0.32, 'sawtooth', 0.24, 0.16, 220);
  tone(196, 0.6, 'sawtooth', 0.26, 0.34, 90);
}
function sndStart(){ note(0, 0.12, 0.26, 0, 'square'); note(4, 0.12, 0.26, 0.09, 'square'); note(7, 0.26, 0.3, 0.18, 'square'); }
function sndTick(){ tone(880, 0.07, 'square', 0.16, 0); }

/* ================= DOM ================= */
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var stage = document.getElementById('stage');
var elDay = document.getElementById('dayTxt');
var elTime = document.getElementById('timeTxt');
var elTimeChip = document.getElementById('timeChip');
var elHearts = document.getElementById('hearts');
var elBar = document.getElementById('bar');
var elBarTxt = document.getElementById('barTxt');
var elStreak = document.getElementById('streakChip');
var elStreakTxt = document.getElementById('streakTxt');
var elBanner = document.getElementById('banner');
var elFlash = document.getElementById('flash');
var elAct = document.getElementById('actBtn');
var elTitle = document.getElementById('titleScreen');
var elOver = document.getElementById('overScreen');
var elBestTitle = document.getElementById('bestTitle');
var elOverIcon = document.getElementById('overIcon');
var elOverTitle = document.getElementById('overTitle');
var elMiss = document.getElementById('missTxt');
var elStMoney = document.getElementById('stMoney');
var elStTotal = document.getElementById('stTotal');
var elStBest = document.getElementById('stBest');
var elSound = document.getElementById('soundBtn');

/* ================= 상수 ================= */
var FISH_TYPES = [
  { e:'🐟', band:0, value:20,  w:0.5, sp:42, size:26 },
  { e:'🐠', band:0, value:30,  w:0.7, sp:52, size:30 },
  { e:'🐡', band:1, value:60,  w:1.2, sp:34, size:34 },
  { e:'🦑', band:1, value:90,  w:1.6, sp:30, size:36 },
  { e:'🐬', band:1, value:120, w:1.8, sp:66, size:40 },
  { e:'🐙', band:2, value:180, w:2.6, sp:26, size:44 },
  { e:'🐋', band:2, value:300, w:4.0, sp:22, size:56 }
];
var TRASH_E = ['👢', '🥫', '🧦', '🪣'];
var GOAL_BASE = 180;

/* ================= 상태 ================= */
var W = 0, H = 0;
var waterTop = 0, bandY = [0, 0, 0], seabed = 0;
var state = 'title';           // title / play / over
var hookState = 'idle';        // idle / down / up
var day = 1, lives = 3, money = 0, total = 0, goal = GOAL_BASE;
var timeLeft = 60, elapsed = 0, eventTimer = 0, eventIdx = 0;
var streak = 0, bestScore = loadBest();
var lastClear = false;

var upgrades = {
  speed: 0,
  time: 0,
  shield: 0,
  luck: 0
};

var SHOP_ITEMS = [
  { id:'speed', name:'⚡ 뜰채 속도 UP', desc:'뜰채 이동 및 승강 속도 +18%', baseCost:150, costMult:1.35 },
  { id:'time', name:'⏱ 제한시간 연장', desc:'매 일차 시작 시간 +8초', baseCost:180, costMult:1.35 },
  { id:'shield', name:'🛡 상어 방어막', desc:'상어 공격 1회 무효화 (소모성)', baseCost:250, costMult:1.3 },
  { id:'luck', name:'✨ 황금 행운 UP', desc:'황금 물고기/보물 등장 확률 증가', baseCost:200, costMult:1.4 }
];

function getShopCost(item){
  var lvl = upgrades[item.id] || 0;
  return Math.round(item.baseCost * Math.pow(item.costMult, lvl));
}

function updateShopUI(){
  var elMoney = document.getElementById('shopMoney');
  if(elMoney) elMoney.textContent = total + '원';
  var grid = document.getElementById('shopGrid');
  if(!grid) return;
  grid.innerHTML = '';
  
  SHOP_ITEMS.forEach(function(it){
    var lvl = upgrades[it.id] || 0;
    var cost = getShopCost(it);
    
    var div = document.createElement('div');
    div.className = 'shopItem';
    
    var lvlTxt = it.id === 'shield' ? (lvl + '개 보유') : ('Lv.' + lvl);
    var costTxt = cost + '원';
    
    div.innerHTML = 
      '<div>' +
        '<div class="shopItemTitle">' + it.name + ' <span style="font-size:10px; color:#ffe27a;">(' + lvlTxt + ')</span></div>' +
        '<div class="shopItemDesc">' + it.desc + '</div>' +
      '</div>' +
      '<button class="shopBuyBtn" ' + (total < cost ? 'disabled' : '') + '>' + costTxt + '</button>';
      
    var btn = div.querySelector('button');
    btn.onclick = function(e){
      e.stopPropagation();
      if(total >= cost){
        total -= cost;
        upgrades[it.id] = (upgrades[it.id] || 0) + 1;
        sndCoin(3);
        updateShopUI();
        updateHUD();
      }
    };
    grid.appendChild(div);
  });
}

function openShop(){
  updateShopUI();
  document.getElementById('shopScreen').classList.remove('hidden');
}

function closeShop(){
  document.getElementById('shopScreen').classList.add('hidden');
}

/* ================= 크기/레이아웃 ================= */
function computeLayout(){
  waterTop = Math.round(H * 0.19);
  var wh = H - waterTop;
  bandY[0] = waterTop + wh * 0.30;
  bandY[1] = waterTop + wh * 0.62;
  bandY[2] = H;
  seabed = H - 14;
  boat.y = waterTop;
}
function resize(){
  var r = stage.getBoundingClientRect();
  var w = Math.max(240, Math.floor(r.width));
  var h = Math.max(220, Math.floor(r.height));
  var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.floor(w * dpr);
  cv.height = Math.floor(h * dpr);
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var ow = W, oh = H;
  W = w; H = h;
  computeLayout();
  if(ow > 0 && oh > 0){
    var sx = W / ow, sy = H / oh;
    for(var i = 0; i < fishes.length; i++){
      fishes[i].x *= sx; fishes[i].y *= sy; fishes[i].baseY *= sy;
    }
    for(var j = 0; j < bubbles.length; j++){ bubbles[j].x *= sx; bubbles[j].y *= sy; }
    hook.x *= sx; hook.y *= sy; boat.x *= sx; targetX *= sx;
  }else{
    hook.x = boat.x = targetX = W / 2;
    hook.y = boat.y + 10;
  }
  makeClouds();
}
function makeClouds(){
  clouds = [];
  var n = 3;
  for(var i = 0; i < n; i++){
    clouds.push({ x: Math.random() * W, y: 8 + Math.random() * (waterTop * 0.45), s: 0.6 + Math.random() * 0.7, v: 4 + Math.random() * 7 });
  }
}

/* ================= 물고기/개체 생성 ================= */
function bandTop(b){ return b === 0 ? waterTop + 22 : bandY[b - 1]; }
function bandBot(b){ return (b === 2 ? seabed - 14 : bandY[b]); }

function spawnFish(band, atEdge){
  var pool = [];
  for(var i = 0; i < FISH_TYPES.length; i++) if(FISH_TYPES[i].band === band) pool.push(FISH_TYPES[i]);
  var t = pool[Math.floor(Math.random() * pool.length)];
  var top = bandTop(band), bot = bandBot(band);
  var f = {
    kind:'fish', e:t.e, value:t.value, w:t.w, size:t.size,
    x: atEdge ? (Math.random() < 0.5 ? -30 : W + 30) : (20 + Math.random() * (W - 40)),
    y: top + Math.random() * Math.max(20, bot - top),
    vx: (Math.random() < 0.5 ? -1 : 1) * t.sp * (0.75 + Math.random() * 0.55) * speedMul(),
    baseY: 0, wob: Math.random() * 6.28, wobA: 4 + Math.random() * 8,
    hooked:false, pop:0, gold:false, band:band
  };
  f.baseY = f.y;
  fishes.push(f);
  return f;
}
function spawnTrash(){
  var band = Math.floor(Math.random() * 3);
  var top = bandTop(band), bot = bandBot(band);
  var f = {
    kind:'trash', e: TRASH_E[Math.floor(Math.random() * TRASH_E.length)],
    value:-40, w:1.4, size:28,
    x: 20 + Math.random() * (W - 40), y: top + Math.random() * Math.max(20, bot - top),
    vx: (Math.random() < 0.5 ? -1 : 1) * 14, baseY:0, wob:Math.random() * 6.28, wobA:3,
    hooked:false, pop:0, gold:false, band:band
  };
  f.baseY = f.y;
  fishes.push(f);
}
function spawnShark(){
  var f = {
    kind:'shark', e:'🦈', value:0, w:0, size:54,
    x: Math.random() < 0.5 ? -50 : W + 50,
    y: bandY[0] + Math.random() * Math.max(30, seabed - 24 - bandY[0]),
    vx: (Math.random() < 0.5 ? -1 : 1) * (58 + Math.random() * 26) * speedMul(),
    baseY:0, wob:Math.random() * 6.28, wobA:6, hooked:false, pop:0, gold:false, band:2
  };
  f.baseY = f.y;
  f.vx = (f.x < 0 ? 1 : -1) * Math.abs(f.vx);
  fishes.push(f);
}
function spawnGold(){
  var f = {
    kind:'fish', e:'🐟', value:400, w:1.0, size:32,
    x: Math.random() * W, y: bandY[0] + Math.random() * (bandY[1] - bandY[0]),
    vx:(Math.random() < 0.5 ? -1 : 1) * 118, baseY:0, wob:Math.random() * 6.28, wobA:10,
    hooked:false, pop:0, gold:true, life:22, band:1
  };
  f.baseY = f.y;
  fishes.push(f);
}
function spawnTreasure(){
  var f = {
    kind:'fish', e:'💎', value:600, w:5.0, size:40,
    x: 40 + Math.random() * (W - 80), y: seabed - 22,
    vx:(Math.random() < 0.5 ? -1 : 1) * 8, baseY:0, wob:Math.random() * 6.28, wobA:2,
    hooked:false, pop:0, gold:true, life:30, band:2
  };
  f.baseY = f.y;
  fishes.push(f);
}
function spawnKraken(){
  for(var i = 0; i < fishes.length; i++){ if(fishes[i].isKraken && !fishes[i].hooked) return; }
  var f = {
    kind:'fish', e:'🐙', value:10000, w:7.0, size:64,
    x: Math.random() < 0.5 ? -70 : W + 70, y: seabed - 35,
    vx: (Math.random() < 0.5 ? -1 : 1) * 32 * speedMul(), baseY:0, wob:Math.random() * 6.28, wobA:14,
    hooked:false, pop:0, gold:true, isKraken:true, band:2
  };
  f.baseY = f.y;
  f.vx = (f.x < 0 ? 1 : -1) * Math.abs(f.vx);
  fishes.push(f);
}
function speedMul(){ return 1 + (day - 1) * 0.12 + Math.min(elapsed, 180) * 0.0012; }

function wantCount(band){
  if(band === 0) return 6;
  if(band === 1) return 4 + Math.min(2, Math.floor(day / 2));
  return 2 + Math.min(2, Math.floor(day / 2));
}
function wantTrash(){ return 0; }
function wantShark(){ return 0; }

function refillWorld(atEdge){
  var cnt = [0, 0, 0], tr = 0, sh = 0, i;
  for(i = 0; i < fishes.length; i++){
    var f = fishes[i];
    if(f.hooked) continue;
    if(f.kind === 'trash') tr++;
    else if(f.kind === 'shark') sh++;
    else if(!f.gold) cnt[f.band]++;
  }
  for(var b = 0; b < 3; b++){
    var need = wantCount(b) - cnt[b];
    for(i = 0; i < need; i++) spawnFish(b, atEdge);
  }
  for(i = 0; i < wantTrash() - tr; i++) spawnTrash();
  for(i = 0; i < wantShark() - sh; i++) spawnShark();
  spawnKraken();
}

/* ================= 효과 ================= */
function addParticles(x, y, n, color, spd, life){
  for(var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2;
    var s = spd * (0.35 + Math.random());
    particles.push({
      x:x, y:y, vx:Math.cos(a) * s, vy:Math.sin(a) * s - spd * 0.35,
      r: 2 + Math.random() * 3.5, life: life || 0.7, t: life || 0.7, c: color
    });
  }
}
function addPop(x, y, txt, color, size){
  pops.push({ x:x, y:y, txt:txt, c:color, t:1.05, s:size || 20 });
}
function doShake(mag, dur){ shakeMag = Math.max(shakeMag, mag); shake = Math.max(shake, dur); }
function doFlash(a){
  elFlash.style.transition = 'none';
  elFlash.style.opacity = String(a);
  window.setTimeout(function(){
    elFlash.style.transition = 'opacity .22s';
    elFlash.style.opacity = '0';
  }, 20);
}
function showBanner(txt){
  elBanner.textContent = txt;
  elBanner.classList.remove('show');
  void elBanner.offsetWidth;
  elBanner.classList.add('show');
}

/* ================= HUD ================= */
function updateHUD(){
  elDay.textContent = day;
  elTime.textContent = Math.max(0, Math.ceil(timeLeft));
  if(timeLeft <= 10) elTimeChip.classList.add('warn'); else elTimeChip.classList.remove('warn');
  var kids = elHearts.getElementsByTagName('span');
  for(var i = 0; i < kids.length; i++){
    if(i < lives) kids[i].classList.remove('gone'); else kids[i].classList.add('gone');
  }
  var pct = Math.max(0, Math.min(100, money / goal * 100));
  elBar.style.width = pct + '%';
  elBarTxt.textContent = Math.max(0, money) + '원 / ' + goal + '원';
  if(streak >= 2){ elStreak.classList.remove('hide'); elStreakTxt.textContent = streak; }
  else elStreak.classList.add('hide');
  elBestTitle.textContent = '🏆 최고 기록 ' + bestScore + '원';
}
function setActLabel(){
  if(state !== 'play'){ elAct.textContent = '🥅 뜰채 내리기'; return; }
  if(hookState === 'idle') elAct.textContent = '🥅 뜰채 내리기';
  else if(hookState === 'down') elAct.textContent = '⬆️ 당기기!';
  else elAct.textContent = '⏳ 올라오는 중';
}

/* ================= 게임 흐름 ================= */
function startGame(){
  day = 1; lives = 3; total = 0; bestCatch = 0;
  elTitle.classList.add('hidden');
  elOver.classList.add('hidden');
  eventIdx = 0; elapsed = 0; eventTimer = 0;
  startDay();
  sndStart();
}
function restartFromBeginning(){
  upgrades = { speed: 0, time: 0, shield: 0, luck: 0 };
  startGame();
  showBanner('🔄 게임을 처음부터 다시 시작합니다!');
}
function startDay(){
  state = 'play';
  goal = Math.round(GOAL_BASE * Math.pow(1.5, day - 1) / 10) * 10;
  timeLeft = Math.max(42, 62 - day * 2) + (upgrades.time * 8);
  money = 0; streak = 0; caughtCount = 0;
  hookState = 'idle'; hooked.length = 0;
  hook.immune = 0; hook.pop = 0;
  fishes.length = 0; particles.length = 0; pops.length = 0;
  targetX = W / 2; boat.x = W / 2; hook.x = W / 2; hook.y = boat.y + 12;
  refillWorld(false);
  
  if(upgrades.luck > 0 && Math.random() < upgrades.luck * 0.2){
    spawnGold();
  }

  for(var i = 0; i < 3; i++){
    var f = spawnFish(0, false);
    f.x = W / 2 + (i - 1) * 42 + (Math.random() * 16 - 8);
    f.y = waterTop + 40 + i * 14;
    f.baseY = f.y;
  }
  tickAt = 99;
  updateHUD(); setActLabel();
  showBanner(day + '일차 시작! 목표 ' + goal + '원');
}
function nextDay(){
  day++;
  startDay();
  sndStart();
}
function finishDay(){
  var bonus = Math.round(Math.max(0, timeLeft) * 5);
  total += money + bonus;
  lastClear = true;
  state = 'over';
  overLock = window.performance.now() + 650;
  hookState = 'idle';
  if(total > bestScore){ bestScore = total; saveBest(bestScore); }
  elOverIcon.textContent = '🏆';
  elOverTitle.textContent = day + '일차 성공!';
  elMiss.style.color = '#b6ffd0';
  elMiss.textContent = '🐟 ' + caughtCount + '마리 낚음 · ⏱ 시간 보너스 +' + bonus + '원';
  elStMoney.textContent = money + '원';
  elStTotal.textContent = total + '원';
  elStBest.textContent = bestScore + '원';
  document.getElementById('againBtn').textContent = '▶ ' + (day + 1) + '일차 가자!';
  elOver.classList.remove('hidden');
  updateHUD();
  sndClear();
  doFlash(0.55);
}
function gameOver(reason){
  state = 'over';
  overLock = window.performance.now() + 650;
  lastClear = false;
  hookState = 'idle';
  total += money;
  var wasBest = total > bestScore;
  if(wasBest){ bestScore = total; saveBest(bestScore); }
  elOverIcon.textContent = reason === 'shark' ? '🦈' : '⏰';
  elOverTitle.textContent = reason === 'shark' ? '줄이 다 끊어졌어!' : (day + '일차 실패...');
  var miss;
  if(wasBest){
    miss = '🎉 신기록이야! 최고 기록을 갈아치웠어!';
    elMiss.style.color = '#ffe27a';
  }else{
    elMiss.style.color = '#ff9f9f';
    var d = bestScore - total;
    if(d <= 200) miss = '아쉽다! 최고 기록까지 딱 ' + d + '원!';
    else if(reason !== 'shark') miss = '목표까지 ' + Math.max(0, goal - money) + '원 남았었어. 한 판 더!';
    else if(bestCatch >= 2) miss = '한 번에 최대 ' + bestCatch + '마리까지 걸었어! 상어만 피하면 돼';
    else miss = '큰 물고기는 천천히 올라와. 상어를 조심해!';
  }
  elMiss.textContent = miss;
  elStMoney.textContent = money + '원';
  elStTotal.textContent = total + '원';
  elStBest.textContent = bestScore + '원';
  document.getElementById('againBtn').textContent = '🎣 다시 하기';
  elOver.classList.remove('hidden');
  updateHUD();
  sndOver();
  doShake(16, 0.5);
}

function reelUp(){
  hookState = 'up';

}
function pressAction(){
  initAudio();
  if(state === 'title'){ startGame(); return; }
  if(state === 'over'){
    if(window.performance.now() < overLock) return;
    if(lastClear){ elOver.classList.add('hidden'); nextDay(); }
    else startGame();
    return;
  }
  if(state !== 'play') return;
  if(hookState === 'idle') castLine();
  else if(hookState === 'down') reelUp();
}

function totalWeight(){
  var s = 0;
  for(var i = 0; i < hooked.length; i++) s += hooked[i].w;
  return s;
}
function catchThing(f){
  f.hooked = true;
  f.pop = 1;
  hooked.push(f);
  hook.pop = 1;
  if(f.kind === 'trash'){
    sndTrash();
    addParticles(f.x, f.y, 10, '#9aa7b0', 90, 0.6);
    addPop(f.x, f.y - 18, '쓰레기 -40', '#ff9f9f', 17);
    doShake(6, 0.2);
    hitstop = 0.05;
  }else{
    sndHook(Math.min(hooked.length - 1, 9));
    addParticles(f.x, f.y, 14, f.gold ? '#ffe27a' : '#bfe9ff', 120, 0.6);
    addPop(f.x, f.y - 20, '+' + f.value, f.gold ? '#ffe27a' : '#b6ffd0', f.gold ? 24 : 19);
    doShake(f.gold ? 10 : 5 + f.w * 1.6, 0.22);
    hitstop = f.gold ? 0.08 : 0.045;
    if(f.gold) doFlash(0.3);
  }
  reelUp();
}

  { t:'🌟 황금 물고기 등장!  400원!', run:function(){ spawnGold(); spawnGold(); } },

];
function fireEvent(){
  var ev = EVENTS[eventIdx % EVENTS.length];
  eventIdx++;
  ev.run();
  showBanner(ev.t);
  sndEvent();
  doFlash(0.22);
}

/* ================= 업데이트 루프 ================= */
function updateBubbles(dt){
  // 물방울 생성 및 이동 비활성화
  bubbles.length = 0;
}
function updateParticles(dt){
  for(var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.t -= dt;
    if(p.t <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 120 * dt;
  }
}
function updatePops(dt){
  for(var i = pops.length - 1; i >= 0; i--){
    var p = pops[i];
    p.t -= dt;
    if(p.t <= 0){ pops.splice(i, 1); continue; }
    p.y -= 38 * dt;
  }
}

function updateFishes(dt, activePlay){
  for(var i = fishes.length - 1; i >= 0; i--){
    var f = fishes[i];
    if(f.hooked) continue;
    f.wob += dt * 2.5;
    f.x += f.vx * dt;
    f.y = f.baseY + Math.sin(f.wob) * f.wobA;
    if(f.x < -60) f.vx = Math.abs(f.vx);
    if(f.x > W + 60) f.vx = -Math.abs(f.vx);

    if(f.gold && f.life !== undefined){
      f.life -= dt;
      if(f.life <= 0){ fishes.splice(i, 1); continue; }
    }

    if(activePlay && hookState !== 'idle'){
      var hookTargetY = hooked.length > 0 ? hook.y + hooked.length * 20 : hook.y;
      var dx = f.x - hook.x;
      var dy = f.y - hookTargetY;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var touchR = (f.size * 0.5) + 12;

      if(f.kind === 'shark'){
        if(hook.immune <= 0 && dist < touchR + 8){
          snapLine();
          return;
        }
      }else{
        if(dist < touchR && hookState !== 'idle'){
          catchThing(f);
          return;
        }
      }
    }
  }
}

function update(dt){
  animT += dt;
  if(shake > 0){ shake -= dt; if(shake <= 0){ shake = 0; shakeMag = 0; } }
  for(var c = 0; c < clouds.length; c++){
    var cl = clouds[c];
    cl.x += cl.v * dt;
    if(cl.x > W + 60) cl.x = -60;
  }
  if(hitstop > 0){ hitstop -= dt; return; }

  var dir = 0;
  if(keyL || btnL) dir -= 1;
  if(keyR || btnR) dir += 1;
  
  var speedMult = 1 + (upgrades.speed * 0.18);

  if(dir !== 0) targetX += dir * 320 * speedMult * dt;
  if(pointerActive && pointerX >= 0) targetX = pointerX;
  if(targetX < 14) targetX = 14;
  if(targetX > W - 14) targetX = W - 14;

  updateBubbles(dt);
  updateParticles(dt);
  updatePops(dt);

  if(state === 'title'){
    boat.x += (W / 2 - boat.x) * Math.min(1, dt * 2);
    hook.x = boat.x; hook.y = boat.y + 12;
    updateFishes(dt, false);
    boat.bobT += dt;
    return;
  }
  if(state !== 'play'){
    boat.bobT += dt;
    updateFishes(dt, false);
    return;
  }

  boat.bobT += dt;
  if(hook.immune > 0) hook.immune -= dt;
  timeLeft -= dt;
  elapsed += dt;
  eventTimer += dt;
  if(eventTimer >= 30){ eventTimer -= 30; fireEvent(); }

  if(timeLeft <= 5.4 && timeLeft > 0){
    var sec = Math.ceil(timeLeft);
    if(sec !== tickAt){ tickAt = sec; sndTick(); }
  }
  if(timeLeft <= 0){ timeLeft = 0; updateHUD(); gameOver('time'); return; }

  var maxSpd;
  if(hookState === 'idle'){
    boat.x += (targetX - boat.x) * Math.min(1, dt * 9 * speedMult);
    if(boat.x < 30) boat.x = 30;
    if(boat.x > W - 30) boat.x = W - 30;
    hook.x = boat.x;
    hook.y = boat.y + 12 + Math.sin(boat.bobT * 2.4) * 2;
  }else{
    maxSpd = (300 * speedMult) / (1 + totalWeight() * 0.35);
    var dx = targetX - hook.x;
    var mv = Math.max(-maxSpd * dt, Math.min(maxSpd * dt, dx));
    hook.x += mv;
    if(hook.x < 12) hook.x = 12;
    if(hook.x > W - 12) hook.x = W - 12;
  }

  if(hookState === 'down'){
    hook.y += 300 * speedMult * dt;
    if(hook.y >= seabed){
      hook.y = seabed;
      reelUp();
    }
  }else if(hookState === 'up'){
    maxSpd = (260 * speedMult) / (1 + totalWeight() * 0.30);
    hook.y -= maxSpd * dt;
    if(hook.y <= boat.y + 12){
      hook.y = boat.y + 12;
      hookState = 'idle';
      cashIn();
    }
  }

  for(var hIdx = 0; hIdx < hooked.length; hIdx++){
    var hf = hooked[hIdx];
    hf.x = hook.x + (hIdx % 2 === 0 ? -5 : 5);
    hf.y = hook.y + 2 + hIdx * 10;
  }

  updateFishes(dt, true);
  updateHUD();
}

/* ================= 캔버스 렌더링 ================= */
function render(){
  ctx.save();
  if(shake > 0){
    var rx = (Math.random() * 2 - 1) * shakeMag;
    var ry = (Math.random() * 2 - 1) * shakeMag;
    ctx.translate(rx, ry);
  }

  // 하늘
  var skyGrad = ctx.createLinearGradient(0, 0, 0, waterTop);
  skyGrad.addColorStop(0, '#7bc3ff');
  skyGrad.addColorStop(1, '#cbe8ff');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, waterTop);

  // 구름
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  for(var c = 0; c < clouds.length; c++){
    var cl = clouds[c];
    ctx.beginPath();
    ctx.arc(cl.x, cl.y, 14 * cl.s, 0, 6.28);
    ctx.arc(cl.x + 12 * cl.s, cl.y - 4 * cl.s, 11 * cl.s, 0, 6.28);
    ctx.arc(cl.x - 12 * cl.s, cl.y + 2 * cl.s, 10 * cl.s, 0, 6.28);
    ctx.fill();
  }

  // 수중 그라데이션
  var seaGrad = ctx.createLinearGradient(0, waterTop, 0, H);
  seaGrad.addColorStop(0, '#2ab3eb');
  seaGrad.addColorStop(0.35, '#1b7cb5');
  seaGrad.addColorStop(0.7, '#0f5282');
  seaGrad.addColorStop(1, '#093657');
  ctx.fillStyle = seaGrad;
  ctx.fillRect(0, waterTop, W, H - waterTop);

  // 수중 햇빛 줄기 (투명한 햇살 효과)
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for(var ray = 0; ray < 4; ray++){
    var rx = (W * 0.15) + ray * (W * 0.25) + Math.sin(animT * 0.7 + ray * 1.5) * 18;
    var rayGrad = ctx.createLinearGradient(rx, waterTop, rx + 40, H);
    rayGrad.addColorStop(0, 'rgba(255,255,255,0.25)');
    rayGrad.addColorStop(0.5, 'rgba(160,230,255,0.10)');
    rayGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rayGrad;
    ctx.beginPath();
    ctx.moveTo(rx - 15, waterTop);
    ctx.lineTo(rx + 30, waterTop);
    ctx.lineTo(rx + 85, H);
    ctx.lineTo(rx + 15, H);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // 해저 모래 및 해초
  ctx.fillStyle = '#2c5945';
  ctx.beginPath();
  ctx.moveTo(0, seabed);
  ctx.quadraticCurveTo(W * 0.5, seabed - 8, W, seabed + 4);
  ctx.lineTo(W, H); ctx.lineTo(0, H);
  ctx.fill();

  ctx.strokeStyle = '#439b69';
  ctx.lineWidth = 3;
  for(var s = 15; s < W; s += 38){
    ctx.beginPath();
    ctx.moveTo(s, H);
    ctx.quadraticCurveTo(s + Math.sin(animT * 2 + s) * 8, seabed - 18, s + Math.sin(animT * 2.5 + s) * 12, seabed - 32);
    ctx.stroke();
  }

  // 물고기/개체
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(var fIdx = 0; fIdx < fishes.length; fIdx++){
    var f = fishes[fIdx];
    ctx.save();
    ctx.translate(f.x, f.y);
    if(f.vx < 0) ctx.scale(-1, 1);

    // 깊은 수중에서도 물고기가 뚜렷하게 보이도록 하는 은은한 밝은 오라(Aura)
    ctx.fillStyle = f.gold ? 'rgba(255, 235, 130, 0.28)' : 'rgba(255, 255, 255, 0.22)';
    ctx.beginPath();
    ctx.arc(0, 0, f.size * 0.58, 0, Math.PI * 2);
    ctx.fill();

    // 선명한 후광 및 발광 효과
    if(f.gold){
      ctx.shadowColor = 'rgba(255, 235, 100, 1.0)';
      ctx.shadowBlur = 18;
    } else {
      ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
      ctx.shadowBlur = 10;
    }

    // 이모지 고화질 선명 폰트 지정
    // 위 오라를 그릴 때 쓴 반투명 fillStyle 이 남아 있으면 물고기까지 22% 투명도로 그려진다.
    // 이모지를 찍기 직전에 반드시 불투명으로 되돌린다.
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold ' + (f.size + 2) + 'px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
    ctx.fillText(f.e, 0, 0);

    if(f.isKraken){
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText('👑', 0, -(f.size * 0.5 + 12));
    }else if(f.gold){
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('✨', f.size * 0.35, -(f.size * 0.35));
    }
    ctx.restore();
  }

  // 줄 및 뜰채 (Dip Net)
  var boatBobY = waterTop + Math.sin(boat.bobT * 2.4) * 2;
  var netColor = hook.immune > 0 ? '#ff6b6b' : '#ffd54a';

  // 로프/손잡이
  ctx.strokeStyle = hook.immune > 0 ? '#ff6b6b' : 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(boat.x, boatBobY - 6);
  ctx.lineTo(hook.x, hook.y - 12);
  ctx.stroke();

  // 뜰채 테두리 (Rim)
  ctx.strokeStyle = netColor;
  ctx.lineWidth = 3;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.beginPath();
  ctx.ellipse(hook.x, hook.y - 10, 22, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 뜰채 주머니 망 (Net Mesh Pouch)
  ctx.fillStyle = hook.immune > 0 ? 'rgba(255,100,100,0.3)' : 'rgba(255, 255, 255, 0.22)';
  ctx.strokeStyle = hook.immune > 0 ? 'rgba(255,100,100,0.7)' : 'rgba(255, 255, 255, 0.55)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(hook.x - 22, hook.y - 10);
  ctx.quadraticCurveTo(hook.x - 16, hook.y + 22, hook.x, hook.y + 26);
  ctx.quadraticCurveTo(hook.x + 16, hook.y + 22, hook.x + 22, hook.y - 10);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // 망 격자 패턴
  ctx.beginPath();
  ctx.moveTo(hook.x - 12, hook.y - 6);
  ctx.lineTo(hook.x + 4, hook.y + 20);
  ctx.moveTo(hook.x + 12, hook.y - 6);
  ctx.lineTo(hook.x - 4, hook.y + 20);
  ctx.moveTo(hook.x - 18, hook.y + 2);
  ctx.lineTo(hook.x + 18, hook.y + 2);
  ctx.stroke();

  // 배 및 낚시꾼
  ctx.save();
  ctx.translate(boat.x, boatBobY);
  // 배
  ctx.fillStyle = '#8d5b28';
  ctx.beginPath();
  ctx.moveTo(-24, -2);
  ctx.lineTo(24, -2);
  ctx.lineTo(16, 10);
  ctx.lineTo(-16, 10);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#5a3713';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 낚시꾼
  ctx.font = '20px sans-serif';
  ctx.fillText('🧑‍🌾', -4, -14);

  // 낚싯대
  ctx.strokeStyle = '#d69e2e';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-2, -12);
  ctx.lineTo(12, -22);
  ctx.stroke();
  ctx.restore();

  // 수면 파도
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.moveTo(0, waterTop);
  for(var wx = 0; wx <= W; wx += 20){
    ctx.lineTo(wx, waterTop + Math.sin(animT * 3 + wx * 0.05) * 2.5);
  }
  ctx.lineTo(W, waterTop + 6); ctx.lineTo(0, waterTop + 6);
  ctx.fill();

  // 파티클
  for(var pIdx = 0; pIdx < particles.length; pIdx++){
    var pt = particles[pIdx];
    ctx.fillStyle = pt.c;
    ctx.globalAlpha = Math.max(0, pt.t / pt.life);
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.r, 0, 6.28);
    ctx.fill();
  }
  ctx.globalAlpha = 1.0;

  // 텍스트 팝업
  for(var popIdx = 0; popIdx < pops.length; popIdx++){
    var pp = pops[popIdx];
    ctx.save();
    ctx.globalAlpha = Math.min(1, pp.t);
    ctx.font = '900 ' + pp.s + 'px system-ui, sans-serif';
    ctx.fillStyle = pp.c;
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.lineWidth = 3.5;
    ctx.strokeText(pp.txt, pp.x, pp.y);
    ctx.fillText(pp.txt, pp.x, pp.y);
    ctx.restore();
  }

  ctx.restore();
}

/* ================= 이벤트 및 입력 ================= */
var lastTime = 0;
function loop(t){
  if(!lastTime) lastTime = t;
  var dt = Math.min(0.064, (t - lastTime) / 1000);
  lastTime = t;

  update(dt);
  render();
  requestAnimationFrame(loop);
}

var cheatBuffer = '', cheatTimer = null;

// 키보드
window.addEventListener('keydown', function(e){
  if(e.code === 'ArrowLeft' || e.code === 'KeyA') keyL = true;
  if(e.code === 'ArrowRight' || e.code === 'KeyD') keyR = true;
  if(e.code === 'Space'){ e.preventDefault(); pressAction(); }
  
  // '.' (마침표) 입력 시 다음 단계로 이동
  if(e.key === '.' || e.code === 'Period'){
    if(state === 'play'){
      if(money < goal) money = goal;
      finishDay();
    } else {
      overLock = 0;
      pressAction();
    }
  }
});
window.addEventListener('keyup', function(e){
  if(e.code === 'ArrowLeft' || e.code === 'KeyA') keyL = false;
  if(e.code === 'ArrowRight' || e.code === 'KeyD') keyR = false;
});

// 상점 버튼 이벤트 연결
document.getElementById('hudShopBtn').addEventListener('click', function(e){ e.stopPropagation(); openShop(); });
document.getElementById('titleShopBtn').addEventListener('click', function(e){ e.stopPropagation(); openShop(); });
document.getElementById('openShopBtn').addEventListener('click', function(e){ e.stopPropagation(); openShop(); });
document.getElementById('closeShopBtn').addEventListener('click', function(e){ e.stopPropagation(); closeShop(); });

// 처음부터 하기 버튼 이벤트 연결
document.getElementById('hudResetBtn').addEventListener('click', function(e){ e.stopPropagation(); restartFromBeginning(); });
document.getElementById('restartBtn').addEventListener('click', function(e){ e.stopPropagation(); restartFromBeginning(); });
var titleResetBtn = document.getElementById('titleResetBtn');
if(titleResetBtn) titleResetBtn.addEventListener('click', function(e){ e.stopPropagation(); restartFromBeginning(); });

// 버튼 controls
var leftBtn = document.getElementById('leftBtn');
var rightBtn = document.getElementById('rightBtn');

function bindBtn(el, setFn){
  el.addEventListener('touchstart', function(e){ e.preventDefault(); setFn(true); initAudio(); }, {passive:false});
  el.addEventListener('touchend', function(e){ e.preventDefault(); setFn(false); }, {passive:false});
  el.addEventListener('mousedown', function(){ setFn(true); initAudio(); });
  el.addEventListener('mouseup', function(){ setFn(false); });
  el.addEventListener('mouseleave', function(){ setFn(false); });
}
bindBtn(leftBtn, function(v){ btnL = v; });
bindBtn(rightBtn, function(v){ btnR = v; });

elAct.addEventListener('click', pressAction);
document.getElementById('startBtn').addEventListener('click', pressAction);
document.getElementById('againBtn').addEventListener('click', pressAction);

// 터치/마우스 조종
var lastTouchTime = 0;

function handlePointer(e){
  var rect = stage.getBoundingClientRect();
  var clientX = e.touches ? e.touches[0].clientX : e.clientX;
  pointerX = clientX - rect.left;
}

// 마우스 커서 위치를 항상 추적하여 배 이동
stage.addEventListener('mousemove', function(e){
  pointerActive = true;
  handlePointer(e);
});

stage.addEventListener('mouseleave', function(){
  pointerActive = false;
});

// 마우스 좌클릭으로 줄 내리기 / 당기기
stage.addEventListener('mousedown', function(e){
  if(Date.now() - lastTouchTime < 500) return; // 터치 중복 이벤트 방지
  if(e.button === 0){ // 좌클릭
    pointerActive = true;
    handlePointer(e);
    pressAction();
  }
});

// 터치 조종
stage.addEventListener('touchstart', function(e){
  lastTouchTime = Date.now();
  pointerActive = true;
  if(e.touches && e.touches.length > 0) handlePointer(e);
  pressAction();
}, {passive:true});

stage.addEventListener('touchmove', function(e){
  pointerActive = true;
  if(e.touches && e.touches.length > 0) handlePointer(e);
}, {passive:true});

stage.addEventListener('touchend', function(){
  pointerActive = false;
});

// 소리 토글
elSound.addEventListener('click', function(e){
  e.stopPropagation();
  soundOn = !soundOn;
  saveSound(soundOn);
  elSound.textContent = soundOn ? '🔊' : '🔇';
  initAudio();
});
if(!soundOn) elSound.textContent = '🔇';

window.addEventListener('resize', resize);

window.onload = function(){
  resize();
  updateHUD();
  requestAnimationFrame(loop);
};

})();
