<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>주방 음식 담기 게임</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: #c0ebbd;
      font-family: 'Pretendard', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 12px;
    }

    /* 모바일 디바이스 맞춤 유동적 레이아웃 */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 3 / 4;
      max-height: calc(82vh - 100px);
      background: linear-gradient(180deg, #d8f5d5 0%, #b8ebb3 100%);
      border: 5px solid #4a8544;
      border-radius: 24px;
      box-shadow: 0 16px 36px rgba(45, 87, 41, 0.22);
      overflow: hidden;
      touch-action: none; /* 터치 드래그 이동 시 스크롤 방지 */
    }

    /* 은은한 주방 타일 배경 무늬 */
    .bg-pattern {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.5) 2px, transparent 2px);
      background-size: 20px 20px;
      pointer-events: none;
    }

    /* 먹물 오버레이 효과 */
    .ink-overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(10, 10, 15, 0.95);
      z-index: 40;
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      font-weight: 800;
    }

    .ink-overlay.active {
      opacity: 1;
    }

    /* 게임 오버 화면 */
    .gameover-overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(20, 45, 18, 0.92);
      z-index: 60;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 16px;
      text-align: center;
      color: #ffffff;
      cursor: pointer;
    }

    .gameover-overlay.active {
      display: flex;
    }

    /* 반응형 바구니 및 아이템 */
    #basket {
      position: absolute;
      bottom: 12px;
      left: 0px;
      font-size: clamp(3.5rem, 12vw, 4.8rem);
      line-height: 1;
      z-index: 30;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.15));
      will-change: transform;
      cursor: grab;
      touch-action: none;
    }

    .falling-item {
      position: absolute;
      font-size: clamp(2.5rem, 9vw, 3.5rem);
      z-index: 20;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.12));
      will-change: transform;
      pointer-events: none;
    }

    /* Floating Score Popup (+10, -20) */
    .score-popup {
      position: absolute;
      font-weight: 900;
      font-size: clamp(1.4rem, 5vw, 1.8rem);
      z-index: 50;
      pointer-events: none;
      animation: floatUp 0.7s ease-out forwards;
      text-shadow: 0 2px 4px rgba(0,0,0,0.25);
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      50% { transform: translateY(-20px) scale(1.15); }
      100% { opacity: 0; transform: translateY(-40px) scale(1); }
    }

    .speed-boost-border {
      box-shadow: inset 0 0 25px rgba(255, 215, 0, 0.85), 0 0 25px rgba(255, 180, 0, 0.6);
      border-color: #f59e0b !important;
    }
  </style>
</head>
<body>

  <!-- 게임 메인 컨테이너 -->
  <div id="game-container" class="transition-all duration-300">
    <div class="bg-pattern"></div>

    <!-- 먹물 커튼 오버레이 -->
    <div id="ink-screen" class="ink-overlay">
      <div class="text-5xl md:text-6xl mb-2">🦑</div>
      <div>먹물 세례! 시야 가림!</div>
    </div>

    <!-- 게임 오버 화면 -->
    <div id="gameover-screen" class="gameover-overlay">
      <div class="text-5xl">🍽️</div>
      <div class="text-2xl sm:text-3xl font-black">게임 오버!</div>
      <div class="text-base sm:text-lg font-bold">최종 점수 <span id="final-score" class="text-yellow-300">0</span>점</div>
      <div class="text-xs sm:text-sm font-semibold bg-white/20 px-3 py-1.5 rounded-full mt-1">스페이스바 또는 화면 탭으로 다시 시작</div>
    </div>

    <!-- 상단 점수판 & 상태 표시줄 -->
    <div class="relative z-30 p-3 sm:p-4 flex justify-between items-start pointer-events-none">
      <div class="flex flex-col gap-1 items-start">
        <div class="bg-white/85 backdrop-blur-md px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-2xl border-2 border-green-600/30 shadow-md">
          <span class="text-[10px] sm:text-xs font-bold text-green-700 block uppercase tracking-wider">Score</span>
          <span id="score-text" class="text-2xl sm:text-3xl font-black text-green-900 tracking-tight">0</span>
        </div>
        <div id="life-text" class="bg-white/85 backdrop-blur-md px-2.5 py-1 rounded-2xl border-2 border-red-500/30 shadow-md text-base sm:text-xl leading-none">❤️❤️❤️</div>
      </div>

      <!-- 탄산음료 버프 및 쿨다운 배너 -->
      <div class="flex flex-col gap-1 items-end">
        <div id="soda-buff-badge" class="hidden bg-amber-500 text-white px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-xl shadow-md font-bold text-xs sm:text-sm flex items-center gap-1.5 animate-bounce">
          <span>🥤 스피드 폭주:</span>
          <span id="soda-timer" class="font-black text-yellow-200">10.0s</span>
        </div>
        <div id="soda-cooldown-badge" class="hidden bg-gray-800/80 text-gray-200 px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-lg text-[10px] sm:text-xs font-medium backdrop-blur-sm">
          <span>🥤 다음 대기: </span>
          <span id="cooldown-timer" class="font-bold text-amber-400">50s</span>
        </div>
      </div>
    </div>

    <!-- 바구니 이모지 -->
    <div id="basket">🧺</div>
  </div>

  <!-- 외부 컨트롤 버튼 및 안내 가이드 -->
  <div class="mt-3 flex flex-col items-center gap-2 w-full max-w-[480px]">
    <!-- 터치/마우스 이동 버튼 -->
    <div class="flex justify-center gap-3 sm:gap-4 w-full">
      <button id="btn-left" class="flex-1 py-3 sm:py-3.5 bg-green-700 hover:bg-green-800 active:bg-green-900 text-white font-extrabold text-lg sm:text-xl rounded-2xl shadow-md active:scale-95 transition-all flex items-center justify-center gap-1 touch-none">
        <span>◀</span> <span>왼쪽</span>
      </button>
      <button id="btn-right" class="flex-1 py-3 sm:py-3.5 bg-green-700 hover:bg-green-800 active:bg-green-900 text-white font-extrabold text-lg sm:text-xl rounded-2xl shadow-md active:scale-95 transition-all flex items-center justify-center gap-1 touch-none">
        <span>오른쪽</span> <span>▶</span>
      </button>
    </div>

    <p class="text-green-900 font-semibold text-center text-xs sm:text-sm bg-white/70 px-3 py-1.5 rounded-full border border-green-700/20 shadow-sm w-full">
      📱 화면을 직접 터치해서 끌거나 <kbd class="bg-green-100 px-1.5 py-0.5 rounded border border-green-300">←</kbd> <kbd class="bg-green-100 px-1.5 py-0.5 rounded border border-green-300">→</kbd> 방향키 활용!
    </p>
  </div>

  <script>
    // Web Audio 효과음 모듈
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'catch') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.12);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'junk') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.linearRampToValueAtTime(80, now + 0.2);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'ink') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(60, now + 0.28);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.28);
          osc.start(now);
          osc.stop(now + 0.28);
        } else if (type === 'soda') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(1200, now + 0.25);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (e) {
        console.error(e);
      }
    }

    const container = document.getElementById('game-container');
    const basket = document.getElementById('basket');
    const scoreText = document.getElementById('score-text');
    const inkScreen = document.getElementById('ink-screen');
    const sodaBuffBadge = document.getElementById('soda-buff-badge');
    const sodaTimerText = document.getElementById('soda-timer');
    const sodaCooldownBadge = document.getElementById('soda-cooldown-badge');
    const cooldownTimerText = document.getElementById('cooldown-timer');
    const lifeText = document.getElementById('life-text');
    const gameoverScreen = document.getElementById('gameover-screen');
    const finalScoreText = document.getElementById('final-score');

    const MAX_LIVES = 3;
    let lives = MAX_LIVES;
    let isGameOver = false;
    let gameOverAt = 0;

    let score = 0;
    let basketRatio = 0.5; // 0.0 ~ 1.0 상대 위치 비율
    let keys = { left: false, right: false };

    const healthyFoods = ['🍎', '🥦', '🥛', '🍌', '🥕', '🥑', '🍓'];
    const junkFoods = ['🍔', '🍟', '🍕', '🌭', '🍩'];

    let items = [];
    let isSodaActive = false;
    let sodaDuration = 0;
    let isSodaCooldown = false;
    let sodaCooldownDuration = 0;

    let isBasketUpgraded = false;
    let lastSpawnTime = 0;
    let lastFrameTime = performance.now();

    // 키보드 입력 핸들러
    window.addEventListener('keydown', (e) => {
      initAudio();
      // 스페이스바로 재시작 (페이지 스크롤 방지)
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
        tryRestart();
        return;
      }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    });

    // 버튼 컨트롤
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');

    const bindButtonEvents = (btn, dir) => {
      const start = (e) => { e.preventDefault(); initAudio(); keys[dir] = true; };
      const end = (e) => { e.preventDefault(); keys[dir] = false; };
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('mouseleave', end);
      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', end, { passive: false });
    };

    bindButtonEvents(btnLeft, 'left');
    bindButtonEvents(btnRight, 'right');

    // 모바일 터치 드래그 및 마우스 직접 드래그 이동
    let isDragging = false;
    const handleTouchMove = (e) => {
      initAudio();
      const rect = container.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const relativeX = clientX - rect.left;
      basketRatio = Math.max(0, Math.min(1, relativeX / rect.width));
    };

    container.addEventListener('touchstart', (e) => { isDragging = true; handleTouchMove(e); }, { passive: true });
    container.addEventListener('touchmove', (e) => { if (isDragging) handleTouchMove(e); }, { passive: true });
    container.addEventListener('touchend', () => { isDragging = false; });
    container.addEventListener('mousedown', (e) => { isDragging = true; handleTouchMove(e); });
    window.addEventListener('mousemove', (e) => { if (isDragging) handleTouchMove(e); });
    window.addEventListener('mouseup', () => { isDragging = false; });

    function spawnItem() {
      const itemEl = document.createElement('div');
      itemEl.className = 'falling-item';

      const rand = Math.random();
      let type = 'healthy';
      let emoji = '';

      if (rand < 0.12 && !isSodaCooldown && !isSodaActive) {
        type = 'soda';
        emoji = '🥤';
      } else if (rand < 0.27) {
        type = 'squid';
        emoji = '🦑';
      } else if (rand < 0.52) {
        type = 'junk';
        emoji = junkFoods[Math.floor(Math.random() * junkFoods.length)];
      } else {
        type = 'healthy';
        emoji = healthyFoods[Math.floor(Math.random() * healthyFoods.length)];
      }

      itemEl.innerText = emoji;

      const containerWidth = container.clientWidth;
      const startX = Math.random() * (containerWidth - 60);
      const startY = -50;

      // 탄산음료 버스트 모드일 때 스피디하게 낙하
      const baseSpeed = isSodaActive ? (Math.random() * 8 + 14) : (Math.random() * 3.5 + 4.5);

      itemEl.style.transform = `translate(${startX}px, ${startY}px)`;
      container.appendChild(itemEl);

      items.push({
        element: itemEl,
        x: startX,
        y: startY,
        speed: baseSpeed,
        type: type
      });
    }

    function createScorePopup(x, y, text, isPositive) {
      const popup = document.createElement('div');
      popup.className = 'score-popup';
      popup.innerText = text;
      popup.style.color = isPositive ? '#15803d' : '#dc2626';
      popup.style.left = `${x}px`;
      popup.style.top = `${y}px`;
      container.appendChild(popup);

      setTimeout(() => popup.remove(), 700);
    }

    // 목숨 표시 갱신
    function updateLives() {
      lifeText.innerText = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, MAX_LIVES - lives));
    }

    // 탄산음료 버프/쿨다운 초기화
    function resetSodaState() {
      isSodaActive = false;
      sodaDuration = 0;
      isSodaCooldown = false;
      sodaCooldownDuration = 0;
      sodaBuffBadge.classList.add('hidden');
      sodaCooldownBadge.classList.add('hidden');
      container.classList.remove('speed-boost-border');
    }

    // 떨어지는 아이템 전부 정리
    function clearItems() {
      for (const item of items) {
        item.element.remove();
      }
      items = [];
    }

    function loseLife() {
      lives -= 1;
      updateLives();
      if (lives <= 0) {
        lives = 0;
        updateLives();
        endGame();
      }
    }

    function endGame() {
      if (isGameOver) return;
      isGameOver = true;
      gameOverAt = performance.now();
      clearItems();
      resetSodaState();
      inkScreen.classList.remove('active');
      finalScoreText.innerText = score;
      gameoverScreen.classList.add('active');
    }

    function restartGame() {
      clearItems();
      resetSodaState();
      inkScreen.classList.remove('active');
      gameoverScreen.classList.remove('active');

      score = 0;
      lives = MAX_LIVES;
      basketRatio = 0.5;
      keys.left = false;
      keys.right = false;
      isBasketUpgraded = false;
      basket.innerText = '🧺';
      scoreText.innerText = score;
      updateLives();

      lastFrameTime = performance.now();
      lastSpawnTime = lastFrameTime;
      isGameOver = false;
    }

    function tryRestart() {
      if (!isGameOver) return;
      // 게임 오버 직후의 입력으로 바로 재시작되는 것 방지
      if (performance.now() - gameOverAt < 600) return;
      restartGame();
    }

    gameoverScreen.addEventListener('click', tryRestart);
    gameoverScreen.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); tryRestart(); }, { passive: false });

    function gameLoop(now) {
      const dt = (now - lastFrameTime) / 1000;
      lastFrameTime = now;

      // 게임 오버 상태에서는 아이템 생성/이동 정지
      if (isGameOver) {
        requestAnimationFrame(gameLoop);
        return;
      }

      const containerWidth = container.clientWidth;
      const containerHeight = container.clientHeight;
      const basketWidth = basket.clientWidth || 60;

      // 키보드 이동 비율 업데이트
      const step = (550 / containerWidth) * dt;
      if (keys.left) basketRatio -= step;
      if (keys.right) basketRatio += step;
      basketRatio = Math.max(0, Math.min(1, basketRatio));

      // 화면에 맞춰 바구니 위치 배치
      const basketX = basketRatio * (containerWidth - basketWidth);
      basket.style.transform = `translateX(${basketX}px)`;

      // 탄산음료 타이머 관리
      if (isSodaActive) {
        sodaDuration -= dt;
        sodaTimerText.innerText = `${Math.max(0, sodaDuration).toFixed(1)}s`;
        if (sodaDuration <= 0) {
          isSodaActive = false;
          sodaBuffBadge.classList.add('hidden');
          container.classList.remove('speed-boost-border');
        }
      }

      if (isSodaCooldown) {
        sodaCooldownDuration -= dt;
        cooldownTimerText.innerText = `${Math.ceil(Math.max(0, sodaCooldownDuration))}s`;
        if (sodaCooldownDuration <= 0) {
          isSodaCooldown = false;
          sodaCooldownBadge.classList.add('hidden');
        }
      }

      // 아이템 생성
      const spawnInterval = isSodaActive ? 160 : 600;
      if (now - lastSpawnTime > spawnInterval) {
        spawnItem();
        lastSpawnTime = now;
      }

      // 낙하 및 충돌 감지
      const basketY = containerHeight - (basket.clientHeight || 70) - 10;

      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += item.speed;
        item.element.style.transform = `translate(${item.x}px, ${item.y}px)`;

        // 유동적 비율 기준 충돌 판정
        if (
          item.y >= basketY - 30 &&
          item.y <= basketY + 30 &&
          item.x >= basketX - 30 &&
          item.x <= basketX + basketWidth - 10
        ) {
          handleCollision(item);
          // 게임 오버가 되면 아이템 목록이 비워지므로 즉시 루프 종료
          if (isGameOver) break;
          item.element.remove();
          items.splice(i, 1);
          continue;
        }

        if (item.y > containerHeight + 30) {
          item.element.remove();
          items.splice(i, 1);
        }
      }

      requestAnimationFrame(gameLoop);
    }

    function handleCollision(item) {
      if (item.type === 'healthy') {
        score += 10;
        playSound('catch');
        createScorePopup(item.x, item.y, '+10', true);
      } 
      else if (item.type === 'junk') {
        score = Math.max(0, score - 20);
        playSound('junk');
        createScorePopup(item.x, item.y, '-20', false);
        loseLife();
      }
      else if (item.type === 'squid') {
        playSound('ink');
        inkScreen.classList.add('active');
        setTimeout(() => inkScreen.classList.remove('active'), 2000);
      } 
      else if (item.type === 'soda') {
        playSound('soda');
        isSodaActive = true;
        sodaDuration = 10.0;
        sodaBuffBadge.classList.remove('hidden');
        container.classList.add('speed-boost-border');

        isSodaCooldown = true;
        sodaCooldownDuration = 50.0;
        sodaCooldownBadge.classList.remove('hidden');
      }

      scoreText.innerText = score;

      // 100점 이상이면 카트(🛒)로 변신, 100점 미만이면 다시 바구니(🧺) 원복
      if (score >= 100 && !isBasketUpgraded) {
        isBasketUpgraded = true;
        basket.innerText = '🛒';
      } else if (score < 100 && isBasketUpgraded) {
        isBasketUpgraded = false;
        basket.innerText = '🧺';
      }
    }

    // 게임 루프 가동
    updateLives();
    requestAnimationFrame(gameLoop);
  </script>
