<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>깡총깡총 토끼 🐰</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: radial-gradient(circle at 50% 0%, #2f6fb0 0%, #17335c 55%, #0c1a2f 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  #stage {
    position: relative;
    height: min(92vh, 680px);
    aspect-ratio: 5 / 7;
    max-width: 100%;
    border-radius: 20px;
    overflow: hidden;
    background: #7ec8e3;
    box-shadow: 0 20px 50px rgba(0,0,0,.55), 0 0 0 4px rgba(255,255,255,.14) inset;
    cursor: pointer;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* ===== HUD ===== */
  #hud {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; gap: 6px; align-items: center;
    padding: 8px 9px;
    font-size: 13px; font-weight: 800;
    pointer-events: none;
    text-shadow: 0 2px 0 rgba(0,0,0,.28);
  }
  .chip {
    background: rgba(0,0,0,.30);
    border: 2px solid rgba(255,255,255,.35);
    border-radius: 999px;
    padding: 4px 9px;
    white-space: nowrap;
    backdrop-filter: blur(3px);
  }
  #chipShield.on { background: rgba(90,180,255,.55); border-color: #cfeaff; }
  #spacer { flex: 1; }
  #muteBtn {
    pointer-events: auto;
    cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 800; color: #fff;
    background: rgba(0,0,0,.30);
    border: 2px solid rgba(255,255,255,.35);
    border-radius: 999px;
    padding: 4px 9px;
  }

  /* ===== 토스트(이벤트 알림) ===== */
  #toast {
    position: absolute; left: 50%; top: 22%;
    transform: translate(-50%, 6px) scale(.85);
    background: rgba(20,20,40,.78);
    border: 3px solid #ffe27a;
    color: #fff;
    font-weight: 900; font-size: 16px;
    padding: 9px 16px;
    border-radius: 14px;
    opacity: 0;
    transition: opacity .18s ease, transform .18s cubic-bezier(.2,1.6,.4,1);
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  /* ===== 오버레이 ===== */
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    padding: 18px;
    text-align: center;
    background: linear-gradient(180deg, rgba(6,18,40,.35) 0%, rgba(6,18,40,.62) 100%);
  }
  .overlay.hide { display: none; }

  .card {
    background: rgba(255,255,255,.94);
    color: #23324a;
    border-radius: 20px;
    padding: 16px 18px 18px;
    box-shadow: 0 14px 30px rgba(0,0,0,.35);
    border: 4px solid #ffd85e;
    max-width: 320px;
    width: 100%;
  }

  h1 {
    margin: 0 0 2px;
    font-size: 30px;
    letter-spacing: -1px;
    color: #ffd85e;
    text-shadow: 0 3px 0 #b5761b, 0 6px 14px rgba(0,0,0,.45);
  }
  .sub { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.5); }

  .howto { font-size: 14px; font-weight: 700; line-height: 1.6; color: #3c4c66; margin: 0; }
  .howto b { color: #e07b00; }

  .bigscore { font-size: 46px; font-weight: 900; color: #ff9f1c; line-height: 1; margin: 2px 0 4px; }
  .medal { font-size: 40px; line-height: 1.1; }
  .medalName { font-size: 15px; font-weight: 900; color: #6b4b12; margin-top: -2px; }
  .regret { font-size: 15px; font-weight: 800; color: #d1495b; margin: 8px 0 2px; line-height: 1.5; }
  .regret.new { color: #12967a; }
  .best { font-size: 13px; font-weight: 800; color: #5a6b85; }

  .btn {
    margin-top: 12px;
    display: inline-block;
    font-family: inherit;
    font-size: 17px; font-weight: 900; color: #55340a;
    background: linear-gradient(180deg, #ffe27a, #ffbe28);
    border: 0; border-bottom: 5px solid #cf8c0d;
    border-radius: 14px;
    padding: 11px 26px;
    cursor: pointer;
  }
  .btn:active { transform: translateY(3px); border-bottom-width: 2px; }

  .blink { animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  .tip { font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.55); }

  @media (max-height: 620px) {
    h1 { font-size: 24px; }
    .card { padding: 12px 14px 14px; }
    .bigscore { font-size: 38px; }
    .medal { font-size: 32px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud">
    <span class="chip" id="chipTime">⏱ 0초</span>
    <span class="chip" id="chipStar">🥕 0</span>
    <span class="chip" id="chipShield">🛡 0</span>
    <span id="spacer"></span>
    <span class="chip" id="chipBest">🏆 0</span>
    <button id="muteBtn" type="button">🔊</button>
  </div>

  <div id="toast"></div>

  <!-- 시작 화면 -->
  <div class="overlay" id="titleScreen">
    <h1>깡총깡총 토끼 🐰</h1>
    <p class="sub">탭 한 번에 깡총! 거대 당근 사이를 쏙!</p>
    <div class="card">
      <p class="howto">
        👆 <b>화면을 톡</b> 치면 위로 깡총!<br>
        ⌨️ <b>스페이스</b> 를 눌러도 깡총!<br>
        🥕 거대 당근을 지날 때마다 <b>+1점</b><br>
        🥕 미니 당근을 먹으면 <b>+3점</b> 과 방패!
      </p>
    </div>
    <button class="btn" id="startBtn" type="button">시작하기</button>
    <div class="tip blink">아무 데나 톡 치면 바로 시작해!</div>
  </div>

  <!-- 게임 오버 화면 -->
  <div class="overlay hide" id="overScreen">
    <h1 id="overTitle">부딪혔다!</h1>
    <div class="card">
      <div class="medal" id="overMedal">🥕</div>
      <div class="medalName" id="overMedalName">아직 메달이 없어</div>
      <div class="bigscore" id="overScore">0</div>
      <div class="best" id="overBest">최고 기록 0개</div>
      <div class="regret" id="overRegret">한 번만 더 해볼까?</div>
    </div>
    <button class="btn" id="againBtn" type="button">다시 하기</button>
    <div class="tip blink">스페이스나 탭 한 번이면 바로 다시!</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* =========================================================
     0. 안전한 저장소
     ========================================================= */
  var STORE_BEST = "flappy-rabbit-best";
  var STORE_MUTE = "flappy-rabbit-mute";

  function loadNum(key, dflt) {
    try {
      var v = window.localStorage.getItem(key);
      if (v === null) return dflt;
      var n = parseInt(v, 10);
      return isNaN(n) ? dflt : n;
    } catch (e) { return dflt; }
  }
  function saveNum(key, val) {
    try { window.localStorage.setItem(key, String(val)); } catch (e) { /* 무시 */ }
  }

  /* =========================================================
     1. DOM
     ========================================================= */
  var stage = document.getElementById("stage");
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var elTime = document.getElementById("chipTime");
  var elStar = document.getElementById("chipStar");
  var elShield = document.getElementById("chipShield");
  var elBest = document.getElementById("chipBest");
  var muteBtn = document.getElementById("muteBtn");
  var toastEl = document.getElementById("toast");
  var titleScreen = document.getElementById("titleScreen");
  var overScreen = document.getElementById("overScreen");
  var overTitle = document.getElementById("overTitle");
  var overMedal = document.getElementById("overMedal");
  var overMedalName = document.getElementById("overMedalName");
  var overScore = document.getElementById("overScore");
  var overBest = document.getElementById("overBest");
  var overRegret = document.getElementById("overRegret");
  var startBtn = document.getElementById("startBtn");
  var againBtn = document.getElementById("againBtn");

  /* =========================================================
     2. 화면 크기 / 좌표계
     기준 세로 600 단위로 그리고, 실제 픽셀에 맞춰 확대한다.
     ========================================================= */
  var BH = 600;          // 기준 높이(게임 단위)
  var BW = 430;          // 기준 너비(비율에 따라 계산됨)
  var S = 1;             // 게임단위 -> CSS픽셀 배율
  var cssW = 430, cssH = 600;

  function resize() {
    var r = stage.getBoundingClientRect();
    cssW = Math.max(120, Math.round(r.width));
    cssH = Math.max(160, Math.round(r.height));
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.round(cssW * dpr);
    cv.height = Math.round(cssH * dpr);
    cv.style.width = cssW + "px";
    cv.style.height = cssH + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = cssH / BH;
    BW = cssW / S;
  }

  if (window.ResizeObserver) {
    var ro = new ResizeObserver(function () { resize(); });
    ro.observe(stage);
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 250); });

  /* =========================================================
     3. 소리 (WebAudio 로 직접 합성)
     ========================================================= */
  var AC = null, master = null, noiseBuf = null;
  var muted = loadNum(STORE_MUTE, 0) === 1;
  muteBtn.textContent = muted ? "🔇" : "🔊";

  function audioReady() {
    if (!AC) {
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return false;
      try {
        AC = new Ctor();
        master = AC.createGain();
        master.gain.value = 0.5;
        master.connect(AC.destination);
      } catch (e) { AC = null; return false; }
    }
    if (AC.state === "suspended" && AC.resume) {
      try { AC.resume(); } catch (e) { /* 무시 */ }
    }
    return true;
  }

  function tone(f, dur, type, vol, delay, f2) {
    if (muted || !AC) return;
    try {
      var t0 = AC.currentTime + (delay || 0);
      var d = dur || 0.14;
      var osc = AC.createOscillator();
      var g = AC.createGain();
      osc.type = type || "square";
      osc.frequency.setValueAtTime(f, t0);
      if (f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + d);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.001, vol || 0.16), t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      osc.connect(g); g.connect(master);
      osc.start(t0);
      osc.stop(t0 + d + 0.05);
    } catch (e) { /* 무시 */ }
  }

  function noiseHit(dur, vol, delay, cutoff) {
    if (muted || !AC) return;
    try {
      if (!noiseBuf) {
        var len = Math.floor(AC.sampleRate * 0.5);
        noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
        var data = noiseBuf.getChannelData(0);
        for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      }
      var t0 = AC.currentTime + (delay || 0);
      var d = dur || 0.2;
      var src = AC.createBufferSource();
      src.buffer = noiseBuf;
      var lp = AC.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.setValueAtTime(cutoff || 1400, t0);
      lp.frequency.exponentialRampToValueAtTime(180, t0 + d);
      var g = AC.createGain();
      g.gain.setValueAtTime(vol || 0.2, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      src.connect(lp); lp.connect(g); g.connect(master);
      src.start(t0);
      src.stop(t0 + d + 0.05);
    } catch (e) { /* 무시 */ }
  }

  var SCALE_NOTES = [523.25, 587.33, 659.25, 698.46, 783.99, 880.0, 987.77, 1046.5, 1174.7, 1318.5];

  function sndHop() { tone(660, 0.09, "triangle", 0.18, 0, 300); noiseHit(0.08, 0.07, 0, 900); }
  function sndScore(combo) {
    var n = SCALE_NOTES[Math.min(combo, SCALE_NOTES.length - 1)];
    tone(n, 0.11, "square", 0.16);
    tone(n * 2, 0.09, "triangle", 0.08, 0.02);
  }
  function sndPerfect(combo) {
    var n = SCALE_NOTES[Math.min(combo, SCALE_NOTES.length - 1)];
    tone(n, 0.09, "square", 0.16);
    tone(n * 1.5, 0.10, "square", 0.13, 0.07);
    tone(n * 2, 0.14, "triangle", 0.12, 0.14);
  }
  function sndStar() {
    tone(880, 0.07, "triangle", 0.16);
    tone(1318, 0.07, "triangle", 0.15, 0.06);
    tone(1760, 0.14, "triangle", 0.13, 0.12);
  }
  function sndRotten() {
    tone(300, 0.12, "sawtooth", 0.2);
    tone(200, 0.18, "sawtooth", 0.2, 0.1, 100);
  }
  function sndShieldGet() {
    tone(392, 0.10, "sine", 0.18);
    tone(523, 0.10, "sine", 0.18, 0.08);
    tone(784, 0.20, "sine", 0.16, 0.16);
  }
  function sndShieldBreak() {
    tone(240, 0.18, "sawtooth", 0.16, 0, 90);
    tone(880, 0.22, "sine", 0.12, 0.02, 300);
    noiseHit(0.22, 0.16, 0, 2400);
  }
  function sndHit() {
    noiseHit(0.28, 0.30, 0, 2200);
    tone(180, 0.22, "square", 0.22, 0, 60);
  }
  function sndFall() { tone(420, 0.55, "sawtooth", 0.16, 0.10, 70); }
  function sndStart() {
    tone(523, 0.10, "square", 0.15, 0.00);
    tone(659, 0.10, "square", 0.15, 0.09);
    tone(784, 0.10, "square", 0.15, 0.18);
    tone(1046, 0.20, "square", 0.15, 0.27);
  }
  function sndEvent() {
    tone(659, 0.10, "triangle", 0.15);
    tone(988, 0.16, "triangle", 0.14, 0.09);
  }
  function sndMedal() {
    tone(523, 0.12, "square", 0.15, 0.00);
    tone(659, 0.12, "square", 0.15, 0.12);
    tone(784, 0.12, "square", 0.15, 0.24);
    tone(1046, 0.30, "square", 0.16, 0.36);
    tone(1318, 0.30, "triangle", 0.12, 0.36);
  }

  muteBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    muted = !muted;
    muteBtn.textContent = muted ? "🔇" : "🔊";
    saveNum(STORE_MUTE, muted ? 1 : 0);
    if (!muted) { audioReady(); tone(880, 0.09, "triangle", 0.15); }
  });

  /* =========================================================
     4. 게임 상태
     ========================================================= */
  var STATE_TITLE = 0, STATE_PLAY = 1, STATE_DYING = 2, STATE_OVER = 3, STATE_PAUSE = 4;
  var STATE_READY = 5;
  var state = STATE_TITLE;
  var nowSec = 0; // 전역 시간

  var best = loadNum(STORE_BEST, 0);
  elBest.textContent = "🏆 " + best;

  var GROUND_H = 84;      // 바닥 높이(게임 단위)
  var PIPE_W = 62;
  var RABBIT_R = 16;

  var rabbit = { x: 120, y: 300, vy: 0, rot: 0, pop: 1, stretch: 1, motion: 0, alive: true, inv: 0 };
  var pipes = [];
  var stars = [];
  var parts = [];
  var floats = [];

  var score = 0, combo = 0, bestCombo = 0, starCount = 0, riskStars = 0, shields = 0, passed = 0;
  var spurtWarned = false;
  var runTime = 0, groundX = 0, shake = 0, hitStop = 0, flashWhite = 0, overWait = 0;
  var eventIdx = 0, extraSpeed = 0, windOn = false, starBoost = false, themeIdx = 0;
  var themeMix = 0, themeFrom = 0, themeTo = 0;
  var newRecord = false;
  var spawnedTotal = 0;

  // t(초) 또는 p(통과한 파이프 수) 중 먼저 오는 쪽으로 발동한다.
  var EVENTS = [
    { t: 8,  p: 3,  msg: "🌇 농장에 노을이 져!", act: function () { setTheme(1); } },
    { t: 16, p: 6,  msg: "🌬️ 바람이 불어! 거대 당근이 흔들려!", act: function () { windOn = true; } },
    { t: 30, p: 10, msg: "🌙 농장의 밤이야! 당근이 더 빛나!", act: function () { setTheme(2); starBoost = true; } },
    { t: 46, p: 16, msg: "🌅 꼬끼오~! 아침이다! 조금 빨라져!", act: function () { setTheme(0); extraSpeed += 8; } },
    { t: 62, p: 24, msg: "⚡ 멧돼지 출몰! 초고속 모드!", act: function () { setTheme(1); extraSpeed += 12; } },
    { t: 78, p: 32, msg: "⚡⚡ 앗, 더 빨라진다!", act: function () { setTheme(0); extraSpeed += 12; } }
  ];

  var THEMES = [
    { skyTop: [100, 190, 235], skyBot: [200, 240, 255], hill: [173, 204, 102], hill2: [133, 178, 74],
      pipe: [193, 142, 92], pipeDark: [143, 94, 54], ground: [219, 186, 137], groundDark: [176, 142, 97], night: 0 },
    { skyTop: [255, 140, 100], skyBot: [255, 210, 140], hill: [190, 140, 70], hill2: [160, 100, 50],
      pipe: [165, 110, 65], pipeDark: [120, 75, 40], ground: [180, 140, 100], groundDark: [140, 100, 65], night: 0 },
    { skyTop: [20, 30, 80], skyBot: [60, 75, 140], hill: [45, 65, 55], hill2: [35, 50, 40],
      pipe: [75, 60, 55], pipeDark: [50, 40, 35], ground: [65, 55, 60], groundDark: [45, 35, 40], night: 1 }
  ];

  function setTheme(i) {
    themeFrom = themeIdx;
    themeTo = i;
    themeIdx = i;
    themeMix = 0;
  }

  var clouds = [];
  var nightStars = [];
  function buildDecor() {
    clouds.length = 0;
    for (var i = 0; i < 6; i++) {
      clouds.push({
        x: Math.random() * 500,
        y: 50 + Math.random() * 220,
        s: 0.55 + Math.random() * 0.8,
        sp: 8 + Math.random() * 14
      });
    }
    nightStars.length = 0;
    for (var j = 0; j < 34; j++) {
      nightStars.push({ x: Math.random(), y: Math.random() * 0.62, r: 0.7 + Math.random() * 1.5, tw: Math.random() * 6.28 });
    }
  }
  buildDecor();

  /* =========================================================
     5. 난이도 (처음 5개는 확실히 쉽게)
     ========================================================= */
  function pipeSpeed() {
    var s = 150 + Math.min(passed, 45) * 2.1 + extraSpeed;
    return s;
  }
  function gapHeight() {
    if (passed < 5) return 236;
    var g = 236 - (passed - 5) * 2.4;
    return Math.max(152, g);
  }
  function pipeSpacing() {
    if (passed < 5) return 345;
    return Math.max(258, 345 - (passed - 5) * 2.0);
  }

  /* =========================================================
     6. 시작 / 리셋
     ========================================================= */
  var toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1900);
  }

  function resetRun() {
    pipes.length = 0;
    stars.length = 0;
    parts.length = 0;
    floats.length = 0;

    rabbit.x = Math.max(90, BW * 0.28);
    rabbit.y = BH * 0.42;
    rabbit.vy = 0;            
    rabbit.rot = 0;
    rabbit.pop = 1;
    rabbit.stretch = 1;
    rabbit.motion = 0;
    rabbit.alive = true;
    rabbit.inv = 0;

    score = 0; combo = 0; bestCombo = 0; starCount = 0; riskStars = 0; shields = 0; passed = 0;
    runTime = 0; shake = 0; hitStop = 0; flashWhite = 0; overWait = 0;
    eventIdx = 0; extraSpeed = 0; windOn = false; starBoost = false;
    spawnedTotal = 0;
    update.extraSteps = 0;
    newRecord = false; spurtWarned = false;
    themeIdx = 0; themeFrom = 0; themeTo = 0; themeMix = 1;

    // 첫 파이프: 아주 여유롭게 (약 2.3초 뒤 첫 성공)
    spawnPipe(BW + 30, BH * 0.42);
    updateHud();
  }

  var lastStartAt = -9;
  function startGame() {
    if (nowSec - lastStartAt < 0.3) return;
    lastStartAt = nowSec;
    audioReady();
    resetRun();
    state = STATE_READY;    
    titleScreen.classList.add("hide");
    overScreen.classList.add("hide");
    sndStart();
    toast("준비! 톡 치면 출발! 🐰");
  }

  /* =========================================================
     7. 파이프 / 별 만들기
     ========================================================= */
  function spawnPipe(x, forceY) {
    var gh = gapHeight();
    var groundY = BH - GROUND_H;
    var minY = gh / 2 + 54;
    var maxY = groundY - gh / 2 - 26;
    if (maxY < minY) maxY = minY;

    var y;
    if (typeof forceY === "number") {
      y = forceY;
    } else if (spawnedTotal < 3) {
      // 처음엔 토끼 근처에 부드럽게
      y = rabbit.y + (Math.random() * 60 - 30);
    } else {
      y = minY + Math.random() * (maxY - minY);
    }
    y = Math.max(minY, Math.min(maxY, y));

    var amp = 0;
    if (windOn && spawnedTotal > 5 && Math.random() < 0.5) {
      amp = 18 + Math.random() * 22;
      var room = Math.min(y - minY, maxY - y);
      amp = Math.min(amp, Math.max(0, room));
    }

    var p = {
      x: x, baseY: y, y: y, gap: gh, amp: amp,
      phase: Math.random() * 6.28, scored: false, w: PIPE_W
    };
    pipes.push(p);
    spawnedTotal++;

    // 별: 위험 보상 — 가끔 틈 가장자리에 붙어서 나온다
    var chance = starBoost ? 0.62 : 0.42;
    if (spawnedTotal > 2 && Math.random() < chance) {
      var edge = Math.random() < 0.72 ? (Math.random() < 0.5 ? -1 : 1) : 0;
      var off = edge * (gh / 2 - 26);
      var isRotten = Math.random() < 0.25; // 25% 확률로 썩은 당근 등장
      stars.push({
        pipe: p, off: off, x: x + PIPE_W * 0.5, y: y + off,
        got: false, spin: Math.random() * 6.28, edge: (edge !== 0), rotten: isRotten
      });
    }
    return p;
  }

  /* =========================================================
     8. 파티클 / 떠오르는 숫자
     ========================================================= */
  function burst(x, y, n, colors, spd, life) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var v = spd * (0.35 + Math.random() * 0.9);
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30,
        r: 2.2 + Math.random() * 3.6,
        life: life, max: life,
        c: colors[(Math.random() * colors.length) | 0],
        g: 260 + Math.random() * 200
      });
    }
  }
  function floatText(x, y, text, color, size) {
    floats.push({ x: x, y: y, t: text, c: color, s: size || 22, life: 0.95, max: 0.95, vy: -70 });
  }

  /* =========================================================
     9. 입력
     ========================================================= */
  function hop() {
    rabbit.vy = -430;
    rabbit.motion = 1;
    rabbit.pop = 1.34;
    rabbit.stretch = 1.18;   // 위로 솟구치며 약간 길어짐
    rabbit.rot = -0.45;
    sndHop();
    burst(rabbit.x - 10, rabbit.y + 8, 9, ["#fff6d0", "#ffe27a", "#ffffff"], 150, 0.5);
    burst(rabbit.x - 16, rabbit.y + 12, 4, ["#ffffff", "#e8f4ff"], 60, 0.35);
    if (!muted && navigator.vibrate) {
      try { navigator.vibrate(8); } catch (e) { /* 무시 */ }
    }
  }

  function pressAction() {
    if (state === STATE_TITLE) {
      startGame();
      return;
    }
    if (state === STATE_READY) {
      audioReady();
      state = STATE_PLAY;
      hop();
      return;
    }
    if (state === STATE_PLAY) {
      audioReady();
      hop();
      return;
    }
    if (state === STATE_PAUSE) {
      state = STATE_PLAY;
      toast("계속 가자! 🐰");
      return;
    }
    if (state === STATE_OVER) {
      if (overWait <= 0) startGame();
      return;
    }
  }

  stage.addEventListener("pointerdown", function (e) {
    var t = e.target;
    while (t && t !== stage) {
      if (t.tagName === "BUTTON") return;
      t = t.parentNode;
    }
    e.preventDefault();
    audioReady();
    pressAction();
  });

  window.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === " " || k === "Spacebar" || k === "ArrowUp" || k === "ArrowDown" ||
        k === "ArrowLeft" || k === "ArrowRight" || k === "Enter") {
      e.preventDefault();
    }
    if (k === " " || k === "Spacebar" || k === "ArrowUp" || k === "Enter" || k === "w" || k === "W") {
      if (e.repeat) return;
      audioReady();
      pressAction();
    }
    if (k === "m" || k === "M") muteBtn.click();
  }, { passive: false });

  startBtn.addEventListener("click", function (e) { e.stopPropagation(); audioReady(); startGame(); });
  againBtn.addEventListener("click", function (e) {
    e.stopPropagation(); audioReady();
    if (overWait <= 0) startGame();
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden && state === STATE_PLAY) state = STATE_PAUSE;
  });

  /* =========================================================
     10. 충돌 및 데미지 로직
     ========================================================= */
  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    var nx = Math.max(rx, Math.min(cx, rx + rw));
    var ny = Math.max(ry, Math.min(cy, ry + rh));
    var dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function loseShield() {
    shields--;
    rabbit.inv = 1.3;
    rabbit.vy = -430;
    shake = 16;
    hitStop = 0.09;
    flashWhite = 0.5;
    sndShieldBreak();
    burst(rabbit.x, rabbit.y, 26, ["#bfe9ff", "#7fd0ff", "#ffffff", "#4fa8e0"], 240, 0.7);
    floatText(rabbit.x, rabbit.y - 34, "방패가 막았어!", "#3fa8ff", 20);
    combo = 0;
    updateHud();
  }

  function die() {
    if (!rabbit.alive) return;
    rabbit.alive = false;
    state = STATE_DYING;
    if (rabbit.vy < -140) rabbit.vy = -140; // 치솟는 중이었어도 하강 유도
    shake = 22;
    hitStop = 0.10;
    flashWhite = 0.8;
    sndHit();
    sndFall();
    burst(rabbit.x, rabbit.y, 30, ["#ffd85e", "#ff9f1c", "#ffffff", "#ff6b6b"], 260, 0.85);
  }

  /* =========================================================
     11. 게임 오버 화면 업데이트
     ========================================================= */
  function medalOf(sc) {
    if (sc >= 40) return { icon: "🌈", name: "무지개 메달! 전설의 토끼!" };
    if (sc >= 25) return { icon: "🥇", name: "금메달! 정말 대단해!" };
    if (sc >= 12) return { icon: "🥈", name: "은메달! 아주 잘했어!" };
    if (sc >= 5) return { icon: "🥉", name: "동메달! 좋았어!" };
    return { icon: "🥕", name: "아직 메달이 없어. 5점만 넘겨봐!" };
  }

  function showOver() {
    state = STATE_OVER;
    overWait = 0.20;

    var m = medalOf(score);
    overMedal.textContent = m.icon;
    overMedalName.textContent = m.name;
    overScore.textContent = score + "점";

    if (score > best) {
      best = score;
      saveNum(STORE_BEST, best);
      newRecord = true;
    }
    elBest.textContent = "🏆 " + best;
    overBest.textContent = "거대 당근 " + passed + "개 · 당근 " + starCount + "개 · 완벽 " +
                           bestCombo + "연속 · 최고 " + best + "점";

    overRegret.classList.remove("new");
    if (newRecord) {
      overTitle.textContent = "신기록이다! 🎉";
      overRegret.classList.add("new");
      overRegret.textContent = "우와! 최고 기록을 갈아치웠어!";
      sndMedal();
    } else {
      overTitle.textContent = "부딪혔다!";
      var diff = best - score;
      if (diff <= 0) {
        overRegret.textContent = "최고 기록이랑 똑같아! 1점만 더!";
      } else if (diff <= 3) {
        overRegret.textContent = "아깝다! 최고 기록까지 " + diff + "점!";
      } else if (diff <= 8) {
        overRegret.textContent = "조금만 더! 최고 기록까지 " + diff + "점 남았어!";
      } else {
        overRegret.textContent = "최고 기록까지 " + diff + "점! 다시 가보자!";
      }
      if (score >= 5) sndMedal();
    }
    overScreen.classList.remove("hide");
  }

  /* =========================================================
     12. HUD 디스플레이 갱신
     ========================================================= */
  var hudCache = { t: -1, s: -1, sh: -1 };
  function updateHud() {
    var sec = Math.floor(runTime);
    if (sec !== hudCache.t) { hudCache.t = sec; elTime.textContent = "⏱ " + sec + "초"; }
    if (starCount !== hudCache.s) { hudCache.s = starCount; elStar.textContent = "🥕 " + starCount; }
    if (shields !== hudCache.sh) {
      hudCache.sh = shields;
      elShield.textContent = "🛡 " + shields;
      if (shields > 0) elShield.classList.add("on");
      else elShield.classList.remove("on");
    }
  }

  /* =========================================================
     13. 물리 업데이트 및 상태 제어
     ========================================================= */
  function update(dt) {
    if (shake > 0) shake = Math.max(0, shake - dt * 55);
    if (flashWhite > 0) flashWhite = Math.max(0, flashWhite - dt * 2.6);
    if (themeMix < 1) themeMix = Math.min(1, themeMix + dt * 1.2);
    
    // 토끼 형태(부피감, 늘어남) 복원 로직
    rabbit.pop += (1 - rabbit.pop) * Math.min(1, dt * 9);
    rabbit.stretch += (1 - rabbit.stretch) * Math.min(1, dt * 15);
    rabbit.motion = Math.max(0, rabbit.motion - dt * 3.4);

    var i;
    for (i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    for (i = floats.length - 1; i >= 0; i--) {
      var f = floats[i];
      f.life -= dt;
      if (f.life <= 0) { floats.splice(i, 1); continue; }
      f.y += f.vy * dt;
      f.vy += 40 * dt;
    }

    if (state === STATE_TITLE) {
      rabbit.x = BW * 0.5;
      rabbit.y = BH * 0.44 + Math.sin(nowSec * 2.4) * 12;
      rabbit.rot = Math.sin(nowSec * 2.4) * 0.18;
      groundX -= 60 * dt;
      moveClouds(dt, 1);
      return;
    }

    if (state === STATE_READY) {
      rabbit.y = BH * 0.42 + Math.sin(nowSec * 3) * 6;
      rabbit.vy = 0;
      rabbit.rot = 0;
      groundX -= 60 * dt;
      moveClouds(dt, 1);
      return;
    }

    if (state === STATE_PAUSE || state === STATE_OVER) {
      if (overWait > 0) overWait = Math.max(0, overWait - dt);
      moveClouds(dt, 0.3);
      return;
    }

    if (hitStop > 0) { hitStop -= dt; return; }

    if (state === STATE_DYING) {
      rabbit.vy += 1500 * dt;
      rabbit.y += rabbit.vy * dt;
      rabbit.rot = Math.min(1.6, rabbit.rot + dt * 4.2);
      var floorY = BH - GROUND_H - RABBIT_R;
      if (rabbit.y >= floorY) {
        rabbit.y = floorY;
        burst(rabbit.x, rabbit.y + 10, 14, ["#e2c882", "#c9a95f", "#fff"], 160, 0.5);
        shake = Math.max(shake, 10);
        showOver();
      }
      return;
    }

    /* ---- 실제 플레이 ---- */
    runTime += dt;
    if (rabbit.inv > 0) rabbit.inv -= dt;

    while (eventIdx < EVENTS.length &&
           (runTime >= EVENTS[eventIdx].t || passed >= EVENTS[eventIdx].p)) {
      var ev = EVENTS[eventIdx];
      ev.act();
      toast(ev.msg);
      sndEvent();
      shake = Math.max(shake, 8);
      eventIdx++;
    }
    if (eventIdx >= EVENTS.length) {
      var lastT = EVENTS[EVENTS.length - 1].t;
      var steps = Math.floor((runTime - lastT) / 16);
      if (steps > 0 && steps > (update.extraSteps || 0)) {
        update.extraSteps = steps;
        extraSpeed += 8;
        toast("⚡ 더더 빨라진다!");
        sndEvent();
      }
    }

    rabbit.vy += 1500 * dt;
    if (rabbit.vy > 720) rabbit.vy = 720;
    rabbit.y += rabbit.vy * dt;
    rabbit.rot = Math.max(-0.55, Math.min(1.5, rabbit.vy / 520));
    rabbit.x += (Math.max(90, BW * 0.28) - rabbit.x) * Math.min(1, dt * 5);

    if (rabbit.y < RABBIT_R + 4) { rabbit.y = RABBIT_R + 4; if (rabbit.vy < 0) rabbit.vy = 0; }

    var spd = pipeSpeed();
    groundX -= spd * dt;
    moveClouds(dt, 1);

    var groundY = BH - GROUND_H;
    for (i = pipes.length - 1; i >= 0; i--) {
      var pp = pipes[i];
      pp.x -= spd * dt;
      if (pp.amp > 0) pp.y = pp.baseY + Math.sin(runTime * 1.15 + pp.phase) * pp.amp;
      else pp.y = pp.baseY;

      if (!pp.scored && pp.x + pp.w < rabbit.x) {
        pp.scored = true;
        passed++;
        var dist = Math.abs(rabbit.y - pp.y);
        var perfect = dist < pp.gap * 0.19;
        if (perfect) {
          combo++;
          if (combo > bestCombo) bestCombo = combo;
          score += 2;
          sndPerfect(combo);
          floatText(rabbit.x + 26, rabbit.y - 30, "완벽! +2", "#ffe27a", 22);
          burst(pp.x + pp.w * 0.5, pp.y, 16, ["#ffe27a", "#fff", "#ffb703"], 190, 0.6);
          shake = Math.max(shake, 9);
        } else {
          combo = 0;
          score += 1;
          sndScore(Math.min(7, passed % 8));
          floatText(rabbit.x + 26, rabbit.y - 30, "+1", "#ffffff", 20);
          burst(pp.x + pp.w * 0.5, pp.y, 8, ["#ffffff", "#cfeaff"], 130, 0.45);
          shake = Math.max(shake, 5);
        }
        rabbit.pop = 1.3;
        hitStop = perfect ? 0.075 : 0.045;
        updateHud();
      }
      if (pp.x + pp.w < -30) pipes.splice(i, 1);
    }

    for (i = stars.length - 1; i >= 0; i--) {
      var st = stars[i];
      st.x = st.pipe.x + st.pipe.w * 0.5;
      st.y = st.pipe.y + st.off;
      st.spin += dt * 3.2;
      if (!st.got) {
        var ddx = st.x - rabbit.x, ddy = st.y - rabbit.y;
        if (ddx * ddx + ddy * ddy < (RABBIT_R + 15) * (RABBIT_R + 15)) {
          st.got = true;
          if (st.rotten) {
            score = Math.max(0, score - 4);
            sndRotten();
            floatText(st.x, st.y - 16, "윽! -4", "#d1495b", 22);
            burst(st.x, st.y, 18, ["#8b5a2b", "#556b2f", "#4a4a4a"], 200, 0.6);
            shake = Math.max(shake, 12);
            hitStop = 0.06;
            rabbit.pop = 0.7; // 썩은 걸 먹고 움츠러듦
          } else {
            starCount++;
            score += 3;
            sndStar();
            floatText(st.x, st.y - 16, "당근! +3", "#ff8c00", 22);
            burst(st.x, st.y, 18, ["#ff8c00", "#32cd32", "#ffffff"], 200, 0.6);
            shake = Math.max(shake, 8);
            hitStop = 0.05;
            rabbit.pop = 1.32;
            if (starCount % 4 === 0 && shields < 2) {
              shields++;
              sndShieldGet();
              floatText(rabbit.x, rabbit.y - 56, "방패 얻었다! 🛡", "#3fa8ff", 20);
              toast("🛡 방패를 얻었어! 한 번은 살아나!");
            }
          }
          updateHud();
        }
      }
      if (st.x < -40) stars.splice(i, 1);
    }

    var lastX = -9999;
    for (i = 0; i < pipes.length; i++) if (pipes[i].x > lastX) lastX = pipes[i].x;
    if (lastX < BW - pipeSpacing()) spawnPipe(BW + 10);

    var hit = false;
    for (i = 0; i < pipes.length; i++) {
      var q = pipes[i];
      // 완전히 벗어나면 충돌 검사 스킵
      if (q.x > rabbit.x + RABBIT_R + 8 || q.x + q.w < rabbit.x - RABBIT_R - 8) continue;
      
      var topH = q.y - q.gap / 2;
      var botY = q.y + q.gap / 2;
      if (circleRect(rabbit.x, rabbit.y, RABBIT_R * 0.75, q.x, 0, q.w, topH) ||
          circleRect(rabbit.x, rabbit.y, RABBIT_R * 0.75, q.x, botY, q.w, groundY - botY)) {
        hit = true; break;
      }
    }
    // 바닥 충돌 판정
    if (rabbit.y >= groundY - RABBIT_R) { rabbit.y = groundY - RABBIT_R; hit = true; }

    if (hit && rabbit.inv <= 0) {
      if (shields > 0) loseShield();
      else die();
    }
  }

  /* =========================================================
     14. 테마 및 배경 이동
     ========================================================= */
  function moveClouds(dt, mult) {
    var spd = pipeSpeed() * 0.15 * mult;
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      c.x -= c.sp * mult * dt * 4;
      if (c.x < -100) {
        c.x = BW + 50 + Math.random() * 50;
        c.y = 50 + Math.random() * 220;
      }
    }
  }

  function lerp(a, b, t) { return a + (b - a) * t; }
  function lerpColor(c1, c2, t) {
    return [
      Math.round(lerp(c1[0], c2[0], t)),
      Math.round(lerp(c1[1], c2[1], t)),
      Math.round(lerp(c1[2], c2[2], t))
    ];
  }
  function rgb(arr) { return "rgb(" + arr[0] + "," + arr[1] + "," + arr[2] + ")"; }

  function getCurrentTheme() {
    if (themeMix >= 1) return THEMES[themeIdx];
    var t1 = THEMES[themeFrom], t2 = THEMES[themeTo];
    return {
      skyTop: lerpColor(t1.skyTop, t2.skyTop, themeMix),
      skyBot: lerpColor(t1.skyBot, t2.skyBot, themeMix),
      hill: lerpColor(t1.hill, t2.hill, themeMix),
      hill2: lerpColor(t1.hill2, t2.hill2, themeMix),
      pipe: lerpColor(t1.pipe, t2.pipe, themeMix),
      pipeDark: lerpColor(t1.pipeDark, t2.pipeDark, themeMix),
      ground: lerpColor(t1.ground, t2.ground, themeMix),
      groundDark: lerpColor(t1.groundDark, t2.groundDark, themeMix),
      night: lerp(t1.night, t2.night, themeMix)
    };
  }

  /* =========================================================
     15. 화면 그리기 (Render)
     ========================================================= */
  function draw() {
    ctx.clearRect(0, 0, cssW, cssH);
    ctx.save();
    
    // 화면 흔들림 효과
    if (shake > 0) {
      var amt = shake;
      ctx.translate((Math.random() - 0.5) * amt, (Math.random() - 0.5) * amt);
    }
    
    // 게임 내부 해상도 적용
    ctx.scale(S, S);
    var th = getCurrentTheme();
    var groundY = BH - GROUND_H;
    
    // 하늘 배경
    var grd = ctx.createLinearGradient(0, 0, 0, BH);
    grd.addColorStop(0, rgb(th.skyTop));
    grd.addColorStop(1, rgb(th.skyBot));
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, BW, BH);

    // 야간 모드일 때 별자리 표시
    if (th.night > 0.01) {
      ctx.fillStyle = "rgba(255,255,255," + th.night + ")";
      for (var i = 0; i < nightStars.length; i++) {
        var ns = nightStars[i];
        var a = Math.abs(Math.sin(runTime * 2 + ns.tw));
        ctx.globalAlpha = th.night * (0.3 + 0.7 * a);
        ctx.beginPath();
        ctx.arc(ns.x * BW, ns.y * BH, ns.r, 0, 7);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // 구름 렌더링
    ctx.fillStyle = "rgba(255,255,255," + (0.7 - th.night * 0.4) + ")";
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      ctx.beginPath();
      ctx.arc(c.x, c.y, 20 * c.s, 0, 7);
      ctx.arc(c.x + 18 * c.s, c.y - 10 * c.s, 24 * c.s, 0, 7);
      ctx.arc(c.x + 36 * c.s, c.y, 18 * c.s, 0, 7);
      ctx.fill();
    }

    // 원경 산 (패럴랙스 효과)
    ctx.fillStyle = rgb(th.hill);
    var hOffset = (groundX * 0.3) % 400;
    for(var x = hOffset - 400; x < BW; x += 400) {
      ctx.beginPath();
      ctx.moveTo(x, groundY);
      ctx.lineTo(x + 200, groundY - 120);
      ctx.lineTo(x + 400, groundY);
      ctx.fill();
    }
    
    // 헛간 (농장 배경) 렌더링
    var barnX = (groundX * 0.35) % 600;
    for(var x = barnX - 600; x < BW; x += 600) {
      ctx.save();
      ctx.translate(x + 300, groundY);
      // 헛간 몸통
      ctx.fillStyle = th.night > 0.5 ? "#521" : "#b33";
      ctx.fillRect(-35, -60, 70, 60);
      // 지붕
      ctx.fillStyle = th.night > 0.5 ? "#222" : "#555";
      ctx.beginPath(); ctx.moveTo(-40, -60); ctx.lineTo(0, -95); ctx.lineTo(40, -60); ctx.fill();
      // 지붕 테두리
      ctx.strokeStyle = th.night > 0.5 ? "#444" : "#eee"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-40, -60); ctx.lineTo(0, -95); ctx.lineTo(40, -60); ctx.stroke();
      // 문
      ctx.fillStyle = th.night > 0.5 ? "#111" : "#222";
      ctx.fillRect(-12, -35, 24, 35);
      // 창문
      ctx.fillStyle = th.night > 0.5 ? "#ffcc66" : "#444";
      ctx.fillRect(-8, -80, 16, 12);
      ctx.restore();
    }

    // 근경 산
    ctx.fillStyle = rgb(th.hill2);
    var hOffset2 = (groundX * 0.5) % 300;
    for(var x = hOffset2 - 300; x < BW; x += 300) {
      ctx.beginPath();
      ctx.moveTo(x, groundY);
      ctx.lineTo(x + 150, groundY - 80);
      ctx.lineTo(x + 300, groundY);
      ctx.fill();
    }

    // 농장 울타리 (근경 앞, 기둥 뒤)
    var fenceOff = (groundX * 0.8) % 120;
    ctx.fillStyle = rgb(th.pipeDark); 
    for(var x = fenceOff - 120; x < BW; x += 60) {
      ctx.fillRect(x, groundY - 20, 5, 20);
    }
    ctx.fillRect(0, groundY - 16, BW, 3);
    ctx.fillRect(0, groundY - 8, BW, 3);

    // 거대 당근(기둥) 렌더링
    for (var i = 0; i < pipes.length; i++) {
      var p = pipes[i];
      var topH = p.y - p.gap / 2;
      var botY = p.y + p.gap / 2;
      
      var carrotMain = "#ff8c00"; 
      var carrotDark = "#cc7000";

      // 위쪽 당근 본체
      ctx.fillStyle = carrotMain;
      ctx.fillRect(p.x, 0, p.w, topH);
      ctx.fillStyle = carrotDark;
      ctx.fillRect(p.x + p.w - 12, 0, 12, topH);
      
      // 당근 가로 줄무늬 (텍스처)
      ctx.strokeStyle = carrotDark;
      ctx.lineWidth = 3;
      for (var cy = 30; cy < topH - 20; cy += 45) {
        ctx.beginPath(); ctx.moveTo(p.x + 8, cy); ctx.lineTo(p.x + p.w - 18, cy + 8); ctx.stroke();
      }

      // 위쪽 당근 잘린 단면
      ctx.fillStyle = "#ffddaa"; 
      ctx.beginPath();
      ctx.ellipse(p.x + p.w / 2, topH, p.w / 2 + 2, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = carrotDark; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = "#ffb347";
      ctx.beginPath();
      ctx.ellipse(p.x + p.w / 2, topH, p.w / 4, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // 아래쪽 당근 본체
      ctx.fillStyle = carrotMain;
      ctx.fillRect(p.x, botY, p.w, groundY - botY);
      ctx.fillStyle = carrotDark;
      ctx.fillRect(p.x + p.w - 12, botY, 12, groundY - botY);
      
      // 당근 가로 줄무늬 (텍스처)
      for (var cy = botY + 30; cy < groundY - 20; cy += 45) {
        ctx.beginPath(); ctx.moveTo(p.x + 8, cy); ctx.lineTo(p.x + p.w - 18, cy - 8); ctx.stroke();
      }

      // 아래쪽 당근 잘린 단면
      ctx.fillStyle = "#ffddaa"; 
      ctx.beginPath();
      ctx.ellipse(p.x + p.w / 2, botY, p.w / 2 + 2, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = carrotDark; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = "#ffb347";
      ctx.beginPath();
      ctx.ellipse(p.x + p.w / 2, botY, p.w / 4, 4, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    
    // 획득 가능한 아이템(미니 당근) 렌더링
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      if (st.got) continue;
      ctx.save();
      ctx.translate(st.x, st.y);
      ctx.rotate(Math.sin(st.spin) * 0.4); 
      
      var isRotten = st.rotten;
      var leafColor = isRotten ? "#556b2f" : "#32cd32";
      var bodyColor = isRotten ? "#8b5a2b" : "#ff8c00";
      var strokeColor = isRotten ? "#4a3017" : "#cc7000";

      // 당근 잎
      ctx.fillStyle = leafColor;
      ctx.beginPath();
      ctx.moveTo(0, -4); ctx.lineTo(-10, -16); ctx.lineTo(-3, -14);
      ctx.lineTo(0, -20); ctx.lineTo(3, -14); ctx.lineTo(10, -16);
      ctx.closePath(); ctx.fill();

      // 당근 몸통
      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.arc(0, -2, 7, Math.PI, 0); 
      ctx.lineTo(2, 14); 
      ctx.lineTo(-2, 14);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = strokeColor; ctx.lineWidth = 2; ctx.stroke();
      
      // 썩은 당근 질감 (검은 반점)
      if (isRotten) {
        ctx.fillStyle = "#332211";
        ctx.beginPath(); ctx.arc(-2, 3, 1.5, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(2, 7, 1, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(1, -1, 1.5, 0, 7); ctx.fill();
      }

      ctx.restore();
    }

    // 움직이는 지면(땅)
    var gOff = groundX % 32;
    ctx.fillStyle = rgb(th.groundDark);
    ctx.fillRect(0, groundY, BW, GROUND_H);
    ctx.fillStyle = rgb(th.ground);
    ctx.fillRect(0, groundY, BW, 14);
    ctx.strokeStyle = "#402607"; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, groundY); ctx.lineTo(BW, groundY);
    ctx.stroke();
    // 땅 줄무늬 패턴
    ctx.fillStyle = rgb(th.groundDark);
    ctx.globalAlpha = 0.4;
    for(var x = gOff - 32; x < BW; x += 32) {
      ctx.beginPath();
      ctx.moveTo(x, groundY + 14);
      ctx.lineTo(x - 16, BH);
      ctx.lineTo(x + 6, BH);
      ctx.lineTo(x + 22, groundY + 14);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 메인 캐릭터 (토끼) 렌더링
    ctx.save();
    ctx.translate(rabbit.x, rabbit.y);
    ctx.rotate(rabbit.rot);
    // 점프/하강 시 압축 및 팽창 애니메이션 효과
    ctx.scale(rabbit.pop / rabbit.stretch, rabbit.pop * rabbit.stretch);
    
    // 실드(방패) 이펙트 처리
    if (shields > 0 || (rabbit.inv > 0 && Math.floor(rabbit.inv * 15) % 2 === 0)) {
      ctx.beginPath();
      ctx.arc(0, 0, RABBIT_R + 8 + Math.sin(runTime*10)*2, 0, 7);
      ctx.fillStyle = "rgba(100, 200, 255, 0.4)";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(100, 200, 255, 0.8)";
      ctx.stroke();
    }

    ctx.lineWidth = 3; 
    ctx.strokeStyle = "#222";

    // 꼬리 (뒤쪽)
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(-RABBIT_R, 6, 6, 0, 7); ctx.fill(); ctx.stroke();

    // 귀 (뒤쪽)
    ctx.fillStyle = "#e0e0e0";
    ctx.beginPath(); ctx.ellipse(-2, -RABBIT_R, 4, 12, -0.2, 0, 7); ctx.fill(); ctx.stroke();

    // 몸통
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(0, 0, RABBIT_R, 0, 7); ctx.fill(); ctx.stroke();

    // 귀 (앞쪽)
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.ellipse(4, -RABBIT_R - 2, 4, 12, 0.1, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#ffb6c1"; // 귀 속살
    ctx.beginPath(); ctx.ellipse(4, -RABBIT_R - 2, 1.5, 8, 0.1, 0, 7); ctx.fill();

    // 앞발 / 뒷발 (뛰는 모션)
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    if (rabbit.motion > 0) {
      // 점프 중 (앞발 들고 뒷발 뻗음)
      ctx.ellipse(4, 8, 7, 3, -0.6, 0, 7);
      ctx.ellipse(-4, 12, 6, 3, 0.4, 0, 7);
    } else {
      // 하강 중 (발을 모음)
      ctx.ellipse(2, 12, 6, 3, 0, 0, 7);
      ctx.ellipse(-4, 10, 5, 3, 0.2, 0, 7);
    }
    ctx.fill(); ctx.stroke();

    // 눈
    ctx.fillStyle = "#222";
    ctx.beginPath(); ctx.arc(6, -4, 2.5, 0, 7); ctx.fill();

    // 발그레한 볼터치
    ctx.fillStyle = "rgba(255, 182, 193, 0.6)";
    ctx.beginPath(); ctx.arc(3, 1, 3, 0, 7); ctx.fill();

    // 코
    ctx.fillStyle = "#ff99aa";
    ctx.beginPath(); ctx.arc(14, 0, 2, 0, 7); ctx.fill();
    ctx.restore();

    // 이펙트 파티클
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      ctx.fillStyle = p.c;
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 콤보/점수 같은 플로팅 텍스트
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (var i = 0; i < floats.length; i++) {
      var f = floats[i];
      ctx.globalAlpha = Math.max(0, f.life / f.max);
      ctx.font = "900 " + f.s + "px sans-serif";
      ctx.lineWidth = 4; ctx.strokeStyle = "#000";
      ctx.strokeText(f.t, f.x, f.y);
      ctx.fillStyle = f.c;
      ctx.fillText(f.t, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    // 플래시 타격 효과
    if (flashWhite > 0) {
      ctx.fillStyle = "rgba(255,255,255," + flashWhite + ")";
      ctx.fillRect(0, 0, BW, BH);
    }

    ctx.restore();
  }

  /* =========================================================
     16. 메인 루프 실행
     ========================================================= */
  var lastTime = 0;
  function loop(timestamp) {
    requestAnimationFrame(loop);
    var dt = (timestamp - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1; // 브라우저 백그라운드 전환 등에서 프레임 튀는 현상 방지
    lastTime = timestamp;
    nowSec = timestamp / 1000;

    update(dt);
    draw();
  }
  
  // 브라우저 로딩 완료 시 게임 초기화
  resize();
  lastTime = performance.now();
  requestAnimationFrame(loop);

})();
</script>
