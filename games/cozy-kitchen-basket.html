<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>아기자기 주방 음식 담기 게임 🧺</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Jua', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* 모바일 터치 및 바운스 스크롤 방지 */
        html, body {
            touch-action: none;
            overflow: hidden;
            width: 100%;
            height: 100%;
            position: fixed;
        }

        /* 주방 파스텔 연두색 체크 타일 배경 */
        .kitchen-bg {
            background-color: #d8f3dc;
            background-image: 
                radial-gradient(#b7e4c7 15%, transparent 16%),
                radial-gradient(#b7e4c7 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        /* 식탁 체크무늬 */
        .tablecloth-bg {
            background-color: #f72585;
            background: repeating-linear-gradient(
                45deg,
                #ffb703,
                #ffb703 15px,
                #fb8500 15px,
                #fb8500 30px
            );
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.15);
        }

        /* 피격 시 화면 흔들림 효과 */
        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-8px, 4px) rotate(-2deg); }
            40% { transform: translate(8px, -4px) rotate(2deg); }
            60% { transform: translate(-6px, -2px) rotate(-1deg); }
            80% { transform: translate(6px, 2px) rotate(1deg); }
        }

        .shake-effect {
            animation: shake 0.35s ease-in-out;
        }

        /* 바구니 튕김 애니메이션 */
        @keyframes bounce-basket {
            0% { transform: scale(1, 1); }
            40% { transform: scale(1.2, 0.85); }
            70% { transform: scale(0.95, 1.1); }
            100% { transform: scale(1, 1); }
        }

        .basket-bounce {
            animation: bounce-basket 0.25s ease-out;
        }

        /* 정크푸드 디버프 보라색 글로우 효과 */
        .junk-debuff-glow {
            filter: drop-shadow(0 0 18px rgba(147, 51, 234, 0.95)) hue-rotate(260deg);
        }

        /* 점수 float 팝업 애니메이션 */
        @keyframes float-up {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            50% { opacity: 1; transform: translateY(-40px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-80px) scale(1); }
        }

        .score-popup {
            position: absolute;
            font-size: 1.8rem;
            font-weight: bold;
            pointer-events: none;
            animation: float-up 0.8s forwards ease-out;
            z-index: 50;
            white-space: nowrap;
        }

        /* 거대 망고 글로우 후광 효과 */
        .mango-glow {
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.9));
        }

        /* 하트 애니메이션 */
        @keyframes heart-break {
            0% { transform: scale(1.3); }
            50% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .heart-anim {
            display: inline-block;
            animation: heart-break 0.3s ease-out;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between kitchen-bg relative">

    <!-- 정크푸드 피격 시 빨간/어두운 반짝임 효과 -->
    <div id="dark-overlay" class="absolute inset-0 bg-red-900 opacity-0 pointer-events-none z-40 transition-opacity duration-200"></div>

    <!-- 게임 오버 레이어 모달 -->
    <div id="game-over-modal" class="hidden absolute inset-0 bg-black/70 backdrop-blur-sm z-50 flex flex-col items-center justify-center text-white px-4">
        <div class="bg-white text-gray-800 rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl border-4 border-red-400">
            <div class="text-6xl mb-3 animate-bounce">💔</div>
            <h2 class="text-3xl font-black text-red-600 mb-2">게임 오버!</h2>
            <p class="text-lg font-bold text-gray-600 mb-4">건강한 식습관 완성 실패! 🥗</p>
            
            <div class="bg-amber-50 rounded-2xl p-4 mb-6 border border-amber-200">
                <span class="text-sm text-gray-500 block">최종 점수</span>
                <span id="final-score" class="text-4xl font-extrabold text-amber-500">0</span>
            </div>

            <div class="space-y-3">
                <p class="text-sm text-gray-500 hidden sm:block animate-pulse">
                    [ <span class="font-bold text-emerald-600">스페이스 키</span> ] 를 눌러 다시 시작
                </p>
                <button id="btn-restart" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white text-xl font-bold py-3 rounded-2xl shadow-lg border-2 border-emerald-300 transition-all">
                    🔄 다시 시작하기
                </button>
            </div>
        </div>
    </div>

    <!-- 상단 주방 인테리어 (아치형 창문 & 스코어보드) -->
    <div class="w-full flex justify-between items-start px-6 pt-4 pointer-events-none z-10">
        <!-- 아치 창문 -->
        <div class="w-24 h-32 bg-sky-200 border-4 border-white rounded-t-full shadow-inner flex items-center justify-center relative overflow-hidden hidden sm:flex">
            <div class="absolute w-full h-1 bg-white top-1/2"></div>
            <div class="absolute h-full w-1 bg-white left-1/2"></div>
            <span class="text-3xl animate-bounce">☀️</span>
        </div>

        <!-- 점수 및 타이틀 스코어보드 -->
        <div class="bg-white/95 backdrop-blur border-4 border-emerald-400 rounded-3xl px-6 sm:px-8 py-3 shadow-lg flex flex-col items-center pointer-events-auto">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-emerald-700 flex items-center gap-2">
                <span>🥗</span> 아기자기 주방 음식 담기 <span>🥭</span>
            </h1>

            <!-- 하트 라이프 표시 영역 -->
            <div class="flex items-center gap-1 my-1 text-2xl" id="lives-container">
                <span id="heart-1" class="heart-anim">❤️</span>
                <span id="heart-2" class="heart-anim">❤️</span>
                <span id="heart-3" class="heart-anim">❤️</span>
            </div>

            <div class="flex items-center gap-6 mt-1">
                <div class="text-center">
                    <span class="text-[10px] sm:text-xs text-gray-500 block">CURRENT SCORE</span>
                    <span id="score-text" class="text-2xl sm:text-4xl font-extrabold text-amber-500">0</span>
                </div>
                <div class="h-6 sm:h-8 w-0.5 bg-gray-200"></div>
                <div class="text-center">
                    <span class="text-[10px] sm:text-xs text-gray-500 block">HIGH SCORE</span>
                    <span id="high-score-text" class="text-xl sm:text-3xl font-bold text-emerald-600">0</span>
                </div>
            </div>
        </div>

        <!-- 주방 선반 소품 -->
        <div class="bg-amber-700/80 h-4 w-32 rounded-lg shadow-md relative hidden sm:block mt-6">
            <div class="absolute -top-8 left-3 text-2xl">🪴</div>
            <div class="absolute -top-7 left-12 text-xl">🧂</div>
            <div class="absolute -top-7 left-20 text-xl">🍯</div>
        </div>
    </div>

    <!-- 간식이 떨어지는 메인 스테이지 영역 (터치 이동 가능) -->
    <div id="game-stage" class="relative flex-1 w-full overflow-hidden touch-none select-none">
        <div id="items-layer" class="absolute inset-0 pointer-events-none"></div>
    </div>

    <!-- 하단 식탁 및 바구니 영역 -->
    <div class="relative w-full h-32 sm:h-28 tablecloth-bg border-t-8 border-amber-600 flex flex-col items-center justify-start z-20 touch-none">
        <!-- 바구니 (이동 대상) -->
        <div id="basket" class="absolute -top-14 sm:-top-16 left-1/2 -translate-x-1/2 text-6xl sm:text-7xl cursor-grab active:cursor-grabbing transition-transform duration-75 flex items-center justify-center filter drop-shadow-xl select-none">
            <span id="basket-emoji" class="inline-block">🧺</span>
        </div>

        <!-- 모바일/터치 조작 안내 및 버튼 -->
        <div class="w-full max-w-lg px-3 mt-9 sm:mt-12 flex justify-between items-center text-white text-sm gap-1.5 sm:gap-2">
            <button id="btn-left" class="flex-1 max-w-[95px] sm:max-w-none bg-amber-600 active:bg-amber-800 text-white font-bold py-3 px-2 sm:px-6 rounded-2xl shadow-md border-2 border-amber-300 active:scale-95 text-sm sm:text-lg touch-none">
                ◀ 왼쪽
            </button>

            <!-- 모바일 전용 망고 크기 조절 터치 버튼 -->
            <div class="flex items-center gap-1 bg-amber-900/40 p-1 rounded-2xl border border-amber-300/30">
                <button id="btn-mango-down" class="bg-amber-700 active:bg-amber-900 text-amber-100 font-bold py-1.5 px-2 sm:px-3 rounded-xl border border-amber-400 text-xs sm:text-sm active:scale-90">
                    🥭- (A)
                </button>
                <button id="btn-mango-up" class="bg-amber-500 active:bg-amber-700 text-white font-bold py-1.5 px-2 sm:px-3 rounded-xl border border-amber-200 text-xs sm:text-sm active:scale-90">
                    🥭+ (Z)
                </button>
            </div>

            <button id="btn-right" class="flex-1 max-w-[95px] sm:max-w-none bg-amber-600 active:bg-amber-800 text-white font-bold py-3 px-2 sm:px-6 rounded-2xl shadow-md border-2 border-amber-300 active:scale-95 text-sm sm:text-lg touch-none">
                오른쪽 ▶
            </button>
        </div>
        <div class="mt-1 text-[11px] text-amber-100 opacity-90 hidden sm:block">
            [← / →] 이동 | [Z] 망고 크기 UP | [A] 망고 크기 DOWN | [스페이스] 재시작
        </div>
    </div>

    <script>
        // Web Audio API 효과음 생성기
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        // 획득 사운드 (건강 간식 & 망고)
        function playCatchSound(isMango = false) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                const now = audioCtx.currentTime;

                if (isMango) {
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(900, now + 0.3);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else {
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(1040, now + 0.12);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                }
            } catch (e) {}
        }

        // 정크푸드 감점 및 속도 둔화 사운드
        function playJunkSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.25);

                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            } catch (e) {}
        }

        // 하트 손실 경고음
        function playMissSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.25);

                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            } catch (e) {}
        }

        // 게임 오버 팡파르음
        function playGameOverSound() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                [280, 240, 200, 150].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.12);
                    osc.stop(now + idx * 0.12 + 0.15);
                });
            } catch (e) {}
        }

        const HEALTHY_FOODS = ['🍎', '🥦', '🥛', '🍌'];
        const JUNK_FOODS = ['🍩', '🍟', '🍬'];
        const MANGO = '🥭';

        let score = 0;
        let lives = 3;
        let isGameOver = false;
        let highScore = localStorage.getItem('kitchen_high_score') || 0;
        let mangoSizeRem = 10; // 망고 기본 크기 (rem)

        // 바구니 속도 및 정크푸드 디버프 상태
        let baseBasketSpeed = 10;
        let slowdownTimer = null;
        let isSlowed = false;

        const scoreText = document.getElementById('score-text');
        const highScoreText = document.getElementById('high-score-text');
        const finalScoreText = document.getElementById('final-score');
        const gameOverModal = document.getElementById('game-over-modal');
        const btnRestart = document.getElementById('btn-restart');

        highScoreText.textContent = highScore;

        const basket = document.getElementById('basket');
        const basketEmoji = document.getElementById('basket-emoji');
        const gameStage = document.getElementById('game-stage');
        const itemsLayer = document.getElementById('items-layer');
        const darkOverlay = document.getElementById('dark-overlay');

        let basketX = window.innerWidth / 2;
        const keys = { Left: false, Right: false };
        let activeFoods = [];
        let spawnTimer = 0;

        // 바구니 위치 동기화
        function updateBasketPosition() {
            const stageWidth = window.innerWidth;
            const basketWidth = 90;
            const minX = basketWidth / 2;
            const maxX = stageWidth - basketWidth / 2;

            if (basketX < minX) basketX = minX;
            if (basketX > maxX) basketX = maxX;

            basket.style.left = `${basketX}px`;
        }

        // 하트 UI 동기화
        function updateLivesUI() {
            for (let i = 1; i <= 3; i++) {
                const heartEl = document.getElementById(`heart-${i}`);
                if (i <= lives) {
                    heartEl.textContent = '❤️';
                    heartEl.classList.remove('opacity-30', 'scale-75');
                } else {
                    heartEl.textContent = '🖤';
                    heartEl.classList.add('opacity-30', 'scale-75');
                }
            }
        }

        // 정크푸드 디버프 (속도 50% 감축) 적용
        function applySpeedSlowdown() {
            isSlowed = true;
            basketEmoji.classList.add('junk-debuff-glow');

            if (slowdownTimer) clearTimeout(slowdownTimer);

            // 3초 후 원래 속도 복구
            slowdownTimer = setTimeout(() => {
                isSlowed = false;
                basketEmoji.classList.remove('junk-debuff-glow');
            }, 3000);
        }

        // 키보드 이벤트
        window.addEventListener('keydown', (e) => {
            initAudio();
            if (e.key === 'ArrowLeft') keys.Left = true;
            if (e.key === 'ArrowRight') keys.Right = true;

            // Z키: 망고 확대 (+3rem)
            if (e.key === 'z' || e.key === 'Z') {
                mangoSizeRem += 3;
                activeFoods.forEach(food => {
                    if (food.isMango) {
                        food.element.style.fontSize = `${mangoSizeRem}rem`;
                    }
                });
                createScorePopup(basketX - 50, Math.max(20, gameStage.clientHeight - 200), `🥭 망고 크기 UP! (${mangoSizeRem}rem)`, 'text-amber-500 font-bold text-2xl');
            }

            // A키: 망고 축소 (-3rem, 최소 2.5rem)
            if (e.key === 'a' || e.key === 'A') {
                mangoSizeRem = Math.max(2.5, mangoSizeRem - 3);
                activeFoods.forEach(food => {
                    if (food.isMango) {
                        food.element.style.fontSize = `${mangoSizeRem}rem`;
                    }
                });
                createScorePopup(basketX - 50, Math.max(20, gameStage.clientHeight - 200), `🥭 망고 크기 DOWN! (${mangoSizeRem}rem)`, 'text-amber-600 font-bold text-2xl');
            }

            // 스페이스 키: 게임 오버 상태 시 재시작
            // (스크롤 방지 + 포커스된 버튼이 스페이스로 다시 눌리는 것 방지를 위해 항상 preventDefault)
            if (e.code === 'Space' || e.key === ' ') {
                e.preventDefault();
                if (isGameOver) restartGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft') keys.Left = false;
            if (e.key === 'ArrowRight') keys.Right = false;
        });

        // 모바일 터치 버튼 조작
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        const startLeft = (e) => { e.preventDefault(); initAudio(); keys.Left = true; };
        const endLeft = (e) => { e.preventDefault(); keys.Left = false; };
        const startRight = (e) => { e.preventDefault(); initAudio(); keys.Right = true; };
        const endRight = (e) => { e.preventDefault(); keys.Right = false; };

        btnLeft.addEventListener('touchstart', startLeft);
        btnLeft.addEventListener('touchend', endLeft);
        btnLeft.addEventListener('mousedown', startLeft);
        btnLeft.addEventListener('mouseup', endLeft);

        btnRight.addEventListener('touchstart', startRight);
        btnRight.addEventListener('touchend', endRight);
        btnRight.addEventListener('mousedown', startRight);
        btnRight.addEventListener('mouseup', endRight);

        // 모바일 터치 망고 크기 버튼 이벤트 등록
        const btnMangoUp = document.getElementById('btn-mango-up');
        const btnMangoDown = document.getElementById('btn-mango-down');

        if (btnMangoUp) {
            const handleMangoUp = (e) => {
                e.preventDefault();
                initAudio();
                mangoSizeRem += 3;
                activeFoods.forEach(food => {
                    if (food.isMango) food.element.style.fontSize = `${mangoSizeRem}rem`;
                });
                createScorePopup(basketX - 50, Math.max(20, gameStage.clientHeight - 200), `🥭 망고 크기 UP! (${mangoSizeRem}rem)`, 'text-amber-500 font-bold text-xl sm:text-2xl');
            };
            btnMangoUp.addEventListener('touchstart', handleMangoUp, { passive: false });
            btnMangoUp.addEventListener('click', handleMangoUp);
        }

        if (btnMangoDown) {
            const handleMangoDown = (e) => {
                e.preventDefault();
                initAudio();
                mangoSizeRem = Math.max(2.5, mangoSizeRem - 3);
                activeFoods.forEach(food => {
                    if (food.isMango) food.element.style.fontSize = `${mangoSizeRem}rem`;
                });
                createScorePopup(basketX - 50, Math.max(20, gameStage.clientHeight - 200), `🥭 망고 크기 DOWN! (${mangoSizeRem}rem)`, 'text-amber-600 font-bold text-xl sm:text-2xl');
            };
            btnMangoDown.addEventListener('touchstart', handleMangoDown, { passive: false });
            btnMangoDown.addEventListener('click', handleMangoDown);
        }

        btnRestart.addEventListener('click', () => {
            initAudio();
            restartGame();
        });

        // 모바일 터치 및 마우스 드래그 이동 (전체 스테이지 반응형 터치)
        let isDragging = false;

        const handleDragStart = (e) => {
            if (!isGameOver) {
                isDragging = true;
                initAudio();
                const pageX = e.touches ? e.touches[0].clientX : e.clientX;
                basketX = pageX;
                updateBasketPosition();
            }
        };

        const handleDragMove = (e) => {
            if (isDragging && !isGameOver) {
                if (e.touches && e.cancelable) e.preventDefault();
                const pageX = e.touches ? e.touches[0].clientX : e.clientX;
                basketX = pageX;
                updateBasketPosition();
            }
        };

        const handleDragEnd = () => { isDragging = false; };

        // 스테이지 영역 전체 터치 드래그 바구니 이동
        gameStage.addEventListener('mousedown', handleDragStart);
        window.addEventListener('mousemove', handleDragMove);
        window.addEventListener('mouseup', handleDragEnd);

        gameStage.addEventListener('touchstart', handleDragStart, { passive: false });
        window.addEventListener('touchmove', handleDragMove, { passive: false });
        window.addEventListener('touchend', handleDragEnd);

        basket.addEventListener('touchstart', handleDragStart, { passive: false });
        basket.addEventListener('mousedown', handleDragStart);

        // 음식 스폰 함수 (10% 확률로 거대 망고 등장)
        function spawnFood() {
            if (isGameOver) return;

            const stageWidth = gameStage.clientWidth;
            const randVal = Math.random();

            let emoji = '';
            let isJunk = false;
            let isMango = false;

            if (randVal < 0.10) {
                // 10% 확률: 거대 황금 망고 🥭 (+20점, 체력+1, 사과 샤워)
                emoji = MANGO;
                isMango = true;
            } else if (randVal < 0.40) {
                // 30% 확률: 정크푸드 (-10점, 속도 50% 감축 디버프)
                emoji = JUNK_FOODS[Math.floor(Math.random() * JUNK_FOODS.length)];
                isJunk = true;
            } else {
                // 60% 확률: 건강 간식 (+10점)
                emoji = HEALTHY_FOODS[Math.floor(Math.random() * HEALTHY_FOODS.length)];
            }

            const foodEl = document.createElement('div');
            foodEl.className = 'absolute select-none transition-transform duration-75';
            foodEl.textContent = emoji;

            let startX = 0;
            let startY = -60;

            if (isMango) {
                foodEl.style.fontSize = `${mangoSizeRem}rem`;
                foodEl.classList.add('mango-glow');
                startX = Math.random() * Math.max(10, stageWidth - 200);
                startY = -200;
            } else {
                foodEl.style.fontSize = '2.5rem';
                startX = 10 + Math.random() * (stageWidth - 60);
                startY = -50;
            }

            foodEl.style.left = `${startX}px`;
            foodEl.style.top = `${startY}px`;

            itemsLayer.appendChild(foodEl);

            activeFoods.push({
                element: foodEl,
                emoji: emoji,
                isJunk: isJunk,
                isMango: isMango,
                x: startX,
                y: startY,
                speed: isMango ? 2.2 : (2.5 + Math.random() * 2.5),
                rot: (Math.random() - 0.5) * 2,
                currentRot: 0
            });
        }

        // 망고 획득 시 사과 폭포 연출 (보너스 사과)
        // 한 번에 너무 많이 만들면 프레임이 뚝 떨어져서 개수를 줄이고,
        // DocumentFragment 로 한 번에 붙여서 렌더링 부담을 줄임
        function triggerAppleShower(count = 30) {
            const stageWidth = gameStage.clientWidth;
            const frag = document.createDocumentFragment();
            for (let i = 0; i < count; i++) {
                const foodEl = document.createElement('div');
                foodEl.className = 'absolute select-none transition-transform duration-75';
                foodEl.textContent = '🍎';
                foodEl.style.fontSize = '2.5rem';

                const startX = 10 + Math.random() * Math.max(10, stageWidth - 60);
                // Y 위치를 위쪽으로 넓게 분산시켜 시원하게 쏟아지도록 연출
                const startY = -50 - (Math.random() * 1000);

                foodEl.style.left = `${startX}px`;
                foodEl.style.top = `${startY}px`;

                frag.appendChild(foodEl);

                activeFoods.push({
                    element: foodEl,
                    emoji: '🍎',
                    isJunk: false,
                    isMango: false,
                    isBonus: true, // 보너스 사과 (바닥에 떨어져도 하트 차감 X)
                    x: startX,
                    y: startY,
                    speed: 2.5 + Math.random() * 3.5,
                    rot: (Math.random() - 0.5) * 3,
                    currentRot: 0
                });
            }
            itemsLayer.appendChild(frag);
        }

        // 점수/알림 팝업 생성
        function createScorePopup(x, y, text, colorClass) {
            const pop = document.createElement('div');
            pop.className = `score-popup ${colorClass}`;
            pop.textContent = text;
            pop.style.left = `${x}px`;
            pop.style.top = `${y}px`;
            gameStage.appendChild(pop);

            // 스테이지 밖으로 삐져나가 글자가 잘리지 않도록 좌우 위치 보정
            const maxLeft = gameStage.clientWidth - pop.offsetWidth - 8;
            if (maxLeft > 8) pop.style.left = `${Math.min(Math.max(8, x), maxLeft)}px`;

            setTimeout(() => {
                if (pop.parentNode) pop.parentNode.removeChild(pop);
            }, 800);
        }

        // 바구니 튕김 애니메이션
        function triggerBasketBounce() {
            basketEmoji.classList.remove('basket-bounce');
            void basketEmoji.offsetWidth;
            basketEmoji.classList.add('basket-bounce');
        }

        // 정크푸드 피격 시 연출
        function triggerJunkImpact() {
            document.body.classList.remove('shake-effect');
            void document.body.offsetWidth;
            document.body.classList.add('shake-effect');

            darkOverlay.style.opacity = '0.4';
            setTimeout(() => { darkOverlay.style.opacity = '0'; }, 300);
        }

        // 건강 간식 놓쳤을 때 하트 차감 처리
        function loseLife() {
            if (isGameOver) return;

            lives--;
            updateLivesUI();
            playMissSound();

            darkOverlay.style.opacity = '0.3';
            setTimeout(() => { darkOverlay.style.opacity = '0'; }, 200);

            if (lives <= 0) {
                triggerGameOver();
            }
        }

        // 게임 오버 처리
        function triggerGameOver() {
            isGameOver = true;
            playGameOverSound();
            finalScoreText.textContent = score;
            gameOverModal.classList.remove('hidden');
        }

        // 게임 재시작 처리
        function restartGame() {
            score = 0;
            lives = 3;
            isGameOver = false;

            if (slowdownTimer) clearTimeout(slowdownTimer);
            isSlowed = false;
            basketEmoji.classList.remove('junk-debuff-glow');

            scoreText.textContent = '0';
            updateLivesUI();

            for (let food of activeFoods) {
                if (food.element.parentNode) {
                    food.element.parentNode.removeChild(food.element);
                }
            }
            activeFoods = [];
            spawnTimer = 0;

            gameOverModal.classList.add('hidden');
            basketX = window.innerWidth / 2;
            updateBasketPosition();
        }

        // 메인 게임 루프
        function gameLoop() {
            if (!isGameOver) {
                // 1. 바구니 이동 (디버프 시 속도 50% 적용)
                const currentSpeed = isSlowed ? (baseBasketSpeed / 2) : baseBasketSpeed;
                if (keys.Left) basketX -= currentSpeed;
                if (keys.Right) basketX += currentSpeed;
                updateBasketPosition();

                // 2. 간식 생성 타이머
                spawnTimer++;
                if (spawnTimer > 45) {
                    spawnFood();
                    spawnTimer = 0;
                }

                // 바구니 충돌 영역 계산
                const stageHeight = gameStage.clientHeight;
                const basketRectX = basketX - 45;
                const basketRectWidth = 90;
                const catchYThreshold = stageHeight - 50;

                // 3. 간식 낙하 및 충돌/바닥 접촉 체크
                for (let i = activeFoods.length - 1; i >= 0; i--) {
                    const food = activeFoods[i];
                    food.y += food.speed;
                    food.currentRot += food.rot;

                    food.element.style.top = `${food.y}px`;
                    food.element.style.transform = `rotate(${food.currentRot}deg)`;

                    const foodWidth = food.isMango ? (mangoSizeRem * 16) : 40;
                    const foodHeight = food.isMango ? (mangoSizeRem * 16) : 45;
                    const foodCenterX = food.x + foodWidth / 2;
                    const foodBottomY = food.y + foodHeight;

                    const isHorizontallyOverlapping = (foodCenterX >= basketRectX - 30) && (foodCenterX <= basketRectX + basketRectWidth + 30);
                    const isVerticallyOverlapping = (foodBottomY >= catchYThreshold) && (food.y <= stageHeight + 20);

                    if (isHorizontallyOverlapping && isVerticallyOverlapping) {
                        // 바구니에 받아냄!
                        if (food.isJunk) {
                            score = Math.max(0, score - 10);
                            playJunkSound();
                            triggerJunkImpact();
                            applySpeedSlowdown();
                            createScorePopup(basketX - 40, catchYThreshold - 60, '-10 🍩 🐌 속도 50% 둔화!', 'text-red-500 font-bold');
                        } else if (food.isMango) {
                            score += 20;
                            let restoredHeartText = '';
                            if (lives < 3) {
                                lives++;
                                updateLivesUI();
                                restoredHeartText = ' (+❤️)';
                            }
                            playCatchSound(true);
                            triggerBasketBounce();
                            triggerAppleShower(30); // 🍎 사과 샤워 발동!
                            createScorePopup(basketX - 60, catchYThreshold - 100, `🥭 +20${restoredHeartText}! 🍎 사과 30개!`, 'text-amber-500 text-2xl font-black');
                        } else {
                            score += 10;
                            playCatchSound(false);
                            triggerBasketBounce();
                            createScorePopup(basketX - 20, catchYThreshold - 60, '+10 🥗', 'text-emerald-500');
                        }

                        // 최고 점수 갱신
                        scoreText.textContent = score;
                        if (score > highScore) {
                            highScore = score;
                            highScoreText.textContent = highScore;
                            localStorage.setItem('kitchen_high_score', highScore);
                        }

                        itemsLayer.removeChild(food.element);
                        activeFoods.splice(i, 1);
                        continue;
                    }

                    // 바닥 아래로 떨어진 경우
                    if (food.y > stageHeight + 20) {
                        if (!food.isJunk && !food.isBonus) {
                            loseLife();
                            createScorePopup(food.x, stageHeight - 40, '💔 놓침!', 'text-red-600 text-xl font-bold');
                        }

                        itemsLayer.removeChild(food.element);
                        activeFoods.splice(i, 1);
                    }
                }
            }

            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('resize', updateBasketPosition);

        window.onload = () => {
            updateBasketPosition();
            updateLivesUI();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
