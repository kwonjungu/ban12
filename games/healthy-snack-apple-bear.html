<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>건강한 간식 잡기 게임 🍎🐻</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for cute aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Jua', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* Custom Keyframe Animations for Effects */
        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-10px, 5px) rotate(-3deg); }
            40% { transform: translate(10px, -5px) rotate(3deg); }
            60% { transform: translate(-8px, -2px) rotate(-2deg); }
            80% { transform: translate(8px, 2px) rotate(2deg); }
        }
        
        .shake-effect {
            animation: shake 0.4s ease-in-out;
        }

        .red-flash {
            animation: flashRed 0.3s ease-out;
        }

        @keyframes flashRed {
            0% { background-color: rgba(239, 68, 68, 0.4); }
            100% { background-color: transparent; }
        }

        /* Kitchen Tablecloth Pattern Background */
        .kitchen-bg {
            background-color: #d9f99d;
            background-image:  linear-gradient(#bef264 2px, transparent 2px), linear-gradient(90deg, #bef264 2px, transparent 2px);
            background-size: 40px 40px;
        }

        canvas {
            touch-action: none;
        }
    </style>
</head>
<body class="kitchen-bg h-screen w-screen overflow-hidden flex flex-col items-center justify-between p-2 sm:p-4">

    <!-- Main Game Container Card -->
    <div id="game-card" class="relative w-full max-w-xl h-full flex flex-col bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl border-4 border-lime-400 overflow-hidden">
        
        <!-- Top HUD Bar -->
        <header class="w-full bg-lime-500 text-white px-4 py-3 flex justify-between items-center shadow-md border-b-4 border-lime-600 z-10">
            <!-- Hearts -->
            <div class="flex items-center gap-1 text-2xl" id="lives-display">
                <span class="animate-bounce">❤️</span>
                <span class="animate-bounce">❤️</span>
                <span class="animate-bounce">❤️</span>
            </div>

            <!-- Title & Character Selector -->
            <div class="flex items-center gap-2">
                <button id="toggle-char-btn" class="bg-lime-600 hover:bg-lime-700 text-xs px-2.5 py-1.5 rounded-full border border-lime-300 transition-all flex items-center gap-1 shadow">
                    <span>캐릭터:</span>
                    <span id="char-icon" class="text-base">🐻</span>
                </button>
                <button id="sound-btn" class="bg-lime-600 hover:bg-lime-700 text-xs px-2 py-1.5 rounded-full border border-lime-300 transition-all shadow">
                    🔊 소리 ON
                </button>
            </div>

            <!-- Score & High Score -->
            <div class="text-right">
                <div class="text-xl font-bold tracking-wider text-yellow-200" id="score-text">점수: 0</div>
                <div class="text-xs text-lime-100 opacity-90" id="highscore-text">최고: 0</div>
            </div>
        </header>

        <!-- Canvas Container -->
        <div class="relative flex-1 w-full h-full overflow-hidden bg-gradient-to-b from-lime-100/50 to-emerald-100/40">
            <!-- Red Flash Overlay for Junk Food penalty -->
            <div id="flash-overlay" class="absolute inset-0 pointer-events-none z-20"></div>

            <!-- Game Canvas -->
            <canvas id="gameCanvas" class="w-full h-full block cursor-pointer"></canvas>

            <!-- Start Screen Overlay -->
            <div id="start-screen" class="absolute inset-0 bg-lime-900/40 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-30 transition-all">
                <div class="bg-white p-6 rounded-3xl shadow-2xl border-4 border-lime-500 max-w-sm w-full animate-fade-in flex flex-col items-center">
                    <div class="text-5xl mb-2 animate-bounce">🍎🥦🐻</div>
                    <h1 class="text-3xl font-extrabold text-lime-700 mb-2">건강 간식을 모아라!</h1>
                    <p class="text-gray-600 text-sm mb-4 leading-relaxed">
                        하늘에서 떨어지는 맛있는 건강 간식을 <br>
                        귀여운 곰돌이 바구니로 가득 받아내세요!
                    </p>
                    
                    <div class="bg-lime-50 w-full p-3 rounded-2xl mb-5 text-left text-xs text-gray-700 space-y-1 border border-lime-200">
                        <p class="font-bold text-lime-800 mb-1">🎮 조작방법 및 규칙:</p>
                        <p>• <b>방향키 (◀ ▶)</b> 또는 <b>화면 조작 버튼</b>으로 이동</p>
                        <p>• 🍎🥦🥛🍌 <b>건강 간식</b>: +10점</p>
                        <p>• 🌟🍎 <b>황금 사과</b>: +50점 & 하트 1개 회복!</p>
                        <p>• 🍩🍟🍬 <b>정크푸드</b>: -10점 & 화면 흔들림</p>
                        <p>• 건강 간식을 놓치면 하트가 깎여요!</p>
                    </div>

                    <button id="start-btn" class="w-full py-3.5 bg-gradient-to-r from-lime-500 to-emerald-600 text-white font-bold text-xl rounded-2xl shadow-lg hover:from-lime-600 hover:to-emerald-700 active:scale-95 transition-all border-b-4 border-emerald-800">
                        게임 시작 (Space)
                    </button>
                </div>
            </div>

            <!-- Game Over Screen Overlay -->
            <div id="gameover-screen" class="hidden absolute inset-0 bg-red-950/60 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-30">
                <div class="bg-white p-6 rounded-3xl shadow-2xl border-4 border-red-400 max-w-sm w-full animate-fade-in flex flex-col items-center">
                    <div class="text-5xl mb-2">😭🥗</div>
                    <h2 class="text-2xl font-bold text-red-600 mb-1">게임 오버!</h2>
                    <p class="text-gray-500 text-sm mb-4">건강한 식습관 완성 실패!</p>

                    <div class="bg-red-50 w-full p-4 rounded-2xl mb-5 space-y-2 border border-red-200">
                        <div class="text-gray-600 text-sm">획득한 점수</div>
                        <div class="text-4xl font-extrabold text-red-500" id="final-score">0점</div>
                        <div class="text-xs text-gray-500 pt-1" id="final-highscore">최고 기록: 0점</div>
                    </div>

                    <button id="restart-btn" class="w-full py-3.5 bg-gradient-to-r from-red-500 to-rose-600 text-white font-bold text-xl rounded-2xl shadow-lg hover:from-red-600 hover:to-rose-700 active:scale-95 transition-all border-b-4 border-rose-800">
                        다시 시작 (Space)
                    </button>
                </div>
            </div>
        </div>

        <!-- On-screen Touch Controls (Visible on Touch devices or small screens) -->
        <footer class="w-full bg-lime-200/80 p-3 flex justify-between items-center gap-4 border-t-2 border-lime-300">
            <button id="btn-left" class="flex-1 py-4 bg-white active:bg-lime-300 text-lime-800 text-2xl font-bold rounded-2xl shadow-md border-2 border-lime-400 active:scale-95 transition-all flex justify-center items-center">
                ◀ 왼쪽
            </button>
            <button id="btn-right" class="flex-1 py-4 bg-white active:bg-lime-300 text-lime-800 text-2xl font-bold rounded-2xl shadow-md border-2 border-lime-400 active:scale-95 transition-all flex justify-center items-center">
                오른쪽 ▶
            </button>
        </footer>
    </div>

    <script>
        // Web Audio API Sound Effects Synthesizer (No external sound files required)
        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playCatchSound() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.1);
            }

            playJunkSound() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.25);

                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.25);
            }

            playGoldenSound() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.25, now + idx * 0.06);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.06 + 0.15);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.06);
                    osc.stop(now + idx * 0.06 + 0.15);
                });
            }

            playMissSound() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'square';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.2);
            }

            playGameOverSound() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [300, 260, 220, 180];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.3, now + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.12);
                    osc.stop(now + idx * 0.12 + 0.2);
                });
            }
        }

        const soundFx = new SoundSystem();

        // Main Game Configuration & State
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const HEALTHY_ITEMS = [
            { emoji: '🍎', type: 'healthy', score: 10, name: '사과' },
            { emoji: '🥦', type: 'healthy', score: 10, name: '브로콜리' },
            { emoji: '🥛', type: 'healthy', score: 10, name: '우유' },
            { emoji: '🍌', type: 'healthy', score: 10, name: '바나나' },
            { emoji: '🍇', type: 'healthy', score: 10, name: '포도' },
            { emoji: '🥕', type: 'healthy', score: 10, name: '당근' }
        ];

        const JUNK_ITEMS = [
            { emoji: '🍩', type: 'junk', score: -10, name: '도넛' },
            { emoji: '🍟', type: 'junk', score: -10, name: '감자튀김' },
            { emoji: '🍬', type: 'junk', score: -10, name: '사탕' },
            { emoji: '🍕', type: 'junk', score: -10, name: '피자' }
        ];

        const GOLDEN_ITEM = { emoji: '🌟🍎', type: 'golden', score: 50, name: '황금사과' };

        // Player State
        let player = {
            x: 0,
            y: 0,
            width: 70,
            height: 70,
            speed: 8,
            character: '🐻' // '🐻' or '🧺'
        };

        // Game Settings
        let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER'
        let score = 0;
        let lives = 3;
        let highScore = localStorage.getItem('healthy_snack_highscore') || 0;
        let items = [];
        let particles = [];
        let floatingTexts = [];
        let spawnTimer = 0;
        let baseSpawnInterval = 60; // frames
        let baseSpeed = 3.5;

        // Key states
        const keys = {
            left: false,
            right: false
        };

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            // Adjust player position
            player.y = canvas.height - player.height - 15;
            if (player.x > canvas.width - player.width) {
                player.x = canvas.width - player.width;
            }
        }

        window.addEventListener('resize', resizeCanvas);

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                keys.left = true;
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                keys.right = true;
            } else if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault();
                if (gameState === 'START' || gameState === 'GAMEOVER') {
                    startGame();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                keys.left = false;
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                keys.right = false;
            }
        });

        // Touch Control Buttons
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        const addTouchEvents = (btn, direction) => {
            const start = (e) => {
                e.preventDefault();
                keys[direction] = true;
            };
            const end = (e) => {
                e.preventDefault();
                keys[direction] = false;
            };
            btn.addEventListener('touchstart', start);
            btn.addEventListener('touchend', end);
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
        };

        addTouchEvents(btnLeft, 'left');
        addTouchEvents(btnRight, 'right');

        // Touch Dragging directly on canvas
        let isDragging = false;
        canvas.addEventListener('pointerdown', (e) => {
            isDragging = true;
            movePlayerToPointer(e);
        });
        canvas.addEventListener('pointermove', (e) => {
            if (isDragging) movePlayerToPointer(e);
        });
        window.addEventListener('pointerup', () => isDragging = false);

        function movePlayerToPointer(e) {
            const rect = canvas.getBoundingClientRect();
            const pointerX = e.clientX - rect.left;
            player.x = pointerX - player.width / 2;
            clampPlayer();
        }

        // Character Switcher
        const toggleCharBtn = document.getElementById('toggle-char-btn');
        const charIconSpan = document.getElementById('char-icon');
        toggleCharBtn.addEventListener('click', () => {
            player.character = player.character === '🐻' ? '🧺' : '🐻';
            charIconSpan.textContent = player.character;
        });

        // Sound Toggle Button
        const soundBtn = document.getElementById('sound-btn');
        soundBtn.addEventListener('click', () => {
            soundFx.enabled = !soundFx.enabled;
            soundBtn.textContent = soundFx.enabled ? '🔊 소리 ON' : '🔇 소리 OFF';
        });

        // UI Buttons
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        function spawnItem() {
            const rand = Math.random();
            let itemData;

            // Spawn chance: Healthy ~65%, Junk ~28%, Golden ~7%
            if (rand < 0.07) {
                itemData = GOLDEN_ITEM;
            } else if (rand < 0.35) {
                itemData = JUNK_ITEMS[Math.floor(Math.random() * JUNK_ITEMS.length)];
            } else {
                itemData = HEALTHY_ITEMS[Math.floor(Math.random() * HEALTHY_ITEMS.length)];
            }

            // Speed scales slightly with current score
            const speedBonus = Math.min(score / 150, 4);

            items.push({
                x: Math.random() * (canvas.width - 50) + 10,
                y: -50,
                size: itemData.type === 'golden' ? 48 : 40,
                speed: baseSpeed + Math.random() * 1.5 + speedBonus,
                ...itemData
            });
        }

        function createParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6 - 2,
                    radius: Math.random() * 5 + 3,
                    color: color,
                    alpha: 1,
                    life: 30
                });
            }
        }

        function createFloatingText(text, x, y, color) {
            floatingTexts.push({
                text: text,
                x: x,
                y: y,
                vy: -1.5,
                alpha: 1,
                color: color
            });
        }

        function clampPlayer() {
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        }

        function updateHUD() {
            document.getElementById('score-text').textContent = `점수: ${score}`;
            document.getElementById('highscore-text').textContent = `최고: ${highScore}`;
            
            // Hearts display
            const heartsContainer = document.getElementById('lives-display');
            let heartsHTML = '';
            for (let i = 0; i < 3; i++) {
                if (i < lives) {
                    heartsHTML += '<span class="animate-bounce">❤️</span>';
                } else {
                    heartsHTML += '<span class="opacity-30 filter grayscale">💔</span>';
                }
            }
            heartsContainer.innerHTML = heartsHTML;
        }

        function startGame() {
            soundFx.init();
            score = 0;
            lives = 3;
            items = [];
            particles = [];
            floatingTexts = [];
            spawnTimer = 0;
            gameState = 'PLAYING';

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            
            updateHUD();
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            soundFx.playGameOverSound();

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('healthy_snack_highscore', highScore);
            }

            document.getElementById('final-score').textContent = `${score}점`;
            document.getElementById('final-highscore').textContent = `최고 기록: ${highScore}점`;
            document.getElementById('gameover-screen').classList.remove('hidden');
            updateHUD();
        }

        function triggerJunkPenaltyEffect() {
            const card = document.getElementById('game-card');
            const flash = document.getElementById('flash-overlay');

            card.classList.remove('shake-effect');
            flash.classList.remove('red-flash');
            
            // Trigger reflow to restart CSS animations
            void card.offsetWidth;

            card.classList.add('shake-effect');
            flash.classList.add('red-flash');
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            // Player movement
            if (keys.left) player.x -= player.speed;
            if (keys.right) player.x += player.speed;
            clampPlayer();

            // Item Spawning (Interval decreases as score increases)
            spawnTimer++;
            const currentInterval = Math.max(baseSpawnInterval - Math.floor(score / 50) * 5, 25);
            if (spawnTimer >= currentInterval) {
                spawnItem();
                spawnTimer = 0;
            }

            // Update Items
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.y += item.speed;

                // Collision with player basket/bear
                const playerCenterX = player.x + player.width / 2;
                const playerCenterY = player.y + player.height / 2;
                const dist = Math.hypot(item.x - playerCenterX, item.y - playerCenterY);

                if (dist < (player.width / 2 + item.size / 2 - 10)) {
                    // CATCH ITEM!
                    if (item.type === 'healthy') {
                        score += item.score;
                        soundFx.playCatchSound();
                        createParticles(item.x, item.y, '#bef264', 8);
                        createFloatingText(`+${item.score}`, item.x, item.y, '#15803d');
                    } else if (item.type === 'golden') {
                        score += item.score;
                        if (lives < 3) lives++;
                        soundFx.playGoldenSound();
                        createParticles(item.x, item.y, '#fde047', 18);
                        createFloatingText(`+${item.score} ❤️!`, item.x, item.y, '#eab308');
                    } else if (item.type === 'junk') {
                        score = Math.max(0, score + item.score);
                        soundFx.playJunkSound();
                        triggerJunkPenaltyEffect();
                        createParticles(item.x, item.y, '#ef4444', 12);
                        createFloatingText(`${item.score}`, item.x, item.y, '#dc2626');
                    }

                    updateHUD();
                    items.splice(i, 1);
                    continue;
                }

                // Item falls past bottom floor
                if (item.y > canvas.height + 30) {
                    if (item.type === 'healthy' || item.type === 'golden') {
                        // Drop healthy item penalty
                        lives--;
                        soundFx.playMissSound();
                        updateHUD();
                        createFloatingText('놓침! 💔', item.x, canvas.height - 40, '#ef4444');

                        if (lives <= 0) {
                            gameOver();
                            return;
                        }
                    }
                    items.splice(i, 1);
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            // Update Floating Text
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.alpha -= 0.025;
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Subtle Floor line
            ctx.beginPath();
            ctx.strokeStyle = '#a3e635';
            ctx.lineWidth = 3;
            ctx.moveTo(0, canvas.height - 10);
            ctx.lineTo(canvas.width, canvas.height - 10);
            ctx.stroke();

            // Draw Falling Items
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            items.forEach(item => {
                ctx.font = `${item.size}px sans-serif`;
                // Add gentle rotation to falling items
                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.fillText(item.emoji, 0, 0);
                ctx.restore();
            });

            // Draw Player Character (Bear or Basket)
            ctx.font = `${player.width}px sans-serif`;
            ctx.fillText(player.character, player.x + player.width / 2, player.y + player.height / 2 + 5);

            // Draw Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw Floating Score Texts
            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 22px Jua, sans-serif';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            });
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        window.onload = function() {
            resizeCanvas();
            updateHUD();
            gameLoop();
        };
    </script>
</body>
</html>
