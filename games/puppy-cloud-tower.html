<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>멍구름타워 🐶 - 스릴만점 피버 에디션</title>
<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    background: #070913;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    touch-action: none;
    position: fixed;
  }
  body { 
    display: flex; 
    align-items: center; 
    justify-content: center; 
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100dvh;
    max-width: 500px;
    max-height: 950px;
    box-shadow: 0 0 70px rgba(0,0,0,.9);
    overflow: hidden;
    background: #0f1322;
  }
  canvas { 
    display: block; 
    width: 100%; 
    height: 100%; 
    touch-action: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<script>
(function(){
'use strict';

var wrap = document.getElementById('wrap');
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');

var W = 400, H = 700;

function loadNum(key, def) {
  try { var v = localStorage.getItem(key); return v !== null ? Number(v) : def; } catch(e) { return def; }
}
function saveNum(key, val) {
  try { localStorage.setItem(key, String(val)); } catch(e){}
}
function loadFlag(key, def) {
  try { var v = localStorage.getItem(key); return v !== null ? v === '1' : def; } catch(e) { return def; }
}
function loadStr(key, def) {
  try { var v = localStorage.getItem(key); return v !== null ? v : def; } catch(e) { return def; }
}
function saveStr(key, val) {
  try { localStorage.setItem(key, String(val)); } catch(e){}
}

var bestHeight = loadNum('puppy_stack_best_height', 0);
var bestScore = loadNum('puppy_stack_best_score', 0);
var totalCoins = loadNum('puppy_stack_coins', 100);
var muted = loadFlag('puppy_stack_muted', false);
var selectedSkin = loadStr('puppy_stack_skin', 'shiba');

var unlockedSkins = [];
try {
  var s = localStorage.getItem('puppy_stack_unlocked_skins');
  unlockedSkins = s ? JSON.parse(s) : ['shiba'];
} catch(e) { unlockedSkins = ['shiba']; }

function saveUnlockedSkins() {
  try { localStorage.setItem('puppy_stack_unlocked_skins', JSON.stringify(unlockedSkins)); } catch(e){}
}

var AC = null;

function audioInit(){
  if (AC) { if (AC.state === 'suspended') { try{ AC.resume(); }catch(e){} } return; }
  try {
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    AC = new Ctor();
    if (AC.state === 'suspended') { try{ AC.resume(); }catch(e){} }
  } catch(e){ AC = null; }
}

function tone(freq, dur, type, vol, delay, slideTo){
  if (!AC || muted) return;
  try {
    var t0 = AC.currentTime + (delay || 0);
    var o = AC.createOscillator();
    var g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, vol), t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch(e){}
}

function sndPlace(combo){
  var baseFreq = 340 + combo * 40;
  tone(baseFreq, 0.12, 'triangle', 0.25, 0, baseFreq + 90);
}
function sndPerfect(combo){
  var baseFreq = 480 + combo * 60;
  tone(baseFreq, 0.15, 'sine', 0.32, 0, baseFreq * 1.5);
  tone(baseFreq * 1.25, 0.2, 'triangle', 0.2, 0.05);
}
function sndSpring(){ tone(300, 0.25, 'sawtooth', 0.3, 0, 900); }
function sndFever(){ tone(523, 0.1, 'sine', 0.3, 0); tone(659, 0.1, 'sine', 0.3, 0.08); tone(783, 0.1, 'sine', 0.3, 0.16); tone(1046, 0.3, 'triangle', 0.35, 0.24); }
function sndWind(){ tone(220, 0.3, 'sine', 0.15, 0, 180); }
function sndCoin(){ tone(987, 0.08, 'sine', 0.25, 0); tone(1318, 0.15, 'sine', 0.28, 0.06); }
function sndItem(){ tone(600, 0.1, 'triangle', 0.25, 0); tone(900, 0.18, 'sine', 0.3, 0.08); }
function sndGameOver(){ tone(300, 0.40, 'sawtooth', 0.22, 0, 80); tone(150, 0.50, 'square', 0.15, 0.1); }
function sndStart(){ tone(523, 0.10, 'triangle', 0.2, 0); tone(659, 0.10, 'triangle', 0.2, 0.08); tone(783, 0.18, 'sine', 0.22, 0.16); }

var state = 'menu'; // menu | shop | playing | over
var puppy = null;
var stack = [];
var currentBlock = null;
var debris = [];
var particles = [];
var floats = [];
var stars = [];
var windParticles = [];

var score = 0;
var currentFloor = 0;
var combo = 0;
var maxCombo = 0;
var camY = 0;
var targetCamY = 0;
var shake = 0;
var flash = 0;
var toast = null;
var menuTime = 0;
var overTime = 0;
var playTime = 0;
var newRecord = false;
var hearts = 3;
var sessionCoins = 0;

var magnetActive = false;
var magnetTimer = 0;

// 신규 스릴 요소: 피버 및 바람 시스템
var feverGauge = 0; // 0 ~ 100
var feverActive = false;
var feverTimer = 0;
var windForce = 0; // 바람 세기 (-1 ~ 1)
var windTimer = 0;
var windWarningTimer = 0;

var BLOCK_HEIGHT = 38;

var SKINS = {
  shiba: { id:'shiba', name:'시바견', icon:'🐶', price:0, desc:'기본에 충실한 귀요미 강아지!', bodyColor:'#b86d3b', earColor:'#5c2e0b' },
  poodle: { id:'poodle', name:'복슬 푸들', icon:'🐩', price:150, desc:'하트 구름 등장 확률 증가!', bodyColor:'#e8a5c8', earColor:'#c26198' },
  beagle: { id:'beagle', name:'비글', icon:'🐶', price:300, desc:'콤보 달성 시 추가 점수 30%!', bodyColor:'#a36f4c', earColor:'#3b2313' },
  retriever: { id:'retriever', name:'골든 리트리버', icon:'🐕', price:500, desc:'획득 코인 1.5배 & 피버 보너스!', bodyColor:'#eab308', earColor:'#ca8a04' },
  space: { id:'space', name:'우주멍', icon:'🚀', price:800, desc:'기본 스타트 하트 4개 부여!', bodyColor:'#6366f1', earColor:'#312e81' }
};

function resize(){
  var rw = wrap.clientWidth;
  var rh = wrap.clientHeight;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  
  cv.width = rw * dpr;
  cv.height = rh * dpr;
  
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  
  W = rw;
  H = rh;
  makeStars();
}

function makeStars(){
  stars = [];
  for (var i = 0; i < 160; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * 3500,
      r: Math.random() * 1.6 + 0.4,
      a: Math.random() * 0.75 + 0.25,
      tw: Math.random() * 6
    });
  }
}

function createPuppy(x, y){
  return {
    x: x, y: y,
    targetX: x, targetY: y,
    vy: 0,
    w: 36, h: 36,
    squish: 1,
    isJumping: false,
    fallAngle: 0,
    face: 'happy'
  };
}

function resetGame(){
  stack = [];
  debris = [];
  particles = [];
  floats = [];
  windParticles = [];

  score = 0;
  currentFloor = 0;
  combo = 0;
  maxCombo = 0;
  camY = 0;
  targetCamY = 0;
  shake = 0;
  flash = 0;
  toast = null;
  overTime = 0;
  playTime = 0;
  newRecord = false;
  sessionCoins = 0;

  magnetActive = false;
  magnetTimer = 0;

  feverGauge = 0;
  feverActive = false;
  feverTimer = 0;
  windForce = 0;
  windTimer = 0;
  windWarningTimer = 0;

  hearts = (selectedSkin === 'space') ? 4 : 3;

  var baseW = 180;
  var baseY = H - 75;
  stack.push({
    x: W / 2,
    y: baseY,
    w: baseW,
    hue: null,
    type: 'normal',
    item: null
  });

  puppy = createPuppy(W / 2, baseY - BLOCK_HEIGHT / 2 - 18);

  spawnNextBlock();
}

function spawnNextBlock(){
  var prev = stack[stack.length - 1];
  var nextFloor = stack.length;
  var nextY = prev.y - BLOCK_HEIGHT;
  var nextW = prev.w;

  var speed;
  if (nextFloor <= 8) speed = 170 + nextFloor * 8;
  else if (nextFloor <= 18) speed = 230 + (nextFloor - 8) * 10;
  else speed = 330 + Math.min(160, (nextFloor - 18) * 12);

  var dir = Math.random() < 0.5 ? 1 : -1;
  var startX = dir === 1 ? nextW / 2 + 10 : W - nextW / 2 - 10;

  var pastelHues = [340, 160, 270, 25, 200, 48, 290, 180, 350, 130];
  var isPastel = Math.random() < 0.15;
  var hue = isPastel ? pastelHues[Math.floor(Math.random() * pastelHues.length)] : null;

  // 다양한 스릴 특수 구름 아이템
  var itemType = null;
  var rand = Math.random();
  if (rand < 0.18) itemType = 'coin';
  else if (rand < 0.28 + (selectedSkin === 'poodle' ? 0.08 : 0)) itemType = 'heart';
  else if (rand < 0.35) itemType = 'magnet';
  else if (rand < 0.44) itemType = 'spring'; // 슈퍼 용수철 구름!
  else if (rand < 0.52) itemType = 'thunder'; // 속도 빠른 번개 구름!

  if (itemType === 'thunder') speed *= 1.4;

  currentBlock = {
    x: startX,
    y: nextY,
    w: nextW,
    speed: speed,
    dir: dir,
    hue: hue,
    item: itemType,
    speedMult: 1.0,
    targetSpeedMult: 1.0,
    changeTimer: 0.6 + Math.random() * 0.5
  };
}

function setToast(msg, dur){
  toast = { text: msg, t: 0, dur: dur || 1.8 };
}

function handleTap(px, py){
  audioInit();

  if (state === 'menu'){
    if (px && py && px >= W - 120 && px <= W - 10 && py >= 10 && py <= 60){
      state = 'shop';
      return;
    }
    resetGame();
    state = 'playing';
    sndStart();
    setToast('⚡ 타이밍 맞춰 터치! 퍼펙트로 피버를 터뜨리세요! 🐶', 2.5);
    return;
  }

  if (state === 'shop'){
    var skinKeys = Object.keys(SKINS);
    var cardH = 68;
    var startY = 110;

    for (var i = 0; i < skinKeys.length; i++){
      var sk = SKINS[skinKeys[i]];
      var cy = startY + i * (cardH + 12);
      if (py >= cy && py <= cy + cardH){
        if (unlockedSkins.indexOf(sk.id) !== -1){
          selectedSkin = sk.id;
          saveStr('puppy_stack_skin', selectedSkin);
          sndCoin();
          setToast('🐶 ' + sk.name + ' 스킨 착용 완료!', 1.5);
        } else {
          if (totalCoins >= sk.price){
            totalCoins -= sk.price;
            saveNum('puppy_stack_coins', totalCoins);
            unlockedSkins.push(sk.id);
            saveUnlockedSkins();
            selectedSkin = sk.id;
            saveStr('puppy_stack_skin', selectedSkin);
            sndCoin();
            setToast('🎉 ' + sk.name + ' 해금 & 착용 성공!', 2.0);
          } else {
            setToast('❌ 코인이 부족합니다!', 1.5);
          }
        }
        return;
      }
    }

    if (py >= H - 85 && py <= H - 15){
      state = 'menu';
      return;
    }
    return;
  }

  if (state === 'over'){
    if (overTime > 0.8){
      resetGame();
      state = 'playing';
      sndStart();
    }
    return;
  }

  if (state === 'playing' && currentBlock){
    placeBlock();
  }
}

window.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    handleTap(W / 2, H / 2);
  }
  if (e.key === 'm' || e.key === 'M'){
    audioInit();
    muted = !muted;
    saveNum('puppy_stack_muted', muted ? 1 : 0);
  }
});

cv.addEventListener('pointerdown', function(e){
  e.preventDefault();
  var r = cv.getBoundingClientRect();
  var px = (e.clientX - r.left) * (W / r.width);
  var py = (e.clientY - r.top) * (H / r.height);

  if (px >= W - 50 && px <= W - 5 && py >= 5 && py <= 55 && (state === 'playing' || state === 'over')){
    audioInit();
    muted = !muted;
    saveNum('puppy_stack_muted', muted ? 1 : 0);
    return;
  }

  handleTap(px, py);
}, { passive: false });

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function() {
  setTimeout(resize, 200);
});

function placeBlock(){
  var prev = stack[stack.length - 1];
  var cb = currentBlock;
  var diff = cb.x - prev.x;
  var absDiff = Math.abs(diff);

  // 자석 혹은 피버 모드 시 완벽 자동 스냅
  if (feverActive || magnetActive || cb.item === 'magnet'){
    if (absDiff < 65 || feverActive) {
      cb.x = prev.x;
      diff = 0;
      absDiff = 0;
    }
  }

  var isPerfect = absDiff < 22;

  if (isPerfect){
    cb.x = prev.x;
    diff = 0;
    combo++;
    if (combo > maxCombo) maxCombo = combo;

    // 피버 게이지 충전
    feverGauge = Math.min(100, feverGauge + 25);
    if (feverGauge >= 100 && !feverActive){
      triggerFever();
    }

    if (combo >= 2 && cb.w < 220){
      cb.w = Math.min(220, cb.w + 18);
      floats.push({ x: cb.x, y: cb.y - 20, text: '구름 대형 확장! 🌈', hue: 50, t: 0 });
    }

    sndPerfect(combo);
    spawnBurst(cb.x, cb.y, 22, 50);
    
    var scoreBoost = (selectedSkin === 'beagle') ? 1.3 : 1.0;
    if (feverActive) scoreBoost *= 2.0;

    var addedScore = Math.round((120 + combo * 60) * scoreBoost);
    var perfText = combo > 2 ? combo + 'x COMBO PERFECT!! +' + addedScore : 'PERFECT!! +' + addedScore;
    floats.push({ x: cb.x, y: cb.y - 10, text: perfText, hue: 45, t: 0 });
    score += addedScore;
    puppy.face = 'happy';
  } else {
    feverGauge = Math.max(0, feverGauge - 15);
    if (absDiff < 38) {
      diff = diff * 0.15;
      absDiff = Math.abs(diff);
      floats.push({ x: cb.x, y: cb.y - 10, text: 'NICE SNAP! ✨', hue: 180, t: 0 });
      puppy.face = 'surprised';
    } else {
      puppy.face = 'scared';
    }

    combo = 0;
    var overlap = prev.w - absDiff;

    if (overlap <= 0){
      if (hearts > 0) {
        hearts--;
        cb.x = prev.x;
        cb.w = Math.max(prev.w, 110);
        sndPerfect(1);
        flash = 0.5;
        shake = 12;
        spawnBurst(cb.x, cb.y, 28, 300);
        floats.push({ x: cb.x, y: cb.y - 20, text: '💖 무지개 세이프!', hue: 300, t: 0 });
        setToast('💖 실수 방지 세이프! (남은 목숨: ' + hearts + '개)', 2.0);
      } else {
        triggerGameOver();
        return;
      }
    } else {
      var debrisW = absDiff;
      var debrisX = diff > 0 ? cb.x + overlap / 2 + debrisW / 2 : cb.x - overlap / 2 - debrisW / 2;
      debris.push({
        x: debrisX, y: cb.y, w: debrisW,
        vy: -50, vx: diff > 0 ? 120 : -120,
        rot: 0, vRot: (Math.random() - 0.5) * 8,
        hue: cb.hue
      });

      cb.w = overlap;
      cb.x = prev.x + diff / 2;

      sndPlace(combo);
      spawnBurst(cb.x, cb.y, 10, 200);
      score += 40;
    }
  }

  // 특수 구름 아이템 처리
  var jumpAmount = 1;
  if (cb.item === 'coin'){
    var coinGain = Math.round(10 * (selectedSkin === 'retriever' ? 1.5 : 1.0));
    sessionCoins += coinGain;
    totalCoins += coinGain;
    saveNum('puppy_stack_coins', totalCoins);
    sndCoin();
    floats.push({ x: cb.x + 30, y: cb.y - 15, text: '🪙 +' + coinGain, hue: 50, t: 0 });
  } else if (cb.item === 'heart'){
    if (isPerfect) {
      hearts = Math.min(5, hearts + 1);
      sndItem();
      spawnBurst(cb.x, cb.y - 10, 18, 340);
      floats.push({ x: cb.x, y: cb.y - 25, text: '💖 PERFECT! 하트 +1 획득!', hue: 340, t: 0 });
    }
  } else if (cb.item === 'magnet'){
    magnetActive = true;
    magnetTimer = 6.0;
    sndItem();
    floats.push({ x: cb.x, y: cb.y - 25, text: '🧲 자석 스킬 발동!', hue: 200, t: 0 });
  } else if (cb.item === 'spring'){
    sndSpring();
    jumpAmount = 3; // 3층 슈퍼 점프!
    shake = 10;
    spawnBurst(cb.x, cb.y, 35, 60);
    floats.push({ x: cb.x, y: cb.y - 30, text: '🌀 슈퍼 용수철 3단 점프!!', hue: 80, t: 0 });
  } else if (cb.item === 'thunder'){
    sndItem();
    score += 150;
    floats.push({ x: cb.x, y: cb.y - 20, text: '⚡ 번개 성공 보너스 +150점!', hue: 60, t: 0 });
  }

  stack.push({
    x: cb.x, y: cb.y, w: cb.w,
    hue: cb.hue,
    type: isPerfect ? 'gold' : 'normal'
  });

  currentFloor = stack.length - 1;

  puppy.targetX = cb.x;
  puppy.targetY = cb.y - BLOCK_HEIGHT / 2 - 18;
  puppy.vy = jumpAmount > 1 ? -600 : -380;
  puppy.isJumping = true;
  puppy.squish = jumpAmount > 1 ? 0.4 : 0.6;

  targetCamY = Math.max(0, (stack.length - 2.5) * BLOCK_HEIGHT);

  spawnNextBlock();
}

function triggerFever(){
  feverActive = true;
  feverTimer = 7.0;
  feverGauge = 100;
  sndFever();
  flash = 0.6;
  shake = 15;
  spawnBurst(W / 2, H / 2, 60, 300);
  setToast('🔥 FEVER TIME!! 무적이 되어 점수 폭풍 획득!! 🔥', 2.5);
}

function triggerGameOver(){
  state = 'over';
  overTime = 0;
  sndGameOver();
  shake = 22;

  if (currentBlock){
    debris.push({
      x: currentBlock.x, y: currentBlock.y, w: currentBlock.w,
      vy: -100, vx: (Math.random() - 0.5) * 200,
      rot: 0, vRot: (Math.random() - 0.5) * 10,
      hue: currentBlock.hue
    });
    currentBlock = null;
  }

  puppy.vy = -300;
  puppy.isJumping = true;

  if (currentFloor > bestHeight){ bestHeight = currentFloor; newRecord = true; saveNum('puppy_stack_best_height', bestHeight); }
  if (score > bestScore){ bestScore = score; saveNum('puppy_stack_best_score', bestScore); }
}

function spawnBurst(x, y, count, hue){
  for (var i = 0; i < count; i++){
    var a = Math.random() * Math.PI * 2;
    var spd = 70 + Math.random() * 200;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      r: 2 + Math.random() * 4,
      hue: hue || (Math.random() * 360), t: 0,
      life: 0.4 + Math.random() * 0.5
    });
  }
}

function update(dt){
  flash = Math.max(0, flash - dt * 2.5);
  shake = Math.max(0, shake - dt * 40);
  if (toast){ toast.t += dt; if (toast.t > toast.dur) toast = null; }

  if (state === 'shop'){
    menuTime += dt;
    return;
  }

  if (state === 'menu'){
    menuTime += dt;
    if (currentBlock){
      currentBlock.x += currentBlock.dir * currentBlock.speed * dt;
      var bound = currentBlock.w / 2 + 10;
      if (currentBlock.x < bound){ currentBlock.x = bound; currentBlock.dir = 1; }
      else if (currentBlock.x > W - bound){ currentBlock.x = W - bound; currentBlock.dir = -1; }
    }
    return;
  }

  if (state === 'over'){
    overTime += dt;
    if (puppy){
      puppy.vy += 1000 * dt;
      puppy.y += puppy.vy * dt;
    }
    updateDebris(dt);
    updateParticles(dt);
    return;
  }

  playTime += dt;

  // 피버 모드 타이머
  if (feverActive){
    feverTimer -= dt;
    feverGauge = (feverTimer / 7.0) * 100;
    if (feverTimer <= 0){
      feverActive = false;
      feverGauge = 0;
    }
  }

  // 자석 타이머
  if (magnetActive){
    magnetTimer -= dt;
    if (magnetTimer <= 0) magnetActive = false;
  }

  // 돌풍(바람) 이벤트 업데이트 (10층 이상부터 발생)
  if (currentFloor >= 10){
    windTimer -= dt;
    if (windTimer <= 0){
      if (windForce === 0 && Math.random() < 0.45){
        windForce = (Math.random() < 0.5 ? 1 : -1) * (140 + Math.random() * 120);
        windTimer = 3.0 + Math.random() * 3.0;
        windWarningTimer = 1.2;
        sndWind();
      } else {
        windForce = 0;
        windTimer = 2.0 + Math.random() * 3.0;
      }
    }
  }
  if (windWarningTimer > 0) windWarningTimer -= dt;

  // 바람 입자 생성 및 이동
  if (windForce !== 0 && Math.random() < 0.6){
    windParticles.push({
      x: windForce > 0 ? -10 : W + 10,
      y: Math.random() * H,
      vx: windForce * 1.8,
      vy: (Math.random() - 0.5) * 30,
      len: 15 + Math.random() * 25,
      life: 0.8
    });
  }
  for (var w = windParticles.length - 1; w >= 0; w--){
    var wp = windParticles[w];
    wp.x += wp.vx * dt;
    wp.y += wp.vy * dt;
    wp.life -= dt;
    if (wp.life <= 0) windParticles.splice(w, 1);
  }

  if (currentBlock){
    var spdMult = 1.0;
    
    if (!currentBlock.speedMult) currentBlock.speedMult = 1.0;
    if (!currentBlock.targetSpeedMult) currentBlock.targetSpeedMult = 1.0;
    if (!currentBlock.changeTimer) currentBlock.changeTimer = 0.5;

    currentBlock.changeTimer -= dt;
    if (currentBlock.changeTimer <= 0) {
      var rand = Math.random();
      if (rand < 0.60) {
        currentBlock.targetSpeedMult = 1.35 + Math.random() * 0.25;
      } else {
        currentBlock.targetSpeedMult = 1.7 + Math.random() * 0.35;
      }
      currentBlock.changeTimer = 0.2 + Math.random() * 0.35;
    }
    currentBlock.speedMult += (currentBlock.targetSpeedMult - currentBlock.speedMult) * Math.min(1, dt * 12);

    // 바람에 의한 추가 이동 스릴 효과
    var windEffect = windForce * dt;
    currentBlock.x += (currentBlock.dir * currentBlock.speed * spdMult * currentBlock.speedMult * dt) + windEffect;
    
    var bound = currentBlock.w / 2 + 10;
    if (currentBlock.x < bound){ currentBlock.x = bound; currentBlock.dir = 1; }
    else if (currentBlock.x > W - bound){ currentBlock.x = W - bound; currentBlock.dir = -1; }
  }

  if (puppy){
    puppy.x += (puppy.targetX - puppy.x) * Math.min(1, dt * 12);
    if (puppy.isJumping){
      puppy.vy += 1200 * dt;
      puppy.y += puppy.vy * dt;
      if (puppy.y >= puppy.targetY){
        puppy.y = puppy.targetY;
        puppy.vy = 0;
        puppy.isJumping = false;
        puppy.squish = 1;
      }
    } else {
      puppy.y = puppy.targetY;
    }
    puppy.squish += (1 - puppy.squish) * Math.min(1, dt * 10);
  }

  camY += (targetCamY - camY) * Math.min(1, dt * 6);

  updateDebris(dt);
  updateParticles(dt);
}

function updateDebris(dt){
  for (var i = debris.length - 1; i >= 0; i--){
    var d = debris[i];
    d.vy += 900 * dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.rot += d.vRot * dt;
    if (d.y > camY + H + 100) debris.splice(i, 1);
  }
}

function updateParticles(dt){
  for (var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.t += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 300 * dt;
    if (p.t >= p.life) particles.splice(i, 1);
  }

  for (var f = floats.length - 1; f >= 0; f--){
    var fl = floats[f];
    fl.t += dt;
    fl.y -= 38 * dt;
    if (fl.t > 1.2) floats.splice(f, 1);
  }
}

function drawSky(){
  var g = ctx.createLinearGradient(0, 0, 0, H);
  
  if (feverActive){
    // 피버 모드 무지개 그라데이션
    var hueShift = (playTime * 120) % 360;
    g.addColorStop(0.0, 'hsl(' + hueShift + ', 80%, 30%)');
    g.addColorStop(0.5, 'hsl(' + ((hueShift + 120) % 360) + ', 80%, 25%)');
    g.addColorStop(1.0, 'hsl(' + ((hueShift + 240) % 360) + ', 80%, 20%)');
  } else {
    var floor = currentFloor;
    var topColor, midColor, botColor;

    if (floor < 8) {
      topColor = '#3b82f6'; midColor = '#60a5fa'; botColor = '#e0f2fe';
    } else if (floor < 18) {
      topColor = '#2e1065'; midColor = '#9d174d'; botColor = '#fca5a5';
    } else if (floor < 28) {
      topColor = '#090518'; midColor = '#1e1b4b'; botColor = '#312e81';
    } else {
      topColor = '#180033'; midColor = '#4c1d95'; botColor = '#831843';
    }

    g.addColorStop(0.0, topColor);
    g.addColorStop(0.5, midColor);
    g.addColorStop(1.0, botColor);
  }

  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  if (currentFloor > 8 || feverActive){
    var alpha = feverActive ? 0.8 : Math.min(1, (currentFloor - 8) / 10);
    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      var sy = (s.y - camY * 0.2) % H;
      if (sy < 0) sy += H;
      var tw = 0.5 + 0.5 * Math.sin(playTime * 3 + s.tw);
      ctx.globalAlpha = s.a * tw * alpha;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(s.x, sy, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // 바람 시각 효과 선 그리기
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.lineWidth = 2;
  for (var w = 0; w < windParticles.length; w++){
    var wp = windParticles[w];
    ctx.beginPath();
    ctx.moveTo(wp.x, wp.y);
    ctx.lineTo(wp.x + wp.len * (wp.vx > 0 ? 1 : -1), wp.y);
    ctx.stroke();
  }
}

function drawCloudShape(x, y, w, h, hue, isGold, itemType){
  ctx.save();
  var isHeart = (itemType === 'heart');
  var isThunder = (itemType === 'thunder');
  
  var mainColor, shadowColor;
  if (isHeart) {
    mainColor = '#fbcfe8';
    shadowColor = '#f472b6';
  } else if (isThunder) {
    mainColor = '#475569';
    shadowColor = '#1e293b';
  } else if (isGold || feverActive) {
    mainColor = '#fef08a';
    shadowColor = '#fde047';
  } else if (hue !== null && hue !== undefined) {
    mainColor = 'hsl(' + hue + ', 82%, 88%)';
    shadowColor = 'hsl(' + hue + ', 65%, 72%)';
  } else {
    mainColor = '#ffffff';
    shadowColor = '#cbd5e1';
  }

  ctx.fillStyle = shadowColor;
  ctx.beginPath();
  ctx.arc(x - w * 0.35, y + 2, h * 0.45, 0, Math.PI * 2);
  ctx.arc(x + w * 0.35, y + 2, h * 0.45, 0, Math.PI * 2);
  ctx.arc(x, y + 2, h * 0.55, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = mainColor;
  ctx.beginPath();
  ctx.arc(x - w * 0.35, y - 2, h * 0.42, 0, Math.PI * 2);
  ctx.arc(x + w * 0.35, y - 2, h * 0.42, 0, Math.PI * 2);
  ctx.arc(x, y - 4, h * 0.52, 0, Math.PI * 2);
  ctx.fillRect(x - w * 0.4, y - h * 0.3, w * 0.8, h * 0.6);
  ctx.fill();

  if (itemType){
    ctx.font = isHeart ? 'bold 18px sans-serif' : '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var icon = '🪙';
    if (itemType === 'heart') icon = '💖';
    if (itemType === 'magnet') icon = '🧲';
    if (itemType === 'spring') icon = '🌀';
    if (itemType === 'thunder') icon = '⚡';
    ctx.fillText(icon, x, y - 4);
  } else if (isGold){
    ctx.fillStyle = '#eab308';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✨ PERFECT ✨', x, y);
  }

  ctx.restore();
}

function drawStack(){
  for (var i = 0; i < stack.length; i++){
    var b = stack[i];
    var sy = b.y + camY;
    if (sy < -60 || sy > H + 60) continue;
    drawCloudShape(b.x, sy, b.w, BLOCK_HEIGHT, b.hue, b.type === 'gold', null);
  }

  if (currentBlock && (state === 'playing' || state === 'menu')){
    var csy = currentBlock.y + camY;
    drawCloudShape(currentBlock.x, csy, currentBlock.w, BLOCK_HEIGHT, currentBlock.hue, false, currentBlock.item);
  }

  for (var d = 0; d < debris.length; d++){
    var deb = debris[d];
    var dsy = deb.y + camY;
    ctx.save();
    ctx.translate(deb.x, dsy);
    ctx.rotate(deb.rot);
    drawCloudShape(0, 0, deb.w, BLOCK_HEIGHT, deb.hue, false, null);
    ctx.restore();
  }
}

function drawPuppy(){

  ctx.ellipse(-6, -8, 6, 11, 0.3, 0, Math.PI * 2);

  // 주둥이 & 코

  ctx.beginPath();
  ctx.ellipse(10, -5, 7, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#1c1917';
  ctx.beginPath();
  ctx.arc(14, -7, 3, 0, Math.PI * 2);
  ctx.fill();

  // 눈 및 상태 표정
  if (feverActive){
    // 피버 모드: 멋진 선글라스 착용 🕶️
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(4, -13, 13, 7);

    ctx.beginPath(); ctx.arc(8, -10, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1c1917';
    ctx.beginPath(); ctx.arc(8, -10, 1.5, 0, Math.PI * 2); ctx.fill();
  } else {
    // Normal / Happy
    ctx.fillStyle = '#1c1917';
    ctx.beginPath();
    ctx.arc(8, -10, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(9, -11, 1, 0, Math.PI * 2);
    ctx.fill();
  }

  // 볼터치
  ctx.fillStyle = '#ff80ab';
  ctx.beginPath();
  ctx.arc(12, -2, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // 발
  ctx.fillStyle = sk.earColor;
  ctx.beginPath();
  ctx.arc(-6, 16, 4, 0, Math.PI * 2);
  ctx.arc(6, 16, 4, 0, Math.PI * 2);
  ctx.fill();

  // 스킨 특별 액세서리 연출
  if (selectedSkin === 'space'){

    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(4, -8, 18, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
}

function drawParticles(){
  for (var i = 0; i < particles.length; i++){
    var p = particles[i];
    var sy = p.y + camY;
    var alpha = 1 - (p.t / p.life);
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.fillStyle = 'hsl(' + p.hue + ', 90%, 70%)';
    ctx.beginPath();
    ctx.arc(p.x, sy, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (var f = 0; f < floats.length; f++){
    var fl = floats[f];
    var fsy = fl.y + camY;
    var fAlpha = Math.max(0, 1 - fl.t / 1.2);
    ctx.globalAlpha = fAlpha;
    ctx.fillStyle = 'hsl(' + fl.hue + ', 100%, 85%)';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(fl.text, fl.x, fsy);
  }
  ctx.globalAlpha = 1;
}

  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 16px sans-serif';
  ctx.fillText(ready ? '다시 도전하기 (터치)' : '잠시만 기다려주세요...', W / 2, my + 271);
  ctx.globalAlpha = 1;
}

function draw(){
  ctx.save();
  if (shake > 0){
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  drawSky();
  drawStack();
  drawPuppy();
  drawParticles();

  if (flash > 0){
    ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.4) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();

  if (state === 'menu'){
    drawMenu();
  } else if (state === 'shop'){
    drawShop();
  } else if (state === 'over'){
    drawHUD();
    drawGameOver();
  } else {
    drawHUD();
  }
}

var lastT = performance.now();
function loop(now){
  var dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

resize();
resetGame();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
