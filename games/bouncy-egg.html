<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>통통 달걀 🥚</title>
<style>
  /* */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: radial-gradient(circle at 50% 0%, #2f6fb0 0%, #17335c 55%, #0c1a2f 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* 반응형 스테이지 컨테이너 */
  #stage {
    position: relative;
    height: min(92vh, 680px);
    width: min(92vw, 480px);
    aspect-ratio: 5 / 7;
    max-width: 100%;
    max-height: 100%;
    border-radius: 20px;
    overflow: hidden;
    background: #2b1d14; /* 캔버스 로딩 시 자연스러운 닭장 원목색 배경 */
    box-shadow: 0 20px 50px rgba(0,0,0,.55), 0 0 0 4px rgba(255,255,255,.14) inset;
    cursor: pointer;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* ===== HUD ===== */
  #hud {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; gap: 6px; align-items: center;
    padding: 8px 9px;
    font-size: 13px; font-weight: 800;
    pointer-events: none;
    text-shadow: 0 2px 0 rgba(0,0,0,.35);
    z-index: 10;
  }
  .chip {
    background: rgba(0,0,0,.35);
    border: 2px solid rgba(255,255,255,.35);
    border-radius: 999px;
    padding: 4px 9px;
    white-space: nowrap;
    backdrop-filter: blur(4px);
  }
  #chipShield.on { background: rgba(90,180,255,.55); border-color: #cfeaff; }
  #spacer { flex: 1; }
  #muteBtn {
    pointer-events: auto;
    cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 800; color: #fff;
    background: rgba(0,0,0,.35);
    border: 2px solid rgba(255,255,255,.35);
    border-radius: 999px;
    padding: 4px 9px;
    backdrop-filter: blur(4px);
  }

  /* ===== 토스트(이벤트 알림) ===== */
  #toast {
    position: absolute; left: 50%; top: 20%;
    transform: translate(-50%, 6px) scale(.85);
    background: rgba(20,20,40,.82);
    border: 3px solid #ffe27a;
    color: #fff;
    font-weight: 900; font-size: 15px;
    padding: 8px 16px;
    border-radius: 14px;
    opacity: 0;
    transition: opacity .18s ease, transform .18s cubic-bezier(.2,1.6,.4,1);
    pointer-events: none;
    white-space: nowrap;
    z-index: 12;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  /* ===== 오버레이 ===== */
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    padding: 18px;
    text-align: center;
    background: linear-gradient(180deg, rgba(6,18,40,.35) 0%, rgba(6,18,40,.68) 100%);
    z-index: 20;
  }
  .overlay.hide { display: none; }

  .card {
    background: rgba(255,255,255,.95);
    color: #23324a;
    border-radius: 20px;
    padding: 16px 18px 18px;
    box-shadow: 0 14px 30px rgba(0,0,0,.35);
    border: 4px solid #ffd85e;
    max-width: 320px;
    width: 100%;
  }

  h1 {
    margin: 0 0 2px;
    font-size: 28px;
    letter-spacing: -1px;
    color: #ffd85e;
    text-shadow: 0 3px 0 #b5761b, 0 6px 14px rgba(0,0,0,.45);
  }
  .sub { margin: 0 0 12px; font-size: 13px; font-weight: 700; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.5); }

  .howto { font-size: 13px; font-weight: 700; line-height: 1.6; color: #3c4c66; margin: 0; }
  .howto b { color: #e07b00; }

  .bigscore { font-size: 44px; font-weight: 900; color: #ff9f1c; line-height: 1; margin: 2px 0 4px; }
  .medal { font-size: 38px; line-height: 1.1; }
  .medalName { font-size: 14px; font-weight: 900; color: #6b4b12; margin-top: -2px; }
  .regret { font-size: 14px; font-weight: 800; color: #d1495b; margin: 8px 0 2px; line-height: 1.5; }
  .regret.new { color: #12967a; }
  .best { font-size: 12px; font-weight: 800; color: #5a6b85; }

  .btn {
    margin-top: 10px;
    display: inline-block;
    font-family: inherit;
    font-size: 16px; font-weight: 900; color: #55340a;
    background: linear-gradient(180deg, #ffe27a, #ffbe28);
    border: 0; border-bottom: 4px solid #cf8c0d;
    border-radius: 14px;
    padding: 10px 24px;
    cursor: pointer;
  }
  .btn:active { transform: translateY(2px); border-bottom-width: 2px; }

  .blink { animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  .tip { font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.55); }

  @media (max-height: 620px) {
    h1 { font-size: 24px; }
    .card { padding: 12px 14px 14px; }
    .bigscore { font-size: 36px; }
    .medal { font-size: 32px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud">
    <span class="chip" id="chipTime">⏱ 0초</span>
    <span class="chip" id="chipStar">⭐ 0</span>
    <span class="chip" id="chipShield">🛡 0</span>
    <span class="chip" id="chipBoost" style="display:none; background: rgba(255, 180, 0, 0.7); border-color: #ffe27a; color: #fff;">⚡ 초고속 5.0초</span>
    <span id="spacer"></span>
    <span class="chip" id="chipBest">🏆 0</span>
    <button id="muteBtn" type="button">🔊</button>
  </div>

  <div id="toast"></div>

  <!-- 시작 화면 -->
  <div class="overlay" id="titleScreen">
    <h1>통통 달걀 🥚</h1>
    <p class="sub">복작복작 닭장 속을 통통! 파이프를 쏙!</p>
    <div class="card">
      <p class="howto">
        👆 <b>화면을 톡</b> 치면 위로 통통!<br>
        ⌨️ <b>스페이스바</b> 로 통통 + <b>🛡️ 15초 무적 & 방패 +15개!</b><br>
        🧱 파이프를 지날 때마다 <b>+1점</b><br>
        ⭐ 별을 먹으면 <b>+3점</b> 과 방패!
      </p>
    </div>
    <button class="btn" id="startBtn" type="button">시작하기</button>
    <div class="tip blink">아무 데나 톡 치면 바로 시작해!</div>
  </div>

  <!-- 게임 오버 화면 -->
  <div class="overlay hide" id="overScreen">
    <h1 id="overTitle">부딪혔다!</h1>
    <div class="card">
      <div class="medal" id="overMedal">🥚</div>
      <div class="medalName" id="overMedalName">아직 메달이 없어</div>
      <div class="bigscore" id="overScore">0</div>
      <div class="best" id="overBest">최고 기록 0개</div>
      <div class="regret" id="overRegret">한 번만 더 해볼까?</div>
    </div>
    <button class="btn" id="againBtn" type="button">다시 하기</button>
    <div class="tip blink">스페이스나 탭 한 번이면 바로 다시!</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* =========================================================
     0. 안전한 저장소
     ========================================================= */
  var STORE_BEST = "flappy-chick-best";
  var STORE_MUTE = "flappy-chick-mute";

  function loadNum(key, dflt) {
    try {
      var v = window.localStorage.getItem(key);
      if (v === null) return dflt;
      var n = parseInt(v, 10);
      return isNaN(n) ? dflt : n;
    } catch (e) { return dflt; }
  }
  function saveNum(key, val) {
    try { window.localStorage.setItem(key, String(val)); } catch (e) { /* 무시 */ }
  }

  /* =========================================================
     1. DOM 요소
     ========================================================= */
  var stage = document.getElementById("stage");
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var elTime = document.getElementById("chipTime");
  var elStar = document.getElementById("chipStar");
  var elShield = document.getElementById("chipShield");
  var elBoost = document.getElementById("chipBoost");
  var elBest = document.getElementById("chipBest");
  var muteBtn = document.getElementById("muteBtn");
  var toastEl = document.getElementById("toast");
  var titleScreen = document.getElementById("titleScreen");
  var overScreen = document.getElementById("overScreen");
  var overTitle = document.getElementById("overTitle");
  var overMedal = document.getElementById("overMedal");
  var overMedalName = document.getElementById("overMedalName");
  var overScore = document.getElementById("overScore");
  var overBest = document.getElementById("overBest");
  var overRegret = document.getElementById("overRegret");
  var startBtn = document.getElementById("startBtn");
  var againBtn = document.getElementById("againBtn");

  /* =========================================================
     2. 정교한 반응형 크기 설정 (우측/하단 빈 공간 완벽 해결)
     ========================================================= */
  var BH = 600;          // 게임 세로 기준 단위
  var BW = 430;          // 게임 가로 단위 (스테이지 비율에 맞춰 자동 계산)
  var S = 1;             // 게임 단위 -> CSS 픽셀 전환 스케일
  var cssW = 430, cssH = 600;

  function resize() {
    var r = stage.getBoundingClientRect();
    cssW = Math.max(120, Math.round(r.width));
    cssH = Math.max(160, Math.round(r.height));
    var dpr = Math.min(window.devicePixelRatio || 1, 3);

    // 캔버스 물리 픽셀 설정
    cv.width = Math.round(cssW * dpr);
    cv.height = Math.round(cssH * dpr);

    // 스케일 축 비율: 세로(BH=600) 기준으로 가로 BW를 유동 계산
    S = cssH / BH;
    BW = cssW / S;

    // 변환 행렬 적용: (0..BW, 0..BH) 좌표계가 정확히 캔버스 전체 영역(cssW, cssH)에 채워짐
    ctx.setTransform(dpr * S, 0, 0, dpr * S, 0, 0);
  }

  if (window.ResizeObserver) {
    var ro = new ResizeObserver(function () { resize(); });
    ro.observe(stage);
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 250); });

  /* =========================================================
     3. 사운드 시스템 (WebAudio API)
     ========================================================= */
  var AC = null, master = null, noiseBuf = null;
  var muted = loadNum(STORE_MUTE, 0) === 1;
  muteBtn.textContent = muted ? "🔇" : "🔊";

  function audioReady() {
    if (!AC) {
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return false;
      try {
        AC = new Ctor();
        master = AC.createGain();
        master.gain.value = 0.5;
        master.connect(AC.destination);
      } catch (e) { AC = null; return false; }
    }
    if (AC.state === "suspended" && AC.resume) {
      try { AC.resume(); } catch (e) { /* 무시 */ }
    }
    return true;
  }

  function tone(f, dur, type, vol, delay, f2) {
    if (muted || !AC) return;
    try {
      var t0 = AC.currentTime + (delay || 0);
      var d = dur || 0.14;
      var osc = AC.createOscillator();
      var g = AC.createGain();
      osc.type = type || "square";
      osc.frequency.setValueAtTime(f, t0);
      if (f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + d);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.001, vol || 0.16), t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      osc.connect(g); g.connect(master);
      osc.start(t0);
      osc.stop(t0 + d + 0.05);
    } catch (e) { /* 무시 */ }
  }

  function noiseHit(dur, vol, delay, cutoff) {
    if (muted || !AC) return;
    try {
      if (!noiseBuf) {
        var len = Math.floor(AC.sampleRate * 0.5);
        noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
        var data = noiseBuf.getChannelData(0);
        for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      }
      var t0 = AC.currentTime + (delay || 0);
      var d = dur || 0.2;
      var src = AC.createBufferSource();
      src.buffer = noiseBuf;
      var lp = AC.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.setValueAtTime(cutoff || 1400, t0);
      lp.frequency.exponentialRampToValueAtTime(180, t0 + d);
      var g = AC.createGain();
      g.gain.setValueAtTime(vol || 0.2, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      src.connect(lp); lp.connect(g); g.connect(master);
      src.start(t0);
      src.stop(t0 + d + 0.05);
    } catch (e) { /* 무시 */ }
  }

  var SCALE_NOTES = [523.25, 587.33, 659.25, 698.46, 783.99, 880.0, 987.77, 1046.5, 1174.7, 1318.5];

  function sndFlap() { tone(660, 0.09, "triangle", 0.18, 0, 300); noiseHit(0.08, 0.07, 0, 900); }
  function sndScore(combo) {
    var n = SCALE_NOTES[Math.min(combo, SCALE_NOTES.length - 1)];
    tone(n, 0.11, "square", 0.16);
    tone(n * 2, 0.09, "triangle", 0.08, 0.02);
  }
  function sndPerfect(combo) {
    var n = SCALE_NOTES[Math.min(combo, SCALE_NOTES.length - 1)];
    tone(n, 0.09, "square", 0.16);
    tone(n * 1.5, 0.10, "square", 0.13, 0.07);
    tone(n * 2, 0.14, "triangle", 0.12, 0.14);
  }
  function sndStar() {
    tone(880, 0.07, "triangle", 0.16);
    tone(1318, 0.07, "triangle", 0.15, 0.06);
    tone(1760, 0.14, "triangle", 0.13, 0.12);
  }
  function sndShieldGet() {
    tone(392, 0.10, "sine", 0.18);
    tone(523, 0.10, "sine", 0.18, 0.08);
    tone(784, 0.20, "sine", 0.16, 0.16);
  }
  function sndShieldBreak() {
    tone(240, 0.18, "sawtooth", 0.16, 0, 90);
    tone(880, 0.22, "sine", 0.12, 0.02, 300);
    noiseHit(0.22, 0.16, 0, 2400);
  }
  function sndHit() {
    noiseHit(0.28, 0.30, 0, 2200);
    tone(180, 0.22, "square", 0.22, 0, 60);
  }
  function sndFall() { tone(420, 0.55, "sawtooth", 0.16, 0.10, 70); }
  function sndStart() {
    tone(523, 0.10, "square", 0.15, 0.00);
    tone(659, 0.10, "square", 0.15, 0.09);
    tone(784, 0.10, "square", 0.15, 0.18);
    tone(1046, 0.20, "square", 0.15, 0.27);
  }
  function sndEvent() {
    tone(659, 0.10, "triangle", 0.15);
    tone(988, 0.16, "triangle", 0.14, 0.09);
  }
  function sndMedal() {
    tone(523, 0.12, "square", 0.15, 0.00);
    tone(659, 0.12, "square", 0.15, 0.12);
    tone(784, 0.12, "square", 0.15, 0.24);
    tone(1046, 0.30, "square", 0.16, 0.36);
    tone(1318, 0.30, "triangle", 0.12, 0.36);
  }

  function sndBoost() {
    tone(440, 0.08, "sawtooth", 0.20, 0, 880);
    tone(660, 0.12, "square", 0.18, 0.05, 1320);
    noiseHit(0.2, 0.12, 0, 2800);
  }

  muteBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    muted = !muted;
    muteBtn.textContent = muted ? "🔇" : "🔊";
    saveNum(STORE_MUTE, muted ? 1 : 0);
    if (!muted) { audioReady(); tone(880, 0.09, "triangle", 0.15); }
  });

  /* =========================================================
     4. 게임 상태 관리
     ========================================================= */
  var STATE_TITLE = 0, STATE_PLAY = 1, STATE_DYING = 2, STATE_OVER = 3, STATE_PAUSE = 4, STATE_READY = 5;
  var state = STATE_TITLE;

  var best = loadNum(STORE_BEST, 0);
  elBest.textContent = "🏆 " + best;

  var GROUND_H = 84;      // 바닥 높이
  var PIPE_W = 62;
  var BIRD_R = 16;

  var bird = { x: 120, y: 300, vy: 0, rot: 0, pop: 1, stretch: 1, wing: 0, alive: true, inv: 0 };
  var pipes = [];
  var stars = [];
  var parts = [];
  var floats = [];

  var score = 0, combo = 0, bestCombo = 0, starCount = 0, shields = 0, passed = 0;
  var runTime = 0, groundX = 0, shake = 0, hitStop = 0, flashWhite = 0, overWait = 0;
  var eventIdx = 0, extraSpeed = 0, windOn = false, starBoost = false, themeIdx = 0;
  var boostTimer = 0;
  var themeMix = 0, themeFrom = 0, themeTo = 0;
  var newRecord = false;
  var spawnedTotal = 0;
  var nowSec = 0;

  var EVENTS = [
    { t: 8,  p: 3,  msg: "🌇 닭장에 붉은 노을이 물들었어!", act: function () { setTheme(1); } },
    { t: 16, p: 6,  msg: "🌬️ 닭장에 바람이 분다! 파이프가 움직여!", act: function () { windOn = true; } },
    { t: 30, p: 10, msg: "🌙 밤이 된 닭장! 별이 더 나와!", act: function () { setTheme(2); starBoost = true; } },
    { t: 46, p: 16, msg: "🌅 활기찬 아침 닭장! 조금 빨라져!", act: function () { setTheme(0); extraSpeed += 8; } },
    { t: 62, p: 24, msg: "⚡ 초고속 모드! 조심해!", act: function () { setTheme(1); extraSpeed += 12; } },
    { t: 78, p: 32, msg: "⚡⚡ 더 빨라진다!", act: function () { setTheme(0); extraSpeed += 12; } }
  ];

  var THEMES = [
    // 0: 낮 닭장 - 코랄 핑크 파이프
    { skyTop: [130, 88, 52], skyBot: [195, 142, 90], hill: [110, 68, 38], hill2: [82, 48, 25],
      pipe: [255, 105, 135], pipeDark: [195, 45, 75], ground: [225, 180, 105], groundDark: [185, 138, 72], night: 0 },
    // 1: 노을 닭장 - 바이올렛 파이프
    { skyTop: [175, 82, 52], skyBot: [230, 138, 80], hill: [135, 58, 32], hill2: [98, 40, 20],
      pipe: [155, 105, 245], pipeDark: [100, 55, 190], ground: [215, 158, 88], groundDark: [172, 118, 56], night: 0 },
    // 2: 밤 닭장 - 골드 앰버 파이프
    { skyTop: [38, 26, 42], skyBot: [78, 52, 68], hill: [45, 28, 35], hill2: [28, 16, 22],
      pipe: [255, 195, 45], pipeDark: [205, 135, 15], ground: [125, 95, 75], groundDark: [90, 65, 50], night: 1 }
  ];

  function setTheme(i) {
    themeFrom = themeIdx;
    themeTo = i;
    themeIdx = i;
    themeMix = 0;
  }

  var clouds = [];
  var nightStars = [];
  function buildDecor() {
    clouds.length = 0;
    for (var i = 0; i < 10; i++) {
      clouds.push({
        x: Math.random() * 600,
        y: 30 + Math.random() * 260,
        s: 0.4 + Math.random() * 0.6,
        sp: 6 + Math.random() * 10
      });
    }
    nightStars.length = 0;
    for (var j = 0; j < 34; j++) {
      nightStars.push({ x: Math.random(), y: Math.random() * 0.62, r: 0.7 + Math.random() * 1.5, tw: Math.random() * 6.28 });
    }
  }

  function moveClouds(dt, mult) {
    for (var i = 0; i < clouds.length; i++) {
      clouds[i].x -= clouds[i].sp * dt * (mult || 1);
      if (clouds[i].x < -60) clouds[i].x = BW + 60;
    }
  }
  buildDecor();

  /* =========================================================
     5. 난이도 공식
     ========================================================= */
  function pipeSpeed() { 
    return 150 + Math.min(passed, 45) * 2.1 + extraSpeed + (boostTimer > 0 ? 220 : 0); 
  }
  function gapHeight() { return passed < 5 ? 236 : Math.max(152, 236 - (passed - 5) * 2.4); }
  function pipeSpacing() { return passed < 5 ? 345 : Math.max(258, 345 - (passed - 5) * 2.0); }

  /* =========================================================
     6. 게임 리셋 / 시작
     ========================================================= */
  var toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1900);
  }

  function resetRun() {
    pipes.length = 0;
    stars.length = 0;
    parts.length = 0;
    floats.length = 0;

    bird.x = Math.max(90, BW * 0.28);
    bird.y = BH * 0.42;
    bird.vy = 0;
    bird.rot = 0;
    bird.pop = 1;
    bird.stretch = 1;
    bird.wing = 0;
    bird.alive = true;
    bird.inv = 0;

    score = 0; combo = 0; bestCombo = 0; starCount = 0; shields = 0; passed = 0;
    runTime = 0; shake = 0; hitStop = 0; flashWhite = 0; overWait = 0;
    eventIdx = 0; extraSpeed = 0; windOn = false; starBoost = false; boostTimer = 0;
    spawnedTotal = 0;
    update.extraSteps = 0;
    newRecord = false;
    themeIdx = 0; themeFrom = 0; themeTo = 0; themeMix = 1;

    spawnPipe(BW + 30, BH * 0.42);
    updateHud();
  }

  var lastStartAt = -9;
  function startGame() {
    if (nowSec - lastStartAt < 0.3) return;
    lastStartAt = nowSec;
    audioReady();
    resetRun();
    state = STATE_READY;
    titleScreen.classList.add("hide");
    overScreen.classList.add("hide");
    sndStart();
    toast("준비! 톡 치면 출발! 🥚");
  }

  /* =========================================================
     7. 장애물 및 아이템 생성
     ========================================================= */
  function spawnPipe(x, forceY) {
    var gh = gapHeight();
    var groundY = BH - GROUND_H;
    var minY = gh / 2 + 54;
    var maxY = groundY - gh / 2 - 26;
    if (maxY < minY) maxY = minY;

    var y;
    if (typeof forceY === "number") {
      y = forceY;
    } else if (spawnedTotal < 3) {
      y = bird.y + (Math.random() * 60 - 30);
    } else {
      y = minY + Math.random() * (maxY - minY);
    }
    y = Math.max(minY, Math.min(maxY, y));

    var amp = 0;
    if (windOn && spawnedTotal > 5 && Math.random() < 0.5) {
      amp = 18 + Math.random() * 22;
      var room = Math.min(y - minY, maxY - y);
      amp = Math.min(amp, Math.max(0, room));
    }

    var p = {
      x: x, baseY: y, y: y, gap: gh, amp: amp,
      phase: Math.random() * 6.28, scored: false, w: PIPE_W
    };
    pipes.push(p);
    spawnedTotal++;

    // 파이프 사이 통로에 별 3~5개 생성 (아치형, 일자, 대각선 등 다채로운 배열)
    if (spawnedTotal > 1) {
      var numStars = Math.floor(Math.random() * 3) + 3; // 3, 4, 5개 중 랜덤
      var pattern = Math.random();
      for (var sIdx = 0; sIdx < numStars; sIdx++) {
        var relX = (sIdx - (numStars - 1) / 2) * 26;
        var relY = 0;
        if (pattern < 0.45) {
          // 완만한 아치(곡선) 형태
          relY = -Math.sin((sIdx / (numStars - 1)) * Math.PI) * 22;
        } else if (pattern < 0.75) {
          // 일자 수평 형태
          relY = 0;
        } else {
          // 사선 형태
          relY = (sIdx - (numStars - 1) / 2) * 12;
        }

        stars.push({
          pipe: p, relX: relX, relY: relY,
          x: x + PIPE_W * 0.5 + relX, y: y + relY,
          got: false, spin: Math.random() * 6.28
        });
      }
    }
    return p;
  }

  /* =========================================================
     8. 이펙트 생성
     ========================================================= */
  function burst(x, y, n, colors, spd, life) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var v = spd * (0.35 + Math.random() * 0.9);
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30,
        r: 2.2 + Math.random() * 3.6,
        life: life, max: life,
        c: colors[(Math.random() * colors.length) | 0],
        g: 260 + Math.random() * 200
      });
    }
  }
  function floatText(x, y, text, color, size) {
    floats.push({ x: x, y: y, t: text, c: color, s: size || 22, life: 0.95, max: 0.95, vy: -70 });
  }

  /* =========================================================
     9. 입력 및 조작
     ========================================================= */
  function flap() {
    if (!bird.alive) return;
    bird.vy = -380;
    bird.pop = 0.75;
    bird.stretch = 1.35;
    bird.wing = 1;
    sndFlap();
    burst(bird.x - 8, bird.y + 10, 5, ["#ffffff", "#fffae6", "#e8d8b5"], 90, 0.3);
  }

  function triggerBoost() {
    if (state === STATE_PLAY) {
      boostTimer = 15.0;
      bird.inv = 15.0;
      shields += 15;
      shake = Math.max(shake, 14);
      floatText(bird.x, bird.y - 38, "🛡️ 15초 무적 + 방패 +15!", "#ffea00", 24);
      toast("⚡ 15초 동안 무적 모드 발동 & 방패 15개 추가! 🛡️");
      sndBoost();
      updateHud();
    }
  }

  function pressAction(isSpace) {
    if (state === STATE_TITLE) { startGame(); return; }
    if (state === STATE_READY) { audioReady(); state = STATE_PLAY; flap(); if (isSpace) triggerBoost(); return; }
    if (state === STATE_PLAY) { 
      audioReady(); 
      flap(); 
      if (isSpace) triggerBoost(); 
      return; 
    }
    if (state === STATE_PAUSE) { state = STATE_PLAY; toast("계속 가자! 🐤"); return; }
    if (state === STATE_OVER) { if (overWait <= 0) startGame(); return; }
  }

  stage.addEventListener("pointerdown", function (e) {
    var t = e.target;
    while (t && t !== stage) {
      if (t.tagName === "BUTTON") return;
      t = t.parentNode;
    }
    e.preventDefault();
    audioReady();
    pressAction(false);
  });

  window.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === " " || k === "Spacebar" || k === "ArrowUp" || k === "ArrowDown" ||
        k === "ArrowLeft" || k === "ArrowRight" || k === "Enter") {
      e.preventDefault();
    }
    if (k === " " || k === "Spacebar" || k === "ArrowUp" || k === "Enter" || k === "w" || k === "W") {
      if (e.repeat) return;
      audioReady();
      var isSpace = (k === " " || k === "Spacebar");
      pressAction(isSpace);
    }
    if (k === "m" || k === "M") muteBtn.click();
  }, { passive: false });

  startBtn.addEventListener("click", function (e) {
    e.preventDefault();
    e.stopPropagation();
    audioReady();
    startGame();
  });
  againBtn.addEventListener("click", function (e) {
    e.preventDefault();
    e.stopPropagation();
    audioReady();
    if (overWait <= 0) startGame();
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden && state === STATE_PLAY) state = STATE_PAUSE;
  });

  /* =========================================================
     10. 충돌 처리
     ========================================================= */
  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    var nx = Math.max(rx, Math.min(cx, rx + rw));
    var ny = Math.max(ry, Math.min(cy, ry + rh));
    var dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function loseShield() {
    shields--;
    bird.inv = 1.3;
    bird.vy = -430;
    shake = 16;
    hitStop = 0.09;
    flashWhite = 0.5;
    sndShieldBreak();
    burst(bird.x, bird.y, 26, ["#bfe9ff", "#7fd0ff", "#ffffff", "#4fa8e0"], 240, 0.7);
    floatText(bird.x, bird.y - 34, "방패가 막았어!", "#3fa8ff", 20);
    combo = 0;
    updateHud();
  }

  function die() {
    if (!bird.alive) return;
    bird.alive = false;
    state = STATE_DYING;
    if (bird.vy < -140) bird.vy = -140;
    shake = 22;
    hitStop = 0.10;
    flashWhite = 0.8;
    sndHit();
    sndFall();
    burst(bird.x, bird.y, 32, ["#ffc107", "#ffea75", "#ffffff", "#d0b894"], 260, 0.85);
  }

  /* =========================================================
     11. 게임 오버
     ========================================================= */
  function medalOf(sc) {
    if (sc >= 40) return { icon: "🌈", name: "무지개 메달! 전설의 달걀!" };
    if (sc >= 25) return { icon: "🥇", name: "금메달! 황금 달걀이다!" };
    if (sc >= 12) return { icon: "🥈", name: "은메달! 탱탱한 달걀!" };
    if (sc >= 5) return { icon: "🥉", name: "동메달! 싱싱한 달걀!" };
    return { icon: "🥚", name: "아직 메달이 없어. 5개만 넘겨봐!" };
  }

  function showOver() {
    state = STATE_OVER;
    overWait = 0.20;

    var m = medalOf(score);
    overMedal.textContent = m.icon;
    overMedalName.textContent = m.name;
    overScore.textContent = score + "점";

    if (score > best) {
      best = score;
      saveNum(STORE_BEST, best);
      newRecord = true;
    }
    elBest.textContent = "🏆 " + best;
    overBest.textContent = "파이프 " + passed + "개 · 별 " + starCount + "개 · 완벽 " +
                           bestCombo + "연속 · 최고 " + best + "점";

    overRegret.classList.remove("new");
    if (newRecord) {
      overTitle.textContent = "신기록이다! 🎉";
      overRegret.classList.add("new");
      overRegret.textContent = "우와! 최고 기록을 갈아치웠어!";
      sndMedal();
    } else {
      overTitle.textContent = "부딪혔다!";
      var diff = best - score;
      if (diff <= 0) {
        overRegret.textContent = "최고 기록이랑 똑같아! 1점만 더!";
      } else if (diff <= 3) {
        overRegret.textContent = "아깝다! 최고 기록까지 " + diff + "점!";
      } else if (diff <= 8) {
        overRegret.textContent = "조금만 더! 최고 기록까지 " + diff + "점 남았어!";
      } else {
        overRegret.textContent = "최고 기록까지 " + diff + "점! 다시 가보자!";
      }
      if (score >= 5) sndMedal();
    }
    overScreen.classList.remove("hide");
  }

  /* =========================================================
     12. HUD 디스플레이
     ========================================================= */
  var hudCache = { t: -1, s: -1, sh: -1 };
  function updateHud() {
    var sec = Math.floor(runTime);
    if (sec !== hudCache.t) { hudCache.t = sec; elTime.textContent = "⏱ " + sec + "초"; }
    if (starCount !== hudCache.s) { hudCache.s = starCount; elStar.textContent = "⭐ " + starCount; }
    if (shields !== hudCache.sh) {
      hudCache.sh = shields;
      elShield.textContent = "🛡 " + shields;
      if (shields > 0) elShield.classList.add("on");
      else elShield.classList.remove("on");
    }
    if (elBoost) {
      if (boostTimer > 0) {
        elBoost.style.display = "inline-block";
        elBoost.textContent = "🛡️ 무적 " + boostTimer.toFixed(1) + "초";
      } else {
        elBoost.style.display = "none";
      }
    }
  }

  /* =========================================================
     13. 프레임 업데이트
     ========================================================= */
  function update(dt) {
    if (shake > 0) shake = Math.max(0, shake - dt * 55);
    if (flashWhite > 0) flashWhite = Math.max(0, flashWhite - dt * 2.6);
    if (themeMix < 1) themeMix = Math.min(1, themeMix + dt * 1.2);
    bird.pop += (1 - bird.pop) * Math.min(1, dt * 9);
    bird.wing = Math.max(0, bird.wing - dt * 3.4);

    if (boostTimer > 0) {
      boostTimer = Math.max(0, boostTimer - dt);
      if (Math.random() < 0.6) {
        parts.push({
          x: bird.x - 12,
          y: bird.y + (Math.random() * 24 - 12),
          vx: -320 - Math.random() * 200,
          vy: (Math.random() - 0.5) * 60,
          r: 2.5 + Math.random() * 3,
          life: 0.35, max: 0.35,
          c: Math.random() < 0.5 ? "#ffe27a" : "#ffffff",
          g: 0
        });
      }
      updateHud();
    }

    var i;
    for (i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    for (i = floats.length - 1; i >= 0; i--) {
      var f = floats[i];
      f.life -= dt;
      if (f.life <= 0) { floats.splice(i, 1); continue; }
      f.y += f.vy * dt;
      f.vy += 40 * dt;
    }

    if (state === STATE_TITLE) {
      bird.x = BW * 0.5;
      bird.y = BH * 0.44 + Math.sin(nowSec * 2.4) * 12;
      bird.rot = Math.sin(nowSec * 2.4) * 0.18;
      groundX -= 60 * dt;
      moveClouds(dt, 1);
      return;
    }

    if (state === STATE_READY) {
      bird.x = Math.max(90, BW * 0.28);
      bird.y = BH * 0.42 + Math.sin(nowSec * 3.0) * 8;
      bird.rot = Math.sin(nowSec * 3.0) * 0.08;
      groundX -= 60 * dt;
      moveClouds(dt, 1);
      return;
    }

    if (state === STATE_PAUSE || state === STATE_OVER) {
      if (overWait > 0) overWait = Math.max(0, overWait - dt);
      moveClouds(dt, 0.3);
      return;
    }

    if (hitStop > 0) { hitStop -= dt; return; }

    if (state === STATE_DYING) {
      bird.vy += 1500 * dt;
      bird.y += bird.vy * dt;
      bird.rot = Math.min(1.6, bird.rot + dt * 4.2);
      var floorY = BH - GROUND_H - BIRD_R;
      if (bird.y >= floorY) {
        bird.y = floorY;
        burst(bird.x, bird.y + 10, 14, ["#e2c882", "#c9a95f", "#fff"], 160, 0.5);
        shake = Math.max(shake, 10);
        showOver();
      }
      return;
    }

    /* ---- 플레이 로직 ---- */
    runTime += dt;
    updateHud();
    if (bird.inv > 0) bird.inv -= dt;

    while (eventIdx < EVENTS.length &&
           (runTime >= EVENTS[eventIdx].t || passed >= EVENTS[eventIdx].p)) {
      var ev = EVENTS[eventIdx];
      ev.act();
      toast(ev.msg);
      sndEvent();
      shake = Math.max(shake, 8);
      eventIdx++;
    }

    if (eventIdx >= EVENTS.length) {
      var lastT = EVENTS[EVENTS.length - 1].t;
      var steps = Math.floor((runTime - lastT) / 16);
      if (steps > 0 && steps > (update.extraSteps || 0)) {
        update.extraSteps = steps;
        extraSpeed += 8;
        toast("⚡ 더더 빨라진다!");
        sndEvent();
      }
    }

    bird.vy += 1500 * dt;
    if (bird.vy > 720) bird.vy = 720;
    bird.y += bird.vy * dt;
    bird.rot = Math.max(-0.55, Math.min(1.5, bird.vy / 520));
    bird.x += (Math.max(90, BW * 0.28) - bird.x) * Math.min(1, dt * 5);

    if (bird.y < BIRD_R + 4) { bird.y = BIRD_R + 4; if (bird.vy < 0) bird.vy = 0; }

    var spd = pipeSpeed();
    groundX -= spd * dt;
    moveClouds(dt, 1);

    var groundY = BH - GROUND_H;
    for (i = pipes.length - 1; i >= 0; i--) {
      var pp = pipes[i];
      pp.x -= spd * dt;
      if (pp.amp > 0) pp.y = pp.baseY + Math.sin(runTime * 1.15 + pp.phase) * pp.amp;
      else pp.y = pp.baseY;

      if (!pp.scored && pp.x + pp.w < bird.x) {
        pp.scored = true;
        passed++;
        var dist = Math.abs(bird.y - pp.y);
        var perfect = dist < pp.gap * 0.19;
        if (perfect) {
          combo++;
          if (combo > bestCombo) bestCombo = combo;
          score += 2;
          sndPerfect(combo);
          floatText(bird.x + 26, bird.y - 30, "완벽! +2", "#ffe27a", 22);
          burst(pp.x + pp.w * 0.5, pp.y, 16, ["#ffe27a", "#fff", "#ffb703"], 190, 0.6);
          shake = Math.max(shake, 9);
        } else {
          combo = 0;
          score += 1;
          sndScore(Math.min(7, passed % 8));
          floatText(bird.x + 26, bird.y - 30, "+1", "#ffffff", 20);
          burst(pp.x + pp.w * 0.5, pp.y, 8, ["#ffffff", "#cfeaff"], 130, 0.45);
          shake = Math.max(shake, 5);
        }
        bird.pop = 1.3;
        hitStop = perfect ? 0.075 : 0.045;
        updateHud();
      }

      if (pp.x + pp.w < -30) pipes.splice(i, 1);
    }

    for (i = stars.length - 1; i >= 0; i--) {
      var st = stars[i];
      st.x = st.pipe.x + st.pipe.w * 0.5 + (st.relX || 0);
      st.y = st.pipe.y + (st.relY !== undefined ? st.relY : (st.off || 0));
      st.spin += dt * 3.2;
      if (!st.got) {
        var ddx = st.x - bird.x, ddy = st.y - bird.y;
        if (ddx * ddx + ddy * ddy < (BIRD_R + 15) * (BIRD_R + 15)) {
          st.got = true;
          starCount++;
          score += 3;
          sndStar();
          floatText(st.x, st.y - 16, "별! +3", "#ffe27a", 22);
          burst(st.x, st.y, 18, ["#ffe27a", "#fff6c0", "#ffffff"], 200, 0.6);
          shake = Math.max(shake, 8);
          hitStop = 0.05;
          bird.pop = 1.32;
          if (starCount % 4 === 0 && shields < 2) {
            shields++;
            sndShieldGet();
            floatText(bird.x, bird.y - 56, "방패 얻었다! 🛡", "#3fa8ff", 20);
            toast("🛡 방패를 얻었어! 한 번은 살아나!");
          }
          updateHud();
        }
      }
      if (st.x < -40) stars.splice(i, 1);
    }

    var lastX = -9999;
    for (i = 0; i < pipes.length; i++) if (pipes[i].x > lastX) lastX = pipes[i].x;
    if (lastX < BW - pipeSpacing()) spawnPipe(BW + 10);

    /* ---- 충돌 검사 ---- */
    if (bird.inv <= 0) {
      if (bird.y + BIRD_R >= groundY) {
        bird.y = groundY - BIRD_R;
        if (shields > 0) loseShield();
        else die();
        return;
      }

      for (i = 0; i < pipes.length; i++) {
        var q = pipes[i];
        if (q.x > bird.x + BIRD_R + 8 || q.x + q.w < bird.x - BIRD_R - 8) continue;
        var topH = q.y - q.gap / 2;
        var botY = q.y + q.gap / 2;
        var botH = groundY - botY;

        var hitTop = circleRect(bird.x, bird.y, BIRD_R - 2, q.x, 0, q.w, topH);
        var hitBot = circleRect(bird.x, bird.y, BIRD_R - 2, q.x, botY, q.w, botH);

        if (hitTop || hitBot) {
          if (shields > 0) loseShield();
          else die();
          break;
        }
      }
    } else {
      if (bird.y + BIRD_R >= groundY) {
        bird.y = groundY - BIRD_R;
        if (bird.vy > 0) bird.vy = 0;
      }
    }
  }

  /* =========================================================
     14. 그래픽 렌더링
     ========================================================= */
  function lerp(a, b, f) { return a + (b - a) * f; }
  function lerpColor(c1, c2, f) {
    return [
      Math.round(lerp(c1[0], c2[0], f)),
      Math.round(lerp(c1[1], c2[1], f)),
      Math.round(lerp(c1[2], c2[2], f))
    ];
  }
  function rgbStr(c) { return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")"; }

  function getCurTheme() {
    var t1 = THEMES[themeFrom];
    var t2 = THEMES[themeTo];
    if (themeMix >= 1) return t2;
    return {
      skyTop: lerpColor(t1.skyTop, t2.skyTop, themeMix),
      skyBot: lerpColor(t1.skyBot, t2.skyBot, themeMix),
      hill: lerpColor(t1.hill, t2.hill, themeMix),
      hill2: lerpColor(t1.hill2, t2.hill2, themeMix),
      pipe: lerpColor(t1.pipe, t2.pipe, themeMix),
      pipeDark: lerpColor(t1.pipeDark, t2.pipeDark, themeMix),
      ground: lerpColor(t1.ground, t2.ground, themeMix),
      groundDark: lerpColor(t1.groundDark, t2.groundDark, themeMix),
      night: lerp(t1.night, t2.night, themeMix)
    };
  }

  function drawBg(tm) {
    // 1. 닭장 나무 벽면 배경 그라데이션 (BW, BH 영역 전체 꽉 채움)
    var grad = ctx.createLinearGradient(0, 0, 0, BH);
    grad.addColorStop(0, rgbStr(tm.skyTop));
    grad.addColorStop(1, rgbStr(tm.skyBot));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, BW + 2, BH + 2);

    // 2. 나무 판자 세로 줄무늬 패턴
    ctx.fillStyle = "rgba(0,0,0,0.06)";
    var plankW = 38;
    for (var px = 0; px < BW + plankW; px += plankW) {
      ctx.fillRect(px, 0, 2, BH - GROUND_H);
    }

    // 3. 닭장 철망 (Chicken Wire Grid)
    ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
    ctx.lineWidth = 1;
    var step = 28;
    ctx.beginPath();
    for (var x = -BH; x < BW + BH; x += step) {
      ctx.moveTo(x, 0); ctx.lineTo(x + BH, BH - GROUND_H);
      ctx.moveTo(x, BH - GROUND_H); ctx.lineTo(x + BH, 0);
    }
    ctx.stroke();

    // 4. 밤일 때 별빛 오라
    if (tm.night > 0.01) {
      ctx.save();
      ctx.globalAlpha = tm.night;
      ctx.fillStyle = "#ffffff";
      for (var i = 0; i < nightStars.length; i++) {
        var st = nightStars[i];
        var alpha = 0.3 + 0.7 * Math.sin(nowSec * 3 + st.tw);
        ctx.globalAlpha = tm.night * alpha;
        ctx.beginPath();
        ctx.arc(st.x * BW, st.y * BH * 0.5, st.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // 5. 닭장 뒤쪽 횃대 및 볏짚 둥지
    var perchY = BH - GROUND_H - 120;
    ctx.fillStyle = rgbStr(tm.hill2);
    ctx.fillRect(0, perchY, BW + 2, 10);

    for (var nx = 30; nx < BW + 60; nx += 110) {
      ctx.fillStyle = rgbStr(tm.groundDark);
      ctx.beginPath();
      ctx.ellipse(nx + 25, perchY - 4, 22, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(240, 190, 80, 0.7)";
      ctx.beginPath();
      ctx.ellipse(nx + 25, perchY - 6, 18, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      // 보너스 배경 달걀
      ctx.fillStyle = "rgba(255, 250, 240, 0.85)";
      ctx.beginPath();
      ctx.ellipse(nx + 20, perchY - 12, 5, 7, -0.2, 0, Math.PI * 2);
      ctx.ellipse(nx + 29, perchY - 11, 5, 7, 0.2, 0, Math.PI * 2);
      ctx.fill();
    }

    // 6. 공기 중 먼지/깃털 입자
    ctx.fillStyle = "rgba(255, 245, 220, 0.6)";
    for (var c = 0; c < clouds.length; c++) {
      var cl = clouds[c];
      ctx.beginPath();
      ctx.arc(cl.x, cl.y, cl.s * 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPipes(tm) {
    var groundY = BH - GROUND_H;
    ctx.lineWidth = 3;

    for (var i = 0; i < pipes.length; i++) {
      var p = pipes[i];
      var topH = p.y - p.gap / 2;
      var botY = p.y + p.gap / 2;
      var botH = groundY - botY;

      ctx.fillStyle = rgbStr(tm.pipe);
      ctx.strokeStyle = rgbStr(tm.pipeDark);

      // 상단 파이프
      ctx.fillRect(p.x, 0, p.w, topH);
      ctx.strokeRect(p.x, 0, p.w, topH);
      ctx.fillRect(p.x - 4, topH - 22, p.w + 8, 22);
      ctx.strokeRect(p.x - 4, topH - 22, p.w + 8, 22);

      // 하이라이트
      ctx.fillStyle = "rgba(255,255,255,0.22)";
      ctx.fillRect(p.x + 6, 0, 8, Math.max(0, topH - 22));
      ctx.fillRect(p.x + 4, topH - 20, 8, 18);

      // 하단 파이프
      ctx.fillStyle = rgbStr(tm.pipe);
      ctx.fillRect(p.x, botY, p.w, botH);
      ctx.strokeRect(p.x, botY, p.w, botH);
      ctx.fillRect(p.x - 4, botY, p.w + 8, 22);
      ctx.strokeRect(p.x - 4, botY, p.w + 8, 22);

      // 하이라이트
      ctx.fillStyle = "rgba(255,255,255,0.22)";
      ctx.fillRect(p.x + 6, botY + 22, 8, Math.max(0, botH - 22));
      ctx.fillRect(p.x + 4, botY + 2, 8, 18);
    }
  }

  function drawStars() {
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      if (st.got) continue;
      ctx.save();
      ctx.translate(st.x, st.y);
      ctx.rotate(st.spin);

      ctx.fillStyle = "#ffe27a";
      ctx.strokeStyle = "#e59b00";
      ctx.lineWidth = 2;

      ctx.beginPath();
      for (var k = 0; k < 5; k++) {
        var a1 = (k * 72 - 90) * Math.PI / 180;
        var a2 = (k * 72 + 36 - 90) * Math.PI / 180;
        var r1 = 14, r2 = 6;
        if (k === 0) ctx.moveTo(Math.cos(a1) * r1, Math.sin(a1) * r1);
        else ctx.lineTo(Math.cos(a1) * r1, Math.sin(a1) * r1);
        ctx.lineTo(Math.cos(a2) * r2, Math.sin(a2) * r2);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "rgba(255,255,255,0.6)";
      ctx.beginPath();
      ctx.arc(-2, -3, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  function drawChick() {
    if (bird.inv > 0 && Math.floor(nowSec * 22) % 2 === 0) return;

    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    ctx.scale(bird.pop * bird.stretch, bird.pop / bird.stretch);

    // 달걀 몸통
    ctx.fillStyle = "#fffdf7";
    ctx.strokeStyle = "#cbb28d";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(0, -BIRD_R - 5);
    ctx.bezierCurveTo(BIRD_R + 3, -BIRD_R - 2, BIRD_R + 5, BIRD_R + 3, 0, BIRD_R + 5);
    ctx.bezierCurveTo(-BIRD_R - 5, BIRD_R + 3, -BIRD_R - 3, -BIRD_R - 2, 0, -BIRD_R - 5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 상단 광택
    ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
    ctx.beginPath();
    ctx.ellipse(-4, -6, 4, 7, -0.3, 0, Math.PI * 2);
    ctx.fill();

    // 볼터치
    ctx.fillStyle = "rgba(255, 140, 160, 0.55)";
    ctx.beginPath();
    ctx.arc(-7, 2, 3.5, 0, Math.PI * 2);
    ctx.arc(7, 2, 3.5, 0, Math.PI * 2);
    ctx.fill();

    // 눈
    ctx.fillStyle = "#2c221e";
    ctx.beginPath();
    ctx.arc(-5, -2, 2.8, 0, Math.PI * 2);
    ctx.arc(5, -2, 2.8, 0, Math.PI * 2);
    ctx.fill();

    // 반사광
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(-4, -3.2, 1.1, 0, Math.PI * 2);
    ctx.arc(6, -3.2, 1.1, 0, Math.PI * 2);
    ctx.fill();

    // 입
    ctx.strokeStyle = "#5a4332";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(0, 1, 2.5, 0.2, Math.PI - 0.2);
    ctx.stroke();

    // 날개
    ctx.save();
    ctx.translate(-3, 2);
    var wingAngle = -0.2 - bird.wing * 1.2;
    ctx.rotate(wingAngle);

    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#cbb28d";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.ellipse(-4, 0, 7, 4, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // 방패 오라
    if (shields > 0) {
      ctx.strokeStyle = "rgba(100, 200, 255, 0.85)";
      ctx.fillStyle = "rgba(160, 225, 255, 0.22)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, BIRD_R + 10 + Math.sin(nowSec * 6) * 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    if (boostTimer > 0) {
      ctx.fillStyle = "rgba(255, 200, 50, 0.6)";
      ctx.beginPath();
      ctx.arc(-BIRD_R - 6, 0, 9 + Math.random() * 4, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawGround(tm) {
    var groundY = BH - GROUND_H;

    // 볏짚 바닥 (BW 가로 영역 꽉 채움)
    ctx.fillStyle = rgbStr(tm.ground);
    ctx.fillRect(0, groundY, BW + 2, GROUND_H + 2);

    // 바닥 테두리 나무 빔
    ctx.fillStyle = rgbStr(tm.groundDark);
    ctx.fillRect(0, groundY, BW + 2, 10);

    // 지푸라기 결 연출
    ctx.strokeStyle = "rgba(255, 220, 130, 0.4)";
    ctx.lineWidth = 2;
    var strawStep = 18;
    var offset = (groundX % strawStep + strawStep) % strawStep;
    ctx.beginPath();
    for (var x = -strawStep; x < BW + strawStep * 2; x += strawStep) {
      var sx = x - offset;
      ctx.moveTo(sx, groundY + 14);
      ctx.lineTo(sx + 10, groundY + 28);
      ctx.moveTo(sx + 8, groundY + 32);
      ctx.lineTo(sx + 18, groundY + 50);
    }
    ctx.stroke();
  }

  function drawFx() {
    var i;
    for (i = 0; i < parts.length; i++) {
      var p = parts[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (i = 0; i < floats.length; i++) {
      var f = floats[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, f.life / f.max);
      ctx.fillStyle = f.c;
      ctx.font = "900 " + f.s + "px sans-serif";
      ctx.textAlign = "center";
      ctx.strokeStyle = "rgba(0,0,0,0.5)";
      ctx.lineWidth = 4;
      ctx.strokeText(f.t, f.x, f.y);
      ctx.fillText(f.t, f.x, f.y);
      ctx.restore();
    }

    if (flashWhite > 0) {
      ctx.fillStyle = "rgba(255,255,255," + Math.min(1, flashWhite) + ")";
      ctx.fillRect(0, 0, BW + 2, BH + 2);
    }
  }

  /* =========================================================
     15. 메인 게임 루프
     ========================================================= */
  var lastTime = 0;
  function render(ts) {
    if (!lastTime) lastTime = ts;
    var dt = Math.min((ts - lastTime) / 1000, 0.08);
    lastTime = ts;
    nowSec = ts / 1000;

    update(dt);

    ctx.save();
    if (shake > 0) {
      var sx = (Math.random() - 0.5) * shake;
      var sy = (Math.random() - 0.5) * shake;
      ctx.translate(sx, sy);
    }

    var tm = getCurTheme();
    drawBg(tm);
    drawPipes(tm);
    drawStars();
    drawChick();
    drawGround(tm);
    drawFx();

    ctx.restore();

    requestAnimationFrame(render);
  }

  window.onload = function () {
    resize();
    updateHud();
    requestAnimationFrame(render);
  };
})();
</script>
