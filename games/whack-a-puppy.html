<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>강아지 잡기 🐶</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  html, body { 
    margin: 0; 
    padding: 0; 
    height: 100%; 
    width: 100%; 
    overflow: hidden; 
    touch-action: none;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: radial-gradient(circle at 50% 0%, #a7f3d0 0%, #16a34a 45%, #052e16 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(4px, 2vw, 12px);
    -webkit-user-select: none;
    user-select: none;
  }

  #wrap { 
    width: 100%; 
    height: 100%;
    max-width: 520px; 
    max-height: 920px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    max-height: 100%;
    aspect-ratio: 9 / 13;
    margin: 0 auto;
    border-radius: min(24px, 5vw);
    overflow: hidden;
    background: #40916c;
    box-shadow: 0 18px 40px rgba(0,0,0,.55), 0 0 0 3px rgba(255,255,255,.25) inset;
    touch-action: none;
    cursor: crosshair;
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute; left: 0; right: 0; top: 0;
    padding: clamp(8px, 2vh, 14px) clamp(10px, 3vw, 16px) 0;
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 6px; pointer-events: none; z-index: 4;
  }
  .pill {
    background: rgba(12, 20, 44, .7);
    border: 2px solid rgba(255,255,255,.25);
    border-radius: clamp(10px, 3vw, 16px);
    padding: clamp(4px, 1vh, 8px) clamp(8px, 2vw, 14px);
    line-height: 1.15;
    text-align: center;
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 10px rgba(0,0,0,.3);
  }
  .lbl { display: block; font-size: clamp(10px, 2.2vw, 12px); letter-spacing: .06em; opacity: .85; }
  .val { font-size: clamp(18px, 4.5vw, 24px); font-weight: 900; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
  #lives { font-size: clamp(14px, 3.8vw, 20px); letter-spacing: 1px; }
  #time.warn { color: #ff6b6b; animation: tick .5s infinite; }
  @keyframes tick { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.18);} }
  #time { display: inline-block; }

  #timebarWrap {
    position: absolute; left: clamp(10px, 3vw, 16px); right: clamp(10px, 3vw, 16px); top: clamp(56px, 11vh, 72px);
    height: clamp(8px, 1.8vh, 12px); border-radius: 99px;
    background: rgba(6,12,30,.5);
    border: 2px solid rgba(255,255,255,.2);
    overflow: hidden; pointer-events: none; z-index: 4;
  }
  #timebar { height: 100%; width: 100%; border-radius: 99px;
    background: linear-gradient(90deg, #7dffb0, #ffe066); transition: background .3s, width 0.1s linear; }
  #timebar.warn { background: linear-gradient(90deg, #ff9f43, #ff5252); }

  #comboBox {
    position: absolute; left: 0; right: 0; top: clamp(72px, 14vh, 90px);
    text-align: center; pointer-events: none; opacity: 0;
    font-size: clamp(20px, 5.5vw, 28px); font-weight: 900;
    color: #ffe66d; z-index: 4;
    text-shadow: 0 3px 0 #b5541b, 0 0 18px rgba(255,214,102,.8);
    transition: opacity 0.2s;
  }
  #comboBox.on { opacity: 1; }
  #comboBox.pop { animation: cpop .32s ease-out; }
  @keyframes cpop { 0%{ transform: scale(.5) rotate(-8deg);} 60%{ transform: scale(1.3) rotate(4deg);} 100%{ transform: scale(1);} }

  #banner {
    position: absolute; left: 0; right: 0; top: 38%;
    text-align: center; pointer-events: none; opacity: 0; z-index: 5;
  }
  #banner span {
    display: inline-block;
    background: linear-gradient(180deg, #fff4c2, #ffcf4a);
    color: #6b3b0b;
    font-weight: 900; font-size: clamp(14px, 3.8vw, 18px);
    padding: clamp(8px, 1.5vh, 12px) clamp(14px, 3vw, 20px); border-radius: 16px;
    border: 3px solid #fff;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  #banner.show { animation: bn 2.2s ease-out forwards; }
  @keyframes bn {
    0% { opacity: 0; transform: translateY(24px) scale(.7); }
    15% { opacity: 1; transform: translateY(0) scale(1.08); }
    25% { transform: translateY(0) scale(1); }
    80% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-22px) scale(.95); }
  }

  #muteBtn {
    position: absolute; right: 12px; bottom: 12px;
    width: clamp(38px, 9vw, 46px); height: clamp(38px, 9vw, 46px); border-radius: 14px;
    border: 2px solid rgba(255,255,255,.3);
    background: rgba(12,20,44,.65); color: #fff;
    font-size: clamp(16px, 4vw, 20px); cursor: pointer; padding: 0;
    z-index: 10; backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
  }
  #muteBtn:active { transform: scale(.92); }

  /* ---------- Overlay Screens ---------- */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(8px, 1.8vh, 14px); padding: 20px 22px;
    text-align: center;
    background: radial-gradient(circle at 50% 30%, rgba(10,22,52,.85), rgba(6,12,30,.96));
    backdrop-filter: blur(6px); z-index: 8;
  }
  .screen.hide { display: none; }

  .bigTitle {
    font-size: clamp(32px, 8vw, 46px); font-weight: 900; letter-spacing: -1px;
    color: #ffe066;
    text-shadow: 0 4px 0 #b5541b, 0 8px 0 rgba(0,0,0,.35), 0 0 30px rgba(255,209,102,.55);
    margin: 0;
    animation: float 2.4s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{ transform: translateY(0) rotate(-1.5deg);} 50%{ transform: translateY(-8px) rotate(1.5deg);} }
  .sub { font-size: clamp(12px, 3.2vw, 15px); opacity: .92; line-height: 1.5; margin: 0; }
  .moleRow { font-size: clamp(28px, 7vw, 38px); letter-spacing: 6px; }
  .moleRow span { display: inline-block; animation: peek 1.6s ease-in-out infinite; }
  .moleRow span:nth-child(2){ animation-delay: .25s; }
  .moleRow span:nth-child(3){ animation-delay: .5s; }
  .moleRow span:nth-child(4){ animation-delay: .75s; }
  @keyframes peek { 0%,100%{ transform: translateY(6px) scale(.92);} 50%{ transform: translateY(-8px) scale(1.06);} }

  .btn {
    font-family: inherit;
    margin-top: 4px;
    padding: clamp(12px, 2.2vh, 16px) clamp(28px, 6vw, 38px);
    font-size: clamp(18px, 4.5vw, 22px); font-weight: 900;
    color: #5a2a00;
    background: linear-gradient(180deg, #ffe680, #ffb703);
    border: 3px solid #fff;
    border-radius: 18px;
    box-shadow: 0 6px 0 #c47a00, 0 12px 22px rgba(0,0,0,.42);
    cursor: pointer;
    animation: btnPulse 1.4s ease-in-out infinite;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c47a00; }
  @keyframes btnPulse { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.05);} }

  .card {
    background: rgba(255,255,255,.09);
    border: 2px solid rgba(255,255,255,.18);
    border-radius: 16px;
    padding: clamp(8px, 1.8vh, 14px) clamp(12px, 3vw, 18px);
    font-size: clamp(11px, 2.8vw, 13px); line-height: 1.6;
  }
  .key { display: inline-block; background: rgba(255,255,255,.2); border-radius: 6px; padding: 1px 6px; font-weight: 800; }
  .best { font-size: clamp(13px, 3vw, 15px); opacity: .95; font-weight: 700; color: #ffe066; }

  #grade { font-size: clamp(52px, 12vw, 68px); font-weight: 900; line-height: 1;
    text-shadow: 0 5px 0 rgba(0,0,0,.4), 0 0 26px currentColor; }
  #gradeName { font-size: clamp(14px, 3.5vw, 18px); font-weight: 800; opacity: .95; margin-top: -4px; }
  #finalScore { font-size: clamp(38px, 9vw, 48px); font-weight: 900; color: #ffe066; text-shadow: 0 4px 0 #b5541b; }
  #stats { font-size: clamp(12px, 3.2vw, 15px); opacity: .92; line-height: 1.7; }
  #regret { font-size: clamp(13px, 3.5vw, 16px); font-weight: 800; color: #ffd166; }
  .tiny { font-size: clamp(10px, 2.5vw, 12px); opacity: .7; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>

    <div id="hud">
      <div class="pill"><span class="lbl">점수</span><span class="val" id="score">0</span></div>
      <div class="pill"><span class="lbl">목숨</span><span class="val" id="lives">❤️</span></div>
      <div class="pill"><span class="lbl">시간</span><span class="val"><span id="time">60</span></span></div>
    </div>
    <div id="timebarWrap"><div id="timebar"></div></div>
    <div id="comboBox"></div>
    <div id="banner"><span></span></div>

    <button id="muteBtn" type="button" aria-label="소리 켜기 끄기">🔊</button>

    <!-- 시작 화면 -->
    <div class="screen" id="titleScreen">
      <div class="moleRow"><span>🐶</span><span>✨</span><span>🐱</span><span>🐭</span></div>
      <h1 class="bigTitle">강아지 잡기</h1>
      <p class="sub">튀어나온 강아지에게 <b>개껌을 콕콕!</b><br>60초 동안 연속 터치에 도전하세요!</p>
      <div class="card">
        🐶 일반 <b>+10</b> &nbsp; ✨ 황금 <b>+50</b> &nbsp; 🐱 삼색고양이 <b>2번! (+30)</b><br>
        🤎 갈색 <b>-20</b> &nbsp; 🐭 쥐강아지 <b>-10</b>
      </div>
      <button class="btn" id="startBtn" type="button">시작하기 🦴</button>
      <p class="best" id="bestTitle">최고 기록: 0점</p>
      <p class="tiny">화면 터치/클릭! &nbsp;/&nbsp; 키보드는 <span class="key">1</span>~<span class="key">0</span>, <span class="key">Q</span>~<span class="key">T</span> 키 사용 가능</p>
    </div>

    <!-- 결과 화면 -->
    <div class="screen hide" id="overScreen">
      <div id="grade">S</div>
      <div id="gradeName">강아지 마스터</div>
      <div id="finalScore">0</div>
      <div id="stats">명중률 0% · 최고 콤보 0</div>
      <div id="regret">아깝다!</div>
      <button class="btn" id="againBtn" type="button">한 판 더! 🦴</button>
      <p class="tiny">화면을 터치하거나 스페이스바를 누르면 다시 시작</p>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var stage = document.getElementById('stage');
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');

  var elScore = document.getElementById('score');
  var elLives = document.getElementById('lives');
  var elTime = document.getElementById('time');
  var elBar = document.getElementById('timebar');
  var elCombo = document.getElementById('comboBox');
  var elBanner = document.getElementById('banner');
  var elBannerText = elBanner.querySelector('span');
  var titleScreen = document.getElementById('titleScreen');
  var overScreen = document.getElementById('overScreen');
  var startBtn = document.getElementById('startBtn');
  var againBtn = document.getElementById('againBtn');
  var muteBtn = document.getElementById('muteBtn');
  var elBestTitle = document.getElementById('bestTitle');
  var elGrade = document.getElementById('grade');
  var elGradeName = document.getElementById('gradeName');
  var elFinal = document.getElementById('finalScore');
  var elStats = document.getElementById('stats');
  var elRegret = document.getElementById('regret');

  var BEST_KEY = 'whackamole_best_v2';
  function loadBest() {
    try {
      var v = window.localStorage.getItem(BEST_KEY);
      var n = parseInt(v, 10);
      return isFinite(n) && n > 0 ? n : 0;
    } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { window.localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* ignore */ }
  }
  var best = loadBest();
  elBestTitle.textContent = '최고 기록: ' + best + '점';

  var AC = null, master = null, muted = false;

  function audioReady() {
    if (!AC) {
      try {
        var Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) return null;
        AC = new Ctor();
        master = AC.createGain();
        master.gain.value = 0.25;
        master.connect(AC.destination);
      } catch (e) { AC = null; master = null; return null; }
    }
    if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
    return AC;
  }

  function tone(freq, dur, type, vol, delay, slideTo) {
    if (!AC || !master || muted) return;
    try {
      var t0 = AC.currentTime + (delay || 0);
      var osc = AC.createOscillator();
      var g = AC.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.3, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(master);
      osc.start(t0); osc.stop(t0 + dur + 0.03);
    } catch (e) {}
  }

  function noiseBurst(dur, vol, cutoff, delay, sweepTo) {
    if (!AC || !master || muted) return;
    try {
      var t0 = AC.currentTime + (delay || 0);
      var len = Math.max(1, Math.floor(AC.sampleRate * dur));
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = AC.createBufferSource(); src.buffer = buf;
      var f = AC.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(cutoff || 1200, t0);
      if (sweepTo) f.frequency.exponentialRampToValueAtTime(Math.max(60, sweepTo), t0 + dur);
      var g = AC.createGain();
      g.gain.setValueAtTime(vol || 0.3, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t0); src.stop(t0 + dur + 0.02);
    } catch (e) {}
  }

  var SCALE = [261.6, 293.7, 329.6, 349.2, 392.0, 440.0, 493.9, 523.3, 587.3, 659.3, 698.5, 784.0];
  function sndHit(comboVal) {
    var idx = Math.min(SCALE.length - 1, Math.max(0, comboVal - 1));
    var f = SCALE[idx];
    noiseBurst(0.06, 0.35, 2600, 0, 500);
    tone(f, 0.11, 'square', 0.26, 0.005);
    tone(f * 2, 0.08, 'triangle', 0.14, 0.01);
  }
  function sndGold() {
    tone(783.9, 0.1, 'triangle', 0.28, 0);
    tone(987.7, 0.1, 'triangle', 0.28, 0.07);
    tone(1174.6, 0.16, 'triangle', 0.3, 0.14);
    tone(1567.9, 0.2, 'sine', 0.2, 0.21);
  }
  function sndBomb() {
    noiseBurst(0.45, 0.6, 900, 0, 60);
    tone(160, 0.45, 'sawtooth', 0.32, 0, 40);
  }
  function sndShield() {
    tone(440, 0.08, 'square', 0.28, 0, 880);
    noiseBurst(0.05, 0.3, 3000, 0);
  }
  function sndMiss() { noiseBurst(0.13, 0.2, 700, 0, 220); }
  function sndEscape() { tone(330, 0.13, 'sine', 0.16, 0, 180); }
  function sndCombo(level) {
    var b = 523.3 * Math.pow(1.06, level);
    tone(b, 0.1, 'triangle', 0.25, 0);
    tone(b * 1.5, 0.12, 'triangle', 0.22, 0.06);
    tone(b * 2, 0.16, 'sine', 0.18, 0.12);
  }
  function sndStart() {
    tone(392, 0.11, 'square', 0.26, 0);
    tone(523.3, 0.11, 'square', 0.26, 0.1);
    tone(659.3, 0.22, 'square', 0.28, 0.2);
  }
  function sndOver() {
    tone(523.3, 0.16, 'square', 0.24, 0);
    tone(392, 0.16, 'square', 0.24, 0.15);
    tone(311.1, 0.16, 'square', 0.24, 0.3);
    tone(261.6, 0.4, 'square', 0.26, 0.45);
  }
  function sndTick(last) {
    tone(last ? 1046 : 880, 0.07, 'square', 0.18, 0);
  }
  function sndRecord() {
    tone(523.3, 0.1, 'triangle', 0.26, 0);
    tone(659.3, 0.1, 'triangle', 0.26, 0.09);
    tone(784, 0.1, 'triangle', 0.26, 0.18);
    tone(1046.5, 0.35, 'triangle', 0.3, 0.27);
  }
  function sndMouse() {
    tone(1046.5, 0.08, 'sine', 0.28, 0, 1500);
    tone(1567.9, 0.12, 'triangle', 0.22, 0.06, 1200);
  }

  muteBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    if (!muted) { audioReady(); tone(660, 0.09, 'triangle', 0.22, 0); }
  });

  var W = 360, H = 480, DPR = 1;
  var L = null;

  function resize() {
    var r = stage.getBoundingClientRect();
    W = Math.max(200, Math.round(r.width));
    H = Math.max(240, Math.round(r.height));
    DPR = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    computeLayout();
  }

  function computeLayout() {
    var padX = W * 0.06;
    var top = H * 0.18;
    var bottom = H * 0.05;
    var gridW = W - padX * 2;
    var gridH = H - top - bottom;
    var cw = gridW / 3;
    var ch = gridH / 5;
    var cells = [];
    for (var i = 0; i < 15; i++) {
      var col = i % 3, row = (i / 3) | 0;
      cells.push({
        cx: padX + cw * (col + 0.5),
        cy: top + ch * (row + 0.78)
      });
    }
    L = {
      cells: cells,
      cw: cw, ch: ch,
      top: top,
      rx: Math.min(cw * 0.42, ch * 0.46),
      ry: Math.min(cw * 0.42, ch * 0.46) * 0.42,
      rise: ch * 0.62,
      horizon: H * 0.26
    };
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });
  if (window.ResizeObserver) {
    try { new ResizeObserver(resize).observe(stage); } catch (e) {}
  }

  var STATE = { TITLE: 0, PLAY: 1, OVER: 2 };
  var state = STATE.TITLE;

  var GAME_TIME = 60;

  var holes = [];
  for (var h = 0; h < 15; h++) {
    holes.push({ state: 'idle', type: 'normal', time: 0, dur: 1, hitTime: 0, hp: 1, maxHp: 1, seed: Math.random() * 10 });
  }

  var score = 0, lives = 1, combo = 0, maxCombo = 0;
  var swings = 0, hits = 0;
  var timeLeft = GAME_TIME, elapsed = 0;
  var spawnTimer = 0;
  var shake = 0, hitstop = 0, flash = 0, flashColor = '255,255,255';
  var particles = [], pops = [];
  var events = [];
  var lastTickSec = -1;
  var hammer = { x: -999, y: -999, swing: 0, show: 0 };
  var bgTime = 0;

  function resetGame() {
    for (var i = 0; i < 15; i++) {
      holes[i].state = 'idle';
      holes[i].time = 0;
      holes[i].dur = 1;
      holes[i].hitTime = 0;
      holes[i].type = 'normal';
      holes[i].hp = 1;
      holes[i].maxHp = 1;
    }
    score = 0; lives = 1; combo = 0; maxCombo = 0;
    swings = 0; hits = 0;
    timeLeft = GAME_TIME; elapsed = 0;
    spawnTimer = 0.35;
    shake = 0; hitstop = 0; flash = 0;
    particles.length = 0; pops.length = 0;
    lastTickSec = -1;
    events = [
      { t: 6, text: '🤎 갈색 강아지 조심! 때리면 -20', done: false },
      { t: 12, text: '🐱 고양이 & 🐭 쥐강아지 등장!', done: false },
      { t: 18, text: '✨ 황금 강아지 등장! 놓치지 마세요!', done: false },
      { t: 30, text: '🔥 강아지 러시! 더 빨라진다!', done: false },
      { t: 45, text: '🌟 황금 폭풍! 지금이 기회야!', done: false },
      { t: 55, text: '⏰ 마지막 5초! 전력으로!', done: false }
    ];
    updateHUD();
    showCombo(false);
  }

  function updateHUD() {
    elScore.textContent = String(score);
    var hearts = '';
    for (var i = 0; i < 1; i++) hearts += (i < lives ? '❤️' : '🖤');
    elLives.textContent = hearts;
    var t = Math.max(0, Math.ceil(timeLeft));
    elTime.textContent = String(t);
    var ratio = Math.max(0, Math.min(1, timeLeft / GAME_TIME));
    elBar.style.width = (ratio * 100).toFixed(1) + '%';
    if (timeLeft <= 10) { elTime.classList.add('warn'); elBar.classList.add('warn'); }
    else { elTime.classList.remove('warn'); elBar.classList.remove('warn'); }
  }

  function showCombo(on) {
    if (!on) { elCombo.classList.remove('on'); return; }
    elCombo.textContent = '🔥 ' + combo + '콤보!';
    elCombo.classList.add('on');
    elCombo.classList.remove('pop');
    void elCombo.offsetWidth;
    elCombo.classList.add('pop');
  }

  function banner(text) {
    elBannerText.textContent = text;
    elBanner.classList.remove('show');
    void elBanner.offsetWidth;
    elBanner.classList.add('show');
  }

  function addParticles(x, y, n, colors, power, kind) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = (0.4 + Math.random()) * power;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - power * 0.5,
        life: 0.45 + Math.random() * 0.45,
        max: 0.9,
        r: (kind === 'smoke' ? 6 : 3) + Math.random() * 4,
        c: colors[(Math.random() * colors.length) | 0],
        kind: kind || 'dot',
        rot: Math.random() * 6.3,
        vr: (Math.random() - 0.5) * 12
      });
    }
    if (particles.length > 320) particles.splice(0, particles.length - 320);
  }

  function addPop(x, y, text, color, size) {
    pops.push({ x: x, y: y, text: text, c: color, life: 0.95, size: size || 26, vy: -60 });
    if (pops.length > 24) pops.shift();
  }

  function doShake(v) { shake = Math.min(26, shake + v); }
  function doFlash(v, color) { flash = Math.max(flash, v); flashColor = color || '255,255,255'; }

  function progress() { return Math.max(0, Math.min(1, elapsed / GAME_TIME)); }

  function activeCount() {
    var n = 0;
    for (var i = 0; i < holes.length; i++) if (holes[i].state === 'up') n++;
    return n;
  }

  function maxActive() {
    if (elapsed < 4) return 2;
    var n = 2 + Math.floor(progress() * 5);
    if (elapsed >= 30) n += 1;
    return Math.min(8, n);
  }

  function spawnInterval() {
    var v = 1.05 - 0.66 * progress();
    if (elapsed >= 30) v *= 0.78;
    if (elapsed >= 45) v *= 0.88;
    return Math.max(0.22, v);
  }

  function pickType() {
    if (elapsed < 7) return 'normal';
    var r = Math.random();
    var bombP = elapsed >= 7 ? (elapsed >= 25 ? 0.15 : 0.09) : 0;
    var toughP = elapsed >= 12 ? 0.16 : 0;
    var goldP = elapsed >= 18 ? (elapsed >= 45 ? 0.18 : 0.09) : 0;
    var mouseP = elapsed >= 12 ? 0.15 : 0;

    if (r < bombP) return 'bomb';
    if (r < bombP + toughP) return 'tough';
    if (r < bombP + toughP + goldP) return 'gold';
    if (r < bombP + toughP + goldP + mouseP) return 'mouse';
    return 'normal';
  }

  function upDuration(type) {
    var p = progress();
    if (type === 'mouse') return 0.85 - 0.25 * p;
    if (type === 'gold') return 1.25 - 0.30 * p;
    if (type === 'bomb') return 1.30 - 0.35 * p;
    if (type === 'tough') return 2.10 - 0.50 * p;
    if (elapsed < 4) return 2.1;
    return 1.55 - 0.80 * p;
  }

  function spawnMole(forceType) {
    var free = [];
    for (var i = 0; i < holes.length; i++) if (holes[i].state === 'idle') free.push(i);
    if (!free.length) return;
    var idx = free[(Math.random() * free.length) | 0];
    var m = holes[idx];
    m.type = forceType || pickType();
    m.state = 'up';
    m.time = 0;
    m.dur = upDuration(m.type);
    m.hitTime = 0;
    m.hp = (m.type === 'tough') ? 2 : 1;
    m.maxHp = m.hp;
    m.seed = Math.random() * 10;
  }

  function spawnMultipleMoles(count) {
    for (var c = 0; c < count; c++) {
      if (activeCount() < maxActive()) {
        spawnMole(elapsed < 4 ? 'normal' : null);
      }
    }
  }

  function breakCombo(reason) {
    if (combo >= 3) {
      addPop(W * 0.5, L.top + L.ch * 0.4, '콤보 끊김!', '#ff8a8a', 22);
    }
    combo = 0;
    showCombo(false);
    if (reason === 'escape') sndEscape();
  }

  function hitMole(idx) {
    var m = holes[idx];
    var c = L.cells[idx];
    var pop = molePop(m);
    var mx = c.cx, my = c.cy - L.rise * pop * 0.55;

    if (m.type === 'bomb') {
      m.state = 'hit'; m.hitTime = 0;
      score = Math.max(0, score - 20);
      lives -= 1;
      combo = 0; showCombo(false);
      doShake(22); doFlash(0.6, '255,80,80'); hitstop = 0.09;
      addParticles(mx, my, 26, ['#ff5252', '#ffb703', '#333333', '#888888'], 320, 'smoke');
      addPop(mx, my - 10, '-20', '#ff6b6b', 34);
      sndBomb();
      updateHUD();
      if (lives <= 0) { setTimeout(gameOver, 260); }
      return;
    }

    if (m.type === 'tough' && m.hp > 1) {
      m.hp -= 1;
      hits += 1;
      doShake(8);
      addParticles(mx, my, 14, ['#ffb703', '#ffffff', '#fb8500'], 220, 'star');
      addPop(mx, my - 10, '1번 더! (1/2)', '#ffb703', 28);
      sndShield();
      return;
    }

    if (m.type === 'mouse') {
      m.state = 'hit'; m.hitTime = 0;
      score = Math.max(0, score - 10);
      combo = 0; showCombo(false);
      hitstop = 0.06;
      doShake(10);
      doFlash(0.2, '255,150,150');
      addParticles(mx, my, 18, ['#a5b4fc', '#ff6b6b', '#ffffff'], 240, 'dot');
      addPop(mx, my - 10, '-10 🐭', '#ff6b6b', 34);
      sndMouse();
      updateHUD();
      return;
    }

    combo += 1;
    if (combo > maxCombo) maxCombo = combo;
    hits += 1;
    var base = (m.type === 'gold') ? 50 : (m.type === 'tough' ? 30 : 10);
    var gain = base;
    score += gain;

    m.state = 'hit'; m.hitTime = 0;
    hitstop = (m.type === 'gold') ? 0.075 : 0.05;
    doShake(m.type === 'gold' ? 12 : 6);

    if (m.type === 'gold') {
      doFlash(0.35, '255,220,120');
      addParticles(mx, my, 26, ['#ffe066', '#fff3b0', '#ffd166', '#ffffff'], 300, 'star');
      addPop(mx, my - 10, '+' + gain, '#ffe066', 38);
      sndGold();
    } else {
      addParticles(mx, my, 14, ['#c98a4b', '#8b5a2b', '#ffe066', '#ffffff'], 240, 'dot');
      addPop(mx, my - 10, '+' + gain, '#ffffff', 28);
      sndHit(combo);
    }

    if (combo >= 2) showCombo(true);
    if (combo % 5 === 0) {
      var bonus = 5;
      score += bonus;
      addPop(W * 0.5, L.top + L.ch * 0.3, combo + '연속! +' + bonus, '#7dffb0', 26);
      addParticles(W * 0.5, L.top + L.ch * 0.35, 18, ['#7dffb0', '#ffe066', '#ffffff'], 260, 'star');
      doFlash(0.22, '160,255,200');
      sndCombo(Math.floor(combo / 5));
      banner('🔥 ' + combo + '연속! 보너스 +5점!');
    }
    updateHUD();
  }

  function swingAt(x, y, fromKey) {
    if (state !== STATE.PLAY) return;
    swings += 1;
    hammer.x = x; hammer.y = y; hammer.swing = 0.001; hammer.show = 1;

    var found = -1, bestD = 1e9;
    for (var i = 0; i < holes.length; i++) {
      var m = holes[i];
      if (m.state !== 'up') continue;
      var p = molePop(m);
      if (p < 0.2) continue;
      var c = L.cells[i];
      var my = c.cy - L.rise * p * 0.55;
      var dx = (x - c.cx) / (L.cw * 0.65);
      var dy = (y - my) / (L.ch * 0.60);
      var d = dx * dx + dy * dy;
      if (d <= 1.5 && d < bestD) { bestD = d; found = i; }
    }

    if (found >= 0) { hitMole(found); return; }

    combo = 0; showCombo(false);
    sndMiss();
    addParticles(x, y, 7, ['#ffffff', '#cfe8ff'], 130, 'dot');
    if (!fromKey) addPop(x, y - 6, '헛스윙!', 'rgba(255,255,255,.75)', 18);
    doShake(3);
  }

  function molePop(m) {
    if (m.state === 'hit') return 1;
    if (m.state !== 'up') return 0;
    var riseT = 0.14, sinkT = 0.18;
    if (m.time < riseT) {
      var k = m.time / riseT;
      return 1 - Math.pow(1 - k, 3);
    }
    if (m.time > m.dur - sinkT) {
      var k2 = Math.max(0, (m.dur - m.time) / sinkT);
      return k2 * k2;
    }
    return 1;
  }

  function update(dt) {
    bgTime += dt;

    if (shake > 0) shake = Math.max(0, shake - dt * 60);
    if (flash > 0) flash = Math.max(0, flash - dt * 2.6);
    if (hammer.show > 0) hammer.show = Math.max(0, hammer.show - dt * 1.6);
    if (hammer.swing > 0) { hammer.swing += dt; if (hammer.swing > 0.26) hammer.swing = 0; }

    var i;
    for (i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += (p.kind === 'smoke' ? -180 : 900) * dt;
      p.vx *= 0.99;
      p.rot += p.vr * dt;
    }
    for (i = pops.length - 1; i >= 0; i--) {
      var q = pops[i];
      q.life -= dt;
      if (q.life <= 0) { pops.splice(i, 1); continue; }
      q.y += q.vy * dt;
      q.vy *= 0.94;
    }

    if (state === STATE.TITLE) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnTimer = 0.55 + Math.random() * 0.5;
        if (activeCount() < 3) {
          var free = [];
          for (i = 0; i < holes.length; i++) if (holes[i].state === 'idle') free.push(i);
          if (free.length) {
            var idx = free[(Math.random() * free.length) | 0];
            var mm = holes[idx];
            mm.state = 'up';
            mm.time = 0;
            mm.dur = 1.2 + Math.random() * 0.8;
            mm.type = Math.random() < 0.18 ? 'gold' : 'normal';
            mm.seed = Math.random() * 10;
          }
        }
      }
      for (i = 0; i < holes.length; i++) {
        var tm = holes[i];
        if (tm.state === 'up') {
          tm.time += dt;
          if (tm.time >= tm.dur) { tm.state = 'idle'; tm.time = 0; }
        } else if (tm.state === 'hit') {
          tm.hitTime += dt;
          if (tm.hitTime > 0.3) { tm.state = 'idle'; tm.time = 0; }
        }
      }
      return;
    }

    if (state !== STATE.PLAY) return;

    if (hitstop > 0) {
      hitstop -= dt;
      dt = dt * 0.06;
    }

    elapsed += dt;
    timeLeft -= dt;

    var sec = Math.ceil(timeLeft);
    if (timeLeft <= 10 && sec !== lastTickSec && sec >= 0) {
      lastTickSec = sec;
      sndTick(sec <= 3);
    }

    for (i = 0; i < events.length; i++) {
      if (!events[i].done && elapsed >= events[i].t) {
        events[i].done = true;
        banner(events[i].text);
        doFlash(0.25, '255,240,180');
        sndCombo(2);
      }
    }

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnTimer = spawnInterval();
      if (activeCount() < maxActive()) {
        spawnMultipleMoles(activeCount() === 0 ? 2 : 1);
      }
    }

    for (i = 0; i < holes.length; i++) {
      var m = holes[i];
      if (m.state === 'up') {
        m.time += dt;
        if (m.time >= m.dur) {
          m.state = 'idle';
          m.time = 0;
          if (m.type !== 'bomb') {
            var c = L.cells[i];
            addPop(c.cx, c.cy - 14, '놓쳤다!', '#9fb6d9', 18);
            if (combo > 0) breakCombo('escape'); else sndEscape();
          }
        }
      } else if (m.state === 'hit') {
        m.hitTime += dt;
        if (m.hitTime > 0.3) { m.state = 'idle'; m.time = 0; }
      }
    }

    updateHUD();

    if (timeLeft <= 0) {
      timeLeft = 0;
      updateHUD();
      gameOver();
    }
  }

  function font(size, weight) {
    return (weight || 900) + ' ' + Math.round(size) + 'px -apple-system, BlinkMacSystemFont, system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
  }

  function drawBackground() {
    var sky = ctx.createLinearGradient(0, 0, 0, L.horizon + 10);
    sky.addColorStop(0, '#64dfdf');
    sky.addColorStop(0.6, '#80ffdb');
    sky.addColorStop(1, '#b7e4c7');
    ctx.fillStyle = sky;
    ctx.fillRect(-40, -40, W + 80, L.horizon + 50);

    ctx.save();
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#fff';
    for (var r = 0; r < 6; r++) {
      var angle = bgTime * 0.1 + (r * Math.PI / 3);
      ctx.beginPath();
      ctx.moveTo(W * 0.85, H * 0.08);
      ctx.lineTo(W * 0.85 + Math.cos(angle - 0.2) * W, H * 0.08 + Math.sin(angle - 0.2) * H);
      ctx.lineTo(W * 0.85 + Math.cos(angle + 0.2) * W, H * 0.08 + Math.sin(angle + 0.2) * H);
      ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = '#fff75e';
    ctx.beginPath();
    ctx.arc(W * 0.85, H * 0.08, W * 0.08, 0, 6.2832);
    ctx.fill();
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.arc(W * 0.85, H * 0.08, W * 0.12 + Math.sin(bgTime * 2) * 3, 0, 6.2832);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,.88)';
    for (var k = 0; k < 3; k++) {
      var cxp = ((bgTime * (5 + k * 3) + k * W * 0.38) % (W + 140)) - 70;
      var cyp = H * (0.05 + k * 0.038);
      var s = W * (0.05 + k * 0.01);
      ctx.beginPath();
      ctx.arc(cxp, cyp, s, 0, 6.2832);
      ctx.arc(cxp + s * 0.85, cyp + s * 0.15, s * 0.75, 0, 6.2832);
      ctx.arc(cxp - s * 0.85, cyp + s * 0.2, s * 0.62, 0, 6.2832);
      ctx.fill();
    }

    ctx.fillStyle = '#2d6a4f';
    ctx.fillRect(-20, L.horizon - H * 0.03, W + 40, H * 0.05);

    ctx.fillStyle = '#52b788';
    ctx.beginPath();
    ctx.moveTo(-20, L.horizon + 8);
    ctx.quadraticCurveTo(W * 0.3, L.horizon - H * 0.06, W * 0.6, L.horizon + 4);
    ctx.quadraticCurveTo(W * 0.85, L.horizon - H * 0.04, W + 20, L.horizon + 10);
    ctx.lineTo(W + 20, H + 20);
    ctx.lineTo(-20, H + 20);
    ctx.closePath();
    ctx.fill();

    var lawn = ctx.createLinearGradient(0, L.horizon, 0, H);
    lawn.addColorStop(0, '#74c69d');
    lawn.addColorStop(0.35, '#40916c');
    lawn.addColorStop(1, '#1b4332');
    ctx.fillStyle = lawn;
    ctx.fillRect(-20, L.horizon + 4, W + 40, H - L.horizon + 20);

    ctx.fillStyle = 'rgba(255,255,255,.05)';
    for (var stripe = 0; stripe < 6; stripe++) {
      var sy = L.horizon + stripe * (H - L.horizon) / 6;
      if (stripe % 2 === 0) {
        ctx.fillRect(-20, sy, W + 40, (H - L.horizon) / 12);
      }
    }

    var flowerColors = ['#ff4d6d', '#ffb703', '#ffffff', '#ff9e00', '#ee9b00'];
    for (var f = 0; f < 22; f++) {
      var fx = ((f * 113 + 37) % (W - 20)) + 10;
      var fy = L.horizon + 15 + ((f * 67 + 19) % (H - L.horizon - 35));
      var fc = flowerColors[f % flowerColors.length];
      
      ctx.fillStyle = fc;
      var petR = 3;
      ctx.beginPath();
      ctx.arc(fx - petR, fy, petR, 0, 6.28);
      ctx.arc(fx + petR, fy, petR, 0, 6.28);
      ctx.arc(fx, fy - petR, petR, 0, 6.28);
      ctx.arc(fx, fy + petR, petR, 0, 6.28);
      ctx.fill();
      
      ctx.fillStyle = '#ffb703';
      ctx.beginPath();
      ctx.arc(fx, fy, 2, 0, 6.28);
      ctx.fill();
    }

    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    for (var gIdx = 0; gIdx < 45; gIdx++) {
      var gx = ((gIdx * 79 + 13) % (W + 20)) - 10;
      var gy = L.horizon + 12 + ((gIdx * 53 + 7) % (H - L.horizon - 20));
      var sway = Math.sin(bgTime * 2.5 + gIdx) * 5;
      
      ctx.strokeStyle = gIdx % 2 === 0 ? '#b7e4c7' : '#74c69d';
      ctx.beginPath();
      ctx.moveTo(gx, gy);
      ctx.quadraticCurveTo(gx + sway * 0.5, gy - 7, gx + sway, gy - 14);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(gx + 4, gy);
      ctx.quadraticCurveTo(gx + 4 + sway * 0.6, gy - 5, gx + 6 + sway * 0.8, gy - 10);
      ctx.stroke();
    }
  }

  function drawHoleBack(cx, cy, rx, ry) {
    ctx.fillStyle = '#4a2c11';
    ctx.beginPath();
    ctx.ellipse(cx, cy + ry * 0.35, rx * 1.34, ry * 1.5, 0, 0, 6.2832);
    ctx.fill();
    ctx.fillStyle = '#6e4423';
    ctx.beginPath();
    ctx.ellipse(cx, cy + ry * 0.15, rx * 1.2, ry * 1.28, 0, 0, 6.2832);
    ctx.fill();
    
    ctx.fillStyle = '#1c1007';
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, 6.2832);
    ctx.fill();
    var g = ctx.createLinearGradient(0, cy - ry, 0, cy + ry);
    g.addColorStop(0, 'rgba(0,0,0,.65)');
    g.addColorStop(1, 'rgba(60,35,15,.25)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, 6.2832);
    ctx.fill();
  }

  function drawHoleFront(cx, cy, rx, ry) {
    ctx.fillStyle = '#6e4423';
    ctx.beginPath();
    ctx.ellipse(cx, cy + ry * 0.28, rx * 1.22, ry * 0.85, 0, 0, Math.PI);
    ctx.fill();
    ctx.fillStyle = '#8c592b';
    ctx.beginPath();
    ctx.ellipse(cx, cy + ry * 0.45, rx * 1.08, ry * 0.65, 0, 0, Math.PI);
    ctx.fill();

    ctx.fillStyle = '#40916c';
    ctx.beginPath();
    for (var b = -5; b <= 5; b++) {
      var angle = Math.PI * 0.1 + (b + 5) * (Math.PI * 0.8 / 10);
      var bx = cx + Math.cos(angle) * (rx * 1.15);
      var by = cy + Math.sin(angle) * (ry * 0.7);
      ctx.moveTo(bx, by);
      ctx.lineTo(bx + (b % 2 === 0 ? -4 : 4), by + 8);
      ctx.lineTo(bx + (b % 2 === 0 ? 3 : -3), by + 12);
    }
    ctx.fill();

    ctx.strokeStyle = '#74c69d';
    ctx.lineWidth = 2;
    for (var t = -4; t <= 4; t++) {
      var tx = cx + t * (rx * 0.24);
      var ty = cy + ry * 0.35 + Math.abs(t) * 1.5;
      var sway = Math.sin(bgTime * 3 + tx) * 3;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.quadraticCurveTo(tx + sway, ty + 6, tx + sway * 1.2, ty + 12);
      ctx.stroke();
    }
  }

  function drawMole(cx, cy, m) {
    var pop = molePop(m);
    if (pop <= 0) return;

    var headY = cy - L.rise * pop;
    var w = L.rx * 1.45;
    var h = L.rise * 0.92;

    ctx.save();

    ctx.beginPath();
    ctx.rect(-50, -50, W + 100, cy + L.ry * 0.28 + 50);
    ctx.clip();

    ctx.translate(cx, headY + h * 0.5);

    if (m.state === 'hit') {
      ctx.scale(1.15, 0.72);
    } else {
      var bob = Math.sin(bgTime * 8 + m.seed) * 2;
      ctx.translate(0, bob);
    }

    if (m.type === 'normal') {
      var bg = ctx.createLinearGradient(0, -h * 0.5, 0, h * 0.5);
      bg.addColorStop(0, '#ffffff');
      bg.addColorStop(0.7, '#f8fafc');
      bg.addColorStop(1, '#e2e8f0');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.ellipse(0, 0, w * 0.48, h * 0.48, 0, 0, 6.2832);
      ctx.fill();

      ctx.fillStyle = '#e2e8f0';
      ctx.beginPath();
      ctx.ellipse(-w * 0.42, -h * 0.1, w * 0.15, h * 0.32, 0.3, 0, 6.2832);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(w * 0.42, -h * 0.1, w * 0.15, h * 0.32, -0.3, 0, 6.2832);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(-w * 0.40, -h * 0.08, w * 0.11, h * 0.25, 0.3, 0, 6.2832);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(w * 0.40, -h * 0.08, w * 0.11, h * 0.25, -0.3, 0, 6.2832);
      ctx.fill();

      ctx.fillStyle = '#fff8f0';
      ctx.beginPath();
      ctx.ellipse(0, h * 0.12, w * 0.28, h * 0.22, 0, 0, 6.2832);
      ctx.fill();

      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.ellipse(0, h * 0.02, w * 0.1, h * 0.07, 0, 0, 6.2832);
      ctx.fill();

      if (m.state === 'hit') {
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(-w * 0.16, -h * 0.12, w * 0.06, 0, 6.28); ctx.stroke();
        ctx.beginPath();
        ctx.arc(w * 0.16, -h * 0.12, w * 0.06, 0, 6.28); ctx.stroke();
      } else {
        ctx.fillStyle = '#1d3557';
        ctx.beginPath();
        ctx.arc(-w * 0.18, -h * 0.12, w * 0.07, 0, 6.2832);
        ctx.arc(w * 0.18, -h * 0.12, w * 0.07, 0, 6.2832);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-w * 0.2, -h * 0.14, w * 0.025, 0, 6.2832);
        ctx.arc(w * 0.16, -h * 0.14, w * 0.025, 0, 6.2832);
        ctx.fill();

        ctx.fillStyle = '#ff85a1';
        ctx.beginPath();
        ctx.ellipse(0, h * 0.24, w * 0.08, h * 0.1, 0, 0, 6.2832);
        ctx.fill();
      }

      ctx.fillStyle = 'rgba(255, 150, 170, 0.45)';
      ctx.beginPath();
      ctx.arc(-w * 0.26, h * 0.05, w * 0.08, 0, 6.2832);
      ctx.arc(w * 0.26, h * 0.05, w * 0.08, 0, 6.2832);
      ctx.fill();

    } else if (m.type === 'bomb') {
      var bbg = ctx.createLinearGradient(0, -h * 0.5, 0, h * 0.5);
      bbg.addColorStop(0, '#9c6644');
      bbg.addColorStop(0.6, '#7f4f24');
      bbg.addColorStop(1, '#582f0e');
      ctx.fillStyle = bbg;
      ctx.beginPath();
      ctx.ellipse(0, 0, w * 0.48, h * 0.48, 0, 0, 6.2832);
      ctx.fill();

      ctx.fillStyle = '#4a2810';
      ctx.beginPath();
      ctx.ellipse(-w * 0.42, -h * 0.08, w * 0.16, h * 0.32, 0.3, 0, 6.2832);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(w * 0.42, -h * 0.08, w * 0.16, h * 0.32, -0.3, 0, 6.2832);
      ctx.fill();

      ctx.fillStyle = '#e6ccb2';
      ctx.beginPath();
      ctx.ellipse(0, h * 0.12, w * 0.28, h * 0.22, 0, 0, 6.2832);
      ctx.fill();

      ctx.fillStyle = '#2b1e16';
      ctx.beginPath();
      ctx.ellipse(0, h * 0.02, w * 0.1, h * 0.07, 0, 0, 6.2832);
      ctx.fill();

      ctx.fillStyle = '#e63946';
      ctx.beginPath();
      ctx.roundRect(-w * 0.35, h * 0.30, w * 0.7, h * 0.12, 3);
      ctx.fill();
      ctx.fillStyle = '#ffb703';
      ctx.beginPath();
      ctx.arc(-w * 0.2, h * 0.36, 2.5, 0, 6.2832);
      ctx.arc(0, h * 0.36, 2.5, 0, 6.2832);
      ctx.arc(w * 0.2, h * 0.36, 2.5, 0, 6.2832);
      ctx.fill();

      if (m.state === 'hit') {
        ctx.strokeStyle = '#2b1e16';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(-w * 0.16, -h * 0.12, w * 0.06, 0, 6.28); ctx.stroke();
        ctx.beginPath();
        ctx.arc(w * 0.16, -h * 0.12, w * 0.06, 0, 6.28); ctx.stroke();
      } else {
        ctx.strokeStyle = '#2b1e16';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-w * 0.24, -h * 0.22); ctx.lineTo(-w * 0.08, -h * 0.14);
        ctx.moveTo(w * 0.24, -h * 0.22); ctx.lineTo(w * 0.08, -h * 0.14);
        ctx.stroke();

        ctx.fillStyle = '#2b1e16';
        ctx.beginPath();
        ctx.arc(-w * 0.16, -h * 0.08, w * 0.065, 0, 6.2832);
        ctx.arc(w * 0.16, -h * 0.08, w * 0.065, 0, 6.2832);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-w * 0.18, -h * 0.10, w * 0.025, 0, 6.2832);
        ctx.arc(w * 0.14, -h * 0.10, w * 0.025, 0, 6.2832);
        ctx.fill();
      }

    } else if (m.type === 'tough') {
      var tbg = ctx.createLinearGradient(0, -h * 0.5, 0, h * 0.5);
      tbg.addColorStop(0, '#ffffff');
      tbg.addColorStop(0.7, '#f8fafc');
      tbg.addColorStop(1, '#e2e8f0');
      ctx.fillStyle = tbg;
      ctx.beginPath();
      ctx.ellipse(0, 0, w * 0.48, h * 0.48, 0, 0, 6.2832);
      ctx.fill();

      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.ellipse(w * 0.22, -h * 0.2, w * 0.22, h * 0.22, -0.3, 0, 6.2832);
      ctx.fill();

      ctx.fillStyle = '#27272a';
      ctx.beginPath();
      ctx.ellipse(-w * 0.22, -h * 0.18, w * 0.2, h * 0.2, 0.3, 0, 6.2832);
      ctx.fill();

      ctx.fillStyle = '#27272a';
      ctx.beginPath();
      ctx.moveTo(-w * 0.42, -h * 0.1);
      ctx.lineTo(-w * 0.22, -h * 0.62);
      ctx.lineTo(-w * 0.08, -h * 0.25);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(w * 0.42, -h * 0.1);
      ctx.lineTo(w * 0.22, -h * 0.62);
      ctx.lineTo(w * 0.08, -h * 0.25);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.moveTo(-w * 0.38, -h * 0.14);
      ctx.lineTo(-w * 0.22, -h * 0.52);
      ctx.lineTo(-w * 0.12, -h * 0.25);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(w * 0.38, -h * 0.14);
      ctx.lineTo(w * 0.22, -h * 0.52);
      ctx.lineTo(w * 0.12, -h * 0.25);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(0, h * 0.12, w * 0.26, h * 0.18, 0, 0, 6.2832);
      ctx.fill();

      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.moveTo(0, h * 0.08);
      ctx.lineTo(-w * 0.06, h * 0.02);
      ctx.lineTo(w * 0.06, h * 0.02);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#52525b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-w * 0.18, h * 0.08); ctx.lineTo(-w * 0.48, h * 0.02);
      ctx.moveTo(-w * 0.18, h * 0.12); ctx.lineTo(-w * 0.5, h * 0.12);
      ctx.moveTo(-w * 0.18, h * 0.16); ctx.lineTo(-w * 0.46, h * 0.22);

      ctx.moveTo(w * 0.18, h * 0.08); ctx.lineTo(w * 0.48, h * 0.02);
      ctx.moveTo(w * 0.18, h * 0.12); ctx.lineTo(w * 0.5, h * 0.12);
      ctx.moveTo(w * 0.18, h * 0.16); ctx.lineTo(w * 0.46, h * 0.22);
      ctx.stroke();

      if (m.state === 'hit') {
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(-w * 0.16, -h * 0.08, w * 0.06, 0, 6.28); ctx.stroke();
        ctx.beginPath();
        ctx.arc(w * 0.16, -h * 0.08, w * 0.06, 0, 6.28); ctx.stroke();
      } else {
        ctx.fillStyle = '#10b981';
        ctx.beginPath();
        ctx.ellipse(-w * 0.17, -h * 0.08, w * 0.08, h * 0.09, 0, 0, 6.2832);
        ctx.ellipse(w * 0.17, -h * 0.08, w * 0.08, h * 0.09, 0, 0, 6.2832);
        ctx.fill();

        ctx.fillStyle = '#064e3b';
        ctx.beginPath();
        ctx.ellipse(-w * 0.17, -h * 0.08, w * 0.03, h * 0.07, 0, 0, 6.2832);
        ctx.ellipse(w * 0.17, -h * 0.08, w * 0.03, h * 0.07, 0, 0, 6.2832);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-w * 0.19, -h * 0.11, w * 0.025, 0, 6.2832);
        ctx.arc(w * 0.15, -h * 0.11, w * 0.025, 0, 6.2832);
        ctx.fill();
      }

      if (m.hp === 2) {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.roundRect(-w * 0.32, h * 0.28, w * 0.64, h * 0.1, 3);
        ctx.fill();

        ctx.fillStyle = '#eab308';
        ctx.beginPath();
        ctx.arc(0, h * 0.33, w * 0.08, 0, 6.2832);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = font(10, 900);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🐱 2x', 0, -h * 0.45);
      } else {
        ctx.save();
        ctx.translate(0, -h * 0.22);
        ctx.rotate(0.2);
        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.roundRect(-w * 0.2, -h * 0.06, w * 0.4, h * 0.12, 4);
        ctx.fill();
        ctx.fillStyle = '#facc15';
        ctx.fillRect(-w * 0.06, -h * 0.06, w * 0.12, h * 0.12);
        ctx.restore();

        ctx.fillStyle = '#ffffff';
        ctx.font = font(10, 900);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('💥 1x', 0, -h * 0.45);
      }
    } else if (m.type === 'mouse') {
      var mbg = ctx.createLinearGradient(0, -h * 0.5, 0, h * 0.5);
      mbg.addColorStop(0, '#e2e8f0');
      mbg.addColorStop(0.6, '#cbd5e1');
      mbg.addColorStop(1, '#94a3b8');
      ctx.fillStyle = mbg;
      ctx.beginPath();
      ctx.ellipse(0, 0, w * 0.46, h * 0.48, 0, 0, 6.2832);
      ctx.fill();

      ctx.fillStyle = '#cbd5e1';
      ctx.beginPath();
      ctx.arc(-w * 0.38, -h * 0.32, w * 0.22, 0, 6.2832);
      ctx.arc(w * 0.38, -h * 0.32, w * 0.22, 0, 6.2832);
      ctx.fill();

      ctx.fillStyle = '#f472b6';
      ctx.beginPath();
      ctx.arc(-w * 0.38, -h * 0.32, w * 0.14, 0, 6.2832);
      ctx.arc(w * 0.38, -h * 0.32, w * 0.14, 0, 6.2832);
      ctx.fill();

      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.ellipse(0, h * 0.14, w * 0.24, h * 0.18, 0, 0, 6.2832);
      ctx.fill();

      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.ellipse(0, h * 0.04, w * 0.07, h * 0.05, 0, 0, 6.2832);
      ctx.fill();

      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(-w * 0.15, h * 0.08); ctx.lineTo(-w * 0.44, h * 0.02);
      ctx.moveTo(-w * 0.15, h * 0.13); ctx.lineTo(-w * 0.45, h * 0.14);
      ctx.moveTo(w * 0.15, h * 0.08); ctx.lineTo(w * 0.44, h * 0.02);
      ctx.moveTo(w * 0.15, h * 0.13); ctx.lineTo(w * 0.45, h * 0.14);
      ctx.stroke();

      if (m.state === 'hit') {
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(-w * 0.16, -h * 0.08, w * 0.05, 0, 6.28); ctx.stroke();
        ctx.beginPath();
        ctx.arc(w * 0.16, -h * 0.08, w * 0.05, 0, 6.28); ctx.stroke();
      } else {
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(-w * 0.16, -h * 0.08, w * 0.065, 0, 6.2832);
        ctx.arc(w * 0.16, -h * 0.08, w * 0.065, 0, 6.2832);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-w * 0.18, -h * 0.10, w * 0.025, 0, 6.2832);
        ctx.arc(w * 0.14, -h * 0.10, w * 0.025, 0, 6.2832);
        ctx.fill();
      }

      ctx.fillStyle = 'rgba(244, 114, 182, 0.4)';
      ctx.beginPath();
      ctx.arc(-w * 0.25, h * 0.06, w * 0.07, 0, 6.2832);
      ctx.arc(w * 0.25, h * 0.06, w * 0.07, 0, 6.2832);
      ctx.fill();

    }

    ctx.restore();
  }

  function drawHammer() {
    if (hammer.show <= 0) return;
    ctx.save();
    ctx.translate(hammer.x, hammer.y);

    var rot = -0.6;
    if (hammer.swing > 0) {
      var p = hammer.swing / 0.26;
      rot = -0.6 + Math.sin(p * Math.PI) * 1.4;
    }
    ctx.rotate(rot);

    ctx.shadowColor = 'rgba(0, 0, 0, 0.32)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 4;

    var bg = ctx.createLinearGradient(-16, -80, 16, -10);
    bg.addColorStop(0, '#fffbf0');
    bg.addColorStop(0.35, '#faedcd');
    bg.addColorStop(0.75, '#e9c46a');
    bg.addColorStop(1, '#d4a373');

    ctx.fillStyle = bg;
    ctx.strokeStyle = '#bc6c25';
    ctx.lineWidth = 2.5;

    ctx.beginPath();
    ctx.roundRect(-10, -78, 20, 62, 6);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(-13, -78, 12, 0, 6.2832);
    ctx.arc(13, -78, 12, 0, 6.2832);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(-12, -18, 11, 0, 6.2832);
    ctx.arc(12, -18, 11, 0, 6.2832);
    ctx.fill();
    ctx.stroke();

    ctx.shadowColor = 'transparent';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.beginPath();
    ctx.roundRect(-5, -74, 5, 52, 3);
    ctx.fill();

    ctx.fillStyle = '#e63946';
    ctx.beginPath();
    ctx.roundRect(-12, -50, 24, 10, 4);
    ctx.fill();

    ctx.fillStyle = '#ff4d6d';
    ctx.beginPath();
    ctx.arc(0, -45, 4.5, 0, 6.2832);
    ctx.fill();

    ctx.restore();
  }

  function drawUI() {
    var i;

    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      var alpha = Math.max(0, p.life / p.max);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.c;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      if (p.kind === 'star') {
        ctx.beginPath();
        for (var k = 0; k < 5; k++) {
          ctx.lineTo(Math.cos((18 + k * 72) * Math.PI / 180) * p.r, Math.sin((18 + k * 72) * Math.PI / 180) * p.r);
          ctx.lineTo(Math.cos((54 + k * 72) * Math.PI / 180) * (p.r * 0.5), Math.sin((54 + k * 72) * Math.PI / 180) * (p.r * 0.5));
        }
        ctx.closePath();
        ctx.fill();
      } else if (p.kind === 'smoke') {
        ctx.beginPath();
        ctx.arc(0, 0, p.r, 0, 6.2832);
        ctx.fill();
      } else {
        ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 2);
      }
      ctx.restore();
    }

    for (i = 0; i < pops.length; i++) {
      var q = pops[i];
      var a = Math.max(0, q.life / 0.95);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = font(q.size, 900);
      ctx.fillStyle = q.c;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 6;
      ctx.fillText(q.text, q.x, q.y);
      ctx.restore();
    }

    if (state === STATE.PLAY) {
      var keyLabels = ['1','2','3','4','5','6','7','8','9','0','Q','W','E','R','T'];
      ctx.font = font(10, 800);
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.textAlign = 'center';
      for (i = 0; i < holes.length; i++) {
        var c = L.cells[i];
        ctx.fillText(keyLabels[i], c.cx, c.cy + L.ry * 1.22);
      }
    }
  }

  function render() {
    ctx.save();

    if (shake > 0) {
      var sx = (Math.random() - 0.5) * shake;
      var sy = (Math.random() - 0.5) * shake;
      ctx.translate(sx, sy);
    }

    drawBackground();

    if (L) {
      for (var i = 0; i < holes.length; i++) {
        var c = L.cells[i];
        drawHoleBack(c.cx, c.cy, L.rx, L.ry);
        drawMole(c.cx, c.cy, holes[i]);
        drawHoleFront(c.cx, c.cy, L.rx, L.ry);
      }
    }

    drawHammer();
    drawUI();

    if (flash > 0) {
      ctx.fillStyle = 'rgba(' + flashColor + ',' + Math.min(0.8, flash) + ')';
      ctx.fillRect(-40, -40, W + 80, H + 80);
    }

    ctx.restore();
  }

  function gameOver() {
    if (state === STATE.OVER) return;
    state = STATE.OVER;
    sndOver();

    var acc = swings > 0 ? Math.round((hits / swings) * 100) : 0;
    elStats.textContent = '명중률 ' + acc + '% · 최고 콤보 ' + maxCombo + '회';
    elFinal.textContent = score + '점';

    var grade = 'C', gName = '강아지 친구';
    if (score >= 1200) { grade = 'S'; gName = '강아지 마스터 ⚡'; }
    else if (score >= 800) { grade = 'A'; gName = '강아지 박사 🐶'; }
    else if (score >= 500) { grade = 'B'; gName = '강아지 조련사 🍖'; }
    else if (score >= 200) { grade = 'C'; gName = '강아지 친구 🐾'; }
    else { grade = 'D'; gName = '초보 집사 🐶'; }

    elGrade.textContent = grade;
    elGradeName.textContent = gName;

    if (score > best) {
      best = score;
      saveBest(best);
      elBestTitle.textContent = '최고 기록: ' + best + '점';
      elRegret.textContent = '🎉 축하합니다! 최고 기록 달성!';
      elRegret.className = 'newRec';
      sndRecord();
    } else {
      elRegret.textContent = '더 높은 점수에 도전해보세요!';
      elRegret.className = '';
    }

    overScreen.classList.remove('hide');
  }

  function startGame() {
    audioReady();
    resetGame();
    state = STATE.PLAY;
    titleScreen.classList.add('hide');
    overScreen.classList.add('hide');
    sndStart();
  }

  function handlePointer(e) {
    if (state !== STATE.PLAY) return;
    if (e.cancelable) e.preventDefault();
    var r = cv.getBoundingClientRect();
    
    var touchList = e.changedTouches ? e.changedTouches : [e];
    for (var i = 0; i < touchList.length; i++) {
      var touch = touchList[i];
      var clientX = touch.clientX;
      var clientY = touch.clientY;
      var x = (clientX - r.left) * (W / r.width);
      var y = (clientY - r.top) * (H / r.height);
      swingAt(x, y, false);
    }
  }

  cv.addEventListener('mousedown', handlePointer);
  cv.addEventListener('touchstart', handlePointer, { passive: false });

  window.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') {
      if (state === STATE.TITLE) { startGame(); e.preventDefault(); }
      else if (state === STATE.OVER) { startGame(); e.preventDefault(); }
      return;
    }

    if (state !== STATE.PLAY) return;

    var keyMap = {
      '1': 0, '2': 1, '3': 2,
      '4': 3, '5': 4, '6': 5,
      '7': 6, '8': 7, '9': 8,
      '0': 9, 'q': 10, 'Q': 10, 'w': 11, 'W': 11,
      'e': 12, 'E': 12, 'r': 13, 'R': 13, 't': 14, 'T': 14
    };

    if (keyMap.hasOwnProperty(e.key) && L) {
      var idx = keyMap[e.key];
      var c = L.cells[idx];
      var my = c.cy - L.rise * molePop(holes[idx]) * 0.55;
      swingAt(c.cx, my, true);
    }
  });

  startBtn.addEventListener('click', startGame);
  againBtn.addEventListener('click', startGame);

  var lastTime = 0;
  function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    var dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    if (dt > 0.1) dt = 0.1;

    update(dt);
    render();

    requestAnimationFrame(loop);
  }

  function boot() {
    resize();
    requestAnimationFrame(loop);
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);

})();
</script>
</body>
</html>
