<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>둥둥 블랙홀 🕳️</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: radial-gradient(ellipse at center, #1e1b4b 0%, #090d16 60%, #030712 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  #stage {
    position: relative;
    height: min(92vh, 680px);
    aspect-ratio: 5 / 7;
    max-width: 100%;
    border-radius: 20px;
    overflow: hidden;
    background: #090d16;
    box-shadow: 0 20px 50px rgba(0,0,0,.8), 0 0 0 4px rgba(168, 85, 247, 0.25) inset;
    cursor: pointer;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; gap: 5px; align-items: center;
    padding: 8px 8px;
    font-size: 12px; font-weight: 800;
    pointer-events: none;
    text-shadow: 0 2px 0 rgba(0,0,0,.28);
    z-index: 10;
  }
  .chip {
    background: rgba(0,0,0,.30);
    border: 2px solid rgba(255,255,255,.35);
    border-radius: 999px;
    padding: 3px 8px;
    white-space: nowrap;
    backdrop-filter: blur(3px);
  }
  #chipShield.on { background: rgba(168, 85, 247, 0.55); border-color: #e9d5ff; }
  #spacer { flex: 1; }
  #muteBtn {
    pointer-events: auto;
    cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 800; color: #fff;
    background: rgba(0,0,0,.30);
    border: 2px solid rgba(255,255,255,.35);
    border-radius: 999px;
    padding: 4px 9px;
    transition: transform 0.1s ease;
  }
  #muteBtn:active { transform: scale(0.92); }

  #toast {
    position: absolute; left: 50%; top: 22%;
    transform: translate(-50%, 6px) scale(.85);
    background: rgba(20,20,40,.88);
    border: 3px solid #c084fc;
    color: #fff;
    font-weight: 900; font-size: 15px;
    padding: 9px 16px;
    border-radius: 14px;
    opacity: 0;
    transition: opacity .18s ease, transform .18s cubic-bezier(.2,1.6,.4,1);
    pointer-events: none;
    white-space: nowrap;
    z-index: 20;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    padding: 18px;
    text-align: center;
    background: linear-gradient(180deg, rgba(6,18,40,.45) 0%, rgba(6,18,40,.75) 100%);
    z-index: 30;
  }
  .overlay.hide { display: none; }

  .card {
    background: rgba(255,255,255,.95);
    color: #23324a;
    border-radius: 20px;
    padding: 16px 18px 18px;
    box-shadow: 0 14px 30px rgba(0,0,0,.35);
    border: 4px solid #c084fc;
    max-width: 320px;
    width: 100%;
  }

  h1 {
    margin: 0 0 2px;
    font-size: 30px;
    letter-spacing: -1px;
    color: #e9d5ff;
    text-shadow: 0 3px 0 #7e22ce, 0 6px 14px rgba(0,0,0,.6);
  }
  .sub { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.5); }

  .howto { font-size: 14px; font-weight: 700; line-height: 1.6; color: #3c4c66; margin: 0; }
  .howto b { color: #9333ea; }

  .bigscore { font-size: 46px; font-weight: 900; color: #9333ea; line-height: 1; margin: 2px 0 4px; }
  .medal { font-size: 40px; line-height: 1.1; }
  .medalName { font-size: 15px; font-weight: 900; color: #581c87; margin-top: -2px; }
  .regret { font-size: 15px; font-weight: 800; color: #d1495b; margin: 8px 0 2px; line-height: 1.5; }
  .regret.new { color: #059669; }
  .best { font-size: 13px; font-weight: 800; color: #5a6b85; }

  .btn {
    margin-top: 12px;
    display: inline-block;
    font-family: inherit;
    font-size: 17px; font-weight: 900; color: #ffffff;
    background: linear-gradient(180deg, #c084fc, #9333ea);
    border: 0; border-bottom: 5px solid #6b21a8;
    border-radius: 14px;
    padding: 11px 26px;
    cursor: pointer;
  }
  .btn:active { transform: translateY(3px); border-bottom-width: 2px; }

  .blink { animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  .tip { font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.55); }

  @media (max-height: 620px) {
    h1 { font-size: 24px; }
    .card { padding: 12px 14px 14px; }
    .bigscore { font-size: 38px; }
    .medal { font-size: 32px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud">
    <span class="chip" id="chipTime">⏱ 0초</span>
    <span class="chip" id="chipStar">⭐ 0점 (별 0)</span>
    <span class="chip" id="chipShield">🛡 0</span>
    <span id="spacer"></span>
    <span class="chip" id="chipBest">🏆 0</span>
    <button id="muteBtn" type="button">🔊</button>
  </div>

  <div id="toast"></div>

  <!-- 시작 화면 -->
  <div class="overlay" id="titleScreen">
    <h1>둥둥 블랙홀 🕳️</h1>
    <p class="sub">탭 한 번에 둥둥! 게이트 사이를 쏙!</p>
    <div class="card">
      <p class="howto">
        👆 <b>화면을 톡</b> 치면 위로 둥둥!<br>
        ⌨️ <b>스페이스</b> 를 눌러도 둥둥!<br>
        🟪 게이트를 지날 때마다 <b>+1점</b><br>
        ⭐ 별을 먹으면 <b>+3점</b> 과 방패!
      </p>
    </div>
    <button class="btn" id="startBtn" type="button">시작하기</button>
    <div class="tip blink">아무 데나 톡 치면 바로 시작해!</div>
  </div>

  <!-- 게임 오버 화면 -->
  <div class="overlay hide" id="overScreen">
    <h1 id="overTitle">부딪혔다!</h1>
    <div class="card">
      <div class="medal" id="overMedal">🕳️</div>
      <div class="medalName" id="overMedalName">아직 메달이 없어</div>
      <div class="bigscore" id="overScore">0</div>
      <div class="best" id="overBest">최고 기록 0개</div>
      <div class="regret" id="overRegret">한 번만 더 해볼까?</div>
    </div>
    <button class="btn" id="againBtn" type="button">다시 하기</button>
    <div class="tip blink">스페이스나 탭 한 번이면 바로 다시!</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const stage = document.getElementById("stage");
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const elTime = document.getElementById("chipTime");
  const elStar = document.getElementById("chipStar");
  const elShield = document.getElementById("chipShield");
  const elBest = document.getElementById("chipBest");
  const muteBtn = document.getElementById("muteBtn");
  const toastEl = document.getElementById("toast");
  const titleScreen = document.getElementById("titleScreen");
  const overScreen = document.getElementById("overScreen");
  const startBtn = document.getElementById("startBtn");
  const againBtn = document.getElementById("againBtn");
  const overTitle = document.getElementById("overTitle");
  const overMedal = document.getElementById("overMedal");
  const overMedalName = document.getElementById("overMedalName");
  const overScore = document.getElementById("overScore");
  const overBest = document.getElementById("overBest");
  const overRegret = document.getElementById("overRegret");

  const STORE_BEST = "flappy_bh_best";
  function loadNum(key, def) { try { var val = localStorage.getItem(key); return val !== null ? Number(val) : def; } catch(e) { return def; } }
  function saveNum(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }

  const BW = 360;
  const BH = 504;
  let S = 1;

  function resize() {
    const rect = stage.getBoundingClientRect();
    cv.width = rect.width * (window.devicePixelRatio || 1);
    cv.height = rect.height * (window.devicePixelRatio || 1);
    S = cv.width / BW;
    ctx.imageSmoothingEnabled = true;
  }
  window.addEventListener("resize", resize);

  let actx = null;
  let muted = false;

  function audioReady() {
    if (!actx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) actx = new AudioCtx();
    }
    if (actx && actx.state === "suspended") {
      actx.resume();
    }
  }

  function playTone(freq, type, duration, vol) {
    if (muted || !actx) return;
    try {
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, actx.currentTime);
      gain.gain.setValueAtTime(vol || 0.15, actx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + duration);
      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start();
      osc.stop(actx.currentTime + duration);
    } catch(e) {}
  }

  function sndFlap() { playTone(320, "sine", 0.1, 0.12); }
  function sndScore(idx) { playTone(440 + idx * 40, "triangle", 0.15, 0.15); }
  function sndHit() { playTone(120, "sawtooth", 0.25, 0.22); }
  function sndFall() { playTone(90, "sawtooth", 0.4, 0.2); }
  function sndMedal() { playTone(587.33, "sine", 0.3, 0.18); }
  function sndStart() { playTone(523.25, "sine", 0.2, 0.15); }
  function sndEvent() { playTone(659.25, "square", 0.25, 0.12); }
  function sndPerfect(c) { playTone(600 + c * 50, "sine", 0.2, 0.18); }
  function sndStar() { playTone(880, "sine", 0.18, 0.18); }
  function sndShieldGet() { playTone(783.99, "sine", 0.3, 0.2); }
  function sndShieldBreak() { playTone(200, "square", 0.3, 0.22); }

  muteBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    muted = !muted;
    muteBtn.textContent = muted ? "🔇" : "🔊";
  });

  const STATE_TITLE = 0;
  const STATE_READY = 1;
  const STATE_PLAY = 2;
  const STATE_PAUSE = 3;
  const STATE_DYING = 4;
  const STATE_OVER = 5;

  const GROUND_H = 70;
  const PIPE_W = 54;
  const BIRD_R = 17;

  let state = STATE_TITLE;
  let score = 0;
  let best = loadNum(STORE_BEST, 0);
  let passed = 0;
  let combo = 0;
  let bestCombo = 0;
  let starCount = 0;
  let shields = 0;
  let runTime = 0;
  let shake = 0;
  let hitStop = 0;
  let flashWhite = 0;
  let overWait = 0;
  let extraSpeed = 0;
  let windOn = false;
  let starBoost = false;
  let eventIdx = 0;
  let spawnedTotal = 0;
  let newRecord = false;
  let spurtWarned = false;
  let groundX = 0;

  const bird = { x: 100, y: 200, vy: 0, rot: 0, pop: 1, stretch: 1, wing: 0, alive: true, inv: 0 };
  const pipes = [];
  const stars = [];
  const parts = [];
  const floats = [];
  const clouds = [];
  const nightStars = [];

  for (let i = 0; i < 35; i++) {
    nightStars.push({
      x: Math.random(), y: Math.random() * 0.82,
      r: 0.8 + Math.random() * 1.5,
      tw: Math.random() * 6.28,
      color: Math.random() < 0.3 ? "#e9d5ff" : (Math.random() < 0.6 ? "#93c5fd" : "#ffffff")
    });
  }
  for (let c = 0; c < 5; c++) {
    clouds.push({ x: Math.random() * BW, y: 40 + Math.random() * 200, s: 0.6 + Math.random() * 0.7, spd: 12 + Math.random() * 15 });
  }

  function moveClouds(dt, factor) {
    for (let i = 0; i < clouds.length; i++) {
      clouds[i].x -= clouds[i].spd * dt * factor;
      if (clouds[i].x < -60) clouds[i].x = BW + 60;
    }
  }

  const THEMES = [
    {
      name: "보랏빛 성운",
      skyTop: "#080612", skyBot: "#130f26",
      pipe: "#a855f7", pipeDark: "#581c87",
      hill: "#1e1b4b", hill2: "#0f172a",
      ground: "#090d16", groundDark: "#030712"
    },
    {
      name: "붉은 은하",
      skyTop: "#17030a", skyBot: "#2d0818",
      pipe: "#f43f5e", pipeDark: "#881337",
      hill: "#4c0519", hill2: "#1f040d",
      ground: "#110307", groundDark: "#050002"
    },
    {
      name: "에메랄드 초신성",
      skyTop: "#02130e", skyBot: "#062e22",
      pipe: "#10b981", pipeDark: "#064e3b",
      hill: "#065f46", hill2: "#022c22",
      ground: "#02120e", groundDark: "#010806"
    },
    {
      name: "황금 플레어",
      skyTop: "#1a0f02", skyBot: "#361d03",
      pipe: "#fbbf24", pipeDark: "#78350f",
      hill: "#451a03", hill2: "#270e02",
      ground: "#140902", groundDark: "#080300"
    },
    {
      name: "딥 시안 차원",
      skyTop: "#03111d", skyBot: "#082a45",
      pipe: "#06b6d4", pipeDark: "#155e75",
      hill: "#0e7490", hill2: "#083344",
      ground: "#031826", groundDark: "#010a12"
    },
    {
      name: "네온 심연",
      skyTop: "#0f051d", skyBot: "#240a3d",
      pipe: "#d946ef", pipeDark: "#701a75",
      hill: "#4a044e", hill2: "#2a022d",
      ground: "#0f0213", groundDark: "#050007"
    }
  ];
  let themeIdx = 0, themeFrom = 0, themeTo = 0, themeMix = 1;

  const EVENTS = [
    { t: 12, p: 4, msg: "🚀 차원 광풍! 파이프 이동 시작!", act: function() { windOn = true; } },
    { t: 28, p: 9, msg: "⭐ 보너스 별 가득!", act: function() { starBoost = true; } },
    { t: 45, p: 15, msg: "⚡ 차원 가속! 스피드 업!", act: function() { extraSpeed += 30; } }
  ];

  function getLevel() {
    return Math.floor(passed / 7) + 1;
  }

  function pipeSpeed() {
    var baseSpd = 160 + passed * 3.4 + Math.min(passed * passed * 0.05, 140);
    return baseSpd + extraSpeed;
  }

  function gapHeight() {
    if (passed < 3) return 240;
    var g = 240 - (passed - 3) * 3.0;
    return Math.max(112, g);
  }

  function pipeSpacing() {
    if (passed < 3) return 350;
    return Math.max(210, 350 - (passed - 3) * 2.8);
  }

  var toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1900);
  }

  function resetRun() {
    pipes.length = 0;
    stars.length = 0;
    parts.length = 0;
    floats.length = 0;

    bird.x = Math.max(90, BW * 0.28);
    bird.y = BH * 0.42;
    bird.vy = 0;
    bird.rot = 0;
    bird.pop = 1;
    bird.stretch = 1;
    bird.wing = 0;
    bird.alive = true;
    bird.inv = 0;

    score = 0; combo = 0; bestCombo = 0; starCount = 0; shields = 0; passed = 0;
    runTime = 0; shake = 0; hitStop = 0; flashWhite = 0; overWait = 0;
    eventIdx = 0; extraSpeed = 0; windOn = false; starBoost = false;
    spawnedTotal = 0;
    newRecord = false; spurtWarned = false;
    themeIdx = 0; themeFrom = 0; themeTo = 0; themeMix = 1;

    hudCache = { t: -1, sc: -1, s: -1, sh: -1 };

    spawnPipe(BW + 30, BH * 0.42);
    updateHud();
  }

  var nowSec = 0;
  var lastStartAt = -9;
  function startGame() {
    if (nowSec - lastStartAt < 0.3) return;
    lastStartAt = nowSec;
    audioReady();
    resetRun();
    state = STATE_READY;
    titleScreen.classList.add("hide");
    overScreen.classList.add("hide");
    sndStart();
    toast("준비! 톡 치면 출발! 🕳️");
  }

  function spawnPipe(x, forceY) {
    var gh = gapHeight();
    var groundY = BH - GROUND_H;
    var minY = gh / 2 + 42;
    var maxY = groundY - gh / 2 - 20;
    if (maxY < minY) maxY = minY;

    var y;
    if (typeof forceY === "number") {
      y = forceY;
    } else if (spawnedTotal < 2) {
      y = bird.y + (Math.random() * 40 - 20);
    } else {
      y = minY + Math.random() * (maxY - minY);
    }
    y = Math.max(minY, Math.min(maxY, y));

    var amp = 0;
    var moveSpd = 1.2;
    var moveChance = Math.min(0.88, (passed >= 5 ? 0.35 : 0) + (passed * 0.022));
    if ((windOn || passed >= 5) && Math.random() < moveChance) {
      var maxAmp = Math.min(50, 14 + passed * 0.9);
      amp = 12 + Math.random() * maxAmp;
      var room = Math.min(y - minY, maxY - y);
      amp = Math.min(amp, Math.max(0, room));
      moveSpd = 1.3 + Math.min(2.2, passed * 0.06);
    }

    var p = {
      x: x, baseY: y, y: y, gap: gh, amp: amp, moveSpd: moveSpd,
      phase: Math.random() * 6.28, scored: false, w: PIPE_W
    };
    pipes.push(p);
    spawnedTotal++;

    var chance = starBoost ? 0.65 : 0.40;
    if (spawnedTotal > 2 && Math.random() < chance) {
      var edge = Math.random() < 0.75 ? (Math.random() < 0.5 ? -1 : 1) : 0;
      var off = edge * (gh / 2 - 24);
      stars.push({
        pipe: p, off: off, x: x + PIPE_W * 0.5, y: y + off,
        got: false, spin: Math.random() * 6.28, edge: (edge !== 0)
      });
    }
    return p;
  }

  function burst(x, y, n, colors, spd, life) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var v = spd * (0.35 + Math.random() * 0.9);
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30,
        r: 2.2 + Math.random() * 3.6,
        life: life, max: life,
        c: colors[(Math.random() * colors.length) | 0],
        g: 260 + Math.random() * 200
      });
    }
  }
  function floatText(x, y, text, color, size) {
    floats.push({ x: x, y: y, t: text, c: color, s: size || 22, life: 0.95, max: 0.95, vy: -70 });
  }

  function flap() {
    bird.vy = -430;
    bird.wing = 1;
    bird.pop = 1.34;
    bird.stretch = 1.18;
    bird.rot = -0.3;
    sndFlap();
    burst(bird.x - 10, bird.y, 10, ["#c084fc", "#a855f7", "#3b82f6", "#ffffff", "#000000"], 160, 0.5);
    burst(bird.x - 16, bird.y + 4, 5, ["#ffffff", "#e9d5ff"], 70, 0.35);
    if (!muted && navigator.vibrate) {
      try { navigator.vibrate(8); } catch (e) {}
    }
  }

  function pressAction() {
    if (state === STATE_TITLE) {
      startGame();
      return;
    }
    if (state === STATE_READY) {
      audioReady();
      state = STATE_PLAY;
      flap();
      return;
    }
    if (state === STATE_PLAY) {
      audioReady();
      flap();
      return;
    }
    if (state === STATE_PAUSE) {
      state = STATE_PLAY;
      toast("계속 가자! 🕳️");
      return;
    }
    if (state === STATE_OVER) {
      if (overWait <= 0) startGame();
      return;
    }
  }

  stage.addEventListener("pointerdown", function (e) {
    var t = e.target;
    while (t && t !== stage) {
      if (t.tagName === "BUTTON") return;
      t = t.parentNode;
    }
    e.preventDefault();
    audioReady();
    pressAction();
  });

  window.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === " " || k === "Spacebar" || k === "ArrowUp" || k === "ArrowDown" ||
        k === "ArrowLeft" || k === "ArrowRight" || k === "Enter") {
      e.preventDefault();
    }
    if (k === " " || k === "Spacebar" || k === "ArrowUp" || k === "Enter" || k === "w" || k === "W") {
      if (e.repeat) return;
      audioReady();
      pressAction();
    }
    if (k === "m" || k === "M") muteBtn.click();
  }, { passive: false });

  startBtn.addEventListener("click", function (e) { e.stopPropagation(); audioReady(); startGame(); });
  againBtn.addEventListener("click", function (e) {
    e.stopPropagation(); audioReady();
    if (overWait <= 0) startGame();
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden && state === STATE_PLAY) state = STATE_PAUSE;
  });

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    var nx = Math.max(rx, Math.min(cx, rx + rw));
    var ny = Math.max(ry, Math.min(cy, ry + rh));
    var dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function loseShield() {
    shields--;
    bird.inv = 1.3;
    bird.vy = -430;
    shake = 16;
    hitStop = 0.09;
    flashWhite = 0.5;
    sndShieldBreak();
    burst(bird.x, bird.y, 26, ["#bfe9ff", "#7fd0ff", "#ffffff", "#4fa8e0"], 240, 0.7);
    floatText(bird.x, bird.y - 34, "방패가 막았어!", "#3fa8ff", 20);
    combo = 0;
    updateHud();
  }

  function die() {
    if (!bird.alive) return;
    bird.alive = false;
    state = STATE_DYING;
    if (bird.vy < -140) bird.vy = -140;
    shake = 22;
    hitStop = 0.10;
    flashWhite = 0.8;
    sndHit();
    sndFall();
    burst(bird.x, bird.y, 30, ["#c084fc", "#a855f7", "#ffffff", "#3b82f6"], 260, 0.85);
  }

  function medalOf(sc) {
    if (sc >= 40) return { icon: "🌌", name: "무지개 심연! 전설의 블랙홀!" };
    if (sc >= 25) return { icon: "🥇", name: "금메달! 차원을 삼키는 자!" };
    if (sc >= 12) return { icon: "🥈", name: "은메달! 아주 잘했어!" };
    if (sc >= 5) return { icon: "🥉", name: "동메달! 좋았어!" };
    return { icon: "🕳️", name: "아직 메달이 없어. 5개만 넘겨봐!" };
  }

  function showOver() {
    state = STATE_OVER;
    overWait = 0.20;

    var m = medalOf(score);
    overMedal.textContent = m.icon;
    overMedalName.textContent = m.name;
    overScore.textContent = score + "점";

    if (score > best) {
      best = score;
      saveNum(STORE_BEST, best);
      newRecord = true;
    }
    elBest.textContent = "🏆 " + best;
    overBest.textContent = "파이프 " + passed + "개 · 별 " + starCount + "개 · 완벽 " +
                           bestCombo + "연속 · 최고 " + best + "점";

    overRegret.classList.remove("new");
    if (newRecord) {
      overTitle.textContent = "신기록이다! 🎉";
      overRegret.classList.add("new");
      overRegret.textContent = "우와! 최고 기록을 갈아치웠어!";
      sndMedal();
    } else {
      overTitle.textContent = "부딪혔다!";
      var diff = best - score;
      if (diff <= 0) {
        overRegret.textContent = "최고 기록이랑 똑같아! 1점만 더!";
      } else if (diff <= 3) {
        overRegret.textContent = "아깝다! 최고 기록까지 " + diff + "점!";
      } else if (diff <= 8) {
        overRegret.textContent = "조금만 더! 최고 기록까지 " + diff + "점 남았어!";
      } else {
        overRegret.textContent = "최고 기록까지 " + diff + "점! 다시 가보자!";
      }
      if (score >= 5) sndMedal();
    }
    overScreen.classList.remove("hide");
  }

  var hudCache = { t: -1, sc: -1, s: -1, sh: -1 };
  function updateHud() {
    var sec = Math.floor(runTime);
    if (sec !== hudCache.t) {
      hudCache.t = sec;
      elTime.textContent = "⏱ " + sec + "초";
    }
    if (score !== hudCache.sc || starCount !== hudCache.s) {
      hudCache.sc = score;
      hudCache.s = starCount;
      elStar.textContent = "⭐ " + score + "점 (별 " + starCount + ")";
    }
    if (shields !== hudCache.sh) {
      hudCache.sh = shields;
      elShield.textContent = "🛡 " + shields;
      if (shields > 0) elShield.classList.add("on");
      else elShield.classList.remove("on");
    }
  }

  function update(dt) {
    if (shake > 0) shake = Math.max(0, shake - dt * 55);
    if (flashWhite > 0) flashWhite = Math.max(0, flashWhite - dt * 2.6);
    if (themeMix < 1) themeMix = Math.min(1, themeMix + dt * 1.2);
    bird.pop += (1 - bird.pop) * Math.min(1, dt * 9);
    bird.wing = Math.max(0, bird.wing - dt * 3.4);

    var i;
    for (i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    for (i = floats.length - 1; i >= 0; i--) {
      var f = floats[i];
      f.life -= dt;
      if (f.life <= 0) { floats.splice(i, 1); continue; }
      f.y += f.vy * dt;
      f.vy += 40 * dt;
    }

    if (state === STATE_TITLE) {
      bird.x = BW * 0.5;
      bird.y = BH * 0.44 + Math.sin(nowSec * 2.4) * 12;
      bird.rot = Math.sin(nowSec * 2.4) * 0.18;
      groundX -= 60 * dt;
      moveClouds(dt, 1);
      updateHud();
      return;
    }

    if (state === STATE_READY) {
      bird.x = Math.max(90, BW * 0.28);
      bird.y = BH * 0.42 + Math.sin(nowSec * 3.0) * 8;
      bird.rot = Math.sin(nowSec * 3.0) * 0.1;
      moveClouds(dt, 0.5);
      updateHud();
      return;
    }

    if (state === STATE_PAUSE || state === STATE_OVER) {
      if (overWait > 0) overWait = Math.max(0, overWait - dt);
      moveClouds(dt, 0.3);
      updateHud();
      return;
    }

    /* ---- 플레이 시간 1초 단위 누적 ---- */
    if (state === STATE_PLAY) {
      runTime += dt;
    }

    if (hitStop > 0) {
      hitStop -= dt;
      updateHud();
      return;
    }

    if (state === STATE_DYING) {
      bird.vy += 1500 * dt;
      bird.y += bird.vy * dt;
      bird.rot = Math.min(1.6, bird.rot + dt * 4.2);
      var floorY = BH - GROUND_H - BIRD_R;
      if (bird.y >= floorY) {
        bird.y = floorY;
        burst(bird.x, bird.y + 10, 14, ["#e2c882", "#c9a95f", "#fff"], 160, 0.5);
        shake = Math.max(shake, 10);
        showOver();
      }
      updateHud();
      return;
    }

    /* ---- 실제 플레이 로직 ---- */
    if (bird.inv > 0) bird.inv -= dt;

    while (eventIdx < EVENTS.length &&
           (runTime >= EVENTS[eventIdx].t || passed >= EVENTS[eventIdx].p)) {
      var ev = EVENTS[eventIdx];
      ev.act();
      toast(ev.msg);
      sndEvent();
      shake = Math.max(shake, 8);
      eventIdx++;
    }

    bird.vy += 1500 * dt;
    if (bird.vy > 720) bird.vy = 720;
    bird.y += bird.vy * dt;
    bird.rot = Math.max(-0.55, Math.min(1.5, bird.vy / 520));
    bird.x += (Math.max(90, BW * 0.28) - bird.x) * Math.min(1, dt * 5);

    if (bird.y < BIRD_R + 4) { bird.y = BIRD_R + 4; if (bird.vy < 0) bird.vy = 0; }

    var spd = pipeSpeed();
    groundX -= spd * dt;
    moveClouds(dt, 1);

    var groundY = BH - GROUND_H;
    for (i = pipes.length - 1; i >= 0; i--) {
      var pp = pipes[i];
      pp.x -= spd * dt;
      if (pp.amp > 0) pp.y = pp.baseY + Math.sin(runTime * (pp.moveSpd || 1.2) + pp.phase) * pp.amp;
      else pp.y = pp.baseY;

      if (!pp.scored && pp.x + pp.w < bird.x) {
        pp.scored = true;
        passed++;

        var targetTheme = Math.floor(passed / 5) % THEMES.length;
        if (targetTheme !== themeTo) {
          themeFrom = themeTo;
          themeTo = targetTheme;
          themeMix = 0;
          toast("🌌 " + THEMES[targetTheme].name + " 차원으로 진입!");
          sndEvent();
        } else if (passed > 0 && passed % 7 === 0) {
          toast("⚠️ LEVEL " + getLevel() + "! 속도 및 장애물 진동 상승!");
          sndEvent();
        }

        var dist = Math.abs(bird.y - pp.y);
        var perfect = dist < pp.gap * 0.19;
        if (perfect) {
          combo++;
          if (combo > bestCombo) bestCombo = combo;
          score += 2;
          sndPerfect(combo);
          floatText(bird.x + 26, bird.y - 30, "완벽! +2", "#ffe27a", 22);
          burst(pp.x + pp.w * 0.5, pp.y, 16, ["#ffe27a", "#fff", "#ffb703"], 190, 0.6);
          shake = Math.max(shake, 9);
        } else {
          combo = 0;
          score += 1;
          sndScore(Math.min(7, passed % 8));
          floatText(bird.x + 26, bird.y - 30, "+1", "#ffffff", 20);
          burst(pp.x + pp.w * 0.5, pp.y, 8, ["#ffffff", "#cfeaff"], 130, 0.45);
          shake = Math.max(shake, 5);
        }
        bird.pop = 1.3;
        hitStop = perfect ? 0.075 : 0.045;
      }

      if (pp.x + pp.w < -30) pipes.splice(i, 1);
    }

    for (i = stars.length - 1; i >= 0; i--) {
      var st = stars[i];
      st.x = st.pipe.x + st.pipe.w * 0.5;
      st.y = st.pipe.y + st.off;
      st.spin += dt * 3.2;
      if (!st.got) {
        var ddx = st.x - bird.x, ddy = st.y - bird.y;
        if (ddx * ddx + ddy * ddy < (BIRD_R + 15) * (BIRD_R + 15)) {
          st.got = true;
          starCount++;
          score += 3;
          sndStar();
          floatText(st.x, st.y - 16, "별! +3", "#ffe27a", 22);
          burst(st.x, st.y, 18, ["#ffe27a", "#fff6c0", "#ffffff"], 200, 0.6);
          shake = Math.max(shake, 8);
          hitStop = 0.05;
          bird.pop = 1.32;
          if (starCount % 4 === 0 && shields < 2) {
            shields++;
            sndShieldGet();
            floatText(bird.x, bird.y - 56, "방패 얻었다! 🛡", "#3fa8ff", 20);
            toast("🛡 방패를 얻었어! 한 번은 살아나!");
          }
        }
      }
      if (st.x < -40) stars.splice(i, 1);
    }

    var lastX = -9999;
    for (i = 0; i < pipes.length; i++) if (pipes[i].x > lastX) lastX = pipes[i].x;
    if (lastX < BW - pipeSpacing()) spawnPipe(BW + 10);

    /* ---- 충돌 감지 ---- */
    for (i = 0; i < pipes.length; i++) {
      var q = pipes[i];
      if (q.x > bird.x + BIRD_R + 8 || q.x + q.w < bird.x - BIRD_R - 8) continue;
      
      var hitTop = circleRect(bird.x, bird.y, BIRD_R - 2, q.x, 0, q.w, q.y - q.gap / 2);
      var hitBot = circleRect(bird.x, bird.y, BIRD_R - 2, q.x, q.y + q.gap / 2, q.w, groundY - (q.y + q.gap / 2));

      if ((hitTop || hitBot) && bird.inv <= 0) {
        if (shields > 0) {
          loseShield();
        } else {
          die();
        }
        break;
      }
    }

    if (bird.y + BIRD_R >= groundY) {
      bird.y = groundY - BIRD_R;
      if (bird.inv <= 0) {
        if (shields > 0) loseShield();
        else die();
      }
    }

    /* ---- 매 프레임 독립적인 HUD 업데이트 ---- */
    updateHud();
  }

  function lerp(a, b, t) { return a + (b - a) * t; }
  function hexToRgb(hex) {
    if (typeof hex !== "string") return [0, 0, 0];
    hex = hex.replace("#", "");
    if (hex.length === 3) hex = hex.split("").map(function(c) { return c + c; }).join("");
    var num = parseInt(hex, 16);
    if (isNaN(num)) return [0, 0, 0];
    return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
  }

  function getThemeVal(key) {
    var tf = THEMES[themeFrom] ? THEMES[themeFrom][key] : THEMES[0][key];
    var tt = THEMES[themeTo] ? THEMES[themeTo][key] : THEMES[0][key];
    if (typeof tf === "number") return lerp(tf, tt, themeMix);
    if (themeFrom === themeTo || themeMix >= 1) return tt;
    var rgb1 = hexToRgb(tf);
    var rgb2 = hexToRgb(tt);
    return "rgb(" + Math.round(lerp(rgb1[0], rgb2[0], themeMix)) + "," +
                    Math.round(lerp(rgb1[1], rgb2[1], themeMix)) + "," +
                    Math.round(lerp(rgb1[2], rgb2[2], themeMix)) + ")";
  }

  function render() {
    ctx.save();
    ctx.scale(S, S);

    // 1. 하늘 (우주 공간)
    var skyGrad = ctx.createLinearGradient(0, 0, 0, BH);
    skyGrad.addColorStop(0, getThemeVal("skyTop"));
    skyGrad.addColorStop(1, getThemeVal("skyBot"));
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, BW, BH);

    // 반짝이는 우주 별들
    ctx.save();
    for (var ns = 0; ns < nightStars.length; ns++) {
      var nst = nightStars[ns];
      var alpha = Math.max(0, Math.min(1, 0.35 + 0.65 * Math.sin(nowSec * 3.5 + nst.tw)));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = nst.color;
      ctx.beginPath();
      ctx.arc(nst.x * BW, nst.y * BH, nst.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 2. 성운 구름 (Space Nebulae)
    for (var c = 0; c < clouds.length; c++) {
      var cl = clouds[c];
      ctx.save();
      ctx.translate(cl.x, cl.y);
      ctx.scale(cl.s, cl.s);
      ctx.globalAlpha = 0.15;
      
      var nebGlow = ctx.createRadialGradient(0, 0, 5, 0, 0, 45);
      nebGlow.addColorStop(0, "rgba(192, 132, 252, 0.8)");
      nebGlow.addColorStop(0.5, "rgba(59, 130, 246, 0.4)");
      nebGlow.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = nebGlow;

      ctx.beginPath();
      ctx.arc(0, 0, 40, 0, Math.PI * 2);
      ctx.arc(22, -12, 30, 0, Math.PI * 2);
      ctx.arc(-20, 10, 35, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 3. 월면 산맥 & 우주 지형
    var groundY = BH - GROUND_H;
    ctx.fillStyle = getThemeVal("hill2");
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    for (var h1 = 0; h1 <= BW; h1 += 20) {
      ctx.lineTo(h1, groundY - 45 - Math.sin((h1 + groundX * 0.15) * 0.012) * 28);
    }
    ctx.lineTo(BW, groundY);
    ctx.fill();

    ctx.fillStyle = getThemeVal("hill");
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    for (var h2 = 0; h2 <= BW; h2 += 20) {
      ctx.lineTo(h2, groundY - 25 - Math.sin((h2 + groundX * 0.3) * 0.02) * 16);
    }
    ctx.lineTo(BW, groundY);
    ctx.fill();

    // 4. 우주 기지 게이트 파이프
    var pipeMain = getThemeVal("pipe");
    var pipeDark = getThemeVal("pipeDark");
    for (var p = 0; p < pipes.length; p++) {
      var pipe = pipes[p];
      var topH = pipe.y - pipe.gap / 2;
      var botY = pipe.y + pipe.gap / 2;
      var botH = groundY - botY;

      if (topH > 0) {
        var pGrad = ctx.createLinearGradient(pipe.x, 0, pipe.x + pipe.w, 0);
        pGrad.addColorStop(0, pipeDark);
        pGrad.addColorStop(0.3, pipeMain);
        pGrad.addColorStop(0.7, pipeMain);
        pGrad.addColorStop(1, pipeDark);
        ctx.fillStyle = pGrad;
        ctx.fillRect(pipe.x, 0, pipe.w, topH);
        ctx.lineWidth = 2;
        ctx.strokeStyle = pipeMain;
        ctx.strokeRect(pipe.x, 0, pipe.w, topH);

        ctx.fillStyle = pipeMain;
        ctx.fillRect(pipe.x - 4, topH - 22, pipe.w + 8, 22);
        ctx.strokeStyle = "#ffffff";
        ctx.strokeRect(pipe.x - 4, topH - 22, pipe.w + 8, 22);
      }

      if (botH > 0) {
        var pGrad2 = ctx.createLinearGradient(pipe.x, 0, pipe.x + pipe.w, 0);
        pGrad2.addColorStop(0, pipeDark);
        pGrad2.addColorStop(0.3, pipeMain);
        pGrad2.addColorStop(0.7, pipeMain);
        pGrad2.addColorStop(1, pipeDark);
        ctx.fillStyle = pGrad2;
        ctx.fillRect(pipe.x, botY, pipe.w, botH);
        ctx.lineWidth = 2;
        ctx.strokeStyle = pipeMain;
        ctx.strokeRect(pipe.x, botY, pipe.w, botH);

        ctx.fillStyle = pipeMain;
        ctx.fillRect(pipe.x - 4, botY, pipe.w + 8, 22);
        ctx.strokeStyle = "#ffffff";
        ctx.strokeRect(pipe.x - 4, botY, pipe.w + 8, 22);
      }
    }

    // 5. 별
    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      if (st.got) continue;
      ctx.save();
      ctx.translate(st.x, st.y);
      ctx.rotate(st.spin);
      ctx.fillStyle = "#ffe27a";
      ctx.strokeStyle = "#e0a100";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (var sp = 0; sp < 5; sp++) {
        ctx.lineTo(Math.cos((18 + sp * 72) * Math.PI / 180) * 14, -Math.sin((18 + sp * 72) * Math.PI / 180) * 14);
        ctx.lineTo(Math.cos((54 + sp * 72) * Math.PI / 180) * 6, -Math.sin((54 + sp * 72) * Math.PI / 180) * 6);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // 6. 블랙홀 캐릭터
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    ctx.scale(bird.pop * bird.stretch, bird.pop / bird.stretch);

    if (bird.inv > 0 && Math.floor(nowSec * 18) % 2 === 0) {
      ctx.globalAlpha = 0.4;
    }

    if (shields > 0 && bird.alive) {
      ctx.save();
      ctx.strokeStyle = "rgba(168, 85, 247, 0.8)";
      ctx.fillStyle = "rgba(168, 85, 247, 0.22)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, BIRD_R + 13 + Math.sin(nowSec * 6) * 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // 회전하는 강착원반
    ctx.save();
    ctx.rotate(nowSec * 2.2);

    for (var r = 3; r >= 1; r--) {
      ctx.beginPath();
      ctx.ellipse(0, 0, BIRD_R + r * 5, (BIRD_R + r * 5) * 0.38, nowSec * 1.2, 0, Math.PI * 2);
      ctx.strokeStyle = r === 1 ? "rgba(255, 255, 255, 0.95)" : (r === 2 ? "rgba(192, 132, 252, 0.65)" : "rgba(59, 130, 246, 0.35)");
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
    ctx.restore();

    // 광자 고리
    var bhGlow = ctx.createRadialGradient(0, 0, BIRD_R * 0.6, 0, 0, BIRD_R + 6);
    bhGlow.addColorStop(0, "rgba(255, 255, 255, 1)");
    bhGlow.addColorStop(0.25, "rgba(216, 180, 254, 0.9)");
    bhGlow.addColorStop(0.65, "rgba(59, 130, 246, 0.4)");
    bhGlow.addColorStop(1, "rgba(0, 0, 0, 0)");

    ctx.fillStyle = bhGlow;
    ctx.beginPath();
    ctx.arc(0, 0, BIRD_R + 6, 0, Math.PI * 2);
    ctx.fill();

    // 블랙홀 중심부
    ctx.fillStyle = "#030308";
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.restore();

    // 7. 바닥
    var gMain = getThemeVal("ground");
    var gDark = getThemeVal("groundDark");
    ctx.fillStyle = gMain;
    ctx.fillRect(0, groundY, BW, GROUND_H);

    ctx.fillStyle = gDark;
    ctx.fillRect(0, groundY, BW, 12);

    ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
    var stripW = 28;
    var offset = (groundX % stripW);
    for (var gx = offset - stripW; gx < BW + stripW; gx += stripW) {
      ctx.beginPath();
      ctx.moveTo(gx, groundY + 12);
      ctx.lineTo(gx + 14, groundY + 12);
      ctx.lineTo(gx, groundY + GROUND_H);
      ctx.lineTo(gx - 14, groundY + GROUND_H);
      ctx.fill();
    }

    ctx.lineWidth = 3;
    ctx.strokeStyle = pipeMain;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(BW, groundY);
    ctx.stroke();

    // 8. 파티클
    for (var pt = 0; pt < parts.length; pt++) {
      var ptk = parts[pt];
      ctx.save();
      ctx.globalAlpha = Math.max(0, ptk.life / ptk.max);
      ctx.fillStyle = ptk.c;
      ctx.beginPath();
      ctx.arc(ptk.x, ptk.y, ptk.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 9. 떠오르는 텍스트
    for (var ft = 0; ft < floats.length; ft++) {
      var fl = floats[ft];
      ctx.save();
      ctx.globalAlpha = Math.max(0, fl.life / fl.max);
      ctx.fillStyle = fl.c;
      ctx.font = "900 " + fl.s + "px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.shadowColor = "rgba(0,0,0,0.5)";
      ctx.shadowBlur = 4;
      ctx.fillText(fl.t, fl.x, fl.y);
      ctx.restore();
    }

    // 10. 피격 플래시
    if (flashWhite > 0) {
      ctx.fillStyle = "rgba(255,255,255," + Math.min(1, flashWhite) + ")";
      ctx.fillRect(0, 0, BW, BH);
    }

    ctx.restore();
  }

  var lastTime = performance.now();
  function loop(now) {
    var dt = (now - lastTime) / 1000;
    lastTime = now;
    nowSec = now / 1000;

    if (dt > 0.1) dt = 0.1;

    update(dt);
    render();

    requestAnimationFrame(loop);
  }

  window.onload = function () {
    resize();
    elBest.textContent = "🏆 " + best;
    requestAnimationFrame(loop);
  };
})();
</script>
</body>
